# worklist.yaml — after-sales casework for XPeng Egypt.
#
# Casework is a preset over the worklist engine: a `case` is the platform `case`
# XRM system entity, worked through a queue by the support team in the console,
# with the agent as the sole voice to the customer. The standard decision set
# (resolve / reject / request_more_info / escalate) is merged in automatically —
# we declare only queues + case types (+ any CUSTOM decisions) here.
#
# The lifecycle is FIXED by the platform (the `case` entity pipeline):
#   open → in_progress → awaiting_customer → resolved → closed  (+ reopened).
# What we define below is the layer on top: ticket TYPES, the TEAM (queue) each
# routes to, its PRIORITY + SLA, and the CUSTOM dispositions an operator can pick.
#
# Locale coverage (cases.<type> / status.<state> / decision.<action>) is enforced
# at boot in BOTH directions against locale.<lang>.yaml — keep them in lockstep.

queues:
  - { key: technical_service, name: 'Technical Service' }   # car faults, charging, roadside
  - { key: customer_care,     name: 'Customer Care' }        # owner activation, general issues
  # Where a BREACHED case goes — see automation.yaml. Not a routing destination: no
  # case type opens here. It exists so an escalation has somewhere to go that a
  # supervisor watches; escalating into the case's own queue would move nothing.
  - { key: escalations,       name: 'Escalations' }          # breached SLA, either clock

work:
  case:
    type_field: case_type

    # CUSTOM dispositions (the standard resolve/reject/request_more_info/escalate
    # set is merged in automatically). `relay: true` sends the update to the
    # customer in their language; `to_stage` moves the case on the pipeline.
    actions:
      activate_account:                 # app-owner activation approved
        relay:    true
        to_stage: resolved
      dispatch_roadside:                # roadside team sent out
        relay:    true
        to_stage: in_progress
        params:
          - { name: eta, label: 'ETA', type: text }

    # TWO CLOCKS per type, both counted in hours from the moment the case opens.
    # `resolve_within_hours` is time to a resolution. `first_response_within_hours` is
    # time to the first HUMAN reply and stops on an operator's relay to the customer —
    # so it measures "did somebody actually answer this person", which is the promise a
    # stranded driver cares about first. Breaching either one escalates (automation.yaml).
    #
    # No `first_response_pause_stages` here on purpose: a case only reaches
    # `awaiting_customer` AFTER a human has replied, so by then the first-response clock
    # has already stopped. Declaring a pause on that stage would suppress nothing.
    types:
      # 📱 App owner activation — verify car registration + owner ID, activate the app account.
      app_owner_activation: { queue: customer_care,    priority: normal, sla: { resolve_within_hours: 24, first_response_within_hours: 4   }, actions: [activate_account] }
      # 🚨 Roadside / breakdown — most urgent. Half an hour to tell them a human has it.
      roadside_assistance:  { queue: technical_service, priority: urgent, sla: { resolve_within_hours: 2,  first_response_within_hours: 0.5 }, actions: [dispatch_roadside] }
      # 🔌 Charging problem — home/public charging or hardware.
      charging_issue:       { queue: technical_service, priority: high,   sla: { resolve_within_hours: 8,  first_response_within_hours: 2   } }
      # 🗂️ Anything else after-sales (catch-all).
      other:                { queue: customer_care,     priority: normal, sla: { resolve_within_hours: 48, first_response_within_hours: 8   } }

  # ── Live handoff — a PERSON holds the conversation in place of the AI Agent ──
  #
  # A handoff is the platform `handoff` system entity, worked through this same engine: the
  # queue it lands in, who is assigned, and the first-reply clock are the record's own work
  # columns. What is different from a case is what happens to the CONVERSATION — while a
  # handoff is waiting or active the AI Agent is silent, and the customer's messages go to
  # the operator's Live chat pane in the console.
  #
  # `route_by: reason` — `reason` is the field `handoff_request` stores, so a charging or
  # roadside handoff reaches Technical Service and a sales question reaches Customer Care,
  # with `customer_care` as the safety net for a reason the map does not name.
  #
  # `handoff:` is the block only this entity may carry. Five minutes to accept before the
  # customer is returned to the AI Agent with an apology (and the ticket path); thirty quiet
  # minutes before an active chat is handed back. Both are tunable per project from
  # Settings → Work. `whatsapp_signature` stays off: the web widget shows the operator's
  # name as a chip, and on WhatsApp the join line already says a person is here.
  #
  # The `first_response_within_hours: 0.25` is the same 15-minute promise a roadside ticket
  # makes — and it is kept by the same person, because the roadside flow opens the ticket
  # AND asks for a person in one turn (see open-support.flow.yaml).
  #
  # `operator_dictation: true` lets the operator TALK a reply instead of typing it — the
  # speech is turned into text in their draft, to check and send. It is on here because a
  # roadside desk often answers from a phone or a car. Each use is a billed speech-to-text
  # call on the project; set it to false to remove the Dictate button and the cost.
  handoff:
    route_by: reason
    map:      { roadside: technical_service, charging: technical_service, sales: customer_care, other: customer_care }
    fallback: customer_care
    sla:      { resolve_within_hours: 2, first_response_within_hours: 0.25 }
    handoff:  { accept_within_minutes: 5, idle_return_minutes: 30, whatsapp_signature: false, operator_dictation: true }
