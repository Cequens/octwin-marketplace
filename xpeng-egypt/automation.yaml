# What XPeng Egypt does by itself — rules (guide: craft-automation; every change, time and action: rules-guide).
#
# The alarm on the SLA promises in `worklist.yaml`. Until this file existed the pack
# declared four resolve clocks — roadside 2h, charging 8h, activation 24h, other 48h —
# and NOTHING ever looked at them: `sla_due_at` was stamped when the case enrolled and
# then never read again. A breach was visible to whoever happened to be looking at the
# work inbox, and was announced to nobody. A stranded driver's two-hour promise paged no
# one at all.
#
# TWO rules, one per clock, each covering all four case types. Each acts once per
# breach — deduped on `first_response_notified_at` / `sla_notified_at` — skips cases
# already resolved or closed, alerts the responsible operator through the ops inbox,
# and relays its `message` to the customer.
#
# A clock rule fires when its deadline passes, not on a sweep's next tick — which
# matters here: the shortest promise is half an hour.
#
# `escalate_to` ROUTES a breached case to the `escalations` queue rather than assigning a
# person, because a `user:`/`team:` ref names an id only the INSTALLING tenant knows and a
# published pack cannot write one. Know the limit that comes with that: routing to a queue
# assigns nobody new (the queue is `manual`). The case leaves its own queue and surfaces in
# the escalations inbox, and the ops-inbox alert goes to whoever held it — or, on an
# unassigned case, to the escalations queue's people. The customer reassurance is unaffected.
#
# The two messages say different things on purpose. A first-response breach means nobody
# has replied yet, so it apologises for the silence. A resolve breach means someone is
# already talking to the customer, but it is taking too long.
#
# Deliberately NOT declared — a `task_overdue` job. `task_open` (which `capture-lead`
# uses for its 24-hour lead follow-up) cannot set a task assignee, and the overdue sweep
# only looks at tasks that have one, so the job could never fire for anything this pack
# creates. Declaring it would be one more promise nothing keeps.
#
# The off-channel funnel bridge: when a rep marks the lead `won` (however it happens —
# console, a flow's record_stage, or an automation transition), complete the purchase
# journey's terminal goal, valued per-lead from expected_value. Do NOT also emit this goal
# from a flow.
#
# The test drive's reminders, a day and two hours before. They follow the booking: moved,
# they move; cancelled or finished, they stop — whoever does it (the chat, the showroom in
# the console).

rules:
  - key: case_first_response
    for: case
    at: clock first_response
    do:
      - breach:
          escalate_to: queue:escalations
          message:
            ar: 'آسفين إننا ما رددنا عليك لحد الآن 🙏 طلبك وصلنا فعلاً وتم تنبيه الفريق — حد من فريقنا هيتواصل معاك حالاً.'
            en: 'Sorry we have not replied yet 🙏 Your request has reached us and the team has been alerted — someone from our team will contact you right away.'

  - key: case_sla
    for: case
    at: clock resolution
    do:
      - breach:
          escalate_to: queue:escalations
          message:
            ar: 'نعتذر عن التأخير 🙏 حالتك أخدت وقت أطول من المتوقع وتم تحويلها للإدارة — إحنا شغالين عليها وهنرجع لك في أقرب وقت.'
            en: 'Sorry for the wait 🙏 Your case has taken longer than expected and has been passed to management — we are working on it and will get back to you shortly.'

  - key: lead_enter_won
    for: lead
    on: { enter: won }
    do:
      - track: { journey: purchase, goal_reached: deal_won, value_field: expected_value }

  - key: test_drive_day_before
    for: booking
    at: slot_start - 24h
    do:
      - remind:
          resource_type: branch
          message:
            ar: 'تذكير: عندك تجربة قيادة XPENG في فرع {{ resource.title }} قريبًا ({{ record.fields.slot_start }}). مستنينك! 🚗'
            en: 'Reminder: your XPENG test drive at {{ resource.title }} is coming up soon ({{ record.fields.slot_start }}). See you there! 🚗'

  - key: test_drive_two_hours_before
    for: booking
    at: slot_start - 2h
    do:
      - remind:
          resource_type: branch
          message:
            ar: 'تذكير: عندك تجربة قيادة XPENG في فرع {{ resource.title }} قريبًا ({{ record.fields.slot_start }}). مستنينك! 🚗'
            en: 'Reminder: your XPENG test drive at {{ resource.title }} is coming up soon ({{ record.fields.slot_start }}). See you there! 🚗'
