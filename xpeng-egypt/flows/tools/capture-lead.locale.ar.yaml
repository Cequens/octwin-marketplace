flow_id: capture-lead

strings:
  gap: 'اسأل العميل عن البيانات المطلوبة بلطف بلغته.'

  it_header:     'إزاي نقدر نساعدك؟'
  it_body:       'اختار اللي محتاجه وفريق المبيعات هيتواصل معاك.'
  it_cta:        'اختار'
  it_quote:      '💬 عرض سعر'
  it_info:       'ℹ️ معلومات أكثر'
  it_test_drive: '📅 تجربة قيادة'
  it_callback:   '📞 اتصلوا بيا'

  f_name:  'اسمك الكريم؟'
  f_phone: 'رقم تليفونك؟ (عشان المبيعات يتواصلوا معاك)'
  f_email: 'إيميلك؟ (اختياري)'

  # مُنتقي الموديلات. صف `m_unsure` مضاف يدويًا — الخيار الوحيد اللي مش جاي من
  # التشكيلة، وهو سبب إن الخطوة دي قايمة مش كاروسيل.
  m_header:      'أنهي موديل؟'
  m_body:        'اختار الموديل اللي عايز عرض سعر ليه — وفريق المبيعات هيجهّزه لك.'
  m_cta:         'اختار موديل'
  m_from:        'يبدأ من {price} جنيه'
  m_unsure:      'لسّه مش محدد'
  m_unsure_desc: 'عايز المبيعات تساعدني أختار'

  # التأكيد اللي بيظهر لما الموديل ييجي مع الطلب مش من ضغطة العميل.
  m_confirm:     'عشان نتأكد — إنت بتسأل عن **{model}**؟'
  m_confirm_yes: 'أيوه، هي دي'
  m_confirm_no:  'لأ، وريني التشكيلة'

  task_title: 'متابعة عميل جديد: {name}'
  task_body:  'اتصل بالعميل على {phone} خلال ٢٤ ساعة.'

  # زوج «استفسار متكرر». العملاء بيتجمّعوا على الرقم + الموديل، يعني ده نفس السجل —
  # لازم العنوان يقول كده وإلا هيتقري كأنه عميل جديد تاني في قائمة المهام.
  task_title_again: 'استفسر تاني: {name}'
  task_body_again:  'العميل ده عنده سجل عندنا على نفس الموديل واستفسر تاني دلوقتي. كلّمه على {phone} خلال ٢٤ ساعة — وراجع السجل عشان تشوف اتكلمتوا في إيه المرة اللي فاتت.'

  # مسار «تم البيع»: السجل بيفضل زي ما هو عن قصد، والمهمة هي اللي بتشيل السياق
  # اللي مندوب المبيعات محتاجه.
  task_title_won: 'عميل حالي، استفسار جديد: {name}'
  task_body_won:  'العميل ده اشترى الموديل ده بالفعل — السجل مقفول على «تم البيع» وسيبناه كده. وهو استفسر تاني دلوقتي. كلّمه على {phone} خلال ٢٤ ساعة؛ ولو عايز عربية تانية افتح له سجل جديد للموديل اللي عايزه.'

  reopen_note: 'أُعيد فتحه — العميل استفسر تاني من خلال المساعد بعد ما السجل اتقفل كـ«مغلق دون بيع».'

  confirm: 'تمام يا {name} ✅ سجّلنا بياناتك وفريق المبيعات هيتواصل معاك قريب. تحب تشوف الموديلات أو تحجز تجربة قيادة؟'
  confirm_again: 'تمام يا {name} ✅ بياناتك موجودة عندنا بالفعل — حدّثناها ونبّهنا فريق المبيعات إنهم يتواصلوا معاك. تحب تشوف الموديلات أو تحجز تجربة قيادة؟'
