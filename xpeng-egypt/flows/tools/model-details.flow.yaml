flow_id:     model-details
version:     1
description: |-
  Show full details and specs for ONE XPENG model (hero photo, range, battery,
  power, seats, indicative price) plus a photo gallery. Pass model_code — one of
  m03, p7, p7_plus, g6, g9, x9.

input:
  model_code:
    type: enum
    enum: [m03, p7, p7_plus, g6, g9, x9]
    optional: true
    describe: 'The model to show. Omit only if unknown — then the tool asks.'

entry:
  - if: '$input.model_code == null'
    goto: need_code
  - else: true
    goto: load

steps:
  need_code:
    - answer:
        instructions: "Ask which model they're interested in (MONA M03, P7, P7+, G6, G9, or X9), or call browse-models to show the whole lineup."

  load:
    - do: record_get
      args:
        entity: model
        match: { field: code, value: '$input.model_code' }
      bind: m
      outputs:
        ok:        [{ goto: show }]
        not_found: [{ goto: unknown }]
        # failed → throws → error-net

  show:
    # ONE swipeable message: the specs in the carousel BODY, the hero + every
    # gallery shot as cards, each carrying its own marketing line.
    #
    # Why the specs live in `body:` and not on the cards — WhatsApp caps a CARD
    # body at 160 chars but the message body at 1024, so the spec block only fits
    # above the cards. (This flow used to render `items: '[$m]'` — a ONE-card
    # carousel, which Meta rejects and the platform degrades to an image+text
    # bubble; that degrade is the only reason the long text ever fit.)
    #
    # `$m.media.*` is the hydrated sidecar — `{ ref, url, caption }` per image,
    # with `caption` the pack copy declared beside each `generate:` in xrm.yaml.
    # `$m.fields.*` still holds the bare refs.
    - assign:
        shots: '$concat($m.media.photo, $m.media.gallery)'
    - render:
        render_intent: carousel
        body: "$lines([ $t('model-details.intro'), '', '🚗 ' + $loc($m.fields.name), $loc($m.fields.tagline), '', '⚡ ' + $t('model-details.range') + ': ' + $format_number($m.fields.range_km) + ' ' + $t('model-details.km'), '🔋 ' + $t('model-details.battery') + ': ' + $format_number($m.fields.battery_kwh) + ' kWh', '🐎 ' + $t('model-details.power') + ': ' + $format_number($m.fields.power_hp) + ' hp', '⏱ ' + $t('model-details.accel') + ': ' + $format_number($m.fields.accel_0_100) + ' ' + $t('model-details.sec'), '👥 ' + $t('model-details.seats') + ': ' + $format_number($m.fields.seats), '', '💰 ' + $t('model-details.from') + ': ' + $format_number($m.fields.price_from) + ' ' + $t('model-details.egp'), '', $loc($m.fields.highlights), '', 'ℹ️ ' + $t('xpeng-egypt.price_provisional') ])"
        items: '$shots'
        item_template:
          image_url: '$item.ref'
          # Falls back to the model name for an image seeded before its copy was
          # written — a caption is optional on the asset.
          body: '$coalesce($loc($item.caption), $loc($m.fields.name))'
          # WhatsApp + web cap carousel cards at 2 buttons (carousel.buttonsPerCard),
          # and Meta REJECTS a card with zero (#131009), so every photo carries the
          # two conversion CTAs. Branches stay reachable via the home hub and the
          # test-drive flow's own branch picker.
          buttons:
            - { title: '{$t("xpeng-egypt.cta_quote")}',       on_select: { invoke: capture-lead,    with: { interested_model: '$m.fields.code', interest_type: quote } } }
            - { title: '{$t("xpeng-egypt.cta_test_drive")}',  on_select: { invoke: book-test-drive, with: { model_code: '$m.fields.code' } } }
      memory_note: 'Showed details for model {$m.fields.code} ({$length($shots)} photos).'
    # Purchase funnel: deep on a specific model — stamp the model for cohort analysis.
    - track: { journey: purchase, event: viewed_model, metadata: { model: '$m.fields.code' } }
    - end: applied

  unknown:
    - answer:
        instructions: "That model wasn't found. List the available models (MONA M03, P7, P7+, G6, G9, X9) and offer to show the full lineup via browse-models."
