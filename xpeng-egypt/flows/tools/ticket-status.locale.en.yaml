flow_id: ticket-status

strings:
  intro: 'Here are your after-sales tickets. Tap one to see its latest update and what you can do. 👇'
  intro_header: 'Your tickets'
  # The list's own CTA button — required by list_picker (it opens the list).
  cta: 'View tickets'

  # Actions on ONE opened ticket (the detail card). Listing rows carry no buttons.
  btn_docs:    '📎 Send a document'
  btn_reply:   '💬 Reply / send info'

  # 📎 Add a document.
  docs_gap: 'Ask the customer to upload the photo or document they want to add to this ticket.'
  f_doc:    'Photo / document'
  cap_doc:  'Document added by the customer'
  docs_ok:  'Got it — your document has been added to ticket XP-{ref}. Our team will review it. ✅'

  # 💬 Reply / send info.
  msg_gap:   "Ask the customer what they'd like to tell the team about this ticket — extra details, an answer to a question, or any update."
  f_message: 'Your message'
  msg_ok:    "Thanks — your reply has reached the team on ticket XP-{ref}. They'll follow up with you here. ✅"

  # Shared error line for a failed action.
  err: 'Sorry — something went wrong on our side. Please try again in a moment.'
