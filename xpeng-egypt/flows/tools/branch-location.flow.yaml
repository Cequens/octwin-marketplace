flow_id:     branch-location
version:     1
description: |-
  Send the map pin for one XPeng showroom, so the customer can navigate to it.
  Call when they ask for directions, a location, or how to get to a showroom —
  or when they tap "Directions" on a showroom card. Pass branch_code.

input:
  branch_code:
    type: enum
    enum: [zayed, dune, mivida]

entry:
  - else: true
    goto: load

steps:
  load:
    - do: record_get
      args:
        entity: branch
        match:  { field: code, value: '$input.branch_code' }
      bind: b
      outputs:
        ok:        [{ goto: check_pin }]
        not_found: [{ goto: unknown }]

  check_pin:
    # A showroom without coordinates cannot be pinned. Fall back to the address
    # in words rather than rendering a pin at (0,0) — the Gulf of Guinea.
    - if: '$b.fields.geo == null'
      goto: no_pin
    - goto: send_pin

  send_pin:
    # TWO messages, so the pin goes out via `send_message` and the card via
    # `render:`. A step emits exactly ONE `render:` — two render nodes in a row
    # do not produce two messages, the second REPLACES the first. This flow
    # shipped that way for an hour and the customer got the hours/phone card with
    # no map at all, which reads as "Directions does nothing".
    #
    # Pin first: it is the thing they asked for. `render_intent: location` takes
    # the SAME `lat`/`lng` the `geo` field stores, so the coordinates copy across
    # with no remapping. Meta's location message carries NO body text and no
    # buttons, which is exactly why the readable part needs its own message.
    - do: send_message
      args:
        to: '$contact.id'
        intent:
          render_intent: location
          lat:     '$b.fields.geo.lat'
          lng:     '$b.fields.geo.lng'
          name:    '$loc($b.fields.name)'
          address: '$loc($b.fields.address)'
      # Both ports go to the SAME step, and neither is left empty: an empty port
      # runs the canonical handler, which ENDS the run — the card below would be
      # unreachable and the customer would get a pin and nothing else. Failure
      # routes there too, so a dropped pin still leaves them the address in words.
      outputs:
        delivered: [{ goto: show_card }]
        failed:    [{ goto: show_card }]

  show_card:
    - render:
        render_intent: detail_card
        body: '$lines($compact([
                 $t("branch-location.hours", { hours: $loc($b.fields.hours) }),
                 $t("branch-location.phone", { phone: $b.fields.phone })
               ]), "\n")'
        buttons:
          - { title: '{$t("xpeng-egypt.cta_test_drive")}', on_select: { invoke: book-test-drive, with: { branch_code: '$input.branch_code' } } }
      memory_note: 'Sent the map pin for {$loc($b.fields.name)} plus its hours and phone.'
    - end: applied

  no_pin:
    - answer:
        data: { address: '$loc($b.fields.address)', name: '$loc($b.fields.name)', hours: '$loc($b.fields.hours)' }
        instructions: 'This showroom has no map pin on file. Give the customer its address, area and opening hours in words, and offer to book a test drive. Do NOT invent coordinates or a map link.'

  unknown:
    - answer:
        instructions: 'That showroom code is not one of ours. Call list-branches to show the three real showrooms instead.'