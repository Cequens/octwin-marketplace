flow_id: ticket-status

strings:
  intro: 'هذه تذاكر ما بعد البيع الخاصة بك. اضغط على أي تذكرة لعرض آخر تحديث وما يمكنك فعله. 👇'
  intro_header: 'تذاكرك'
  # The list's own CTA button — required by list_picker (it opens the list).
  cta: 'عرض التذاكر'

  # أزرار الإجراءات على الكارت.
  btn_docs:    '📎 إرسال مستند'
  btn_reply:   '💬 رد / إرسال معلومة'

  # 📎 إضافة مستند.
  docs_gap: 'اطلب من العميل رفع الصورة أو المستند اللي عايز يضيفه للتذكرة دي.'
  f_doc:    'صورة / مستند'
  cap_doc:  'مستند مضاف من العميل'
  docs_ok:  'تمام — تم إضافة المستند لتذكرة XP-{ref}. فريقنا هيراجعه. ✅'

  # 💬 رد / إرسال معلومة.
  msg_gap:   'اسأل العميل عايز يقول إيه للفريق عن التذكرة دي — تفاصيل إضافية، رد على استفسار، أو أي تحديث.'
  f_message: 'رسالتك'
  msg_ok:    'شكرًا — وصل ردّك للفريق على تذكرة XP-{ref}. هيتابعوا معاك هنا. ✅'

  # سطر خطأ مشترك عند فشل أي إجراء.
  err: 'حصل خطأ من عندنا. من فضلك حاول تاني بعد شوية.'
