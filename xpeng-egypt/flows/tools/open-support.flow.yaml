flow_id:     open-support
version:     1
description: |-
  [interactive Tool] Open an after-sales support ticket for a problem with a car the customer owns,
  routing it to the right team with an SLA. Call when the customer reports a breakdown, a charging
  problem, a fault, or any other after-sales issue. Pass `type` when it's obvious from what they said
  (roadside_assistance = stranded/breakdown; charging_issue = charging/charger; other = anything else);
  otherwise the tool asks. Pass `model_code` and `details` if already stated.
  (For activating the XPeng App as an owner, use `activate-app` instead.)

input:
  type:
    type: enum
    enum: [roadside_assistance, charging_issue, other]
    optional: true
    describe: 'The kind of issue, if clear from the conversation. Leave empty to let the customer pick.'
  model_code:
    type: enum
    enum: [m03, p7, p7_plus, g6, g9, x9]
    optional: true
  details: { type: string, optional: true, describe: 'The problem the customer described, if already stated.' }

entry:
  - else: true
    goto: gather

steps:
  gather:
    - collect:
        gap_instructions: '$t("open-support.gap")'
        fields:
          - field: type                       # FIXED picker — only prompts when the agent didn't pass a type
            options:
              header: open-support.pick_header
              body:   open-support.pick_body
              cta:    open-support.pick_cta
              sections:
                - items:
                    - { value: roadside_assistance, label: open-support.opt_roadside }
                    - { value: charging_issue,      label: open-support.opt_charging }
                    - { value: other,               label: open-support.opt_other }
          - field: details
            label: '$t("open-support.f_details")'
          # ONE TAP, and the number a technician will actually dial arrives verified
          # rather than typed by someone whose car has broken down.
          - field: phone
            type: phone
            dial_code: '20'
            label: '$t("open-support.f_phone")'
          # ROADSIDE ONLY — a stranded driver's position is the single most
          # useful thing on the ticket, and the 2h SLA is spent finding them.
          # Asked in words first, because that is the answer that always exists:
          # the pin is optional (a geo field can ONLY be answered by sharing, so
          # a required one traps a web visitor who blocked the permission) and
          # optional fields are offered LAST, after everything required.
          - field: where
            when:  '$state.type == "roadside_assistance"'
            label: '$t("open-support.f_where")'
            describe: 'Road, direction of travel and the nearest landmark or exit.'
          - field: pin
            when:  '$state.type == "roadside_assistance"'
            type:  geo
            required: false
            label:      '$t("open-support.f_pin")'
            skip_title: '$t("open-support.skip_pin")'
        complete: [{ goto: open }]

  open:
    - do: case_open
      args:
        type: '$state.type'
        # `fields` rides in the case's free-form `data` bag — no schema to satisfy,
        # which is why the roadside keys can simply be absent on the other types.
        fields:
          details: '$state.details'
          phone:   '$state.phone'
          model:   '$coalesce($state.model_code, "")'
          where:   '$coalesce($state.where, "")'
          pin:     '$state.pin'
          # A clickable link, not just two floats. Whoever picks up an urgent
          # roadside ticket needs to START DRIVING, and coordinates in a data bag
          # are not a destination.
          pin_url: '$state.pin != null ? "https://www.google.com/maps/search/?api=1&query=" + $state.pin.lat + "," + $state.pin.lng : ""'
      bind: c
      outputs:
        ok: [{ goto: confirm }]
        # failed → throws → error-net

  confirm:
    # A stranded driver gets the ticket AND a person. The roadside promise is a first human
    # reply within 30 minutes; a ticket alone waits for someone to open the inbox, a handoff
    # puts the customer's next message in front of whoever accepts — the same operator, the
    # same clock. `detach` so a handoff fault can never fail an already-opened ticket; the
    # confirm card tells the customer which of the two happened.
    - if: '$state.type == "roadside_assistance"'
      then:
        # `detach` produces no result, so nothing is bound — the confirm card below already
        # tells the customer a person is joining; a failure surfaces on the record, not here.
        - do: handoff_request
          args:
            reason:  roadside
            summary: '"Roadside ticket XP-" + $c.case_number + ": " + $coalesce($state.where, $state.details)'
          detach: true
    - render:
        render_intent: text_card
        body: '{$state.type == "roadside_assistance" ? $t("open-support.confirm_roadside", { ref: $c.case_number }) : $t("open-support.confirm", { ref: $c.case_number, sla: $coalesce($c.sla_hours, 48) })}'
      memory_note: 'Opened after-sales ticket XP-{$c.case_number} (type {$state.type}, case_id {$c.case_id}).{$state.type == "roadside_assistance" ? " A person was also requested (handoff) — stay silent until the conversation is returned to you." : ""}'
    - end: applied
