flow_id:     capture-lead
version:     1
description: |-
  [interactive Tool] Capture a sales lead — name, phone, and what they want — so
  the XPeng sales team can follow up. Call whenever the customer wants a quote,
  more info, or a call back. Pass interested_model / interest_type if already known
  (interest_type: quote | info | test_drive | callback).

input:
  interested_model:
    type: enum
    enum: [m03, p7, p7_plus, g6, g9, x9]
    optional: true
  interest_type:
    type: enum
    enum: [info, quote, test_drive, callback]
    optional: true
    describe: 'Why they are interested. Infer from the conversation; defaults to info.'
  name:  { type: string, optional: true, describe: 'Customer name, if already given.' }
  phone: { type: string, optional: true, describe: 'Customer phone, if already given.' }
  email: { type: string, optional: true }
  # `lead.preferred_branch` has been declared since this pack shipped and nothing
  # ever wrote it, so sales read a blank column. Pass it when the customer named a
  # showroom or reached you from its card — never guess one.
  preferred_branch:
    type: enum
    enum: [zayed, dune, mivida]
    optional: true
    describe: 'The showroom they named or tapped through from. Omit if they have not said.'

entry:
  - else: true
    goto: gather

steps:
  gather:
    - collect:
        gap_instructions: '$t("capture-lead.gap")'
        fields:
          # `type: name` CONFIRMS rather than asks: WhatsApp sends the customer's
          # profile name on every inbound, so this shows it back with "that's me" /
          # "a different name" instead of making them type a name we already hold.
          # Not adopted silently — a profile name is a display name, and sales calling
          # a lead filed as "🔥 A 🔥" is worse than one tap.
          - field: name
            type: name
            label: '$t("capture-lead.f_name")'
          # `type: phone` draws WhatsApp's NATIVE "Share Contact Info" button, so the
          # customer answers with ONE TAP and the number arrives Meta-verified and
          # normalised to +E164. That matters here beyond convenience: this value is
          # the `lead` dedupe key (`match:` in `save` below, `dedupe_by: phone` in
          # xrm.yaml), and a typed number reached it in three spellings —
          # `01001234567`, `+201001234567`, `0100 123 4567` — so a returning customer
          # forked into a second lead and split their history. `dial_code` lets someone
          # who types it locally still be understood.
          - field: phone
            type: phone
            dial_code: '20'
            label: '$t("capture-lead.f_phone")'
          # The email now comes back from the SAME tap when the customer shares it —
          # WhatsApp's picker covers phone, email and address, and the platform reads
          # the card's vCard. Still optional, still typeable.
          - field: email
            type: email
            required: false
            label: '$t("capture-lead.f_email")'
        complete: [{ goto: resolve_value }]

  # Seed the lead's expected_value from the interested model's price so the
  # purchase-journey deal_won conversion has a real EGP value when sales wins it.
  resolve_value:
    - if: '$state.interested_model == null'
      goto: save
    - do: record_get
      args:
        entity: model
        match: { field: code, value: '$state.interested_model' }
      bind: mp
      outputs:
        ok:        [{ goto: set_value }]
        not_found: [{ goto: save }]
        # failed → throws → error-net

  set_value:
    - assign:
        'state.expected_value': '$mp.fields.price_from'
    - goto: save

  save:
    - do: record_save
      args:
        entity: lead
        match: { value: '$state.phone' }
        fields:
          name:             '$state.name'
          phone:            '$state.phone'
          email:            '$state.email'
          interest_type:    '$coalesce($state.interest_type, "info")'
          interested_model: '$state.interested_model'
          preferred_branch: '$state.preferred_branch'
          expected_value:   '$state.expected_value'
      bind: saved
      outputs:
        ok:      [{ goto: route }]
        invalid: []          # agent-correctable → reason handed back to the agent
        # failed → throws → error-net

  # `lead` declares `dedupe_by: phone`, so a customer who enquires a SECOND time
  # updates the lead they already have — deliberate, and the reason `phone` is
  # collected with the native share-contact tap. What was not deliberate is that
  # both outcomes then ran the same three steps: a repeat enquiry opened a second
  # identical 24h task, told the customer "we've saved your details" as if they
  # were new, and — when sales had already closed the lead won/lost — landed on a
  # terminal record that every pipeline view filters out. `$saved.created` is the
  # platform saying which of the two it did; branch on it.
  route:
    - if: '$saved.created'
      goto: task
    # A returning customer whose lead is CLOSED needs it back in the pipeline, or
    # the enquiry is stored and invisible. `lead` declares no `transitions:`, so
    # the hop is legal; `not_allowed` is still routed rather than left to throw.
    - if: '$saved.stage == "won" || $saved.stage == "lost"'
      goto: reopen
    - goto: task_again

  reopen:
    - do: record_stage
      args:
        record_id: '$saved.record_id'
        to:        new
        note:      '{$t("capture-lead.reopen_note")}'
      outputs:
        ok:          [{ goto: task_again }]
        not_allowed: [{ goto: task_again }]   # lead is saved either way; the task still pages sales
        not_found:   [{ goto: task_again }]
        failed:      [{ goto: task_again }]

  task:
    - do: task_open
      args:
        title:     '{$t("capture-lead.task_title", { name: $state.name })}'
        body:      '{$t("capture-lead.task_body", { phone: $state.phone })}'
        record_id: '$saved.record_id'
        due_in_hours: 24
      bind: t
      outputs:
        ok:     [{ goto: confirm }]
        failed: [{ goto: confirm }]    # lead is already saved; task is best-effort

  # Same record, so a second "Follow up new lead: {name}" would sit next to the
  # first with nothing to tell them apart. Title it for what it is.
  task_again:
    - do: task_open
      args:
        title:     '{$t("capture-lead.task_title_again", { name: $state.name })}'
        body:      '{$t("capture-lead.task_body_again", { phone: $state.phone })}'
        record_id: '$saved.record_id'
        due_in_hours: 24
      bind: t
      outputs:
        ok:     [{ goto: confirm_again }]
        failed: [{ goto: confirm_again }]

  confirm:
    - render:
        render_intent: text_card
        body: '{$t("capture-lead.confirm", { name: $state.name })}'
      memory_note: 'Lead #{$saved.record_number} CREATED for {$state.name} ({$state.phone}) (record_id {$saved.record_id}).'
    # Purchase funnel: reached buying intent + completed the lead_captured goal.
    - track: { journey: purchase, event: submitted_lead, metadata: { model: '$state.interested_model', interest: '$coalesce($state.interest_type, "info")' } }
    - end: applied

  # The note says UPDATED and names the record, so the next session's agent — and
  # anyone reading the operator timeline — can see the two enquiries are one lead
  # rather than reading "Lead #1 saved" twice and calling it a duplicate write.
  confirm_again:
    - render:
        render_intent: text_card
        body: '{$t("capture-lead.confirm_again", { name: $state.name })}'
      memory_note: 'Lead #{$saved.record_number} UPDATED — existing lead for {$state.name} ({$state.phone}), matched on phone (record_id {$saved.record_id}).'
    # Same event: the journey is monotonic and `lead_captured` is a deduped
    # milestone, so a repeat enquiry re-affirms `intent` without double-counting.
    - track: { journey: purchase, event: submitted_lead, metadata: { model: '$state.interested_model', interest: '$coalesce($state.interest_type, "info")' } }
    - end: applied
