flow_id:     book-test-drive
version:     1
description: |-
  [interactive Tool] Book a real test drive at an XPeng showroom. Guides the
  customer through picking a branch, an open time slot, and their contact details,
  then reserves the slot. Pass model_code and/or branch_code if already known.

input:
  model_code:
    type: enum
    enum: [m03, p7, p7_plus, g6, g9, x9]
    optional: true
  branch_code:
    type: enum
    enum: [zayed, dune, mivida]
    optional: true

entry:
  - else: true
    goto: start

steps:
  # If a branch_code came in (e.g. from a showroom card), resolve it and skip the picker.
  start:
    - if: '$input.branch_code != null'
      then:
        - do: record_get
          args:
            entity: branch
            match: { field: code, value: '$input.branch_code' }
          bind: b0
          outputs:
            ok:        [{ goto: seed_branch }]
            not_found: [{ goto: ask_branch }]
            # failed → the pack's errors.failed message, in the customer's language (canonical handler)
            failed:  []
    - goto: ask_branch

  seed_branch:
    - assign:
        'state.branch_id':    '$b0.id'
        'state.branch_name':  '$loc($b0.fields.name)'
        'state.branch_photo': '$b0.fields.photo'
    - goto: pick_model

  # ── 1) Branch picker — same two ways in as `list-branches` ──
  # Browsing three showrooms and finding the closest one are different questions,
  # and only the customer knows which they are asking. The fork is a tap; the
  # near path then shares ONE card set with the browse path, differing only by a
  # distance line.
  ask_branch:
    - render:
        render_intent: detail_card
        body: '{$t("book-test-drive.b_mode_body")}'
        buttons:
          - { title: '{$t("book-test-drive.b_mode_near")}', on_select: { resume: '$self', with: { branch_mode: near } } }
          - { title: '{$t("book-test-drive.b_mode_all")}',  on_select: { resume: '$self', with: { branch_mode: all } } }
      memory_note: 'Asked whether to pick from all showrooms or find the nearest.'
    - pause:
        on_resume:
          - if:   '$state.branch_mode == "near"'
            goto: ask_branch_where
          - goto: load_branches_all

  # `type: geo` draws the channel's NATIVE share-location affordance. Optional,
  # because a geo field can ONLY be answered by sharing — a required one strands a
  # web visitor who blocks the browser permission. Declining falls through to the
  # full list, which is what the browse path would have shown anyway.
  ask_branch_where:
    - collect:
        fields:
          - field: branch_pin
            type: geo
            required: false
            label:      '$t("book-test-drive.b_label_pin")'
            skip_title: '$t("book-test-drive.b_skip_pin")'
        complete: [{ goto: route_branch_pin }]

  route_branch_pin:
    - if: '$state.branch_pin == null'
      goto: load_branches_all
    - goto: load_branches_near

  # `within_km` bounds it and `near` orders it — both compile the SAME distance
  # expression, so the radius and the ordering can never disagree. 400km covers
  # Egypt end to end, so a customer anywhere still gets an answer.
  load_branches_near:
    - do: record_list
      args:
        entity: branch
        all:    true
        where:  { field: geo, op: within_km, value: { lat: '$state.branch_pin.lat', lng: '$state.branch_pin.lng', km: 400 } }
        sort:   { near: { field: geo, lat: '$state.branch_pin.lat', lng: '$state.branch_pin.lng' } }
        limit:  10
      bind: br
      outputs:
        ok:    [{ goto: show_branches }]
        empty: [{ goto: no_branches }]
        failed:  []

  load_branches_all:
    - do: record_list
      args: { entity: branch, all: true }
      bind: br
      outputs:
        ok:    [{ goto: show_branches }]
        empty: [{ goto: no_branches }]
        failed:  []

  show_branches:
    - if: '$length($br.rows) == 0'      # all:true returns ok+[] for 0 rows, not the empty port
      goto: no_branches
    - render:
        render_intent: carousel        # card shape (buttons[].on_select) — picker item_template.on_select throws on this build
        body: '$state.branch_pin != null ? $t("book-test-drive.b_body_near") : $t("book-test-drive.b_body")'
        items: '$br.rows'
        item_template:
          image_url: '$coalesce($item.fields.photo, "")'
          # The distance line appears only when the rows were near-sorted, so both
          # paths share one template. `distance_km` is the number the rows were
          # ORDERED by — labelling with a recomputed one is how a list ends up
          # reading "5.1 · 2.4 · 9.6".
          body: "$lines($compact([ '🏢 ' + $loc($item.fields.name), $item.distance_km != null ? '📏 ' + $t('book-test-drive.b_km', { km: $round($item.distance_km, 1) }) : null, '📍 ' + $loc($item.fields.area) ]))"
          buttons:
            - { title: '{$t("book-test-drive.choose")}', on_select: { resume: '$self', with: { branch_id: '$item.id', branch_name: '$loc($item.fields.name)', branch_photo: '$item.fields.photo' } } }
      memory_note: 'Showed {$length($br.rows)} showrooms{$state.branch_pin != null ? " nearest-first" : ""} to pick from.'
    - pause:
        on_resume:
          - goto: pick_model

  # ── 2) Model picker — same carousel pattern as the branch step. Skipped when a
  #      model was already chosen (e.g. tapped from a model card). ──
  pick_model:
    - if: '$state.model_code != null'
      goto: load_slots
    - do: record_list
      args: { entity: model, all: true, sort_by: { field: price_from, dir: asc } }
      bind: mr
      outputs:
        ok:    [{ goto: show_models }]
        empty: [{ goto: load_slots }]
        failed:  []

  show_models:
    - if: '$length($mr.rows) == 0'
      goto: load_slots
    - render:
        render_intent: carousel
        body: '{$t("book-test-drive.m_body")}'
        items: '$mr.rows'
        item_template:
          image_url: '$coalesce($item.fields.photo, "")'
          body: '$lines(["🚗 " + $loc($item.fields.name), $loc($item.fields.tagline)])'
          buttons:
            - { title: '{$t("book-test-drive.choose")}', on_select: { resume: '$self', with: { model_code: '$item.fields.code', model_name: '$loc($item.fields.name)' } } }
      memory_note: 'Asked the customer to pick a model to test drive.'
    - pause:
        on_resume:
          - goto: load_slots

  # ── 3) Slot picker (real open slots for the chosen branch) ──
  load_slots:
    - do: slot_list
      args: { resource_record_id: '$state.branch_id', days: 14 }
      bind: sl
      outputs:
        ok:    [{ goto: show_slots }]
        empty: [{ goto: no_slots }]
        failed:  []

  # Two weeks of a showroom's times is far more than a list's 10 rows: rendered whole, every time
  # after the first ten was out of reach (walked on WhatsApp 2026-11-06). So the DAY comes first
  # when the window does not fit one list, and a day that still does not fit is PAGED with a "More"
  # row — the two steps a `collect` picker's `narrow:` + `page:` give, built here on the flow's own
  # pause/resume. Each row leaves out the keys it does not carry (an absent value is left out of a
  # tap; a `null` would be sent).
  show_slots:
    - if: "$length($coalesce($sl.slots, $sl.rows, $sl)) == 0"
      goto: no_slots
    - assign:
        all_slots: '$coalesce($sl.slots, $sl.rows, $sl)'
    - if: '$state.slot_day == null && $length($all_slots) > $caps.list.maxRows'
      goto: show_days
    - assign:
        day_slots: '$state.slot_day == null ? $all_slots : $filter($all_slots, { local_date: $state.slot_day })'
    - assign:
        paged:     '$length($day_slots) > $caps.list.maxRows'
        at:        '$coalesce($state.slot_page, 0) < $length($day_slots) ? $coalesce($state.slot_page, 0) : 0'
    - assign:
        pg:        '$paginate($day_slots, $at, $caps.list.maxRows - 1)'
    - assign:
        rows: '$concat(
                 $map($paged ? $pg.page : $day_slots, {
                   t: $format_date($item.local_date + "T" + $item.local_time, "time"),
                   d: $format_date($item.local_date) + " · " + $format_number($item.slot_minutes) + " " + $t("book-test-drive.min_label") + " · " + $format_number($item.remaining) + " " + $t("book-test-drive.spots_label"),
                   s: $item.slot_start, m: $item.slot_minutes,
                   l: $format_date($item.local_date + "T" + $item.local_time, "day_time")
                 }),
                 $paged ? [$pg.has_more ? { t: $t("book-test-drive.more_times"), d: $t("book-test-drive.more_desc"), p: $pg.next_offset } : { t: $t("book-test-drive.first_times"), d: $t("book-test-drive.first_desc"), p: 0 }] : []
               )'
    - render:
        # A LIST, not a carousel. A time slot has no picture, and Meta requires a header image
        # on EVERY carousel card — it accepted this send, returned a wamid and dropped the
        # message, so no WhatsApp customer ever saw the slots.
        render_intent: list_picker
        header: '$t("book-test-drive.s_header")'
        body:   '$t("book-test-drive.s_body", { branch: $state.branch_name })'
        cta:    '$t("book-test-drive.s_cta")'
        items:  '$rows'
        item_template:
          # The TIME is the title and the DAY leads the description, both in the customer's language:
          # a full Arabic day and time runs past a row title's 24 characters, and the description has 72.
          title:       '$item.t'
          description: '$item.d'
          on_select:   { resume: '$self', with: { slot_start: '$item.s', slot_minutes: '$item.m', slot_label: '$item.l', slot_page: '$item.p' } }
      memory_note: 'Showed open test-drive slots for {$state.branch_name}.'
    - pause:
        on_resume:
          # A "More" row carries no slot — show the next page.
          - if: '$state.slot_start == null'
            goto: show_slots
          - goto: ask_contact

  # The days are paged too: two weeks of a showroom open six or seven days a week is 12–14 days,
  # past a list's 10 rows.
  show_days:
    - assign:
        days:     '$unique($all_slots, "local_date")'
    - assign:
        dpaged:   '$length($days) > $caps.list.maxRows'
        dat:      '$coalesce($state.day_page, 0) < $length($days) ? $coalesce($state.day_page, 0) : 0'
    - assign:
        dpg:      '$paginate($days, $dat, $caps.list.maxRows - 1)'
    - assign:
        day_rows: '$concat(
                     $map($dpaged ? $dpg.page : $days, {
                       t: $format_date($item.local_date),
                       d: $t("book-test-drive.day_slots", { count: $length($filter($all_slots, { local_date: $item.local_date })) }),
                       v: $item.local_date
                     }),
                     $dpaged ? [$dpg.has_more ? { t: $t("book-test-drive.more_days"), d: $t("book-test-drive.more_days_desc"), dp: $dpg.next_offset } : { t: $t("book-test-drive.first_times"), d: $t("book-test-drive.first_days_desc"), dp: 0 }] : []
                   )'
    - render:
        render_intent: list_picker
        header: '$t("book-test-drive.d_header")'
        body:   '$t("book-test-drive.d_body", { branch: $state.branch_name })'
        cta:    '$t("book-test-drive.d_cta")'
        items:  '$day_rows'
        item_template:
          title:       '$item.t'
          description: '$item.d'
          on_select:   { resume: '$self', with: { slot_day: '$item.v', day_page: '$item.dp' } }
      memory_note: 'Showed the days with open test-drive slots at {$state.branch_name}.'
    - pause:
        on_resume:
          # A "More days" row carries no day — show the next page of days.
          - if: '$state.slot_day == null'
            goto: show_days
          - goto: show_slots

  # ── 3) Contact details (free-text collect) ──
  ask_contact:
    - collect:
        gap_instructions: '$t("book-test-drive.gap")'
        fields:
          # CONFIRMS the WhatsApp profile name rather than asking for it — one tap,
          # with a "different name" way out for anyone whose display name is not what
          # should appear on a showroom booking.
          - field: name
            type: name
            label: '$t("book-test-drive.f_name")'
          # ONE TAP on WhatsApp's native "Share Contact Info", normalised to +E164.
          - field: phone
            type: phone
            dial_code: '20'
            label: '$t("book-test-drive.f_phone")'
        complete: [{ goto: reserve }]

  reserve:
    - do: booking_reserve
      args:
        resource_record_id: '$state.branch_id'
        slot_start:         '$state.slot_start'
        slot_minutes:       '$coalesce($state.slot_minutes, 45)'
        fields:
          interested_model: '$state.model_code'
          customer_name:    '$state.name'
          customer_phone:   '$state.phone'
      bind: booking
      outputs:
        ok:           [{ goto: confirm }]
        full:         [{ goto: slot_taken }]
        invalid_slot: [{ goto: slot_taken }]
        # failed → the pack's errors.failed message, in the customer's language (canonical handler)
        failed:  []
        invalid: []

  # The reminders (24h + 2h before) are `remind:` rules in automation.yaml — the platform sends
  # them, and moves or stops them with the booking, from every door.
  confirm:
    - render:
        render_intent: detail_card
        header: '{$t("book-test-drive.c_title")}'
        body: "$lines([ '✅ ' + $t('book-test-drive.confirmed_line'), '', '🏢 ' + $state.branch_name, '📅 ' + $coalesce($state.slot_label, $format_date($state.slot_start, 'day_time', null, 'Africa/Cairo')), '🚗 ' + $coalesce($state.model_name, $state.model_code, $t('book-test-drive.any_model')), '👤 ' + $state.name, '', '🔔 ' + $t('book-test-drive.reminder_note') ])"
        buttons:
          - { title: '{$t("xpeng-egypt.cta_browse")}', on_select: { invoke: browse-models } }
      memory_note: 'Test drive booked at {$state.branch_name} for {$coalesce($state.slot_label, $format_date($state.slot_start, "day_time", null, "Africa/Cairo"))} ({$state.phone}).'
    # Purchase funnel: strongest pre-sale signal — completed the test_drive_booked goal.
    - track: { journey: purchase, event: booked_test_drive, metadata: { model: '$coalesce($state.model_code, "any")' } }
    - if: "$coalesce($state.branch_photo, '') != ''"
      then:
        - do: send_message
          detach: true
          args:
            to: '$conversation.channel_contact_handle'
            intent:
              render_intent: carousel
              body: '{$t("book-test-drive.photo_caption", { branch: $state.branch_name })}'
              items: '[$state.branch_photo]'
              item_template:
                image_url: '$item'
                body: '{$state.branch_name}'
    - end: applied

  slot_taken:
    - answer:
        instructions: "The chosen test-drive slot is no longer available (just taken or full). Apologize briefly in the customer's language and invite them to book again to pick another time."

  no_slots:
    - answer:
        instructions: "There are no open test-drive slots at this showroom right now. Apologize in the customer's language, suggest trying another branch, or offer to capture their details via capture-lead so sales can arrange a time."

  no_branches:
    - answer:
        instructions: "Showrooms couldn't be loaded. Apologize briefly in the customer's language and offer to take their details via capture-lead."
