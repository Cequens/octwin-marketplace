# xrm.yaml — records module for XPeng Egypt.
#
#   model   : reference catalog (no pipeline → always listed). The lineup.
#   branch  : reference catalog of showrooms (also the bookable resource).
#   lead    : sales pipeline (new → … → won/lost), deduped by phone.
#   booking : the platform `booking` system entity, EXTENDED with pack fields.
#
# Localized text fields hold a { en, ar } bag; render them in flows via $loc(value).
# The `demo:` block seeds reference data on `octwin deploy --seed`.
# 'generate:<prompt>' attaches an AI photo IF the deploy token has media:generate.

entities:

  # ─────────────────────────────────────────── the lineup ──
  model:
    label: { en: 'Model', ar: 'موديل' }
    icon:        '🚘'
    description: { en: 'A model in the line-up, its body type and range', ar: 'طراز ضمن التشكيلة ونوع هيكله ومداه' }
    fields:
      name:        { type: text, required: true, localized: true }
      code:        { type: text, required: true, unique: true }
      body_type:
        type: select
        options:
          - { value: sedan, label: { en: 'Sedan',            ar: 'سيدان' } }
          - { value: suv,   label: { en: 'SUV',              ar: 'دفع رباعي (SUV)' } }
          - { value: mpv,   label: { en: 'MPV (7-seater)',   ar: 'عائلية 7 مقاعد (MPV)' } }
      tagline:     { type: text, localized: true }
      range_km:    { type: number, sortable: true }
      battery_kwh: { type: number }
      power_hp:    { type: number }
      accel_0_100: { type: number }
      seats:       { type: number }
      price_from:  { type: number }        # EGP major units; indicative (see demo note)
      highlights:  { type: textarea, localized: true }
      photo:       { type: image }
      gallery:     { type: image_list }
    title_field: name
    list: [body_type, range_km]
    dedupe_by: code

  # ─────────────────────────────────────── the showrooms ──
  branch:
    label: { en: 'Showroom', ar: 'معرض' }
    icon:        '📍'
    description: { en: 'A showroom customers can test drive at', ar: 'معرض يمكن للعملاء تجربة القيادة فيه' }
    fields:
      name:    { type: text, required: true, localized: true }
      code:    { type: text, required: true, unique: true }
      area:    { type: text, localized: true }
      address: { type: text, localized: true }
      phone:   { type: text }
      hours:   { type: text, localized: true }
      geo:     { type: geo }
      photo:   { type: image }
    title_field: name
    list: [area]
    dedupe_by: code

  # ─────────────────────────────────────────── sales leads ──
  lead:
    label: { en: 'Sales lead', ar: 'عميل محتمل' }
    icon:        '🌟'
    description: { en: 'A sales enquiry, from first contact to close', ar: 'استفسار مبيعات من أول تواصل حتى الإغلاق' }
    fields:
      name:  { type: text, required: true }
      phone: { type: text, required: true }
      email: { type: text }
      interested_model:
        type: select
        options:
          - { value: m03,     label: { en: 'MONA M03', ar: 'مونا M03' } }
          - { value: p7,      label: { en: 'P7',       ar: 'P7' } }
          - { value: p7_plus, label: { en: 'P7+',      ar: '+P7' } }
          - { value: g6,      label: { en: 'G6',       ar: 'G6' } }
          - { value: g9,      label: { en: 'G9',       ar: 'G9' } }
          - { value: x9,      label: { en: 'X9',       ar: 'X9' } }
      interest_type:
        type: select
        options:
          - { value: info,       label: { en: 'More info',      ar: 'معلومات أكثر' } }
          - { value: quote,      label: { en: 'Price quote',    ar: 'عرض سعر' } }
          - { value: test_drive, label: { en: 'Test drive',     ar: 'تجربة قيادة' } }
          - { value: callback,   label: { en: 'Call me back',   ar: 'اتصلوا بيا' } }
      preferred_branch:
        type: select
        options:
          - { value: zayed,  label: { en: 'Sheikh Zayed', ar: 'الشيخ زايد' } }
          - { value: dune,   label: { en: 'DUNE Mall',    ar: 'دُن مول' } }
          - { value: mivida, label: { en: 'Mivida',       ar: 'ميفيدا' } }
      notes: { type: textarea }
      # Expected deal value (EGP) — seeded from the interested model's price at
      # capture time; the purchase-journey conversion value pulls from this.
      expected_value: { type: number }
    list: [interest_type, phone]
    dedupe_by: phone
    pipeline:
      stages:   [new, contacted, qualified, won, lost]
      initial:  new
      terminal: [won, lost]
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      new:       { en: 'Enquiry received, no contact made yet', ar: 'وصل الاستفسار دون تواصل بعد' }
      contacted: { en: 'Reached out; awaiting a reply', ar: 'تم التواصل وبانتظار الرد' }
      qualified: { en: 'Genuine intent and budget confirmed', ar: 'تأكدت الجدية والميزانية' }
      won:       { en: 'Sale closed', ar: 'تم إتمام البيع' }
      lost:      { en: 'Closed without a sale', ar: 'أُغلق دون بيع' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      new:       { en: 'New', ar: 'جديد' }
      contacted: { en: 'Contacted', ar: 'تم التواصل' }
      qualified: { en: 'Qualified', ar: 'مؤهل' }
      won:       { en: 'Won', ar: 'تم البيع' }
      lost:      { en: 'Lost', ar: 'مغلق' }
    # Reaction hooks (reactions-guide `on:` grammar). Off-channel funnel bridge:
    # when a rep marks the lead `won` (however it happens — console, a flow's
    # record_stage, or an automation transition), complete the purchase journey's
    # terminal goal, valued per-lead from expected_value. Each hook is a LIST of
    # single-verb directives. Do NOT also emit this goal from a flow.
    on:
      enter:
        won:
          - track: { journey: purchase, goal_reached: deal_won, value_field: expected_value }

  # ──────────────────────── test-drive bookings (system entity) ──
  booking:
    extends: system                 # merge pack fields over the platform booking template
    label:       { en: 'Test drive', ar: 'تجربة قيادة' }
    icon:        '🚘'
    description: { en: 'A booked test drive at a showroom', ar: 'تجربة قيادة محجوزة في أحد المعارض' }
    fields:
      interested_model:
        type: select
        options:
          - { value: m03,     label: { en: 'MONA M03', ar: 'مونا M03' } }
          - { value: p7,      label: { en: 'P7',       ar: 'P7' } }
          - { value: p7_plus, label: { en: 'P7+',      ar: '+P7' } }
          - { value: g6,      label: { en: 'G6',       ar: 'G6' } }
          - { value: g9,      label: { en: 'G9',       ar: 'G9' } }
          - { value: x9,      label: { en: 'X9',       ar: 'X9' } }
      customer_name:  { type: text }
      customer_phone: { type: text }
      notes:          { type: textarea }

