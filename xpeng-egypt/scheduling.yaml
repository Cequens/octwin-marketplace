# scheduling.yaml — makes each `branch` a bookable resource for test drives.
#
# A test-drive booking is the platform `booking` XRM system entity (extended in
# xrm.yaml). slot_list expands the availability below into free slots; the flow
# reserves one with booking_reserve. The reminders are `remind:` rules in
# automation.yaml, so the platform sends them — the flow schedules nothing.

timezone: Africa/Cairo

resources:
  branch:
    slot:
      default_minutes:  45      # fallback for booking_reserve's slot_minutes ARG
      window_days:      14      # offer slots up to 2 weeks out
    # Its reminders are rules — automation.yaml (`remind:`).

booking:
  entity: booking

# demo availability — seeded on `octwin deploy --seed`. dow: 0=Sun … 6=Sat.
# Each rule carries its OWN slot_minutes + capacity: the grid and the seat count
# come from the rule row, never from `resources.branch.slot` above (that block's
# default_minutes is only the fallback for the booking_reserve argument). Without
# them these rules took the engine defaults — a 20-minute grid at capacity 1.
# Zayed & Mivida open Sat–Thu 11:00–20:00 (closed Fri=5); DUNE Mall daily 12:00–22:00.
demo:
  availability:
    - resource_match: { entity: branch, field: code, value: zayed }
      rules:
        - { dow: 6, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 0, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 1, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 2, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 3, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 4, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }

    - resource_match: { entity: branch, field: code, value: dune }
      rules:
        - { dow: 6, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }
        - { dow: 0, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }
        - { dow: 1, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }
        - { dow: 2, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }
        - { dow: 3, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }
        - { dow: 4, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }
        - { dow: 5, start: '12:00', end: '22:00', slot_minutes: 45, capacity: 2 }

    - resource_match: { entity: branch, field: code, value: mivida }
      rules:
        - { dow: 6, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 0, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 1, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 2, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 3, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
        - { dow: 4, start: '11:00', end: '20:00', slot_minutes: 45, capacity: 2 }
