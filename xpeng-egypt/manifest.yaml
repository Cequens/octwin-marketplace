# manifest.yaml — the entire XPeng Egypt pack is declared here.
# Strict schema: unknown keys are rejected on deploy. Keep `octwin validate` green.

id:          xpeng-egypt
version:     '2.0.0'
description: 'XPeng Egypt assistant — browse models, capture leads, book test drives, activate the XPeng App, and open after-sales support tickets on WhatsApp & web (AR/EN).'

# Storefront face. Without this block the pack still publishes and installs, but
# lands in the catalog with no title, no tagline and NO CATEGORY — every
# category-grouped marketplace view then files it under an unnamed bucket.
# `automotive` is the existing category (see motorcare-service), not a new one.
listing:
  title:    'XPeng Egypt'
  tagline:  'Browse models, book a test drive, and open after-sales tickets'
  category: automotive
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# Channels + platform capabilities. `messaging` is the conversational adapter;
# records / scheduling / casework are unlocked by the sibling declaration files
# (xrm.yaml / scheduling.yaml / worklist.yaml), not by an adapter.
supported_channels: [whatsapp, web]
required_adapters:  [messaging]

# Default language for platform-emitted copy + `$t()` lookups. The agent still
# adapts to whichever language the customer writes in (bilingual — see prompt).
default_settings:
  locale: ar

# Agent-callable flow tools → flows/tools/<id>.flow.yaml (+ locale files).
flows:
  - home
  - browse-models
  - model-details
  - capture-lead
  - list-branches
  - book-test-drive
  - activate-app
  - open-support
  - ticket-status
  - after-sales

# Voice notes → speech-to-text, then the normal agent turn with the transcript
# in the pre-turn briefing. WITHOUT this block the platform defaults to
# `passthrough`: the media ref survives, but the agent is told it cannot hear
# the audio and asks the customer to type instead. `prompt` is Whisper's
# free-text BIASING hint (not a language code) — it names the model badges,
# which are exactly the tokens STT mangles when spoken in Arabic.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها... / Got your voice note, transcribing…'
    prompt: 'Egyptian Arabic XPeng car showroom voice note — model names M03, P7, G6, G9, X9; test drive booking, price, financing, branch location.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

# One agent — the XPeng Egypt showroom assistant.
agents:
  - id:                assistant
    display_name:      'XPeng Egypt Assistant'
    default_model:     'openrouter/anthropic/claude-sonnet-4-5'
    tools:
      - home
      - browse-models
      - model-details
      - capture-lead
      - list-branches
      - book-test-drive
      - activate-app
      - open-support
      - ticket-status
      - after-sales
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
