# clinic-home — entry menu. Greets, shows the upcoming-appointment count, and
# offers the three actions (find a doctor / book / manage). Pure YAML.

flow_id:     clinic-home
version:     1
description: Welcome / main menu. Call on a greeting, "start", "what can you do?", or a message whose intent is unclear.

input:
  # Matches the sibling packs' `home` flows: this is a line the AGENT composes, not
  # the patient's text echoed back. The old "Optional note from the user" reading
  # invited the agent to pass the inbound message straight through.
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this patient (e.g. greet them by name).'

entry:
  - else: true
    goto: render_menu

steps:
  render_menu:
    # Journey: the patient opened the main menu → discovery stage.
    - track: { event: browsed, timeline: true }
    - render:
        render_intent: list_picker
        header: '{$t("clinic-home.header")}'
        body: '{$t("clinic-home.body_default")}'
        cta: '{$t("clinic-home.cta")}'
        items:
          - { title: '{$t("clinic-home.action.find")}',     on_select: { invoke: doctor-search,       with: {} } }
          - { title: '{$t("clinic-home.action.book")}',     on_select: { invoke: book-appointment,    with: {} } }
          - { title: '{$t("clinic-home.action.manage")}',   on_select: { invoke: manage-appointments, with: {} } }
          - { title: '{$t("clinic-home.action.branches")}', on_select: { invoke: branches,            with: {} } }
      memory_note: '{$t("clinic-home.memory_note")}'
    - end: applied
