# manage-appointments — list / detail / confirm / reschedule / cancel / rate over
# the `booking` XRM system entity + the platform scheduling engine. Also the
# target of the reminder card taps (action=confirm/reschedule/cancel). Pure YAML.

flow_id:     manage-appointments
version:     1
description: |-
  [interactive] View, confirm, reschedule, cancel, or rate the patient's
  appointments. Call with no args to list them; with `appointment_id` to open one;
  reminder buttons call it with `action` (confirm/reschedule/cancel).

input:
  appointment_id: { type: string, optional: true, describe: 'Target booking record id from the patient''s appointment list — never typed. Omit it to show the list so the patient can pick.' }
  action:         { type: string, optional: true, describe: 'One of: confirm | reschedule | cancel | rate.' }
  new_slot_start: { type: string, optional: true, describe: 'Internal — the slot the reschedule picker chose. Never typed.' }
  slot_minutes:   { type: number, optional: true, integer: true, describe: 'Internal — slot length; re-read from the chosen slot when absent.' }
  stars:          { type: number, optional: true, integer: true, min: 1, max: 5, describe: 'Internal — rating carried from the stars picker.' }
  comment:        { type: string, optional: true, describe: "The patient's own words about the visit, captured verbatim from their reply after they picked a star rating. Only for action=rate_comment." }

entry:
  - if: '$input.action == "confirm"'
    goto: do_confirm
  - if: '$input.action == "cancel"'
    goto: do_cancel
  - if: '$input.action == "rate" && $input.stars != null'
    goto: do_rate
  - if: '$input.action == "rate_comment" && $input.comment != null'
    goto: do_rate_comment
  - if: '$input.action == "rate"'
    goto: ask_rating
  - if: '$input.action == "reschedule"'
    goto: start_reschedule
  - if: '$input.appointment_id != null'
    goto: show_detail
  - else: true
    goto: show_list

steps:
  # ── List (contact-scoped bookings, active + past) ─────────────────────────
  show_list:
    - do: record_list
      args: { entity: booking, active_only: false, sort: updated_at, limit: 30 }
      bind: appts
      outputs:
        ok:     [{ goto: render_list }]
        empty:  [{ goto: no_appts }]
        failed: [{ end: failed }]

  render_list:
    - render:
        render_intent: list_picker
        header: '{$t("manage-appointments.list_header")}'
        body:   '{$t("manage-appointments.list_body", { count: $length($appts.rows) })}'
        cta:    '{$t("manage-appointments.list_cta")}'
        items: '$appts.rows'
        item_template:
          title:       '{$coalesce($item.fields.doctor_label, "-")} — {$format_date($item.fields.slot_start, "day_time", null, "Africa/Cairo")}'
          description: '$in($item.stage, ["completed", "cancelled", "no_show"]) ? $t("manage-appointments.past") : $t("manage-appointments.upcoming")'
          on_select:
            invoke: manage-appointments
            with: { appointment_id: '$item.id' }
      memory_note: 'Listed {$length($appts.rows)} appointment(s)'
    - end: applied

  no_appts:
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.none")}'
    - end: applied

  # ── Detail card with actions ──────────────────────────────────────────────
  show_detail:
    - do: record_get
      args: { entity: booking, record_id: '$input.appointment_id' }
      bind: appt
      outputs:
        ok:        [{ goto: render_detail }]
        not_found: [{ goto: not_found }]
        failed:    [{ end: failed }]

  render_detail:
    - render:
        render_intent: detail_card
        body: '$lines($compact([$t("manage-appointments.detail.doctor", { doctor: $coalesce($appt.fields.doctor_label, "-") }), $t("manage-appointments.detail.slot", { slot: $format_date($appt.fields.slot_start, "day_time", null, "Africa/Cairo") }), $appt.fields.for_whom == "dependent" ? $t("manage-appointments.detail.for_whom", { who: $coalesce($appt.fields.dependent, "-") }) : null]), "\n")'
        buttons:
          - { title: '{$t("manage-appointments.button.reschedule")}', on_select: { invoke: manage-appointments, with: { action: reschedule, appointment_id: '$appt.id' } } }
          - { title: '{$t("manage-appointments.button.cancel")}',     on_select: { invoke: manage-appointments, with: { action: cancel,     appointment_id: '$appt.id' } } }
          - { title: '{$t("manage-appointments.button.rate")}',       on_select: { invoke: manage-appointments, with: { action: rate,       appointment_id: '$appt.id' } } }
      memory_note: 'Appointment detail {$appt.id} ({$appt.stage})'
    - end: applied

  not_found:
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.not_found")}'
    - end: applied

  # ── Confirm ───────────────────────────────────────────────────────────────
  do_confirm:
    - do: record_stage
      args: { record_id: '$input.appointment_id', to: confirmed }
      outputs:
        ok:          [{ goto: confirmed_done }]
        not_allowed: [{ goto: confirmed_done }]
        not_found:   [{ goto: not_found }]
        failed:      [{ end: failed }]

  confirmed_done:
    # Journey: the patient confirmed the appointment → confirmed stage.
    - track: { event: appointment_confirmed, timeline: true }
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.confirmed")}'
      memory_note: 'Confirmed appointment {$input.appointment_id}'
    - end: applied

  # ── Cancel — confirm first, then release the seat (its reminders go with it) ──
  do_cancel:
    - do: record_get
      args: { entity: booking, record_id: '$input.appointment_id' }
      bind: appt
      outputs:
        ok:        [{ goto: confirm_cancel }]
        not_found: [{ goto: not_found }]
        failed:    [{ end: failed }]

  confirm_cancel:
    - use: approve_apply
      with:
        preview: '$lines($compact([$t("manage-appointments.cancel_confirm.body"), $t("manage-appointments.detail.doctor", { doctor: $coalesce($appt.fields.doctor_label, "-") }), $t("manage-appointments.detail.slot", { slot: $format_date($appt.fields.slot_start, "day_time", null, "Africa/Cairo") })]), "\n")'
        header:  '{$t("manage-appointments.cancel_confirm.header")}'
        confirm_title: '{$t("manage-appointments.cancel_confirm.yes")}'
        cancel_title:  '{$t("manage-appointments.cancel_confirm.keep")}'
        apply: apply_cancel
        abort_render: { render_intent: text_card, body: '{$t("manage-appointments.cancel_kept")}' }
        # Neither approve nor decline (a typed reply, an agent resume, a stale tap)
        # → re-enter THIS step: re-render the confirm card and pause again.
        on_other: confirm_cancel
        memory_note: 'Confirm-cancel for {$state.appointment_id}'

  apply_cancel:
    - do: booking_cancel
      args: { record_id: '$state.appointment_id' }
      outputs:
        ok:              [{ goto: cancel_done }]
        not_cancellable: [{ goto: cancel_done }]
        failed:          [{ end: failed }]

  cancel_done:
    # Its reminders stop with it — they are `remind:` rules in automation.yaml.
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.cancelled")}'
      memory_note: 'Cancelled appointment {$state.appointment_id}'
    - end: applied

  # ── Rate (survey_submit → survey_response XRM record) ──────────────────────
  ask_rating:
    - render:
        render_intent: list_picker
        header: '{$t("manage-appointments.rate_header")}'
        # `body:` is REQUIRED on a list_picker. WhatsApp rejects an interactive
        # list with no `interactive.body.text`, so without this the message was
        # never delivered — the flow reached this step and the patient saw
        # nothing at all. On web it drew with the header alone, which is why it
        # looked fine in testing.
        body:   '{$t("manage-appointments.rate_body")}'
        cta:    '{$t("manage-appointments.rate_cta")}'
        items:
          - { title: '⭐',          on_select: { invoke: manage-appointments, with: { action: rate, appointment_id: '$input.appointment_id', stars: 1 } } }
          - { title: '⭐⭐',         on_select: { invoke: manage-appointments, with: { action: rate, appointment_id: '$input.appointment_id', stars: 2 } } }
          - { title: '⭐⭐⭐',        on_select: { invoke: manage-appointments, with: { action: rate, appointment_id: '$input.appointment_id', stars: 3 } } }
          - { title: '⭐⭐⭐⭐',       on_select: { invoke: manage-appointments, with: { action: rate, appointment_id: '$input.appointment_id', stars: 4 } } }
          - { title: '⭐⭐⭐⭐⭐',      on_select: { invoke: manage-appointments, with: { action: rate, appointment_id: '$input.appointment_id', stars: 5 } } }
      memory_note: 'Asking for a rating of {$input.appointment_id}'
    - end: applied

  do_rate:
    # The rated DOCTOR comes off the booking: survey_submit keys the response on the
    # APPOINTMENT (upsert on subject_ref), so the doctor has to travel with the submit.
    # That is what `fields:` is for — see the survey_response extension in xrm.yaml.
    - do: record_get
      args: { entity: booking, record_id: '$input.appointment_id' }
      bind: rated_appt
      outputs:
        ok:        [{ goto: submit_rating }]
        not_found: [{ goto: not_found }]
        failed:    [{ end: failed }]

  submit_rating:
    # ONE write does all of it.
    #
    # `fields:` stamps the rollup dimension in the same statement as the answer, and
    # `doctor.rating` / `doctor.rating_count` carry a declared `rollup:` (xrm.yaml), so the
    # engine recomputes them the moment this lands. `record_search rank_by: rating` then
    # re-orders the picker — a rated visit still changes who surfaces first.
    #
    # This replaced FIVE steps: stamp the dimension, record_aggregate the average,
    # record_aggregate the count, record_save the doctor. Every one of them routed its
    # failure port to `rating_thanks`, because making a patient pay for our bookkeeping is
    # not an option — which meant the rating could silently drift while they were thanked.
    # One write cannot half-succeed.
    - do: survey_submit
      args:
        survey:      visit_feedback
        subject_ref: '$input.appointment_id'
        answers:     { stars: '$input.stars' }
        fields:      { doctor: '$rated_appt.fields.resource_id' }
      outputs:
        ok:     [{ goto: rating_thanks }]
        failed: [{ end: failed }]

  rating_thanks:
    # Journey: the patient rated the visit → attended stage + visit_completed goal (terminal).
    - track: { event: visit_rated, timeline: true }
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.rated", { stars: $input.stars })}'
      memory_note: |-
        Rated appointment {$input.appointment_id}: {$input.stars}★, and asked for an optional
        comment. If the patient's next message says anything about the visit, call
        manage-appointments with action=rate_comment, appointment_id={$input.appointment_id}
        and comment set to their words verbatim. If they decline or change the subject, drop it.
    - end: applied

  # ── The comment (second answer, arrives as free text on a later turn) ──────
  # survey_submit upserts on (survey_key, subject_ref) and MERGES the answer bag
  # per key, so submitting the comment ALONE updates the same response and keeps
  # the stars — which still score and still satisfy `required`.
  # This read exists only to tell "already rated" from "not rated yet"; it does
  # NOT feed the submit. Never read the stars back to re-send them.
  do_rate_comment:
    - do: record_list
      args:
        entity: survey_response
        where:
          all:
            - { field: survey_key,  op: eq, value: visit_feedback }
            - { field: subject_ref, op: eq, value: '$input.appointment_id' }
        limit: 1
      outputs:
        ok:     [{ goto: submit_comment }]
        empty:  [{ goto: rate_first }]
        failed: [{ end: failed }]

  submit_comment:
    - do: survey_submit
      args:
        survey:      visit_feedback
        subject_ref: '$input.appointment_id'
        answers:
          comment: '$input.comment'
      outputs:
        ok:     [{ goto: comment_saved }]
        failed: [{ end: failed }]

  comment_saved:
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.comment_saved")}'
      memory_note: 'Saved the visit comment for {$input.appointment_id}'
    - end: applied

  rate_first:
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.rate_first")}'
      memory_note: 'No rating on {$input.appointment_id} yet — comment not saved'
    - end: applied

  # ── Reschedule (slot picker → the reminders follow by themselves) ─────────────────────────────
  start_reschedule:
    - do: record_get
      args: { entity: booking, record_id: '$input.appointment_id' }
      bind: appt
      outputs:
        # Only `$state` survives the picker's pauses (a day tap, a page tap), so the
        # doctor's id rides there rather than on the `$appt` bind.
        ok:
          - assign: { state: '$merge($state, { resource_id: $appt.fields.resource_id })' }
          - goto: pick_new_slot
        not_found: [{ goto: not_found }]
        failed:    [{ end: failed }]

  # The same picker as book-appointment's slot field. A week of slots is far more than
  # one list holds (36 for one doctor; a channel shows 10 and cuts the rest where
  # nobody can reach them), so `narrow:` asks for the DAY first — only when the slots
  # do not fit — and `page:` pages a day that is still too long.
  pick_new_slot:
    - collect:
        fields:
          - field: new_slot_start
            label: '$t("manage-appointments.label.slot")'
            options:
              header: manage-appointments.reschedule_header
              # Required — see the note on `rate_body` above. Without it WhatsApp
              # refused the message and the reschedule picker never arrived.
              body:   manage-appointments.reschedule_body
              cta:    manage-appointments.reschedule_cta
              fetch:  { do: slot_list, args: { resource_record_id: '$state.resource_id' }, bind: slots }
              rows:   '$state.slot_day == null ? $slots : $filter($slots, { local_date: $state.slot_day })'
              map:    { value: '$item.slot_start', label: '$format_date($item.local_date + "T" + $item.local_time, "time")', description: '$lines($compact([$format_date($item.local_date), $loc($item.meta.branch_label)]), " · ")' }
              page:   true
              narrow:
                field: slot_day
                options:
                  header: manage-appointments.reschedule_day_header
                  body:   manage-appointments.reschedule_day_body
                  cta:    manage-appointments.reschedule_day_cta
                  rows:   '$unique($slots, "local_date")'
                  map:    { value: '$item.local_date', label: '$format_date($item.local_date)', description: '$t("manage-appointments.day_slots", { count: $length($filter($slots, { local_date: $item.local_date })) })' }
              # A fully-booked doctor is a normal answer — say it instead of failing.
              on_empty: no_slots
        complete: [{ goto: do_reschedule }]

  no_slots:
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.no_slots")}'
    - end: applied

  # The tap carries only the slot's start (a row id is capped at 200 code points). Its
  # length and branch are re-read here from the list the picker drew. The time is never
  # stored as text: a `slot_label` copy kept the OLD time after every move made outside
  # this flow, and "My appointments" showed it — it reads `slot_start` now.
  do_reschedule:
    - do: slot_list
      args: { resource_record_id: '$state.resource_id' }
      bind: chosen
      outputs:
        ok:     [{ goto: move_booking }]
        empty:  [{ goto: reschedule_failed }]   # nothing free any more — the chosen time went too
        failed: [{ end: failed }]

  move_booking:
    - assign: { hit: '$filter($chosen, { slot_start: $state.new_slot_start })[0]' }
    - if: '$hit == null'
      then: [{ goto: reschedule_failed }]     # taken since the picker was drawn
    - do: booking_reschedule
      args:
        record_id:      '$state.appointment_id'
        new_slot_start: '$state.new_slot_start'
        slot_minutes:   '$coalesce($state.slot_minutes, $hit.slot_minutes)'
        fields:
          branch:     '$hit.meta.branch'
      bind: resched
      outputs:
        ok:           [{ goto: reschedule_done }]
        full:         [{ goto: reschedule_failed }]
        invalid_slot: [{ goto: reschedule_failed }]
        invalid:      [{ end: failed }]   # a field the booking refused — ours, not the patient's
        failed:       [{ end: failed }]
        not_movable: [{ end: { status: aborted, instructions: 'This booking can no longer be moved — it is already completed, cancelled or in the past. Say so in one short line, in the customer''s language, and offer to book a new time.' } }]

  reschedule_done:
    # Its reminders moved with it, the new time in their words (scheduling.yaml).
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.rescheduled")}'
      memory_note: 'Rescheduled {$state.appointment_id}'
    - end: applied

  reschedule_failed:
    - render:
        render_intent: text_card
        body: '{$t("manage-appointments.reschedule_failed")}'
    - end: aborted
