# book-appointment — the booking collect engine, over the platform scheduling +
# XRM record modules (no pack DB). A `collect:` node gathers doctor → slot →
# for-whom (self/dependent) → reason → insurance, prepends a running progress
# card, then `use: approve_apply` confirms and `booking_reserve` writes the
# `booking` XRM record + schedules the T-24h/T-2h reminders. Pure YAML.

flow_id:     book-appointment
version:     1
description: |-
  [interactive] Book an outpatient appointment. Call when the patient wants to book.
  Pass `doctor_id` (a doctor record id from doctor-search) when known; else the tool
  shows a doctor picker. Pre-fill `reason_ar` / `insurance_tpa` / `media_refs` from a
  voice note or document the patient sent (per the media briefing).

input:
  doctor_id:  { type: string, optional: true, describe: 'Chosen doctor record id from a doctor-search result — never a typed name. If the patient only named a doctor, call doctor-search first and let them pick.' }
  media_refs: { type: array, items: { type: string }, optional: true, describe: 'MEDIA- refs of documents the patient sent for this visit.' }
  # reason_ar / insurance_tpa are free-text collect fields (below), auto-exposed
  # in the inputSchema with their `describe:`.

entry:
  - else: true
    goto: collect_fields

steps:
  collect_fields:
    - collect:
        # A REQUEST, not a guarantee. Asked as ONE native form where that is possible, and
        # field-by-field everywhere else — on web (no form client) and on any business Meta
        # has not verified, which is most of them. Both paths collect the same `$state`, so
        # nothing else in this node changes.
        form_flow: true
        # Accumulator is `$state` (the universal turn-merge folds this turn's $input in).
        before_each:
          # Resolve the chosen doctor's label for the progress card + preview.
          # Re-runs each iteration (cheap; record_get is one indexed read).
          - assign: { doctor_label: null }
          - if: '$state.doctor_id != null'
            then:
              - do: record_get
                args: { entity: doctor, record_id: '$state.doctor_id' }
                bind: doc
              - if: '$doc.fields != null'
                then:
                  - assign: { doctor_label: '$doc.fields.name' }
                else:
                  # The passed doctor_id doesn't resolve to a real doctor — a stale id, or
                  # one the agent hallucinated instead of reusing a doctor-search result.
                  # Drop it so the doctor picker (field below, `when: doctor_id == null`)
                  # re-engages this turn, rather than proceeding to the slot fetch — which
                  # would call slot_list with a dead resource id and crash the whole tool
                  # (bare `fetch:` bind surfaces slot_list's `failed` port by throwing —
                  # see docs/BACKLOG.md "Collect-engine `options.fetch` has no failure-port
                  # handling" for the general gap this per-flow guard stubs around).
                  - assign: { state: '$merge($state, { doctor_id: null })' }
          # Re-derive what the slot row used to ferry in its tap id. A picker row's id is
          # capped at 200 code points, and `slot_label` was the `label:` expression
          # re-evaluated into it — the one string the row is already displaying — which
          # took the id to 220. Carry the id (slot_start, backfilled by the engine) and
          # re-read the label here instead. See the platform KB, craft-flows "Bind
          # identifiers, not labels". Guarded on slot_label so this costs ONE slot_list
          # for the whole run, and `$merge($state, …)` is what carries it through the
          # approve_apply suspend into commit_booking / the reminders / the success card.
          - if: '$state.slot_start != null && $state.slot_label == null'
            then:
              - do: slot_list
                args: { resource_record_id: '$state.doctor_id' }
                bind: chosen
                outputs:
                  ok:
                    - assign: { hit: '$filter($chosen, { slot_start: $state.slot_start })[0]' }
                    - if: '$hit != null'
                      then:
                        - assign:
                            state: '$merge($state, { slot_minutes: $hit.slot_minutes, branch_id: $hit.meta.branch, slot_label: $lines($compact([$hit.local_date, $hit.local_time, $hit.meta.branch_label]), " — ") })'
                  empty:  []
                  failed: []
        progress: '$lines($compact([$t("book-appointment.progress.header"), $doctor_label != null ? $t("book-appointment.progress.doctor", { doctor: $doctor_label }) : null, $state.slot_label != null ? $t("book-appointment.progress.slot", { slot: $state.slot_label }) : null, $state.for_whom != null ? $t("book-appointment.progress.for_whom", { who: ($state.for_whom == "dependent" ? $coalesce($state.dependent_name, $t("book-appointment.for_whom.dependent")) : $t("book-appointment.for_whom.self")) }) : null]), "\n")'
        gap_instructions: 'Ask the patient for the next missing detail ({$collect_field}), one at a time, in Egyptian Arabic. Re-call book-appointment once they answer. Do NOT give medical advice.'
        fields:
          # Doctor picker — only when no doctor was pre-chosen. Browses top doctors
          # (record_search with an empty query → ranked by rating); the selection
          # stashes the doctor label for the cards.
          - field: doctor_id
            when: '$state.doctor_id == null'
            label: '$t("book-appointment.label.doctor")'
            options:
              header: book-appointment.field_header.doctor
              cta:    book-appointment.field_cta.doctor
              fetch:  { do: record_search, args: { entity: doctor, query: '' }, bind: docs }
              rows:   '$docs.rows'
              # No `selection:` — `doctor_id` is backfilled from `value` automatically, and
              # `before_each` re-reads the doctor's name into $doctor_label every iteration,
              # so shipping the name in the tap id too bought nothing.
              map:    { value: '$item.id', label: '$item.fields.name', description: '$item.fields.specialty' }
              auto_resolve: true
          # Slot picker — from the scheduling engine. A doctor may work different branches on
          # different days, so each slot carries its rule's branch on `meta` (branch_label for
          # display, branch = the record id). The label folds the branch in
          # ("2026-07-18 — 10:00 — فرع المعادي"); `slot_minutes` / `branch_id` / `slot_label`
          # are re-read from the same row by `before_each` rather than ridden in the tap id,
          # which is what kept that id under the 200-code-point cap.
          - field: slot_start
            label: '$t("book-appointment.label.slot")'
            options:
              header: book-appointment.field_header.slot
              cta:    book-appointment.field_cta.slot
              fetch:  { do: slot_list, args: { resource_record_id: '$state.doctor_id' }, bind: slots }
              rows:   '$slots'
              map:    { value: '$item.slot_start', label: '$lines($compact([$item.local_date, $item.local_time, $item.meta.branch_label]), " — ")' }
          # Who the visit is for.
          - field: for_whom
            label: '$t("book-appointment.label.for_whom")'
            options:
              header: book-appointment.field_header.for_whom
              cta:    book-appointment.field_cta.for_whom
              items:
                - { value: self,      label: book-appointment.for_whom.self }
                - { value: dependent, label: book-appointment.for_whom.dependent }
          # Dependent name — only on the dependent path; free-text.
          - field: dependent_name
            when: '$state.for_whom == "dependent"'
            label: '$t("book-appointment.label.dependent_name")'
            describe: "The dependent's full name — only when the visit is for a family member (for_whom = dependent), captured as free text from the patient."
          # Enrichment — never blocks; collected if the agent pre-filled it.
          - field: reason_ar
            required: false
            label:    '$t("book-appointment.label.reason")'
            describe: 'Reason for visit / symptoms (may be pre-filled from a voice note). Logistics only.'
          - field: insurance_tpa
            required: false
            label:    '$t("book-appointment.label.insurance")'
            describe: 'Insurance company (TPA), e.g. GlobeMed — may be pre-filled from an insurance-card photo.'
        complete: [ { goto: confirm_booking } ]

  confirm_booking:
    - assign:
        preview_body: '$lines($compact([$t("book-appointment.preview.header"), $t("book-appointment.preview.doctor", { doctor: $coalesce($doctor_label, "-") }), $t("book-appointment.preview.slot", { slot: $coalesce($state.slot_label, "-") }), $t("book-appointment.preview.for_whom", { who: ($state.for_whom == "dependent" ? $coalesce($state.dependent_name, $t("book-appointment.for_whom.dependent")) : $t("book-appointment.for_whom.self")) }), $state.reason_ar != null ? $t("book-appointment.preview.reason", { reason: $state.reason_ar }) : null, $state.insurance_tpa != null ? $t("book-appointment.preview.insurance", { tpa: $state.insurance_tpa }) : null]), "\n")'
    - use: approve_apply
      with:
        preview:       '$preview_body'
        header:        '{$t("book-appointment.approve_header")}'
        footer:        '{$t("book-appointment.approve_footer")}'
        confirm_title: 'تأكيد الحجز ✅'
        cancel_title:  'إلغاء ❌'
        apply:         read_card
        abort:         aborted
        on_other:      collect_fields

  # READ THE INSURANCE CARD, if the patient sent one.
  #
  # `insurance_policy` has declared `member_id` and `valid_until` since it was written, and this
  # flow only ever wrote `tpa` — so a policy was captured without the number the billing desk
  # actually needs. The manifest's vision pass DID read all three off the card; it then handed
  # them to the AGENT, which has one argument (`insurance_tpa`) to put them in. Two of the three
  # had nowhere to go.
  #
  # `media_refs` is already an array, which is exactly what a batch analysis takes: ONE call, with
  # the model seeing front and back together.
  #
  # Its OWN step because `outputs:` ends its sequence — a port body that merely assigns and falls
  # through is the "port has no terminal goto" trap, and the flow lint refuses it.
  read_card:
    - assign: { card: null }
    - if: '$state.media_refs == null || $length($state.media_refs) == 0'
      then: [{ goto: commit_booking }]
    - do: analyze_image
      args:
        images: '$state.media_refs'
        json:   true
        prompt: '$t("book-appointment.vision_prompt")'
      bind: card_read
      outputs:
        ok:     [{ goto: apply_card }]
        failed: [{ goto: commit_booking }]   # not a card, or unreadable — the booking still stands

  apply_card:
    - assign: { card: '$card_read.json' }
    - goto: commit_booking

  commit_booking:
    # New dependent (dependent path) → an XRM record linked to the contact.
    - assign: { dependent_id: null }
    - if: '$state.for_whom == "dependent" && $state.dependent_name != null'
      then:
        - do: record_save
          args: { entity: dependent, fields: { name: '$state.dependent_name', relation: '$coalesce($state.dependent_relation, null)' } }
          bind: dep
        - assign: { dependent_id: '$dep.record_id' }
    # Capture-only insurance policy (contact-scoped record).
    # The PATIENT's own answer wins on the insurer: they may have named it in words, and a card
    # photographed in a wallet can belong to a family member. The reading is the floor under that,
    # and the only source for the other two.
    - if: '$state.insurance_tpa != null || $card.tpa != null'
      then:
        - do: record_save
          args:
            entity: insurance_policy
            fields:
              tpa:         '$coalesce($state.insurance_tpa, $card.tpa)'
              member_id:   '$card.member_id'
              valid_until: '$card.valid_until'
          detach: true
    # Reserve the slot + write the booking record (capacity-checked, race-free).
    - do: booking_reserve
      args:
        resource_record_id: '$state.doctor_id'
        slot_start:         '$state.slot_start'
        slot_minutes:       '$state.slot_minutes'
        fields:
          reason:        '$state.reason_ar'
          insurance_tpa: '$state.insurance_tpa'
          for_whom:      '$coalesce($state.for_whom, "self")'
          dependent:     '$dependent_id'
          branch:        '$state.branch_id'
          doctor_label:  '$doctor_label'
          slot_label:    '$state.slot_label'
      bind: appt
      outputs:
        ok:           [{ goto: booked }]
        full:         [{ goto: slot_taken }]
        invalid_slot: [{ goto: slot_taken }]
        failed:       [{ end: failed }]

  booked:
    # Journey: the appointment was reserved → booked stage + appointment_booked
    # goal (the conversion). Reached only via booking_reserve ok, never full/invalid.
    - track: { event: appointment_booked, timeline: true }
    # Reminders — T-24h + T-2h (from the scheduling reminder offsets), each with
    # Confirm/Reschedule/Cancel taps; dedupe by appointment + reminder key.
    - if: '$length($coalesce($appt.reminders, [])) > 0'
      then:
        - do: schedule_notify
          args:
            to: { contact_id: '$contact.id' }
            send_at: '$appt.reminders[0].send_at'
            dedupe_key: 'clinic:appt:{$appt.record_id}:{$appt.reminders[0].key}'
            memory_note: 'Appointment reminder ({$appt.reminders[0].key})'
            intent:
              render_intent: detail_card
              body: '{$t("book-appointment.reminder.body", { doctor: $coalesce($doctor_label, ""), slot: $coalesce($state.slot_label, "") })}'
              buttons:
                - { title: '{$t("book-appointment.reminder.confirm")}',    on_select: { invoke: manage-appointments, with: { action: confirm,    appointment_id: '$appt.record_id' } } }
                - { title: '{$t("book-appointment.reminder.reschedule")}', on_select: { invoke: manage-appointments, with: { action: reschedule, appointment_id: '$appt.record_id' } } }
                - { title: '{$t("book-appointment.reminder.cancel")}',     on_select: { invoke: manage-appointments, with: { action: cancel,     appointment_id: '$appt.record_id' } } }
          detach: true
    - if: '$length($coalesce($appt.reminders, [])) > 1'
      then:
        - do: schedule_notify
          args:
            to: { contact_id: '$contact.id' }
            send_at: '$appt.reminders[1].send_at'
            dedupe_key: 'clinic:appt:{$appt.record_id}:{$appt.reminders[1].key}'
            memory_note: 'Appointment reminder ({$appt.reminders[1].key})'
            intent:
              render_intent: detail_card
              body: '{$t("book-appointment.reminder.body", { doctor: $coalesce($doctor_label, ""), slot: $coalesce($state.slot_label, "") })}'
              buttons:
                - { title: '{$t("book-appointment.reminder.confirm")}',    on_select: { invoke: manage-appointments, with: { action: confirm,    appointment_id: '$appt.record_id' } } }
                - { title: '{$t("book-appointment.reminder.reschedule")}', on_select: { invoke: manage-appointments, with: { action: reschedule, appointment_id: '$appt.record_id' } } }
                - { title: '{$t("book-appointment.reminder.cancel")}',     on_select: { invoke: manage-appointments, with: { action: cancel,     appointment_id: '$appt.record_id' } } }
          detach: true
    - render:
        render_intent: text_card
        body: '{$t("book-appointment.success", { doctor: $coalesce($doctor_label, ""), slot: $coalesce($state.slot_label, "") })}'
      memory_note: 'Booked appointment {$appt.record_id}'
      data: { appointment_id: '$appt.record_id' }
    - end: applied

  slot_taken:
    - render:
        render_intent: text_card
        body: '{$t("book-appointment.slot_taken")}'
      memory_note: 'Booking — slot just taken'
    - end: aborted

  aborted:
    - end: { status: aborted, body: '{$t("book-appointment.aborted")}' }
