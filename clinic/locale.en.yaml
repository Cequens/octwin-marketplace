# clinic — pack-wide English strings.
#
# Entries here are shared across ALL flows in this pack (cross-flow labels,
# common error messages, status verbs). Flow-specific strings live in
# `flows/tools/<flow>.locale.en.yaml`. Reference these via `$t("clinic.<key>")`
# — every key is namespaced (pack-level keys by `pack_id` = `clinic`; flow-level
# keys by `flow_id`). A BARE `$t("<key>")` does not resolve: the resolver
# requires a `<namespace>.<key>` form and returns the raw key otherwise.
#
# Keys must MATCH `locale.ar.yaml` exactly — same names, same {placeholders}.
# `checkLocaleParity` blocks a deploy otherwise, because `$t()` falls back across
# languages: a key missing here silently renders the Arabic string instead.

pack_id: clinic
strings:
  # Shared footer under every option-picker (the collect field_prompt_render).
  field_picker_footer: 'Pick from the list, or type if you need something else.'
