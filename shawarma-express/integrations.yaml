# The one outside system: wherever the restaurant keeps its printed menu.
#
# The pack sends that FILE to a customer who asks for the full menu. It ships with a DEFAULT
# address — the demo's designed menu, a picture hosted in this repo (`assets/shawarma-express/`) —
# so the menu works the moment the pack is installed. A restaurant replaces it with its own file
# (its website, a direct-download link, a POS export) under Outbound → Integrations, and a new menu
# reaches customers the moment that file is replaced, with no redeploy. `expect: binary` is what
# makes the platform store the answer as a file rather than read it as JSON.
#
# NOTHING here is a secret.

version: 1

connections:
  menu_file:
    label:    { en: 'Printable menu (file)', ar: 'المنيو المطبوع (ملف)' }
    describe: >-
      The address of the restaurant's current menu — a picture (JPEG/PNG) or a PDF that the pack
      sends to a customer who asks for the full menu.
    # The whole address, not a host: the operation has no path, so the file IS the base URL.
    # `default:` — works as installed with the demo's menu; the operator's saved address wins.
    base_url:
      default:  'https://raw.githubusercontent.com/Cequens/octwin-marketplace/master/assets/shawarma-express/menu.png'
    auth:     { kind: none }
    health:   { operation: menu_pdf }
    setup_hint: >-
      Works as installed with the demo menu. To send your own, paste the full address of your menu
      picture or PDF — it must download the file itself, not open a page that shows it. "Test
      connection" names the file it got, and fails on a web page.

operations:
  menu_pdf:
    connection: menu_file
    describe:   'GET the current menu file (a JPEG/PNG picture, or a PDF). The file is the connection address itself.'
    method:     GET
    path:       ''
    response:   { expect: binary }
