# shawarma-express — an Egyptian shawarma restaurant taking delivery orders on WhatsApp.
#
# Demonstrates the AUTOMATION engine: standing jobs that run on the platform ticker
# with no flow and no turn — an abandoned-basket nudge with a cooldown, and a
# stale-order sweep that stops a forgotten order sitting in "placed" for ever. Plus a
# menu carousel with AI food photography, an XRM basket, a delivery-order pipeline
# with milestones, and per-branch fulfilment. No pack DB, no code — pure YAML.

id:          shawarma-express
version:     1.0.0
description: 'Shawarma restaurant delivery — menu carousel, basket, checkout with delivery details, live order tracking, and an automated abandoned-basket nudge.'

listing:
  title:    'Shawarma Express'
  tagline:  'Menu, basket, checkout and live tracking — with an automatic nudge'
  category: hospitality
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

supported_channels: [whatsapp, web]
required_adapters:  [messaging]

default_settings:
  locale: ar

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

# Minimum-order and delivery fee live here, not in a flow — the branch manager can
# change them without touching YAML logic.
config:
  delivery:
    fee:           25
    minimum_order: 80
    currency:      EGP

flows:
  - home
  - menu
  - basket
  - my-orders

# A voice note is how a lot of Egyptian customers actually order.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Egyptian Arabic food order voice note — dishes, quantities, address.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                counter
    display_name:      'Shawarma Express'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - menu
      - basket
      - my-orders
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
