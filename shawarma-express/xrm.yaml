# XRM declaration for shawarma-express.
#
#  • `dish`        — the menu (reference, no pipeline ⇒ always listable).
#  • `branch`      — which kitchen fulfils, and which areas it delivers to.
#  • `basket_line` — the basket, contact-scoped, one row per dish (deduped on the
#                    dish code so a second add updates the quantity).
#  • `food_order`  — the delivery pipeline, with an `auto_transition` the automation
#                    sweep reads. The rule lives with the DATA, not in the job.

entities:
  dish:
    label: { en: 'Dish', ar: 'طبق' }
    icon:        '🥙'
    description: { en: 'A menu item and whether the kitchen has it', ar: 'صنف في المنيو وتوافره في المطبخ' }
    fields:
      code:        { type: text, required: true, unique: true, label: { en: 'Code', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      category:    { type: select, options: [shawarma, grills, sandwiches, sides, drinks, desserts], label: { en: 'Category', ar: 'القسم' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      price:       { type: money, label: { en: 'Price', ar: 'السعر' }, sortable: true, currency: EGP }
      spicy:       { type: boolean, label: { en: 'Spicy', ar: 'حار' } }
      available:   { type: boolean, label: { en: 'Available', ar: 'متاح' }, default: true, description: { en: 'Gate: false takes the dish off the menu immediately, without a redeploy.', ar: 'بوابة: القيمة false ترفع الصنف من المنيو فوراً دون إعادة نشر.' } }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:  { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [category, price, available]
    search: { text: [name, description], semantic: [name, description], rank_by: popularity }

  branch:
    label: { en: 'Branch', ar: 'فرع' }
    icon:        '📍'
    description: { en: 'A branch that prepares and delivers orders', ar: 'فرع يجهّز الطلبات ويوصّلها' }
    fields:
      name:        { type: text, required: true, unique: true, label: { en: 'Name', ar: 'الاسم' } }
      area:        { type: select, options: [nasr_city, maadi, zamalek, heliopolis, october, giza], label: { en: 'Area', ar: 'المنطقة' } }
      phone:       { type: text, label: { en: 'Phone', ar: 'الهاتف' } }
      delivers_to: { type: text, label: { en: 'Delivers to', ar: 'يوصّل إلى' } }
      open_hours:  { type: text, label: { en: 'Open hours', ar: 'مواعيد العمل' } }
    list: [area, phone]
    search: { text: [name, delivers_to] }

  basket_line:
    label: { en: 'Basket line', ar: 'سطر السلة' }
    icon:        '🛒'
    description: { en: 'One line in a customer basket before ordering', ar: 'سطر في سلة العميل قبل تأكيد الطلب' }
    fields:
      dish:       { type: record, entity: dish, label: { en: 'Dish', ar: 'الطبق' } }
      code:       { type: text, label: { en: 'Code', ar: 'الرمز' } }
      title:      { type: text, label: { en: 'Dish', ar: 'الطبق' } }
      qty:        { type: number, label: { en: 'Qty', ar: 'الكمية' }, default: 1, sortable: true }
      unit_price: { type: money, label: { en: 'Unit price', ar: 'سعر الوحدة' }, currency: EGP }
      line_total: { type: money, label: { en: 'Line total', ar: 'إجمالي السطر' }, sortable: true, currency: EGP }
      note:       { type: text, label: { en: 'Note', ar: 'ملاحظة' } }
    list: [title, qty, line_total]
    # Identity is the PAIR (shopper, item). This was a synthesized `line_key` text
    # field holding `<contact-id>:<code>`, because a single-field key resolved
    # project-wide and one shopper's save updated another shopper's line. A composite
    # constraint states the same rule truthfully, and `contact_id` is a real column —
    # so no flow has to build the value, and none can build it differently.
    constraints:
      unique:
        - fields: [contact_id, code]

  food_order:
    label: { en: 'Order', ar: 'أوردر' }
    icon:        '🛵'
    description: { en: 'A placed order, from the kitchen to the door', ar: 'طلب مؤكد من المطبخ حتى الباب' }
    fields:
      items_summary:  { type: textarea, label: { en: 'Items', ar: 'الأصناف' } }
      item_count:     { type: number, label: { en: 'Items', ar: 'عدد الأصناف' }, sortable: true }
      subtotal:       { type: money, label: { en: 'Subtotal', ar: 'إجمالي الأصناف' }, currency: EGP }
      delivery_fee:   { type: money, label: { en: 'Delivery', ar: 'التوصيل' }, currency: EGP }
      total:          { type: money, label: { en: 'Total', ar: 'الإجمالي' }, sortable: true, currency: EGP }
      customer_name:  { type: text, label: { en: 'Customer', ar: 'العميل' } }
      customer_phone: { type: text, label: { en: 'Customer phone', ar: 'هاتف العميل' } }
      area:           { type: select, options: [nasr_city, maadi, zamalek, heliopolis, october, giza], label: { en: 'Area', ar: 'المنطقة' } }
      address:        { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      # The delivery pin. Food delivery is the shortest promise in the pack —
      # a driver hunting for a building spends it.
      pin:            { type: geo, label: { en: 'Delivery pin', ar: 'موقع التوصيل على الخريطة' } }
      branch:         { type: record, entity: branch, label: { en: 'Branch', ar: 'الفرع' } }
      branch_label:   { type: text, label: { en: 'Branch', ar: 'الفرع' } }
      payment_method: { type: select, options: [cash_on_delivery, card_on_delivery, wallet], label: { en: 'Payment', ar: 'الدفع' } }
      notes:          { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [item_count, total, area]
    pipeline:
      stages:   [placed, preparing, out_for_delivery, delivered, cancelled]
      initial:  placed
      terminal: [delivered, cancelled]
      outcomes: { delivered: won, cancelled: lost }
      # The automation `stale_records` job reads THIS, so the rule lives with the
      # data: an order nobody moved out of `placed` within a day is not live.
      auto_transition: { from: placed, to: cancelled, after_idle_hours: 24 }
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      placed:           { en: 'Order in, kitchen has not started', ar: 'ℹ️ الأوردر وصل للفرع وبيتم تجهيزه.' }
      preparing:        { en: 'Being cooked now', ar: 'ℹ️ المطبخ بيجهّز أوردرك دلوقتي.' }
      out_for_delivery: { en: 'With the rider', ar: 'ℹ️ الدليفري في الطريق ليك — جهّز الفلوس لو كاش.' }
      delivered:        { en: 'Handed to the customer', ar: 'ℹ️ بالهنا والشفا 🌯' }
      cancelled:        { en: 'Cancelled before delivery', ar: 'ℹ️ الأوردر ده ملغي. تحت أمرك في أي وقت.' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      placed:           { en: 'Placed', ar: 'اتسجّل' }
      preparing:        { en: 'Preparing', ar: 'بيتجهّز في المطبخ 👨‍🍳' }
      out_for_delivery: { en: 'Out for delivery', ar: 'مع الدليفري 🛵' }
      delivered:        { en: 'Delivered', ar: 'اتسلّم ✅' }
      cancelled:        { en: 'Cancelled', ar: 'ملغي' }
    milestones:
      order_placed:    { label: { en: 'Placed', ar: 'تم الطلب' },      stage: placed }
      order_delivered: { label: { en: 'Delivered', ar: 'تم التسليم' }, stage: delivered, terminal: true }

segments:
  live_orders:
    entity: food_order
    label: { en: 'Live orders', ar: 'أوردرات جارية' }
    where: { all: [{ active: true }] }
  bestsellers:
    entity: dish
    label: { en: 'Bestsellers', ar: 'الأكثر طلباً' }
    where: { all: [{ field: popularity, op: gte, value: 4 }] }

