# XRM declaration for shawarma-express.
#
#  • `dish`        — the menu (reference, no pipeline ⇒ always listable).
#  • `branch`      — which kitchen fulfils, and which areas it delivers to.
#  • `basket_line` — the basket, contact-scoped, one row per dish (deduped on the
#                    dish code so a second add updates the quantity).
#  • `food_order`  — the delivery pipeline, with an `auto_transition` the automation
#                    sweep reads. The rule lives with the DATA, not in the job.

entities:
  dish:
    label: { en: 'Dish', ar: 'طبق' }
    fields:
      code:        { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      category:    { type: select, options: [shawarma, grills, sandwiches, sides, drinks, desserts], label: { en: 'Category', ar: 'القسم' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      price:       { type: money, label: { en: 'Price', ar: 'السعر' } }
      currency:    { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'EGP' }
      spicy:       { type: boolean, label: { en: 'Spicy', ar: 'حار' } }
      available:   { type: boolean, label: { en: 'Available', ar: 'متاح' }, default: true }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:  { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [category, price, available]
    search: { text: [name, description], semantic: [name, description], rank_by: popularity }
    dedupe_by: code

  branch:
    label: { en: 'Branch', ar: 'فرع' }
    fields:
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      area:        { type: select, options: [nasr_city, maadi, zamalek, heliopolis, october, giza], label: { en: 'Area', ar: 'المنطقة' } }
      phone:       { type: text, label: { en: 'Phone', ar: 'الهاتف' } }
      delivers_to: { type: text, label: { en: 'Delivers to', ar: 'يوصّل إلى' } }
      open_hours:  { type: text, label: { en: 'Open hours', ar: 'مواعيد العمل' } }
    list: [area, phone]
    search: { text: [name, delivers_to] }
    dedupe_by: name

  basket_line:
    label: { en: 'Basket line', ar: 'سطر السلة' }
    fields:
      # A per-contact UNIQUENESS key: `<contact-id>:<item>`. `dedupe_by` resolves through
      # `findRecord`, which scopes to project + entity + field value and NOT to the
      # contact — so dedupe_by on a bare item code made one shopper's `record_save match:`
      # update ANOTHER shopper's line (their basket silently changed; this one looked
      # empty, because the row belonged to someone else). Folding the contact into the key
      # restores per-customer isolation.
      line_key:   { type: text, label: { en: 'Line key', ar: 'مفتاح السطر' } }
      dish:       { type: record, entity: dish, label: { en: 'Dish', ar: 'الطبق' } }
      code:       { type: text, label: { en: 'Code', ar: 'الرمز' } }
      title:      { type: text, label: { en: 'Dish', ar: 'الطبق' } }
      qty:        { type: number, label: { en: 'Qty', ar: 'الكمية' }, default: 1 }
      unit_price: { type: money, label: { en: 'Unit price', ar: 'سعر الوحدة' } }
      line_total: { type: money, label: { en: 'Line total', ar: 'إجمالي السطر' } }
      note:       { type: text, label: { en: 'Note', ar: 'ملاحظة' } }
    list: [title, qty, line_total]
    dedupe_by: line_key

  food_order:
    label: { en: 'Order', ar: 'أوردر' }
    fields:
      items_summary:  { type: textarea, label: { en: 'Items', ar: 'الأصناف' } }
      item_count:     { type: number, label: { en: 'Items', ar: 'عدد الأصناف' } }
      subtotal:       { type: money, label: { en: 'Subtotal', ar: 'إجمالي الأصناف' } }
      delivery_fee:   { type: money, label: { en: 'Delivery', ar: 'التوصيل' } }
      total:          { type: money, label: { en: 'Total', ar: 'الإجمالي' } }
      currency:       { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'EGP' }
      customer_name:  { type: text, label: { en: 'Customer', ar: 'العميل' } }
      area:           { type: select, options: [nasr_city, maadi, zamalek, heliopolis, october, giza], label: { en: 'Area', ar: 'المنطقة' } }
      address:        { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      branch:         { type: record, entity: branch, label: { en: 'Branch', ar: 'الفرع' } }
      branch_label:   { type: text, label: { en: 'Branch', ar: 'الفرع' } }
      payment_method: { type: select, options: [cash_on_delivery, card_on_delivery, wallet], label: { en: 'Payment', ar: 'الدفع' } }
      notes:          { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [item_count, total, area]
    pipeline:
      stages:   [placed, preparing, out_for_delivery, delivered, cancelled]
      initial:  placed
      terminal: [delivered, cancelled]
      # The automation `stale_records` job reads THIS, so the rule lives with the
      # data: an order nobody moved out of `placed` within a day is not live.
      auto_transition: { from: placed, to: cancelled, after_idle_hours: 24 }
    milestones:
      order_placed:    { label: { en: 'Placed', ar: 'تم الطلب' },      stage: placed }
      order_delivered: { label: { en: 'Delivered', ar: 'تم التسليم' }, stage: delivered, terminal: true }

segments:
  live_orders:
    entity: food_order
    label: { en: 'Live orders', ar: 'أوردرات جارية' }
    where: { all: [{ active: true }] }
  bestsellers:
    entity: dish
    label: { en: 'Bestsellers', ar: 'الأكثر طلباً' }
    where: { all: [{ field: popularity, op: gte, value: 4 }] }

