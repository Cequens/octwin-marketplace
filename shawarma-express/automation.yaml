# What Shawarma Express does by itself — rules (guide: craft-automation; every change, time and
# action: rules-guide). These run on their own: no flow, no turn, no customer message required.
#
# This is the capability a restaurant actually feels: baskets left half-full and
# orders nobody marked as delivered.

rules:
  # A basket left idle for a day gets ONE nudge, then at most one more every 48h.
  # `limit: per_contact` is what stops a nudge becoming spam — without it an audience rule
  # would message the same customer every time its timetable comes.
  - key: basket_nudge
    for:
      entity: basket_line
      where:
        all:
          - { field: qty, op: gte, value: 1 }
          # 18 idle hours, not a day: a day is exactly past WhatsApp's 24-hour window.
          - { not: { updated_within_days: 0.75 } }
    at: every 1h
    limit: { per_contact: 48h }
    do:
      - notify:
          message:
            ar: 'لسه في أكل مستنيك في السلة 🌯 تحب نكمّل الأوردر؟'
            en: 'Your food is still waiting in the basket 🌯 Shall we finish your order?'

  # An order still sitting at `placed` after a day is not a live order — move it to
  # `cancelled` so the kitchen board and the funnel both stay honest.
  - key: stale_order_sweep
    for: food_order
    at: idle 24h
    while: { stage: placed }
    do:
      - move: cancelled
