# swiftship-courier — an Egyptian courier / last-mile company on WhatsApp.
#
# Demonstrates the two things a courier bot must get right: a TRACKING lookup that is
# never answered from memory (the stage and its explainer come from the record, every
# time), and a CLAIMS desk where a lost or damaged parcel becomes a real case with an
# SLA and a compensation disposition a human decides. Plus a pickup-booking pipeline
# priced from a live rate card. No pack DB, no code — pure YAML.

id:          swiftship-courier
version: 1.10.0
description: 'Courier & last-mile — track a shipment, book a pickup priced from the live rate card, and raise a claim that a real claims officer decides.'

listing:
  title:    'SwiftShip Courier'
  tagline:  'Tracking that never guesses, and claims a human actually decides'
  category: logistics
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'SwiftShip Courier'
  avatar: widget/avatar.png
  accent: '#0e7490'   # matches the avatar's gradient
  about:  'Track a shipment, book a pickup, and open a claim.'

supported_channels: [whatsapp, web]
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

flows:
  - home
  - track
  - book-pickup
  - claim

# NO `inbound_preprocessing.image`, deliberately.
#
# It read this pack's document fields and handed them to the AGENT to relay into tool arguments.
# When the relay did not happen the customer was asked to type what the picture already showed —
# and the values reached a record only as well as a language model retyped them.
#
# `claim`'s `read_doc` step reads the document itself, before the collect node runs. It also only
# ever fired on an inbound MESSAGE, so a document sent inside a native WhatsApp form was never read.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Egyptian Arabic courier enquiry voice note — tracking number, address, complaint.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                support
    display_name:      'SwiftShip Support'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - track
      - book-pickup
      - claim
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
