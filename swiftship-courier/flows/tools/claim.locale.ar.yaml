flow_id: claim

strings:
  # The flow's OWN vision prompt — it knows which document it is looking at, where a pack-wide
  # image prompt has to serve every picture a customer might send. English, because it instructs
  # the model rather than speaking to the customer.
  vision_prompt: >-
    A photograph of a photograph of a damaged parcel or its shipping label. Reply as JSON: {"tracking_number":"tracking number exactly as printed on the label, else null"}.
    Copy characters exactly — never correct, complete or reformat a value, and never infer one
    that is not visible.
  status_header:  '🎫 تذاكرك'
  status_note:    'ℹ️ أي قرار من فريقنا بيوصلك هنا في المحادثة على طول.'
  btn_new:        '⚠️ مشكلة جديدة'
  btn_track:      '🔍 تتبّع شحنة'
  btn_status:     '🎫 تذاكري'

  label.tracking: 'رقم التتبع'
  label.type:     'نوع المشكلة'
  label.details:  'تفاصيل المشكلة'

  field_header.type: '⚠️ إيه المشكلة بالظبط؟'
  field_cta.type:    'اختار'

  type.late_delivery:  '⏰ الشحنة متأخرة'
  type.damaged_parcel: '📦 الشحنة تالفة'
  type.lost_parcel:    '❓ الشحنة مفقودة'
  type.wrong_address:  '📍 عنوان خطأ'
  type.general_query:  '💬 استفسار عام'

  subject:            'شكوى على شحنة {tn}'
  opened_header:      '🎫 تم تسجيل شكواك'
  opened_ref:         '🎫 رقم التذكرة: #{ref}'
  opened_sla:         '⏱️ فريقنا يرد عليك خلال {hours} ساعة'
  opened_no_promise:  'ℹ️ فريق الشكاوى يراجع الشحنة والمستندات، وأي تعويض بيتحدد منهم — مش من هنا.'
  opened_footer:      'ردهم بيوصلك هنا في المحادثة.'
