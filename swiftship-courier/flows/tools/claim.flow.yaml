# claim — the claims desk. A lost or damaged parcel is not something a bot may settle, so
# this flow's whole job is to open a real case with the right routing and quote the real
# SLA back. Compensation only ever comes from a human picking `compensation_approved`,
# which relays to the customer by itself.
#
# Damage and loss go to the central claims desk; a late delivery or a wrong address is a
# REGIONAL problem, so the case type routes by the shipment's own region.

flow_id:     claim
version:     1
description: |-
  Raise a claim or a problem about a shipment, or report the status of the customer's
  existing tickets. Call when a parcel is late, damaged, lost, or delivered to the wrong
  place — and for any question about compensation. NEVER promise or estimate compensation
  yourself.

input:
  mode:
    type:     enum
    enum:     [open, status]
    optional: true
    describe: 'open (default) to raise a claim, status to report existing tickets.'
  tracking_number:
    type:     string
    optional: true
    describe: 'The tracking number the claim is about, when known.'
  case_type:
    type:     enum
    enum:     [damaged_parcel, lost_parcel, late_delivery, wrong_address, general_query]
    optional: true
    describe: 'The kind of problem, if the customer already made it clear.'

entry:
  - if:   '$coalesce($input.mode, "open") == "status"'
    goto: load_cases
  - else: true
    goto: gather

steps:
  # ── status ───────────────────────────────────────────────────────────────
  load_cases:
    - do: case_list
      args: { contact_id: '$contact.id' }
      bind: cases
      outputs:
        ok:     [{ goto: show_cases }]
        empty:  [{ goto: no_cases }]
        failed: [{ goto: unavailable }]

  show_cases:
    # `case_list` rows key the id as `id` and the type as `type`.
    - assign:
        case_lines: '$map($cases, $lines($compact([
                        "🎫 #" + $item.case_number,
                        $enum_label($item.type, "cases", $item.type),
                        $enum_label($item.status, "status", $item.status),
                        $item.decision != null ? $enum_label($item.decision_action, "decision", $item.decision_action) : null
                      ]), " · "))'
    - render:
        render_intent: detail_card
        header: '{$t("claim.status_header")}'
        body: '$lines($compact($concat($case_lines, [$t("claim.status_note")])), "\n")'
        buttons:
          - { title: '{$t("claim.btn_new")}',   on_select: { invoke: claim } }
          - { title: '{$t("claim.btn_track")}', on_select: { invoke: home } }
      memory_note: 'Reported {$length($cases)} open ticket(s).'
    - end: applied

  no_cases:
    - answer:
        instructions: 'This customer has no ticket open. Say so in one line and offer to raise one, or to track a shipment.'

  # ── open ─────────────────────────────────────────────────────────────────
  gather:
    - collect:
        before_each:
          - assign: { region: null, ship_stage: null }
          - if: '$state.tracking_number != null'
            then:
              - do: record_get
                args: { entity: shipment, match: { field: tracking_number, value: '$upper($trim($normalize_digits($state.tracking_number)))' } }
                bind: shp
                outputs:
                  ok:        []
                  # An unknown waybill must NOT block a claim — a customer whose parcel
                  # never appeared may not have a valid number at all.
                  not_found: []
                  failed:    []
              - if: '$shp.fields != null'
                then:
                  - assign:
                      region:     '$shp.fields.region'
                      ship_stage: '$shp.stage'
        gap_instructions: 'Ask the customer for the next detail ({$collect_field}) in one short line, in Egyptian Arabic. Re-call claim once they answer. NEVER promise compensation or a delivery date.'
        fields:
          - field: tracking_number
            label:    '$t("claim.label.tracking")'
            describe: 'The tracking number on the parcel or the shop confirmation.'
          - field: case_type
            label: '$t("claim.label.type")'
            options:
              header: claim.field_header.type
              cta:    claim.field_cta.type
              items:
                - { value: late_delivery,  label: claim.type.late_delivery }
                - { value: damaged_parcel, label: claim.type.damaged_parcel }
                - { value: lost_parcel,    label: claim.type.lost_parcel }
                - { value: wrong_address,  label: claim.type.wrong_address }
                - { value: general_query,  label: claim.type.general_query }
          - field: details
            label:    '$t("claim.label.details")'
            describe: "What happened, in the customer's own words."
        complete: [{ goto: open_case }]

  open_case:
    # `region` is the routing key for the regional case types; a claim on an unknown
    # waybill simply has no region and falls to the claims desk via `fallback`.
    - do: case_open
      args:
        type: '$state.case_type'
        fields:
          case_type:       '$state.case_type'
          subject:         '$t("claim.subject", { tn: $state.tracking_number })'
          tracking_number: '$state.tracking_number'
          region:          '$region'
          shipment_stage:  '$ship_stage'
          details:         '$state.details'
      bind: tk
      outputs:
        ok:     [{ goto: opened }]
        failed: [{ goto: unavailable }]

  opened:
    - render:
        render_intent: detail_card
        header: '{$t("claim.opened_header")}'
        body: '$lines($compact([
                 $t("claim.opened_ref", { ref: $tk.case_number }),
                 $t("claim.opened_sla", { hours: $coalesce($tk.sla_hours, 24) }),
                 $t("claim.opened_no_promise")
               ]), "\n")'
        footer: '{$t("claim.opened_footer")}'
        buttons:
          - { title: '{$t("claim.btn_status")}', on_select: { invoke: claim, with: { mode: status } } }
          - { title: '{$t("claim.btn_track")}',  on_select: { invoke: home } }
      memory_note: 'Opened {$state.case_type} ticket #{$tk.case_number} (queue routing by region {$coalesce($region, "unknown")}). NO compensation was promised.'
      data: { case_number: '$tk.case_number' }
    - end: applied

  unavailable:
    - answer:
        instructions: 'The ticket system is unavailable for a moment. Apologise in one line, give the customer the support line, and offer to try again. Do NOT claim a ticket was opened.'
