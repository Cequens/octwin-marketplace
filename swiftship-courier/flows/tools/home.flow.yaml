# home — the front door. Counts the customer's open tickets so someone with a live claim
# lands on it instead of the tracking prompt.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this customer.'

entry:
  - else: true
    goto: count_cases

steps:
  count_cases:
    - do: case_list
      args: { contact_id: '$contact.id' }
      bind: cases
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign: { open_tickets: '$length($coalesce($cases, []))' }
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $open_tickets > 0 ? $t("home.open_tickets", { count: $open_tickets }) : null
               ]), "\n")'
        cta: '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_track")}',  description: '{$t("home.row_track_d")}',  on_select: { invoke: track } }
          - { title: '{$t("home.row_pickup")}', description: '{$t("home.row_pickup_d")}', on_select: { invoke: book-pickup } }
          - { title: '{$t("home.row_claim")}',  description: '{$t("home.row_claim_d")}',  on_select: { invoke: claim } }
          - { title: '{$t("home.row_status")}', description: '{$t("home.row_status_d")}', on_select: { invoke: claim, with: { mode: status } } }
      memory_note: 'Showed the SwiftShip menu ({$open_tickets} open ticket(s)).'
    - end: applied
