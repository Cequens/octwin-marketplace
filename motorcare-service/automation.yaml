# Standing automation jobs for MotorCare.
#
# The alarm on the workshop SLA `worklist.yaml` promises. A breakdown carries a
# four-hour clock and `urgent` priority, and until this job existed nothing looked
# at either: `sla_due_at` was stamped when the job card enrolled and never read.
#
# The sweep is entity-level, so this one job covers all four job types
# (breakdown 4h · diagnostic_check 8h · periodic_service 24h · body_repair 48h).
# It skips job cards already collected or cancelled, alerts the responsible
# operator through the ops inbox, relays `message` to the customer ONCE per breach
# (deduped on `sla_notified_at`), and mints the `sla_breach` record event that
# `xrm.yaml`'s `on.sla_breach` hook turns into a service-desk task.
#
# `escalate_to:` routes the breached item to a queue. It took three rounds to land:
# first omitted because the KB documented the target two incompatible ways, then kept
# out once it was typed as a principal-ref (`user:`/`team:`) — an id only the INSTALLING
# tenant knows, unwritable in a published pack. The platform then added `queue:<key>`,
# resolved against THIS pack's own `worklist.yaml` `queues:`, so it travels with the pack
# (KB 968db6a91806, `worklist-guide` §5). A key we never declared fails at pack load,
# naming the legal ones — it can no longer mis-route in silence.
#
# `service_desk` is already the routing `fallback:` — a breached card leaves the bay and
# lands with the service desk.
#
# Know the limit: routing a queue notifies nobody new. The item appears in that queue's
# work inbox, and the ops-inbox alert still goes to the previous assignee — so a breach on
# an UNASSIGNED item escalates silently. The customer reassurance below is unaffected.

jobs:
  - key:              repair_job_sla
    kind:             sla_sweep
    entity:           repair_job
    # A quarter of an hour, bounding the detection lag at ~6% of the four-hour
    # breakdown promise.
    interval_seconds: 900
    config:
      escalate_to: queue:service_desk
      message: 'نعتذر عن التأخير 🙏 بطاقة سيارتك تجاوزت الوقت المتوقع وتم تنبيه مدير الورشة — بنرجع لك في أقرب وقت.'
