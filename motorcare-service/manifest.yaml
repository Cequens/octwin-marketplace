# motorcare-service — a car service centre on WhatsApp.
#
# Demonstrates the WORKLIST engine on a NON-case entity: a `repair_job` is opened
# with `work_open`, routed to a workshop queue (mechanical / body / diagnostics) by
# a FIELD rather than a static queue, given an SLA, and worked by a foreman in the
# console with real dispositions (quote approved, parts on order, ready for
# collection). Plus `analyze_image` on a customer's damage photo to produce a
# structured triage, the scheduling engine for service bays, and a vehicle record
# the customer never has to re-enter. No pack DB, no code — pure YAML.

id:          motorcare-service
version: 2.3.0
description: 'Car service centre — service packages, AI damage triage from a photo, bay booking, and a workshop queue a foreman really works.'

listing:
  title:    'MotorCare Service'
  tagline:  'Photo-to-triage, bay booking, and a workshop queue with an SLA'
  category: automotive
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'MotorCare Service'
  avatar: widget/avatar.png
  accent: '#be123c'   # matches the avatar's gradient
  about:  'Send a photo of the problem, book a bay, and follow the repair.'

supported_channels: [whatsapp, web]
supported_languages: [ar, en]
# `vision` is load-bearing here — the damage triage is an image analysis.
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

# No `default_conversation_context.lang:` here. That knob was copy-pasted boilerplate:
# nothing in this pack ever read `$context.lang`, so its `en` / `bilingual` options offered
# an operator a switch that changed nothing. Removed across the marketplace 2026-09-05.
#
# The language is not a manifest setting. Automatic detection reads the customer's own words
# (`language-detect.ts`), `/lang` overrides it per contact, and what the pack can actually
# render is derived from the `locale.<lang>.yaml` files it ships.

flows:
  - home
  - services
  - damage-check
  - book-service
  - my-garage

# A customer sends a photo of the damage or the dashboard. The platform reads it
# before the agent's turn so the triage flow starts already informed.
# NO `inbound_preprocessing.image`, deliberately.
#
# It exists for a photo that arrives with NO flow running — the agent cannot see images, so
# without it a cold photo is an opaque ref and the agent cannot tell which tool to call. That
# matters for a pack where the CONTENT decides the tool (a claim vs an ID vs a receipt). Here it
# does not: an image in a car-service pack means `damage-check`, and the photo the customer
# already sent is adopted by the collect field automatically.
#
# Enabling it as well would mean TWO vision calls for one photo — the manifest's, then the flow's
# in `damage-check` — with different prompts, so nothing dedupes them. And the two paths would
# diverge: chat would route on the agent's copy of a briefing while the native form routed on the
# flow's own reading. One analysis, in the flow, is cheaper AND the same everywhere.

agents:
  - id:                serviceadvisor
    display_name:      'MotorCare Service Advisor'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - services
      - damage-check
      - book-service
      - my-garage
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
