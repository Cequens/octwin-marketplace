# damage-check — the pack's signature journey: a photo becomes a triaged JOB CARD
# sitting in the right workshop queue with an SLA running.
#
# The chain: a `type: media` upload field takes the photos (the engine adopts inbound
# images itself, in order, so the fold never depends on the agent naming a ref) → the
# flow reads them ITSELF in `analyze_photos`, one vision call for every angle → it routes
# on that via `work_open`, which resolves the queue from worklist.yaml's
# `route_by: work_area` and stamps the SLA.
#
# The agent still contributes what it is better at: the customer's WORDS. It may pass
# `work_area` / `job_type` from what they typed, and that wins over the photo reading —
# "my brakes squeal" is better evidence than a picture of a wheel. The photo is the floor
# beneath it, and `diagnostics` is the floor beneath both.
#
# Reading the photos in the FLOW is what makes this work everywhere rather than only in
# chat: the manifest's vision pass fires on an inbound MESSAGE, so a photo uploaded inside
# the native form never reached it and every such job routed to `diagnostics`.
#
# (This header used to say `analyze_image` could not be used, because it took a URL and
# a self-hosted media URL is unreachable from a remote provider. That was true and was
# fixed — the primitive resolves a `MEDIA-` ref to BYTES itself. The comment outlived
# the problem and cost this pack its headline journey on the form path.)
#
# This pack no longer declares `inbound_preprocessing.image` at all — see manifest.yaml
# for why. The flow still defaults safely when neither the agent nor the photo supplies
# anything: `diagnostics` means "a human decides", which is the honest fallback.
#
# Nothing here ever states a price. The real number is the foreman's `quote_ready`
# disposition, which relays to the customer on its own.

flow_id:     damage-check
version:     1
description: |-
  [interactive] Triage a problem from a photo and open a workshop job. Call when the
  customer describes damage, a warning light, a noise or a leak, or sends a photo of
  their car. Pre-fill `complaint` from a voice note when you have one.

input:
  complaint:
    type:     string
    optional: true
    describe: "What the customer says is wrong, in their own words."
  plate:
    type:     string
    optional: true
    describe: 'Licence plate, if known (may come from a photo the platform already read).'
  work_area:
    type:     enum
    enum:     [mechanical, body, diagnostics]
    optional: true
    describe: 'Which department the photo points to, from the briefing the platform gave you after reading the image. Omit if unsure — the job then goes to diagnostics for a human to decide.'
  job_type:
    type:     enum
    enum:     [periodic_service, body_repair, diagnostic_check, breakdown]
    optional: true
    describe: 'The kind of job, from the same briefing. Omit if unsure.'
  severity:
    type:     enum
    enum:     [minor, moderate, major]
    optional: true
    describe: 'How serious the VISIBLE damage looks, from the briefing. Never guess beyond what the image showed.'
  make_model:
    type:     string
    optional: true
    describe: 'Make and model, if the platform identified it from the photo.'
  findings:
    type:     string
    optional: true
    describe: 'Two or three short lines, in the customer''s language, describing ONLY what is visible in the photo — copied from the briefing, never invented, never a diagnosis and never a price.'

entry:
  - else: true
    goto: gather

steps:
  gather:
    - collect:
        gap_instructions: 'Ask the customer for the next item ({$collect_field}) in one short line. For the photo, ask for a clear shot of the damaged area or the dashboard. Re-call damage-check once they send it. NEVER estimate a cost yourself.'
        fields:
          - field: plate
            label:    '$t("damage-check.label.plate")'
            describe: 'The licence plate, as printed.'
          - field: complaint
            label:    '$t("damage-check.label.complaint")'
            describe: "What is wrong, in the customer's own words."
          # An UPLOAD field — the engine adopts inbound images of this kind, in order.
          # `multiple` because one angle rarely shows a dent: the customer sends the panel,
          # a close-up and the dashboard light in one go rather than three trips through
          # the flow. Stored as an `image_list` on the job card, which the console renders
          # as a thumbnail grid the foreman can open.
          - field: damage_photo
            type:       media
            media_kind: image
            multiple:   true
            label:      '$t("damage-check.label.photo")'
        complete: [{ goto: analyze_photos }]

  analyze_photos:
    # ONE vision call for every angle, and the model sees them together — three shots of one
    # dent judged as a set beats three separate verdicts. `$state.damage_photo` is already a
    # list of `MEDIA-` refs, so it goes straight in.
    #
    # HERE, and not in the field's `on_collect`, on purpose: a vision call costs ~4s, and in a
    # native form `on_collect` runs while the customer is still on a screen the endpoint is
    # timed on. `complete:` runs after the form closes, on an ordinary turn. Use `on_collect`
    # only when a LATER field in the same node needs the answer — nothing here does.
    #
    # Its OWN step because `outputs:` is unavoidable: a bare `bind:` THROWS on a failure port,
    # and a vision call that fails must not kill the job card. A `do:` carrying `outputs:` ends
    # its sequence, so both ports `goto` the shared continuation rather than duplicating it.
    - do: analyze_image
      args:
        images: '$state.damage_photo'
        json:   true
        prompt: '$t("damage-check.vision_prompt")'
      bind: shot
      outputs:
        ok:     [{ goto: save_vehicle }]
        failed: [{ goto: save_vehicle }]   # never block the job on a failed read

  save_vehicle:
    # `plate` is the entity's unique constraint, so a returning customer's car is
    # updated, never duplicated.
    - do: record_save
      args:
        entity: vehicle
        fields:
          plate:      '$state.plate'
          make_model: '$state.make_model'
      bind: car
      outputs:
        ok:      [{ goto: open_job }]
        invalid: [{ goto: open_job }]
        failed:  [{ goto: open_job }]

  open_job:
    # Defaults matter more than the happy path here: an unset area routes to
    # diagnostics, which means "a human looks at it" — never a guess at a repair.
    # The AGENT's value wins where it has one — it heard the customer's words as well as
    # seeing whatever the platform showed it. The flow's own reading is the FLOOR beneath
    # that, and `diagnostics` is the floor beneath both.
    - assign:
        area:     '$coalesce($state.work_area, $shot.json.work_area, "diagnostics")'
        jtype:    '$coalesce($state.job_type,  $shot.json.job_type,  "diagnostic_check")'
        findings: '$coalesce($state.findings,  $shot.json.findings_ar, $t("damage-check.no_findings"))'
        severity: '$coalesce($state.severity,  $shot.json.severity)'
    # `work_open` writes the record AND enrols it in the worklist: the queue comes
    # from `route_by: work_area`, the SLA from the type. The ports are the whole
    # contract — there is no status string to inspect.
    - do: work_open
      args:
        entity: repair_job
        stage:  received
        fields:
          job_type:     '$jtype'
          work_area:    '$area'
          vehicle:      '$car.record_id'
          plate:        '$state.plate'
          complaint:    '$state.complaint'
          triage_notes: '$lines($compact([$findings, $triage.json.recommended_checks_ar]), "\n")'
          damage_photo: '$state.damage_photo'
      bind: job
      outputs:
        ok:     [{ goto: triaged }]
        failed: [{ goto: job_failed }]

  triaged:
    - render:
        render_intent: detail_card
        header: '{$t("damage-check.header")}'
        body: '$lines($compact([
                 $t("damage-check.job_ref", { ref: $job.record_number }),
                 $t("damage-check.plate", { plate: $state.plate }),
                 $findings,
                 $t("damage-check.area", { area: $enum_lookup($area, { mechanical: $t("damage-check.ar.mechanical"), body: $t("damage-check.ar.body"), diagnostics: $t("damage-check.ar.diagnostics") }, $area) }),
                 $t("damage-check.severity", { severity: $enum_lookup($severity, { minor: $t("damage-check.sev.minor"), moderate: $t("damage-check.sev.moderate"), major: $t("damage-check.sev.major") }, $t("damage-check.sev.unknown")) }),
                 $t("damage-check.no_quote")
               ]), "\n")'
        footer: '{$t("damage-check.footer")}'
        buttons:
          - { title: '{$t("damage-check.btn_book")}',   on_select: { invoke: book-service, with: { work_area: '$area', plate: '$state.plate' } } }
          - { title: '{$t("damage-check.btn_garage")}', on_select: { invoke: my-garage } }
      memory_note: 'Triaged a photo into repair_job #{$job.record_number} — area {$area}, queue {$job.queue_key}. NO price was quoted; the foreman quotes.'
      data: { job_number: '$job.record_number', work_area: '$area' }
    - end: applied

  job_failed:
    - answer:
        instructions: 'The job card could not be opened. Say so plainly in one line and offer to try again or to have the service desk call them. Do NOT claim a job was created, and do NOT estimate a price.'
