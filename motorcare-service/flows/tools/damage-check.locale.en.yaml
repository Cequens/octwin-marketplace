flow_id: damage-check

strings:
  label.plate:      'Plate number'
  label.complaint:  'Describe the problem'
  label.photo:      'Photos of the damage or the dashboard'
  # The flow's OWN vision prompt — narrower than the manifest's, because this one knows it is
  # looking at a damage report and not at any photo a customer might send.
  #
  # NOT TRANSLATED, and byte-identical to the Arabic file: it instructs the model, and
  # `findings_ar` is written into the job card an Arabic-speaking workshop reads — so the STORED
  # value must not change language with the customer.
  vision_prompt: >-
    Photos of ONE vehicle from several angles, or its dashboard. Reply as JSON:
    {"work_area":"mechanical|body|diagnostics","job_type":"periodic_service|body_repair|diagnostic_check|breakdown",
    "severity":"minor|moderate|major","findings_ar":"two or three short lines in Egyptian Arabic
    describing ONLY what is visible — never a diagnosis, never a price"}.

  header:           '🔎 First-look inspection result'
  job_ref:          '🧾 Job card number: #{ref}'
  plate:            '🚗 Plate: {plate}'
  area:             '🔧 Department: {area}'
  severity:         '📊 Severity: {severity}'
  no_quote:         'ℹ️ This is a first look from the photo, not a quote — the workshop will inspect the car and send you the final price.'
  footer:           'Your job card has reached the workshop, and they have a set time to reply.'
  no_findings:      'The photo is not clear enough for a first look — the workshop will inspect it themselves.'

  ar.mechanical:    'Mechanical'
  ar.body:          'Body and paint'
  ar.diagnostics:   'Computer diagnostics'
  sev.minor:        'Minor'
  sev.moderate:     'Moderate'
  sev.major:        'Major'
  sev.unknown:      'Needs inspection'

  btn_book:         '🗓️ Book an appointment'
  btn_garage:       '🚗 My cars'
