# xrm.yaml — data model for the مصر الرقمية services-guide bot.
# One REFERENCE catalog `service` (no pipeline → always lists). Each record is a
# government e-service: its issuing authority, required documents, fees, timing,
# and the portal link to start it. `search:` enables fuzzy Arabic keyword search
# (record_search) for the `find_service` flow.
#
# NOTE: requirements / fees / timing below are indicative and may change — the
# authoritative source is the live service page on https://digital.gov.eg/.

entities:
  service:
    label: { en: Service, ar: خدمة }
    title_field: name
    list: [name, category, authority]
    search:
      text: [name, keywords, description, authority]
    fields:
      name:            { type: text, required: true }
      code:            { type: text, required: true, unique: true }
      category:
        type: select
        options: [civil_status, traffic, notary, supply, courts, commercial, realestate_tax, health]
      authority:       { type: text }        # الجهة المسؤولة
      description:     { type: textarea }     # نبذة عن الخدمة
      requirements:    { type: textarea }     # المستندات / الشروط المطلوبة
      fees:            { type: text }         # الرسوم
      processing_time: { type: text }         # مدة التنفيذ
      channel:         { type: text }         # طريقة الاستلام / التقديم
      url:             { type: text }         # رابط بدء الخدمة على البوابة
      keywords:        { type: text }         # كلمات للبحث
      popular:         { type: boolean }      # خدمة من الأكثر طلباً

