# Frequently asked questions about the مصر الرقمية portal — a single text card.
flow_id:     faq
version:     1
description: Answer common questions about the portal (account, delivery, payment, general help). Call for general how-does-it-work questions.

input:
  message:
    type:     string
    optional: true
    describe: 'Optional note from the user.'

entry:
  - else: true
    goto: show

steps:
  show:
    - render:
        # detail_card, not text_card: this is the most-read page in the pack and it
        # used to end on a full stop — a wall of text with no way onward.
        render_intent: detail_card
        body: '{$t("faq.body")}'
        buttons:
          - { title: '{$t("faq.btn_search")}',     on_select: { invoke: find_service } }
          - { title: '{$t("faq.btn_categories")}', on_select: { invoke: services } }
          - { title: '{$t("faq.btn_home")}',       on_select: { invoke: home } }
      memory_note: 'Showed the FAQ.'
    - end: applied
