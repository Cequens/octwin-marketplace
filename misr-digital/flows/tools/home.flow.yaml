# The HOME hub — front door / menu. FIRST tool the agent calls on a greeting or an
# unclear message. A pure-render list_picker: one row per primary journey, each
# routing a tap straight to that tool via on_select.invoke (no LLM turn).
flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short Arabic greeting line YOU compose for this user (e.g. greet them by name).'

entry:
  - else: true
    goto: show

steps:
  show:
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body:   '$coalesce($input.message, $t("home.greeting"))'
        cta:    '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_services")}', on_select: { invoke: services } }
          - { title: '{$t("home.row_find")}',     on_select: { invoke: find_service } }
          - { title: '{$t("home.row_portal")}',   on_select: { invoke: portal } }
          - { title: '{$t("home.row_faq")}',      on_select: { invoke: faq } }
      memory_note: 'Showed the home menu.'
    - end: applied
