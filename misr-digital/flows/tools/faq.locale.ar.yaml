flow_id: faq

strings:
  body: |-
    ❓ أسئلة شائعة عن مصر الرقمية

    🔹 كيف أبدأ الخدمة؟
    اختر الخدمة من هنا، واطّلع على مستنداتها ورسومها، ثم اضغط زر «ابدأ الخدمة على البوابة» لاستكمالها على الموقع الرسمي.

    🔹 هل أحتاج إلى حساب؟
    نعم، يتم التسجيل على البوابة بالرقم القومي ورقم هاتف محمول مسجَّل باسمك، ويصلك رمز تفعيل.

    🔹 كيف يتم الدفع؟
    تُسدَّد معظم الخدمات إلكترونياً ببطاقة بنكية أو محفظة إلكترونية، وتُضاف رسوم التوصيل حسب الخدمة.

    🔹 كيف تصل المستندات؟
    يتم توصيل كثير من الخدمات (مثل البطاقة والشهادات) إلى محل الإقامة عن طريق البريد.

    🔹 هل الرسوم والمدة المعروضة هنا نهائية؟
    لا، فهي استرشادية وقابلة للتغيير — والمصدر الرسمي دائماً هو صفحة الخدمة على البوابة.

    اكتب اسم أي خدمة وسأساعدك في الوصول إليها 👍
