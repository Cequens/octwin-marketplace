# Strings for the faq flow, keyed by $t("faq.<key>").
flow_id: faq

strings:
  body: |-
    ❓ أسئلة شائعة عن مصر الرقمية

    🔹 إزاي أبدأ خدمة؟
    اختر الخدمة من هنا، اعرف مستنداتها ورسومها، وبعدين اضغط زر «ابدأ الخدمة على البوابة» عشان تكمّل على الموقع الرسمي.

    🔹 محتاج حساب؟
    أيوة، بتسجّل على البوابة بالرقم القومي ورقم موبايل باسمك، وبيوصلك كود تفعيل.

    🔹 الدفع بيتم إزاي؟
    معظم الخدمات بتتدفع إلكترونياً ببطاقة بنكية أو محفظة، ورسوم التوصيل بتضاف حسب الخدمة.

    🔹 الأوراق بتوصل إزاي؟
    كتير من الخدمات (زي البطاقة والشهادات) بتتوصّل لباب المنزل بالبريد.

    🔹 الرسوم والمدة اللي بتظهر هنا نهائية؟
    لا، دي استرشادية وممكن تتغيّر — المصدر الرسمي دايماً هو صفحة الخدمة على البوابة.

    اكتب اسم أي خدمة وأنا أساعدك تلاقيها 👍
