# Service-category menu. Each row drills into `service_list` for that category.
flow_id:     services
version:     1
description: Show the government-service categories. Call when the user asks what services exist, wants to browse, or asks about a whole sector (traffic, civil status, supply…).

input:
  message:
    type:     string
    optional: true
    describe: 'Optional note from the user.'

entry:
  - else: true
    goto: show

steps:
  show:
    - render:
        render_intent: list_picker
        header: '{$t("services.header")}'
        body:   '{$t("services.body")}'
        cta:    '{$t("services.choose")}'
        items:
          - { title: '{$t("services.cat_civil_status")}',   on_select: { invoke: service_list, with: { category: civil_status } } }
          - { title: '{$t("services.cat_traffic")}',        on_select: { invoke: service_list, with: { category: traffic } } }
          - { title: '{$t("services.cat_notary")}',         on_select: { invoke: service_list, with: { category: notary } } }
          - { title: '{$t("services.cat_supply")}',         on_select: { invoke: service_list, with: { category: supply } } }
          - { title: '{$t("services.cat_courts")}',         on_select: { invoke: service_list, with: { category: courts } } }
          - { title: '{$t("services.cat_commercial")}',     on_select: { invoke: service_list, with: { category: commercial } } }
          - { title: '{$t("services.cat_realestate_tax")}', on_select: { invoke: service_list, with: { category: realestate_tax } } }
          - { title: '{$t("services.cat_health")}',         on_select: { invoke: service_list, with: { category: health } } }
      memory_note: 'Showed service categories.'
    - end: applied
