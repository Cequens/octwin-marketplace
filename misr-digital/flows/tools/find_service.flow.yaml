# Keyword search across every service (fuzzy, Arabic-folded via the entity's
# `search:` declaration). Agent calls this when the user names a service or need
# ("أجدد رخصة القيادة", "شهادة ميلاد", "مخالفات"). Results drill into service_detail.
flow_id:     find_service
version:     1
description: Search all government services by keyword. Call when the user names a specific service or need. Pass the user's words as `query`.

input:
  query:
    type:     string
    optional: true
    describe: 'The user''s search words (a service name or need).'

entry:
  - if: '$input.query'
    goto: search
  - else: true
    goto: ask

steps:
  ask:
    - render:
        render_intent: text_card
        body: '{$t("find_service.ask")}'
      memory_note: 'Asked the user what service to search for.'
    - end: applied
  search:
    - do: record_search
      args:
        entity: service
        query:  '$input.query'
        limit:  20
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: none }]
        failed: [{ end: failed }]
  show:
    # Journey: a search that returned something.
    - track: { event: searched, metadata: { query: '$input.query', results: '$length($page.rows)' } }
    - render:
        render_intent: list_picker
        header: '{$t("find_service.header")}'
        body:   '{$t("find_service.body")}'
        cta:    '{$t("find_service.choose")}'
        items:  '$page.rows'
        item_template:
          title:       '{$item.title}'
          description: '{$t("find_service.tap_for_details")}'
          on_select:   { invoke: service_detail, with: { code: '$item.fields.code' } }
      memory_note: 'Showed search results for the user query.'
    - end: applied
  none:
    # A citizen said what they needed and the catalog had no answer. The query rides
    # along as metadata so the miss becomes actionable: what to add, or which
    # `keywords:` failed to match the words real people use. Deliberately NOT
    # `advances_to` anything — a miss is not progress; it is the explanation attached
    # to the searching → service_found drop-off.
    #
    # ⚠️ RARELY REACHED TODAY, measured 2026-08-05. The entity opts into `semantic:`
    # search, and semantic ranking returns the top-N by cosine with NO similarity
    # floor — so `record_search` answers even pure gibberish ("زقزقة برتقان فضائي"
    # returned traffic_fines) and this `empty` port only fires if the catalog itself
    # is empty. The event is wired because it is correct where it does fire, but the
    # miss list will stay near-empty until a score floor exists: rows carry a `score`
    # and `$filter_gte($page.rows, 'score', <min>)` is the documented idiom, which
    # needs a threshold tuned against real traffic. Scores are not observable through
    # `octwin chat --json`, so picking one now would be a guess — and a guess that is
    # too high tells citizens "nothing found" for services we DO have, which is worse
    # than the current over-eagerness. Logged in FEEDBACK.md.
    - track: { event: search_missed, metadata: { query: '$input.query' } }
    - answer:
        instructions: 'No service matched the search. Apologize briefly, suggest rephrasing, or offer to browse categories via the services menu. Reply in FORMAL Arabic (فصحى) — this is a government service.'
