# One service's full detail: authority, required documents, fees, timing, and a
# link button that routes the user to start it on the مصر الرقمية portal.
# Reached by tapping a service in `service_list` or `find_service` (passes `code`).
flow_id:     service_detail
version:     1
description: Show one service's requirements, fees, timing and a start-on-portal link. Reached from a service list; not usually called directly.

input:
  code:
    type:     string
    optional: true
    describe: 'The service code (e.g. driving_license_renew, birth_cert).'

entry:
  - else: true
    goto: load

steps:
  load:
    - do: record_list
      args:
        entity: service
        all:    true
        limit:  1
        where:  { all: [{ field: code, op: eq, value: '$input.code' }] }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: none }]
        failed: [{ end: failed }]
  show:
    - assign:
        svc: '$page.rows[0]'
    - assign:
        body: |-
          {$svc.fields.description}

          {$t("service_detail.lbl_authority")} {$svc.fields.authority}

          {$t("service_detail.lbl_requirements")}
          {$svc.fields.requirements}

          {$t("service_detail.lbl_fees")} {$svc.fields.fees}
          {$t("service_detail.lbl_time")} {$svc.fields.processing_time}
          {$t("service_detail.lbl_channel")} {$svc.fields.channel}

          {$t("service_detail.disclaimer")}
    # A service the portal does not host yet gets the same documents/fees briefing but
    # NO start button — a `cta_url` pointing at the portal root would strand the citizen
    # on a landing page hunting for something that isn't there.
    - if:   '$svc.fields.coming_soon == true'
      goto: show_offline
    # Journey terminal. `ready_to_start` means "we handed them a live portal link" —
    # NOT that they started: a cta_url is a native URL button and the click happens
    # off-platform where nothing can observe it. Naming the goal for what we can
    # actually see keeps the funnel honest rather than overclaiming a conversion.
    - track: { event: service_reached, timeline: true, metadata: { code: '$svc.fields.code' } }
    # A detail_card, NOT a cta_url. The URL button is the only thing cta_url renders —
    # its field list has no `buttons` — so a card could either hand over the portal link
    # or offer anything else, never both, and only ONE render intent ships per turn so
    # it could not be two messages either. That left the end of the main journey as a
    # dead end: a link and no way onward, no way to say the briefing was wrong.
    #
    # So the portal moves one tap away, behind `start_service`. What that buys:
    #   • the citizen can rate the briefing or look for another service from here
    #   • the start becomes OBSERVABLE — `ready_to_start` below only ever meant "we
    #     displayed a link"; `service_started` is a tap we actually see.
    # The cost is one extra tap to the portal, which this card can afford: it is a
    # briefing about which documents to gather, so most readers are not leaving for
    # the portal in the same minute anyway.
    - render:
        render_intent: detail_card
        header: '{$svc.title}'
        body:   '{$body}'
        footer: '{$t("service_detail.footer")}'
        buttons:
          - { title: '{$t("service_detail.btn_start")}',    on_select: { invoke: start_service,    with: { code: '$svc.fields.code' } } }
          - { title: '{$t("service_detail.btn_rate")}',     on_select: { invoke: feedback,         with: { code: '$svc.fields.code' } } }
          - { title: '{$t("service_detail.btn_related")}',  on_select: { invoke: related_services, with: { code: '$svc.fields.code' } } }
      memory_note: 'Showed service detail for {$svc.title} with start / rate / related actions.'
    - end: applied

  show_offline:
    # A service the citizen found but cannot start. Completes `service_found` and NOT
    # `ready_to_start` — the distance between those two goals in the funnel is exactly
    # the cost of the services the portal hasn't published yet.
    - track: { event: service_viewed, timeline: true, metadata: { code: '$svc.fields.code' } }
    # detail_card, not text_card — text_card allows ONLY `body`, so a `header` on it is
    # silently dropped and the service name would vanish from the card.
    # No 🚀 here: there is nothing on the portal to open. The other two actions are the
    # same as the live card, so a citizen who cannot start this service still has
    # somewhere to go — which is the whole point of not leaving them on an apology.
    - render:
        render_intent: detail_card
        header: '{$svc.title}'
        footer: '{$t("service_detail.footer")}'
        body: |-
          {$body}

          {$t("service_detail.not_online_yet")}
        buttons:
          - { title: '{$t("service_detail.btn_rate")}',    on_select: { invoke: feedback,         with: { code: '$svc.fields.code' } } }
          - { title: '{$t("service_detail.btn_related")}', on_select: { invoke: related_services, with: { code: '$svc.fields.code' } } }
      memory_note: 'Showed service detail for {$svc.title} — not on the portal yet, no start link.'
    - end: applied
  none:
    - answer:
        instructions: 'That service was not found. Apologize briefly and offer to browse categories via the services menu or search again. Reply in FORMAL Arabic (فصحى) — this is a government service.'
