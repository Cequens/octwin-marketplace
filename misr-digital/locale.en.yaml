# misr-digital — pack-wide English strings.
#
# Entries here are shared across ALL flows in this pack (cross-flow labels,
# common error messages, status verbs). Flow-specific strings live in
# `flows/tools/<flow>.locale.en.yaml`. Reference these via `$t("misr-digital.<key>")`
# — every key is namespaced (pack-level by `pack_id`; flow-level by `flow_id`).
# A bare `$t("<key>")` does NOT resolve (returns the raw key); the flow linter's
# `locale-key-not-namespaced` rule fails the build on a bare key.
#
# Keys must MATCH `locale.ar.yaml` exactly — same names, same {placeholders}.
# Register: FORMAL, matching the Arabic فصحى — this pack fronts a government portal.

pack_id: misr-digital
strings:
  # Example pack-level string — reference as `$t("misr-digital.greeting")`.
  greeting: 'Welcome. How may I help you?'
