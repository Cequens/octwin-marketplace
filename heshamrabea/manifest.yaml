# manifest.yaml — Hesham Rabea barbershop bot (info + appointment booking).
id:          heshamrabea
version:     '2.1.0'
description: 'Hesham Rabea barbershops: services & prices, branches, and appointment booking with a chosen barber per branch.'

listing:
  title:    'Hesham Rabea'
  tagline:  'Barber booking across every branch — pick the chair, not just the time'
  category: services
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  # Left unlisted deliberately: this pack carries a real trading name, so
  # publishing it to the catalog is the owner's call, not a default.
  public:   false

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'Hesham Rabea'
  avatar: widget/avatar.png
  accent: '#b45309'   # matches the avatar's gradient
  about:  'Book your barber — pick the branch, the chair and the time.'

supported_channels: [whatsapp, web]
required_adapters:  [messaging]

default_settings:
  locale: ar

# Every flow file the pack ships (home hub first).
flows:
  - home          # main menu / front door
  - book          # appointment booking journey (branch → barber → service → slot → confirm)
  - services      # service-category menu
  - service_list  # services in a category, with prices (drill-down, reached from `services`)
  - branches      # list of branches
  - contact       # phone + working hours (call button)
  - faq           # frequently asked questions

# Voice notes → speech-to-text, then the normal agent turn with the transcript
# in the pre-turn briefing. WITHOUT this block the platform defaults to
# `passthrough`: the media ref survives, but the agent is told it cannot hear
# the audio and asks the customer to type instead. `prompt` is the STT model's
# free-text BIASING hint (a domain sketch, NOT a language code).
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Egyptian Arabic barbershop booking voice note — the service (haircut, shave, beard trim), the barber, the branch, the preferred day and time.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                assistant
    display_name:      'Hesham Rabea Assistant'
    default_model:     'openrouter/anthropic/claude-sonnet-4-5'
    tools:
      - home
      - book
      - services
      - branches
      - contact
      - faq
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
    default_memory:
      lastMessages: 10
