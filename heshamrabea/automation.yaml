# What the barbershop does by itself — rules (guide: craft-automation; every change, time and action: rules-guide).
rules:
  # Remind the customer 2 hours before. It follows the booking: moved, it moves; cancelled or finished, it
  # stops — whoever does it (the chat, the shop in the console).
  - key: appointment_two_hours_before
    for: booking
    at: slot_start - 2h
    do:
      - remind:
          resource_type: professional
          message:
            ar: 'تذكير ⏰ عندك موعد بعد ساعتين في فرع {{ record.fields.branch_name }} مع {{ resource.title }} ({{ record.fields.slot_start }}). مستنينك 💈'
            en: 'Reminder ⏰ You have an appointment in two hours at {{ record.fields.branch_name }} with {{ resource.title }} ({{ record.fields.slot_start }}). See you soon 💈'
