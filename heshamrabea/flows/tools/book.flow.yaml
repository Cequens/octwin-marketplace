# Appointment booking journey:
#   branch → barber → service → time slot → confirm → reserve (+ reminder).
# Each picker row RE-INVOKES this flow with the running selection carried in `with:`
# (threaded forward via $input). `entry` routes to the next stage by which fields are
# present. The only suspend is the confirm card (approve_apply). This invoke-chain is
# more robust than chained resume:$self pauses.
flow_id:     book
version:     1
description: |-
  Book/reserve an appointment. Walks the customer through choosing a branch, a barber,
  a service, and a time slot, then confirms and reserves it. Call whenever the customer
  wants to book, reserve, or make a new appointment.

# A tap binding carries IDENTIFIERS, never the label beside them: every `with:` key is
# encoded into the tap id, and a list row's id is capped at 200 code points (Arabic counts
# the same as English). This chain used to ferry branch_name/pro_name/service_name/
# service_price/slot_label alongside the ids they are derivable from, which put the slot
# picker at 257 — over the cap, so the platform parked it and shipped a `t:ref:` handle,
# paying a lookup on every render AND every tap. `hydrate` re-reads the four rows once,
# at the only point that needs their labels. See the platform KB, craft-flows
# "Bind identifiers, not labels — a tap id has a hard ceiling".
input:
  branch_code:   { type: string, optional: true, describe: 'Chosen branch code (also a preselect when coming from a branch card).' }
  pro_id:        { type: string, optional: true, describe: 'Chosen barber record id.' }
  service_id:    { type: string, optional: true, describe: 'Chosen service record id.' }
  slot_start:    { type: string, optional: true, describe: 'Chosen slot start (ISO).' }

entry:
  - if:   '$input.slot_start != null'
    goto: hydrate
  - if:   '$input.service_id != null'
    goto: load_slots
  - if:   '$input.pro_id != null'
    goto: load_services
  - if:   '$input.branch_code != null'
    goto: load_pros
  - else: true
    goto: start

steps:
  # 1) Branch
  start:
    - do: record_list
      args: { entity: branch, all: true, limit: 50, sort_by: { field: area, dir: asc } }
      bind: branches
      outputs:
        ok:     [{ goto: pick_branch }]
        empty:  [{ goto: none_branch }]
        failed: [{ end: failed }]
  pick_branch:
    - render:
        render_intent: list_picker
        header: '{$t("book.branch_header")}'
        body:   '{$t("book.branch_body")}'
        cta:    '{$t("book.choose")}'
        items:  '$branches.rows'
        item_template:
          title:       '{$item.title}'
          description: '{$item.fields.phone}'
          on_select:   { invoke: book, with: { branch_code: '$item.fields.code' } }
      memory_note: 'Offered branches to book at.'
    - end: applied

  # 2) Barber (filtered to the chosen branch)
  load_pros:
    # `book.pro_body` is the one picker body that interpolates a label, so the branch name is
    # read here from its code rather than ferried through the tap. `code` is unique: true in
    # xrm.yaml, hence the entity's dedupe_by — record_get's `match` reaches any declared field.
    - do: record_get
      args: { entity: branch, match: { field: code, value: '$input.branch_code' } }
      bind: branch
      outputs:
        ok:        [{ goto: list_pros }]
        not_found: [{ goto: list_pros }]
        failed:    [{ goto: list_pros }]
  list_pros:
    - do: record_list
      args:
        entity: professional
        all:    true
        limit:  50
        where:  { all: [{ field: branch_code, op: eq, value: '$input.branch_code' }] }
        sort_by: { field: name, dir: asc }
      bind: pros
      outputs:
        ok:     [{ goto: pick_pro }]
        empty:  [{ goto: none_pro }]
        failed: [{ end: failed }]
  pick_pro:
    - render:
        render_intent: list_picker
        header: '{$t("book.pro_header")}'
        body:   '{$t("book.pro_body", { branch: $coalesce($branch.fields.name, $pros.rows[0].fields.branch_name, "") })}'
        cta:    '{$t("book.choose")}'
        items:  '$pros.rows'
        item_template:
          title:       '{$item.title}'
          description: '{$item.fields.role}'
          on_select:
            invoke: book
            with:
              branch_code: '$input.branch_code'
              pro_id:      '$item.id'
      memory_note: 'Offered barbers.'
    - end: applied

  # 3) Service
  load_services:
    - do: record_list
      args: { entity: service, all: true, limit: 60, sort_by: { field: category, dir: asc } }
      bind: services
      outputs:
        ok:     [{ goto: pick_service }]
        empty:  [{ goto: none_service }]
        failed: [{ end: failed }]
  pick_service:
    - render:
        render_intent: list_picker
        header: '{$t("book.service_header")}'
        body:   '{$t("book.service_body")}'
        cta:    '{$t("book.choose")}'
        items:  '$services.rows'
        item_template:
          title: '{$item.title} — {$format_number($item.fields.price)} {$t("book.egp")}'
          on_select:
            invoke: book
            with:
              branch_code: '$input.branch_code'
              pro_id:      '$input.pro_id'
              service_id:  '$item.id'
      memory_note: 'Offered services.'
    - end: applied

  # 4) Time slot
  load_slots:
    - do: slot_list
      args: { resource_record_id: '$input.pro_id', days: 7 }
      bind: slots
      outputs:
        ok:     [{ goto: pick_slot }]
        empty:  [{ goto: none_slot }]
        failed: [{ end: failed }]
  pick_slot:
    - render:
        render_intent: list_picker
        header: '{$t("book.slot_header")}'
        body:   '{$t("book.slot_body")}'
        cta:    '{$t("book.choose")}'
        items:  '$slots'
        item_template:
          title: '{$item.local_date} · {$item.local_time}'
          on_select:
            invoke: book
            with:
              branch_code: '$input.branch_code'
              pro_id:      '$input.pro_id'
              service_id:  '$input.service_id'
              slot_start:  '$item.slot_start'
      memory_note: 'Offered time slots.'
    - end: applied

  # 4b) Hydrate — the four labels the tap chain no longer carries, re-read once here from
  # the ids it does carry. Everything downstream (confirm preview, do_book fields, the
  # done card, the reminder) reads them off $state exactly as before, so this is the only
  # place that changed. `do_book` re-read these same rows anyway — now it is done once,
  # not ferried through every tap in the chain.
  # Every port routes on to the next rung, including the failure ones: a missing label
  # degrades the preview copy, it must never strand a customer who has already chosen
  # all four things. (Unlike a collect hook, a normal step's port body has to terminate,
  # so this is a chain of steps rather than one step with empty ports.)
  hydrate:
    # The barber row carries the branch name denormalised (xrm.yaml), so one read covers both.
    - do: record_get
      args: { entity: professional, record_id: '$state.pro_id' }
      bind: pro
      outputs:
        ok:
          - assign: { state: '$merge($state, { pro_name: $pro.fields.name, branch_name: $pro.fields.branch_name })' }
          - goto: hydrate_branch
        not_found: [{ goto: hydrate_branch }]
        failed:    [{ goto: hydrate_branch }]

  # Fall back to the branch row only when the denormalised copy is missing or stale.
  hydrate_branch:
    - if:   '$state.branch_name != null || $state.branch_code == null'
      goto: hydrate_service
    - do: record_get
      args: { entity: branch, match: { field: code, value: '$state.branch_code' } }
      bind: br
      outputs:
        ok:
          - assign: { state: '$merge($state, { branch_name: $br.fields.name })' }
          - goto: hydrate_service
        not_found: [{ goto: hydrate_service }]
        failed:    [{ goto: hydrate_service }]

  hydrate_service:
    - do: record_get
      args: { entity: service, record_id: '$state.service_id' }
      bind: svc
      outputs:
        ok:
          - assign: { state: '$merge($state, { service_name: $svc.fields.name, service_price: $svc.fields.price })' }
          - goto: hydrate_slot
        not_found: [{ goto: hydrate_slot }]
        failed:    [{ goto: hydrate_slot }]

  # The slot's human label — recomposed from the same row the picker rendered, matching
  # `pick_slot`'s title. Re-reading also re-checks the slot is still free before we preview it.
  hydrate_slot:
    - do: slot_list
      args: { resource_record_id: '$state.pro_id', days: 7 }
      bind: fresh_slots
      outputs:
        ok:
          - assign: { hit: '$filter($fresh_slots, { slot_start: $state.slot_start })[0]' }
          - if: '$hit != null'
            then:
              - assign: { state: '$merge($state, { slot_label: $hit.local_date + " · " + $hit.local_time })' }
          - goto: confirm
        empty:  [{ goto: confirm }]
        failed: [{ goto: confirm }]

  # 5) Confirm (the only suspend — approve_apply renders a card, pauses, resumes)
  confirm:
    - use: approve_apply
      with:
        preview: '{$t("book.preview", { branch: $state.branch_name, pro: $state.pro_name, service: $state.service_name, price: $state.service_price, slot: $state.slot_label })}'
        apply:   do_book
        abort:   cancelled
        confirm_title: '{$t("book.confirm_btn")}'
        cancel_title:  '{$t("book.cancel_btn")}'
        # Neither approve nor decline (a typed reply, an agent resume, a stale tap)
        # → re-enter THIS step: re-render the confirm card and pause again. The
        # sibling packs point `on_other` at their `collect_fields` step so the
        # customer can amend a field mid-preview; this flow has no collect — the
        # four choices are made by picker steps upstream — so its own id is the
        # right target, following `clinic/flows/tools/manage-appointments.flow.yaml`.
        # REQUIRED: omitted, the template used to expand its default branch to
        # `then: []`, whose fall-through threw, and the catch DELETED the run state
        # and restarted the flow — same card every turn, every choice lost.
        on_other:      confirm
        memory_note:   'Asked the customer to confirm the booking.'

  # 6) Reserve
  do_book:
    - do: booking_reserve
      args:
        resource_record_id: '$state.pro_id'
        slot_start:         '$state.slot_start'
        fields:
          service_name:      '$state.service_name'
          branch_name:       '$state.branch_name'
          professional_name: '$state.pro_name'
          price:             '$state.service_price'
          customer_name:     '$contact.display_name'
      bind: booking
      outputs:
        ok:           [{ goto: booked }]
        full:         [{ goto: slot_taken }]
        invalid_slot: [{ goto: slot_taken }]
        failed:       [{ end: failed }]
  booked:
    - foreach:
        in: '$booking.reminders'
        as: rem
        body:
          - do: schedule_notify
            args:
              to:      { contact_id: '$contact.id' }
              send_at: '$rem.send_at'
              intent:  { render_intent: text_card, body: '{$t("book.reminder", { branch: $state.branch_name, pro: $state.pro_name, slot: $state.slot_label })}' }
              dedupe_key: '"booking-" + $booking.record_number + "-" + $rem.key'
    - render:
        render_intent: detail_card
        header: '{$t("book.done_header")}'
        body:   '{$t("book.done_body", { ref: $booking.record_number, branch: $state.branch_name, pro: $state.pro_name, service: $state.service_name, slot: $state.slot_label, price: $state.service_price })}'
      memory_note: 'Booking confirmed ({$booking.record_number}).'
    - end: applied

  # Terminal / edge states
  cancelled:
    - render: { render_intent: text_card, body: '{$t("book.cancelled")}' }
      memory_note: 'Customer cancelled the booking.'
    - end: applied
  slot_taken:
    - render: { render_intent: text_card, body: '{$t("book.slot_taken")}' }
      memory_note: 'Chosen slot was no longer available.'
    - end: applied
  none_branch:
    - answer: { instructions: 'No branches are available right now. Apologize briefly and give the phone number 01093333755.' }
  none_pro:
    - answer: { instructions: 'No barbers are listed for this branch yet. Apologize, and suggest calling 01093333755 or choosing another branch.' }
  none_service:
    - answer: { instructions: 'No services are available right now. Apologize and give the phone 01093333755.' }
  none_slot:
    - answer: { instructions: 'No free time slots in the coming days for this barber. Suggest another barber or branch, or calling 01093333755.' }
