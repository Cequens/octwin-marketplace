flow_id: faq

strings:
  body: "Frequently asked questions ❓\n\n• How do I book?\nYou can book right here (the «Book an appointment» button) or by calling your nearest branch.\n\n• Do I need to book ahead?\nBooking ahead is better to secure your time, but we take walk-ins when there is room.\n\n• How can I pay?\nCash or card at every branch 💳\n\n• Do you cut children's hair?\nYes, we do children's haircuts 👦\n\n• What are your hours?\nDaily from 10am to 12 midnight 🕙\n\nFor anything else, call us on 01093333755."
