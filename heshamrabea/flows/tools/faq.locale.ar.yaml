strings:
  body: "أسئلة شائعة ❓\n\n• إزاي أحجز؟\nتقدر تحجز من هنا (زر «احجز موعد») أو بالاتصال بأقرب فرع.\n\n• لازم أحجز قبلها؟\nالحجز المسبق أفضل لضمان الميعاد، بس بنستقبل بدون حجز حسب التوفّر.\n\n• طرق الدفع؟\nكاش أو كارت في كل الفروع 💳\n\n• في حلاقة أطفال؟\nأيوه، عندنا قص شعر للأطفال 👦\n\n• مواعيد العمل؟\nيومياً من ١٠ صباحاً حتى ١٢ منتصف الليل 🕙\n\nلأي استفسار تاني كلّمنا على 01093333755."
