# scheduling.yaml — makes the `professional` XRM entity a bookable resource.
# Availability is seeded PER barber (matched by unique name) because bulk
# field-match demo seeding attaches rules only once (platform backlog item).
# Every branch shares the same hours: 10:00–23:30 daily.
timezone: Africa/Cairo

resources:
  professional:
    slot:
      default_minutes: 30
      default_capacity: 1
      window_days: 7
    reminders:
      - { key: t_2h, seconds: 7200 }   # remind the customer 2 hours before

booking:
  entity: booking

demo:
  availability:
    - resource_match: { entity: professional, field: name, value: "كابتن أحمد" }
      rules:
        - { dow: 0, start: "10:00", end: "23:30", slot_minutes: 30, capacity: 1 }
        - { dow: 1, start: "10:00", end: "23:30", slot_minutes: 30, capacity: 1 }
        - { dow: 2, start: "10:00", end: "23:30", slot_minutes: 30, capacity: 1 }
