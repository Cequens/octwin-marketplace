# xrm.yaml — data model for the Hesham Rabea pack.
# Three reference catalogs (branch / professional / service) + an extended
# `booking` system entity. Professionals are the bookable resource (scheduling.yaml).
# NOTE: barber names below are PLACEHOLDER demo data — replace with the real roster.

entities:
  branch:
    label: { en: Branch, ar: فرع }
    title_field: name
    list: [name, area, phone]
    fields:
      name:  { type: text, required: true }
      code:  { type: text, required: true, unique: true }
      area:  { type: select, options: [new_cairo, madinaty, heliopolis, maadi, zayed, mansoura, north_coast] }
      phone: { type: text }

  professional:
    label: { en: Professional, ar: أخصائي }
    title_field: name
    list: [name, role, branch_code]
    fields:
      name:           { type: text, required: true }
      role:           { type: text }
      branch_code:    { type: text, required: true }
      branch_name:    { type: text }
      schedule_group: { type: text }

  service:
    label: { en: Service, ar: خدمة }
    title_field: name
    list: [name, category, price]
    fields:
      name:         { type: text, required: true }
      category:     { type: select, options: [haircut, beard, hair_treatment, skin, hands_feet, package] }
      price:        { type: number }
      duration_min: { type: number }

  booking:
    extends: system
    fields:
      customer_name:     { type: text }
      service_name:      { type: text }
      branch_name:       { type: text }
      professional_name: { type: text }
      price:             { type: number }
      notes:             { type: textarea }

