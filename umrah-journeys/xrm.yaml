# XRM declaration for umrah-journeys.
#
#  • `package`  — the shared catalog (no pipeline ⇒ always listable), with an
#                 AI-generated hero image and semantic search over the copy.
#  • `pilgrim`  — a traveller in the party, contact-scoped. One per person, so a
#                 family books once and the names persist for the next trip.
#  • `trip`     — the booking PIPELINE. This is what the agency measures.
#
# The visa file is deliberately NOT an entity here — it is the `case` system
# entity, worked through worklist.yaml, because it is human work with an SLA.

entities:
  package:
    label: { en: 'Package', ar: 'باقة' }
    fields:
      code:          { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:          { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      kind:          { type: select, options: [umrah, hajj, ramadan_umrah, ziyarah], label: { en: 'Kind', ar: 'النوع' } }
      nights:        { type: number, label: { en: 'Nights', ar: 'عدد الليالي' }, sortable: true }
      makkah_hotel:  { type: text, label: { en: 'Makkah hotel', ar: 'فندق مكة' } }
      madinah_hotel: { type: text, label: { en: 'Madinah hotel', ar: 'فندق المدينة' } }
      distance_haram: { type: text, label: { en: 'Distance to Haram', ar: 'المسافة من الحرم' } }
      transport:     { type: text, label: { en: 'Transport', ar: 'المواصلات' } }
      includes:      { type: textarea, label: { en: 'Includes', ar: 'يشمل' } }
      price_pp:      { type: money, label: { en: 'Price per person', ar: 'السعر للفرد' }, sortable: true }
      currency:      { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'SAR' }
      hero:          { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      rating:        { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [kind, nights, price_pp]
    search: { text: [name, makkah_hotel, madinah_hotel], semantic: [name, includes], rank_by: rating }
    dedupe_by: code

  pilgrim:
    label: { en: 'Pilgrim', ar: 'معتمر' }
    fields:
      full_name:       { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      passport_number: { type: text, label: { en: 'Passport', ar: 'رقم الجواز' } }
      nationality:     { type: text, label: { en: 'Nationality', ar: 'الجنسية' } }
      relation:        { type: text, label: { en: 'Relation', ar: 'صلة القرابة' } }
      passport_scan:   { type: image, label: { en: 'Passport scan', ar: 'صورة الجواز' } }
    list: [passport_number, nationality]
    dedupe_by: full_name

  trip:
    label: { en: 'Trip', ar: 'رحلة' }
    fields:
      package:        { type: record, entity: package, label: { en: 'Package', ar: 'الباقة' } }
      package_label:  { type: text, label: { en: 'Package', ar: 'الباقة' } }
      package_code:   { type: text, label: { en: 'Package code', ar: 'رمز الباقة' } }
      lead_name:      { type: text, label: { en: 'Lead traveller', ar: 'المسؤول عن الحجز' } }
      travellers:     { type: number, label: { en: 'Travellers', ar: 'عدد المسافرين' }, sortable: true }
      departure_city: { type: select, options: [riyadh, jeddah, cairo, dubai, casablanca, jakarta], label: { en: 'Departure city', ar: 'مدينة المغادرة' } }
      travel_month:   { type: select, options: [rajab, shaaban, ramadan, shawwal, dhul_qadah, dhul_hijjah], label: { en: 'Month', ar: 'الشهر' } }
      room_type:      { type: select, options: [double, triple, quad], label: { en: 'Room', ar: 'نوع الغرفة' } }
      total_price:    { type: money, label: { en: 'Total', ar: 'الإجمالي' }, sortable: true }
      currency:       { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'SAR' }
      notes:          { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [package_label, travellers, travel_month, total_price]
    pipeline:
      stages:   [enquiry, reserved, docs_pending, visa_issued, ticketed, travelled, cancelled]
      initial:  enquiry
      terminal: [travelled, cancelled]
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      enquiry:      { en: 'Enquiry', ar: 'استفسار' }
      reserved:     { en: 'Reserved', ar: 'حجز مثبّت' }
      docs_pending: { en: 'Documents pending', ar: 'بانتظار المستندات' }
      visa_issued:  { en: 'Visa issued', ar: 'صدرت التأشيرة' }
      ticketed:     { en: 'Ticketed', ar: 'تم إصدار التذاكر' }
      travelled:    { en: 'Travelled', ar: 'تمت الرحلة' }
      cancelled:    { en: 'Cancelled', ar: 'ملغى' }
    milestones:
      trip_reserved: { label: { en: 'Reserved', ar: 'تم الحجز' },       stage: reserved }
      visa_issued:   { label: { en: 'Visa issued', ar: 'صدرت التأشيرة' }, stage: visa_issued }
      travelled:     { label: { en: 'Travelled', ar: 'تمت الرحلة' },     stage: travelled, terminal: true }

segments:
  live_trips:
    entity: trip
    label: { en: 'Live trips', ar: 'رحلات قائمة' }
    where: { all: [{ active: true }] }

