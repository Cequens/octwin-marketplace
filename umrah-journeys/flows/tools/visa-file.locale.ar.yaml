flow_id: visa-file

strings:
  # The flow's OWN prompt — it knows it is looking at a passport data page, where a pack-wide
  # image prompt has to serve receipts and vaccination cards too. English, because it instructs
  # the model rather than speaking to the pilgrim.
  vision_prompt: >-
    The data page of a passport. Reply as JSON:
    {"passport_number":"exactly as printed, no spaces added or removed, else null",
    "nationality":"country as printed, else null",
    "full_name":"name in Latin characters as printed, else null"}.
    Copy characters exactly. Never infer a nationality from a name or a number format.
  status_header:     '📂 ملفاتك لدينا'
  status_note:       'ℹ️ الحالة تُحدَّث من فريق التأشيرات، وبنبلّغك فوراً بأي قرار.'
  btn_upload:        '📎 ارفع مستنداً'
  btn_query:         '💬 استفسار لفريقنا'
  btn_trip:          '🧾 تفاصيل حجزي'
  btn_status:        '📂 حالة ملفي'
  btn_more:          '📎 ارفع جوازاً آخر'
  btn_home:          '🏠 القائمة الرئيسية'

  label.name:        'اسم المسافر'
  label.passport:    'صورة صفحة بيانات الجواز'
  label.photo:       'الصورة الشخصية (اختياري)'
  skip:              'تخطَّ ⏭️'

  caption:           'جواز {name}'
  reply:             'رفع العميل صورة جواز {name}.'
  uploaded_header:   '✅ تم استلام المستند'
  uploaded_body:     'أُضيفت صورة جواز {name} إلى الملف رقم #{ref}.'
  uploaded_next:     'ترسل جوازات باقي المسافرين واحداً واحداً، وفريق التأشيرات يبدأ المراجعة.'

  default_question:  'استفسار عن التأشيرة'
  query_header:      '💬 وصل استفسارك'
  query_body:        'فتحنا لك الملف رقم #{ref}، وفريقنا يرد عليك خلال {hours} ساعة. رده بيوصلك هنا في المحادثة.'

  # The zero branch — no file open yet.
  none_header:       '📂 لا يوجد ملف بعد'
  none_body:         'ما عندك ملف تأشيرة مفتوح حالياً. الملف يُفتح تلقائياً بمجرد تثبيت حجز باقة، وفريق التأشيرات يبدأ فيه فوراً.'
  btn_packages:      '🕋 شاهد الباقات'
  caption_photo:     'الصورة الشخصية — {name}'
  uploaded_photo:    '🖼️ واستلمنا كذلك الصورة الشخصية.'
