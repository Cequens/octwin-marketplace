# manifest.yaml — Octwin Sales: Octwin's OWN AI Agent, answering the octwin.ai website's "Talk to us"
# chat. It answers product questions from the same facts the website states, shows what each plan
# includes (no prices — every paid plan is priced for the customer's volume), points to the live
# demos, and books a demo on the sales team's calendar (no live chat with a person — booking is the way in).
#
# Installed into an ordinary project of the demo workspace; the website shows the chat only when
# the platform settings `site_chat.tenant_slug` + `site_chat.project_slug` name that project.
id:          octwin-sales
version:     '1.8.0'
description: 'Octwin''s own sales AI Agent for the octwin.ai website chat: product answers, plans, live demos, demo booking on the sales calendar, quotation requests and messages for the team.'

listing:
  title:    'Octwin Sales'
  tagline:  'Our own AI Agent: product answers, plans, live demos and demo booking'
  category: other
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  # Unlisted: this is OUR sales desk, not a pack a customer installs.
  public:   false

# The chat face a website visitor sees.
widget:
  name:   'Octwin'
  avatar: widget/avatar.png
  accent: '#0a7468'   # the website's teal (passes WCAG AA for white text)
  about:  'Ask about Octwin, see what each plan includes, try a live demo, or book a demo with our team.'
  # Open on the main menu: the web chat runs `home` by itself when a visitor opens an empty chat,
  # so the first thing they see is what they can do — not a blank "say hi".
  start_flow: home
  # The flows a button on the website may open the chat on (`data-chat-flow="book-demo"`, `PlatformChat.open`) —
  # "Book a demo" lands on the form. Anything else a page asks for is refused.
  entry_flows: [book-demo, request-quote, send-message, live-demos, plans]
  # Shown in the empty chat for the moment before the menu arrives (the menu then replaces it). It promises
  # nothing the start flow does: a page button may open the chat on another flow instead.
  welcome:
    en: '👋 Hi, I am Octwin''s AI Agent.'
    ar: '👋 أهلًا، أنا وكيل الذكاء الاصطناعي لدى Octwin.'

# The pictures the carousels show (plans, live demos, industry use cases) — AI-generated .jpg (WhatsApp drops
# other image types), referenced as `$pack_asset:<key>` from each flow's `config:`.
static_assets:
  - { file: assets/demo-clinic.jpg, key: demo_clinic }
  - { file: assets/demo-courier.jpg, key: demo_courier }
  - { file: assets/demo-oud.jpg, key: demo_oud }
  - { file: assets/demo-realty.jpg, key: demo_realty }
  - { file: assets/plan-enterprise.jpg, key: plan_enterprise }
  - { file: assets/plan-free.jpg, key: plan_free }
  - { file: assets/plan-growth.jpg, key: plan_growth }
  - { file: assets/plan-scale.jpg, key: plan_scale }
  - { file: assets/plan-starter.jpg, key: plan_starter }
  - { file: assets/uc-bk-dues.jpg, key: uc_bk_dues }
  - { file: assets/uc-bk-faq.jpg, key: uc_bk_faq }
  - { file: assets/uc-bk-lead.jpg, key: uc_bk_lead }
  - { file: assets/uc-gv-complaint.jpg, key: uc_gv_complaint }
  - { file: assets/uc-hs-after.jpg, key: uc_hs_after }
  - { file: assets/uc-hs-preadmit.jpg, key: uc_hs_preadmit }
  - { file: assets/uc-lb-home.jpg, key: uc_lb_home }
  - { file: assets/uc-lg-day.jpg, key: uc_lg_day }
  - { file: assets/uc-lg-shipper.jpg, key: uc_lg_shipper }
  - { file: assets/uc-lg-track.jpg, key: uc_lg_track }
  - { file: assets/uc-mi-approval.jpg, key: uc_mi_approval }
  - { file: assets/uc-mi-cover.jpg, key: uc_mi_cover }
  - { file: assets/uc-mi-network.jpg, key: uc_mi_network }
  - { file: assets/uc-mk-cod.jpg, key: uc_mk_cod }
  - { file: assets/uc-mk-return.jpg, key: uc_mk_return }
  - { file: assets/uc-mk-wismo.jpg, key: uc_mk_wismo }
  - { file: assets/uc-re-eoi.jpg, key: uc_re_eoi }
  - { file: assets/uc-re-lead.jpg, key: uc_re_lead }
  - { file: assets/uc-re-visit.jpg, key: uc_re_visit }
  - { file: assets/uc-rt-offers.jpg, key: uc_rt_offers }
  - { file: assets/uc-rt-points.jpg, key: uc_rt_points }
  - { file: assets/uc-rt-service.jpg, key: uc_rt_service }
  - { file: assets/uc-un-adm.jpg, key: uc_un_adm }
  - { file: assets/uc-un-app.jpg, key: uc_un_app }
  - { file: assets/uc-un-tour.jpg, key: uc_un_tour }

supported_channels: [web, whatsapp]
required_adapters:  [messaging]
supported_languages: [en, ar]

default_settings:
  locale: en          # the website is in English; the AI Agent replies in the visitor's language

inbound_preprocessing:
  voicenote:
    mode: transcribe

flows:
  - home           # the menu
  - book-demo      # collect the lead → pick a time → confirm → book it, save it, email it
  - request-quote  # what the price depends on → confirm → a quote_request record + an email
  - send-message   # a message for the team (the Contact page form) → confirm → a contact_message record + an email
  - plans          # what each plan includes — a carousel, no prices
  - start-free     # the Free plan's sign-up link (the plans carousel's Free button)
  - industry-cases # an industry's real use cases — a carousel, each opening on the website
  - quick-answers  # the most common questions, answered by a fixed card with no AI
  - live-demos     # the marketplace's live demos

agents:
  - id:           assistant
    display_name: 'Octwin'
    tools:
      - home
      - book-demo
      - request-quote
      - send-message
      - plans
      - start-free
      - industry-cases
      - quick-answers
      - live-demos
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
