# worklist.yaml — the hand-over to OUR sales team. One queue; every hand-over lands in it.
# A visitor reaches a person only when this is declared AND the project's plan includes Live chat
# (the handoff guide, §6); otherwise `handoff_request` answers `failed` and talk-to-sales offers
# to book a demo instead.
queues:
  - { key: sales, name: 'Sales', assignment: { strategy: manual } }

work:
  handoff:
    route_by: reason
    map:      { sales: sales, demo: sales, other: sales }
    fallback: sales
    sla:      { resolve_within_hours: 4, first_response_within_hours: 0.25 }
    handoff:  { accept_within_minutes: 5, idle_return_minutes: 30, operator_attribution: business, customer_cancel: true }
