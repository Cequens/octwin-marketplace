flow_id: plans
strings:
  header:     '💼 خطط Octwin'
  free:       "🆓 مجانية — جرّبها مع عملاء حقيقيين: واتساب ودردشة الموقع والقوالب، ووكيل الذكاء الاصطناعي، والنماذج والقوائم، والدردشة المباشرة. ابدأ الآن دون اتصال."
  starter:    "🌱 Starter — الرد على الأسئلة والتحويل إلى الفريق. تضيف واجهة Send API والحملات."
  growth:     "📈 Growth — البيع والحجز والأتمتة: الكتالوج والسلة والطلبات، والحجوزات، والتذكيرات، والتكاملات، والدردشة داخل التطبيق."
  scale:      "🏗️ Scale — إدارة العمل من المحادثة: إدارة الحالات، وصندوق العمل، ولوحات الأداء."
  enterprise: "🏛️ Enterprise — حدود واتفاقية مستوى خدمة حسب العقد، ودعم مخصص."
  meta:       "الخطط المدفوعة مسعّرة حسب حجم استخدامك. رسوم واتساب من Meta تُمرَّر بتكلفتها دون أي هامش؛ ولا رسوم على دردشة الموقع أو التطبيق."
  btn_start:  '🆓 ابدأ مجانًا'
  btn_book:   '📅 احجز عرضًا'
  btn_quote:  '💰 اطلب عرض سعر'
