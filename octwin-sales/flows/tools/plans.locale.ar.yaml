flow_id: plans
strings:
  intro:      "💼 خططنا — اسحب للمقارنة. الخطط المدفوعة مسعّرة حسب حجم استخدامك؛ ورسوم واتساب من Meta تُمرَّر بتكلفتها دون هامش."
  free:       "**🆓 مجانية**\nجرّبها مع عملاء حقيقيين: واتساب ودردشة الموقع ووكيل الذكاء الاصطناعي والنماذج والدردشة المباشرة. ابدأ الآن دون اتصال."
  starter:    "**🌱 Starter**\nالرد على الأسئلة والتحويل إلى الفريق. تضيف واجهة Send API والحملات."
  growth:     "**📈 Growth**\nالبيع والحجز والأتمتة: الكتالوج والسلة والطلبات، والحجوزات، والتذكيرات، والتكاملات، والدردشة داخل التطبيق."
  scale:      "**🏗️ Scale**\nإدارة العمل من المحادثة: إدارة الحالات، وصندوق العمل، ولوحات الأداء."
  enterprise: "**🏛️ Enterprise**\nحدود واتفاقية مستوى خدمة حسب العقد، ودعم مخصص."
  btn_start:  '🆓 ابدأ مجانًا'
  btn_book:   '📅 احجز عرضًا'
  btn_quote:  '💰 اطلب عرض سعر'
