flow_id: quick-answers
strings:
  pick: "❓ الأسئلة الأكثر تكرارًا — اختر أحدها. ولأي سؤال آخر، اكتبه مباشرة."
  cta: "الأسئلة"
  q_arabic: "🗣️ هل يفهم اللهجات العربية؟"
  a_arabic: "نعم. يفهم وكيل الذكاء الاصطناعي العربية الفصحى ولهجة العميل نفسها — الخليجية والمصرية والشامية وغيرها — والإنجليزية. مكتوبة، أو رسالة صوتية، أو صورة."
  q_channels: "💬 على أي قنوات يعمل؟"
  a_channels: "واتساب (منصة واتساب للأعمال الرسمية عبر CEQUENS)، ودردشة على موقعك، ودردشة داخل تطبيقك على iOS أو Android، ورابط أو رمز QR. وكيل واحد وسجلات واحدة على جميعها."
  q_security: "🔐 هل هو آمن؟"
  a_security: "يعمل Octwin على بنية CEQUENS التحتية، المشمولة بشهادات CEQUENS: ISO 27001 وISO 27017 · 27018 وSOC 2 Type II وPCI DSS. ويجيب وكيل الذكاء الاصطناعي فقط من المحتوى الذي اعتمدته والأنظمة التي ربطتها."
  q_systems: "🔌 هل يتصل بأنظمتنا؟"
  a_systems: "نعم — أي واجهة REST أو SOAP أو XML عبر HTTPS، تُضبط كإعدادات دون أي نشر من جهتك: نظام CRM أو الحجوزات أو الدفع عبر مزودك أو نظام ERP."
  q_pricing: "💰 كيف يتم التسعير؟"
  a_pricing: "الخطة المجانية خدمة ذاتية: سجّل وابدأ دون اتصال. كل خطة مدفوعة مسعّرة حسب حجم استخدامك — يرسل الفريق عرض السعر خلال يومَي عمل. رسوم واتساب من Meta تُمرَّر بتكلفتها دون هامش؛ ولا رسوم على دردشة الموقع أو التطبيق."
  q_golive: "⏱️ ما مدة الإطلاق؟"
  a_golive: "الخطة المجانية خدمة ذاتية: تسجّل وتُعدّها بنفسك اليوم، دون أي اتصال. أما الخطة المدفوعة فيُعدّها فريقنا معك — من أيام إلى بضعة أسابيع حسب الأنظمة التي تربطها."
  q_handover: "🙋 هل يمكن لفريقي استلام المحادثة؟"
  a_handover: "نعم. دردشة مباشرة مع التوجيه وساعات العمل: يحوّل وكيل الذكاء الاصطناعي المحادثة عند الحاجة، ويستلمها فريقك والمحادثة كاملة أمامه."
  btn_demos: "▶️ جرّب عرضًا مباشرًا"
  btn_industry: "🏭 شاهد قطاعك"
  btn_plans: "💼 الخطط"
  btn_book: "📅 احجز عرضًا"
  btn_quote: "💰 اطلب عرض سعر"
  btn_free: "🆓 ابدأ مجانًا"
  btn_more: "❓ أسئلة أخرى"
