# Book a demo — collect the lead, confirm it, save it as a `lead` record, then offer a person now.
# The craft-collect recipe: one `collect:`, `approve_apply` before committing, `record_save`.
flow_id:     book-demo
version:     1
description: Book a demo with the Octwin team. Call when the visitor wants a demo, a call, a quote, or to talk business. Pass `industry` or `volume` only when they said it.

input:
  industry: { type: enum, optional: true, enum: [banks, ecommerce, healthcare, realestate, insurance, education, logistics, retail, government, other] }
  volume:   { type: enum, optional: true, enum: [under_1k, k1_10k, k10_100k, over_100k] }

entry:
  - else: true
    goto: intake

steps:
  intake:
    - collect:
        fields:
          - field: name
            label: '$t("book-demo.ask_name")'
          - field: company
            label: '$t("book-demo.ask_company")'
          # Untyped on purpose, like `phone` below: a typed `email`/`phone` field cannot be drawn in a
          # form, and ONE such field turns the form off for the WHOLE node (craft-collect, "One WhatsApp
          # form instead of many turns"). This node's visitor is on the website, where one form beats
          # seven questions — so the format is checked here instead. `when` is TRUE when it is WRONG.
          - field: email
            label: '$t("book-demo.ask_email")'
            validate:
              when:  '!$matches($state.email, "^[^@ ]+@[^@ ]+[.][^@ ]+$")'
              error: '{$t("book-demo.email_error")}'
          - field: industry
            type:  choice
            label: '$t("book-demo.ask_industry")'
            options:
              body:   '{$t("book-demo.ask_industry")}'
              enum:   industry
              values: [banks, ecommerce, healthcare, realestate, insurance, education, logistics, retail, government, other]
          - field: volume
            type:  choice
            label: '$t("book-demo.ask_volume")'
            options:
              body:   '{$t("book-demo.ask_volume")}'
              enum:   volume
              values: [under_1k, k1_10k, k10_100k, over_100k]
          # Optional, and untyped for the same reason as `email`: with the country code, checked here.
          - field: phone
            required: false
            label: '$t("book-demo.ask_phone")'
            validate:
              when:  '!$matches($state.phone, "^[+][0-9 ]{8,16}$")'
              error: '{$t("book-demo.phone_error")}'
          # Optional: never asked on its own — filled when the visitor volunteers it.
          - field: notes
            required: false
            label: '$t("book-demo.ask_notes")'
        complete: [{ goto: confirm }]

  confirm:
    - use: approve_apply
      with:
        header:       '{$t("book-demo.confirm_header")}'
        preview:      '{$t("book-demo.preview", { name: $state.name, company: $state.company, email: $state.email, industry: $enum_label($state.industry, "industry"), volume: $enum_label($state.volume, "volume"), phone: $coalesce($state.phone, "—") })}'
        apply:        save
        abort_render: { render_intent: text_card, body: '{$t("book-demo.not_sent")}' }
        on_other:     intake
        memory_note:  'Asked the visitor to confirm their demo request.'

  save:
    - track: { journey: demo, stage_enter: requested }
    - do: record_save
      args:
        entity: lead
        fields:
          name:     '$state.name'
          company:  '$state.company'
          email:    '$state.email'
          industry: '$state.industry'
          volume:   '$state.volume'
          phone:    '$coalesce($state.phone, "")'
          notes:    '$coalesce($state.notes, "")'
      bind: saved
      outputs:
        ok:
          - render:
              render_intent: detail_card
              body: '{$t("book-demo.saved", { name: $state.name })}'
              buttons:
                - { title: '{$t("book-demo.btn_person")}', on_select: { invoke: talk-to-sales, with: { reason: demo } } }
                - { title: '{$t("book-demo.btn_demos")}', on_select: { invoke: live-demos } }
                - { title: '{$t("book-demo.btn_home")}', on_select: { invoke: home } }
            memory_note: 'Saved demo request #{$saved.record_number} for {$state.company} ({$state.industry}, {$state.volume}). The sales team will email {$state.email} to agree a time.'
          - end: applied
        invalid:
          - assign: { state.email: null }
          - goto: intake
        failed: [{ end: failed }]
