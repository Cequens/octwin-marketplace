flow_id: quick-answers
strings:
  pick: "❓ The questions we hear most — pick one. For anything else, just type it."
  cta: "Questions"
  q_arabic: "🗣️ Does it understand Arabic dialects?"
  a_arabic: "Yes. The AI Agent understands standard Arabic and the customer's own dialect — Gulf, Egyptian, Levantine and more — and English. Typed, spoken as a voice note, or photographed."
  q_channels: "💬 Which channels does it work on?"
  a_channels: "WhatsApp (the official WhatsApp Business Platform, through CEQUENS), a chat on your website, in-app chat inside your iOS or Android app, and a link or QR code. One AI Agent and one set of records on all of them."
  q_security: "🔐 Is it secure?"
  a_security: "Octwin runs on CEQUENS infrastructure, covered by CEQUENS's ISO 27001, ISO 27017 · 27018, SOC 2 Type II and PCI DSS certifications. The AI Agent answers only from content you approved and systems you connected."
  q_systems: "🔌 Can it connect to our systems?"
  a_systems: "Yes — any REST, SOAP or XML API over HTTPS, set up as configuration, with nothing for you to deploy: your CRM, bookings, payments from your own provider, or your ERP."
  q_pricing: "💰 How does pricing work?"
  a_pricing: "The Free plan is self-service: sign up and start, with no call. Every paid plan is priced for your volume — the team quotes it within 2 working days. Meta's WhatsApp fees are passed through at cost, with no markup; website and in-app chat carry none."
  q_golive: "⏱️ How fast can we go live?"
  a_golive: "The Free plan is self-service: you sign up and set it up yourself, today, with no call. A paid plan is set up with our team — days to a few weeks, depending on the systems you connect."
  q_handover: "🙋 Can my team take over a chat?"
  a_handover: "Yes. Live chat with routing and working hours: the AI Agent hands over when it should, and your team picks up with the whole conversation in front of them."
  btn_demos: "▶️ Try a live demo"
  btn_industry: "🏭 See your industry"
  btn_plans: "💼 Plans"
  btn_book: "📅 Book a demo"
  btn_quote: "💰 Get a quotation"
  btn_free: "🆓 Start free"
  btn_more: "❓ More questions"
