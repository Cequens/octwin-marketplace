# XRM declaration for binaa-supply.
#
# Two entities. The PRICE LIST is deliberately not one of them: it lives in the
# operator's workbook and is read live (see integrations.yaml). Finance edits that
# sheet daily, so a mirror here would always be one sweep out of date — and the
# whole point of the pack is that it works with the system they already use.
#
#  • site  — where a contractor wants materials delivered.
#  • quote — the RFQ pipeline. Its `on:` hooks are seams 3 and 4 of the demo.

entities:

  site:
    label: { en: 'Delivery site', ar: 'موقع التسليم' }
    icon:        '🏗️'
    description: { en: 'A customer construction site materials are quoted and delivered to', ar: 'موقع إنشائي للعميل تُسعّر وتُسلَّم إليه المواد' }
    fields:
      name:          { type: text, required: true, label: { en: 'Site', ar: 'الموقع' } }
      city:          { type: select, options: [riyadh, kharj, diriyah, qassim, dammam], label: { en: 'City', ar: 'المدينة' } }
      address:       { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      contact_phone: { type: text, label: { en: 'Site phone', ar: 'جوال الموقع' } }
    list: [city, contact_phone]
    search: { text: [name, address] }
    dedupe_by: name

  quote:
    label: { en: 'Quote / RFQ', ar: 'طلب عرض سعر' }
    icon:        '🧾'
    description: { en: 'A material request-for-quote, priced and tracked to delivery', ar: 'طلب تسعير مواد يُسعّر ويُتابع حتى التسليم' }
    fields:
      material_name: { type: text, required: true, label: { en: 'Material', ar: 'الصنف' } }
      sku:           { type: text, label: { en: 'SKU', ar: 'الكود' } }
      qty:           { type: number, required: true, label: { en: 'Qty', ar: 'الكمية' }, sortable: true }
      unit:          { type: text, label: { en: 'Unit', ar: 'الوحدة' } }
      unit_price:    { type: money, label: { en: 'Unit price', ar: 'سعر الوحدة' }, currency: SAR }
      total:         { type: money, label: { en: 'Total', ar: 'الإجمالي' }, sortable: true, currency: SAR }
      customer_name: { type: text, label: { en: 'Customer', ar: 'العميل' } }
      site:          { type: record, entity: site, label: { en: 'Site', ar: 'الموقع' } }
      site_name:     { type: text, label: { en: 'Site name', ar: 'اسم الموقع' } }
      site_address:  { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      notes:         { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
      # Written back FROM the workbook — the append response fills the first two,
      # the inbound webhook refreshes them plus the sync stamps. So the console row
      # deep-links straight to the sheet row the desk has to act on.
      # The append's own `updatedRange`, e.g. `Quotes!A5:O5`, stored verbatim —
      # Google accepts it in a deep link, so the console can jump straight to the
      # row with no row number to parse and nothing a later sort invalidates.
      sheet_range:    { type: text,   label: { en: 'Sheet row', ar: 'صف الشيت' } }
      # The row, derived from `sheet_range` at append time — what the status
      # write-back addresses. TEXT, not number: the flow expression that extracts
      # it has to start with `$` to be evaluated at all, so it cannot carry a `+`
      # coercion, and a URL path needs a string anyway. See `sheets_update_status`
      # for why this is the fragile half and the append log is the durable one.
      sheet_row:      { type: text,   label: { en: 'Row', ar: 'رقم الصف' } }
    list: [material_name, qty, total]
    search: { text: [material_name, sku, customer_name] }
    pipeline:
      stages:      [new, quoted, won, shipped, delivered, lost]
      initial:     new
      progression: free
      terminal:    [delivered, lost]
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      new:       { en: 'RFQ received, not yet priced', ar: 'وصل طلب التسعير ولم يُسعّر بعد' }
      quoted:    { en: 'A price was sent; awaiting the customer', ar: 'أُرسل السعر وبانتظار رد العميل' }
      won:       { en: 'The customer accepted; prepare the order', ar: 'وافق العميل — جهّز التوريد' }
      shipped:   { en: 'Materials left the yard', ar: 'غادرت المواد المستودع' }
      delivered: { en: 'Signed for on site', ar: 'تم الاستلام والتوقيع في الموقع' }
      lost:      { en: 'Closed without an order', ar: 'أُغلق دون توريد' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      new:       { en: 'New', ar: 'جديد' }
      quoted:    { en: 'Quoted', ar: 'تم التسعير' }
      won:       { en: 'Won', ar: 'معتمد ✅' }
      shipped:   { en: 'Shipped', ar: 'تم الشحن 🚚' }
      delivered: { en: 'Delivered', ar: 'تم التسليم ✅' }
      lost:      { en: 'Lost', ar: 'ملغي' }
    milestones:
      rfq_filed: { label: { en: 'RFQ filed', ar: 'تم استلام الطلب' } }
      order_won: { label: { en: 'Won', ar: 'تم الاعتماد' } }

    on:
      # ── seam 3 · the observer push ──────────────────────────────────────────
      # Both hook SHAPES are exercised: `create:` is a bare directive list,
      # `enter:` is a stage-keyed map.
      #
      # These are QUEUED, not called on the turn. A customer filing an RFQ must not
      # wait on Slack, and the alert must survive a 503 — which the reactions seam,
      # being fire-and-forget, could not guarantee on its own.
      create:
        - push:
            operation: slack_post_rfq
            input:
              text: '🧱 New RFQ {{ record.record_number }} — {{ record.fields.material_name }} ×{{ record.fields.qty }} {{ record.fields.unit }} for {{ record.fields.customer_name }}. Sheet: {{ record.fields.sheet_range }}'
      enter:
        won:
          - push:
              operation: slack_post_sales
              input:
                text: '🏆 Won {{ record.record_number }} — {{ record.fields.material_name }} ×{{ record.fields.qty }} · {{ record.fields.total }} SAR · {{ record.fields.customer_name }}'

        # ── the customer notification ─────────────────────────────────────────
        # Ops moves the quote to `shipped` in the console, and THIS fires — the
        # ordinary notify verb, one declared line. It does not care what caused
        # the move, which is exactly why deleting the sheet-side webhook cost
        # nothing: a console click and an inbound upsert produce the same event.
        shipped:
          - notify:
              message: '🚚 طلبك {{ record.record_number }} ({{ record.fields.material_name }}) خرج للشحن. نتواصل معك عند وصول الشحنة للموقع.'
              cooldown_hours: 12

        delivered:
          - notify:
              message: '✅ تم تسليم طلبك {{ record.record_number }}. شكراً لتعاملك مع بناء لمواد البناء.'
              cooldown_hours: 24

      # ── the sheet-side mirror ───────────────────────────────────────────────
      # ANY move, appended to `Status log` — so the workbook still shows status
      # even though nobody types it there any more. `stage_change` rather than six
      # `enter:` entries: a stage added later would silently miss the mirror.
      #
      # It fires ALONGSIDE the `enter:` hooks above, not instead of them, and for
      # EVERY source — a console click, a flow's record_save, an automation sweep.
      # Queued, so a spreadsheet write can never delay the customer's message; if
      # it fails it dead-letters visibly and the stage move still stands.
      stage_change:
        # TWO writes on purpose. The log is the durable record — append-only, no
        # row index, survives a sort. The cell is the one the sales desk reads
        # without being taught a formula. If they ever disagree, the log is right.
        - push:
            operation: sheets_append_status
            input:
              ref:  '{{ record.record_number }}'
              from: '{{ event.from }}'
              to:   '{{ event.to }}'
              by:   '{{ event.actor }}'
        - push:
            operation: sheets_update_status
            input:
              row:    '{{ record.fields.sheet_row }}'
              status: '{{ event.to }}'

segments:
  open_rfqs:
    entity: quote
    label:  { en: 'Open RFQs', ar: 'طلبات مفتوحة' }
    where:  { stage_in: [new, quoted] }
  in_transit:
    entity: quote
    label:  { en: 'In transit', ar: 'في الطريق' }
    where:  { stage: shipped }

demo:
  - entity: site
    as: site_narjis
    fields:
      name: 'مشروع النرجس - برج A'
      city: riyadh
      address: 'حي النرجس، طريق أنس بن مالك، الرياض'
      contact_phone: '0551234567'
  - entity: site
    fields:
      name: 'مستودع الخرج'
      city: kharj
      address: 'المنطقة الصناعية، الخرج'
      contact_phone: '0559876543'
  - entity: quote
    stage: quoted
    fields:
      material_name: 'أسمنت مقاوم 50 كجم'
      sku: 'CEM-SR-50'
      qty: 400
      unit: 'كيس'
      unit_price: 14
      total: 5600
      customer_name: 'مؤسسة الراجحي للمقاولات'
      site: '@site_narjis'
      site_name: 'مشروع النرجس - برج A'
