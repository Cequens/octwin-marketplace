# home — the front door. A list_picker hub, so a contractor chooses instead of typing.
#
# Counts the caller's open RFQs so the greeting can lead with what is actually
# outstanding rather than a generic welcome.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this customer.'

entry:
  - else: true
    goto: count_open

steps:

  count_open:
    - do: record_aggregate
      args: { entity: quote, op: count, active_only: true }
      bind: oc
      outputs:
        ok:     [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign:
        live: '$coalesce($oc.value, 0)'
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $live > 0 ? $t("home.open_rfqs", { count: $live }) : null
               ]), "\n")'
        footer: '{$t("home.footer")}'
        cta: '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_prices")}', description: '{$t("home.row_prices_d")}', on_select: { invoke: price-list } }
          - { title: '{$t("home.row_cement")}', description: '{$t("home.row_cement_d")}', on_select: { invoke: price-list, with: { category: cement } } }
          - { title: '{$t("home.row_steel")}',  description: '{$t("home.row_steel_d")}',  on_select: { invoke: price-list, with: { category: steel } } }
          - { title: '{$t("home.row_rfq")}',    description: '{$t("home.row_rfq_d")}',    on_select: { invoke: request-quote } }
          - { title: '{$t("home.row_mine")}',   description: '{$t("home.row_mine_d")}',   on_select: { invoke: my-quotes } }
      memory_note: 'Showed the Binaa menu ({$live} open RFQ(s)).'
    - end: applied
