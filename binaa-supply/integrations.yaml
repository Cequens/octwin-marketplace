# The two systems the yard already runs on.
#
#  • sheet — the price list AND the RFQ log. Deliberately NOT mirrored into XRM:
#            finance edits that workbook every day, and a mirror is a second
#            source of truth that is always one sweep out of date. We read it live.
#
#            Reached through a Google Apps Script Web App rather than the Sheets
#            REST API, because that API has no token-only write path (an API key is
#            read-only and public-sheets-only; writing needs OAuth2). A Web App is
#            a first-party Google endpoint the sheet's owner deploys, so there is no
#            OAuth dance and no refresh tokens to rotate. See README.md.
#
#  • slack — where the sales desk actually lives.
#
# NOTHING here is a secret. The endpoint and the credential are operator data,
# entered once in the console under Outbound → Integrations.

version: 1

connections:

  sheet:
    label:    { en: 'Price-list workbook', ar: 'شيت قائمة الأسعار' }
    describe: >-
      The Apps Script Web App bound to the Binaa workbook. The endpoint is the
      /exec deployment URL; the credential is the same string you paste into
      SHARED_SECRET at the top of the script.
    base_url:
      required: true
      example:  'https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxxxxxxxx/exec'
      # `/dev` is an editor-only URL that requires a signed-in Google session, so a
      # server-to-server call against it always fails. Reject it before it is saved
      # rather than after an operator spends an afternoon on it.
      must_match: '^https://script\.google\.com/(a/macros/[^/]+|macros)/s/[A-Za-z0-9_-]+/exec$'
    auth:
      kind: api_key
      # The Web App answers with a cross-host redirect, and any correct HTTP client
      # strips an Authorization header on that hop — so the secret CANNOT ride a
      # header here. The GET carries it in the query string; the POST overrides to
      # the body (see `auth_in` on sheet_append_quote), because a query string is
      # logged by intermediaries and an RFQ carries a customer's phone number.
      in:   query
      name: secret
    request:
      # Content Service always redirects to a one-time googleusercontent.com URL
      # that is GET-only — following it with POST returns 405. All three of these
      # are required for such an endpoint to work at all.
      follow_redirects:       true
      redirect_method:        get
      strip_auth_on_redirect: true
      max_redirects:          3
      timeout_ms:             8000
      max_response_bytes:     262144
    # Apps Script cannot set a status code. A thrown script AND a wrong sharing
    # setting both answer HTTP 200 — the latter with a human sign-in page. Every
    # operation below therefore relies on the platform's default `expect: json`,
    # which turns an HTML body into a named `non_json_response` failure instead of
    # a silent success. Do not weaken it to `text` on this connection.
    health: { operation: sheet_ping }
    setup_hint: >-
      Extensions → Apps Script, paste apps-script/binaa-sheet.gs.md, then
      Deploy → New deployment → Web app with "Execute as: Me" and
      "Who has access: Anyone". Add script.googleusercontent.com under Allowed
      redirect hosts — the Web App redirects there to serve its body, and it is a
      different domain from script.google.com rather than a subdomain, so it is
      not covered automatically.

  # The SAME workbook as `sheet` above, reached through Google's own API instead of
  # a script we deploy. Both exist on purpose: `sheet` needs no Google Cloud project
  # and no OAuth consent (paste a URL and a secret, done), which keeps the pack
  # installable in five minutes; `sheets` is the production shape, where the
  # operator grants access once and the platform renews it forever.
  #
  # WHY THE PRICE READ STAYS ON THE APPS SCRIPT. It is tempting to retire `sheet`
  # now that OAuth2 works, and it would be a downgrade for two reasons:
  #
  #   • values.get returns POSITIONAL arrays, so a flow can only address columns by
  #     index — hard-coding column order. The script resolves them by NAME, and this
  #     pack's README promises exactly that ("column order may change but the names
  #     may not"). Reordering two columns would then yield wrong prices rather than
  #     an error. Closing this needs an `index_of` expr builtin — logged in the
  #     platform's docs/BACKLOG.md.
  #   • the script filters server-side (q / category / sku / limit); values.get
  #     cannot, so the whole sheet would cross the wire on every turn.
  #
  # A WRITE needs neither property, which is why the RFQ append is what moves here
  # next.
  #
  # Nothing here is a secret and there is no credential field — pressing Connect in
  # the console sends the operator to Google, and the grant comes back to us.
  sheets:
    label:    { en: 'Google Sheets (direct)', ar: 'جداول جوجل (مباشر)' }
    describe: >-
      The same price workbook, read through the Google Sheets API with an account
      the operator authorizes once. No Apps Script deployment and no shared secret.
    # Google serves every spreadsheet from one host, so the pack owns the endpoint
    # and the operator supplies only WHICH workbook.
    base_url: { fixed: 'https://sheets.googleapis.com' }
    auth:
      kind:     oauth2
      provider: google
      scopes:
        # Read AND write: the RFQ append moves here next. Asking for it now means
        # one consent rather than two, and the scope list is shown to whoever
        # presses Connect.
        - https://www.googleapis.com/auth/spreadsheets
    settings:
      spreadsheet_id:
        label:    { en: 'Spreadsheet ID', ar: 'معرّف الجدول' }
        describe: 'The part of the sheet URL between /d/ and /edit.'
        required: true
        example:  '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms'
    health: { operation: sheets_ping }
    setup_hint: >-
      Press Connect and approve access at Google. An administrator must first
      register the platform's OAuth client under Platform → Integrations.

  slack:
    label:    { en: 'Slack workspace', ar: 'سلاك' }
    describe: 'Where the sales desk sees new RFQs and won deals.'
    # Operator-supplied even though Slack's API base never varies, because a DEMO
    # has to be runnable. `fixed:` would be the better production pattern for a
    # known SaaS (and docs/38 shows it), but it also makes this half of the demo
    # impossible to exercise without a real Slack workspace — and the README
    # promises the whole loop runs against the local stub. Runnable beats tidy.
    base_url:
      required: true
      example:  'https://slack.com/api'
    auth:     { kind: bearer }
    settings:
      rfq_channel:
        label:    { en: 'RFQ channel ID', ar: 'قناة الطلبات' }
        describe: 'Channel → About → the C… id at the bottom. Not the #name.'
        required: true
        example:  'C0123ABCD'
      sales_channel:
        label:    { en: 'Sales channel ID', ar: 'قناة المبيعات' }
        required: true
        example:  'C0456EFGH'
    request:
      timeout_ms:         8000
      max_response_bytes: 65536
    health: { operation: slack_auth_test }
    setup_hint: >-
      api.slack.com/apps → create an app → OAuth & Permissions → Bot Token Scopes
      chat:write (add chat:write.public if you would rather not invite the bot) →
      Install to Workspace → copy the xoxb- token.

operations:

  # ── the workbook ───────────────────────────────────────────────────────────

  sheet_ping:
    connection: sheet
    describe:   'Cheap authenticated read for the console Test button. Also reports the pasted script version.'
    method:     GET
    query:      { action: ping }
    response:
      ok_path:    ok
      error_path: error
      error_map:
        denied: [bad_secret]
      data_path:  sheet

  sheet_append_quote:
    connection: sheet
    describe:   'Append one RFQ row to the Quotes tab. The script dedupes on `ref`, so a retry cannot double-file.'
    method:     POST
    # The secret moves to the BODY for this one: a query string is logged by
    # intermediaries, and this request carries the customer's phone number.
    auth_in:    body
    headers:
      # Server-to-server, so there is no CORS preflight and no need for the
      # text/plain workaround the browser-side advice recommends.
      Content-Type: 'application/json'
    body:
      action:     append_quote
      ref:        '{{ input.ref }}'
      customer:   '{{ input.customer }}'
      phone:      '{{ input.phone }}'
      sku:        '{{ input.sku }}'
      material:   '{{ input.material }}'
      qty:        '{{ input.qty }}'
      unit:       '{{ input.unit }}'
      unit_price: '{{ input.unit_price }}'
      total:      '{{ input.total }}'
      currency:   '{{ input.currency || "SAR" }}'
      site:       '{{ input.site }}'
      address:    '{{ input.address }}'
    # Never store a customer's phone number in the delivery log.
    redact: [phone]
    idempotency_header: 'X-Idempotency-Key'
    response:
      ok_path:    ok
      error_path: error
      data_path:  row
      error_map:
        denied:  [bad_secret]
        invalid: [missing_ref, unknown_action, missing_sheet]
        # The script holds a lock while appending; `busy` means try again shortly.
        retry:   [busy]

  # ── the workbook, through Google's own API ─────────────────────────────────

  sheets_ping:
    connection: sheets
    describe:   'Read the workbook title. Proves the grant, the scope and the spreadsheet id in one call.'
    method:     GET
    path:       'v4/spreadsheets/{{ conn.spreadsheet_id }}'
    query:
      # Ask for one field rather than the whole workbook — a large sheet would
      # otherwise return megabytes to answer "are you connected?".
      fields: 'properties.title'
    response:
      data_path: properties
    status_map:
      # Google DOES use real status codes, unlike the two endpoints above, so the
      # platform's defaults are already right: 401/403 → denied, 5xx → retry. The
      # one override: a 404 here means the operator typed the wrong spreadsheet id,
      # which is a setup mistake to fix — not an empty result to render.
      404: invalid

  sheets_prices:
    connection: sheets
    describe:   'Every price row, header included. Filtering happens flow-side — see below.'
    method:     GET
    # A1, not A2: `$rows_to_objects` needs the HEADER row to address columns by name,
    # which is the whole reason this can replace the Apps Script read. Bounded at 500
    # rows so a runaway sheet trips the range rather than `max_response_bytes`.
    path:       'v4/spreadsheets/{{ conn.spreadsheet_id }}/values/Prices!A1:J500'
    # THE ONE REGRESSION vs the script, stated plainly: values.get cannot filter, so
    # the whole (bounded) range crosses the wire on every turn and the flow filters
    # in memory. At price-list scale that is cheaper than it sounds and buys away the
    # entire Apps Script setup path — no deployment, no shared secret, no sharing
    # setting, no redirect host, and real status codes instead of HTTP 200 for
    # everything. If a yard ever outgrows 500 rows, that is the moment to reconsider.
    response:
      items_path: values
      data_path:  values
    status_map:
      404: invalid

  # ── Slack ──────────────────────────────────────────────────────────────────

  slack_auth_test:
    connection: slack
    describe:   'Confirms the bot token for the console Test button.'
    method:     POST
    path:       'auth.test'
    response:
      ok_path:    ok
      error_path: error
      data_path:  team
      error_map:
        denied: [invalid_auth, not_authed, token_revoked, account_inactive]

  # TWO operations rather than one taking `channel` as an argument, because the
  # channel is CONNECTION CONFIG, not per-call data. An operation body can read
  # `{{ conn.* }}`; a `push:` hook's `input:` is rendered at enqueue time from the
  # record alone and cannot. Putting the channel here also means a `push:` hook
  # names WHICH DESK it is telling, which reads better in xrm.yaml.
  slack_post_rfq:
    connection: slack
    describe:   'Tell the RFQ desk. Queued only.'
    method:     POST
    path:       'chat.postMessage'
    # A customer must never wait on Slack's uptime for their reply, and the platform
    # refuses a synchronous call to an operation declared this way.
    allow_sync: false
    headers:
      # With a JSON body the token MUST be the header — Slack ignores a body field.
      Content-Type: 'application/json; charset=utf-8'
    body:
      channel: '{{ conn.rfq_channel }}'
      text:    '{{ input.text }}'
    response:
      ok_path:    ok
      error_path: error
      error_map:
        # Slack answers HTTP 200 for EVERY failure, so status-code mapping would
        # report each of these as a success. Splitting them matters because the
        # response differs: `denied` is the operator's to fix and is never retried,
        # `invalid` is ours, and `retry` is nobody's fault.
        denied:  [not_in_channel, channel_not_found, missing_scope, invalid_auth,
                  not_authed, token_revoked, token_expired, account_inactive,
                  is_archived, restricted_action_read_only_channel]
        invalid: [no_text, invalid_blocks, msg_blocks_too_long, invalid_arguments]
        retry:   [rate_limited, ratelimited, internal_error, fatal_error,
                  service_unavailable, request_timeout]
    # chat.postMessage is rate-limited at roughly one message per second per
    # channel and answers 429 with Retry-After. Honour theirs over our curve.
    honor_retry_after: true

  slack_post_sales:
    connection: slack
    describe:   'Tell the sales desk. Queued only.'
    method:     POST
    path:       'chat.postMessage'
    # A customer must never wait on Slack's uptime for their reply, and the platform
    # refuses a synchronous call to an operation declared this way.
    allow_sync: false
    headers:
      # With a JSON body the token MUST be the header — Slack ignores a body field.
      Content-Type: 'application/json; charset=utf-8'
    body:
      channel: '{{ conn.sales_channel }}'
      text:    '{{ input.text }}'
    response:
      ok_path:    ok
      error_path: error
      error_map:
        # Slack answers HTTP 200 for EVERY failure, so status-code mapping would
        # report each of these as a success. Splitting them matters because the
        # response differs: `denied` is the operator's to fix and is never retried,
        # `invalid` is ours, and `retry` is nobody's fault.
        denied:  [not_in_channel, channel_not_found, missing_scope, invalid_auth,
                  not_authed, token_revoked, token_expired, account_inactive,
                  is_archived, restricted_action_read_only_channel]
        invalid: [no_text, invalid_blocks, msg_blocks_too_long, invalid_arguments]
        retry:   [rate_limited, ratelimited, internal_error, fatal_error,
                  service_unavailable, request_timeout]
    # chat.postMessage is rate-limited at roughly one message per second per
    # channel and answers 429 with Retry-After. Honour theirs over our curve.
    honor_retry_after: true

inbound:

  quote_status:
    label:    { en: 'Quote status edited in the sheet', ar: 'تغيّر حالة العرض في الشيت' }
    describe: 'The ops team sets a Status cell in the Quotes tab; the script posts it here.'
    connection: sheet
    verify:
      scheme:     octwin_v1
      max_skew_s: 300
    # onEdit can fire twice for one edit, and the script retries on a 5xx. This is
    # the durable guard — it survives a restart, which a per-process one would not.
    idempotency: '{{ payload.ref }}:{{ payload.status }}:{{ payload.edited_at }}'
    when: { path: event, equals: [quote_status] }
    upsert:
      entity: quote
      # The sheet has NO stable row identity — sorting it renumbers every row — so
      # the join key is minted on OUR side (`record_number`), written into the
      # sheet's Ref column when the RFQ is filed, and matched on the way back.
      match:  { record_number: '{{ payload.ref }}' }
      fields:
        sheet_row:      '{{ payload.row }}'
        sheet_row_url:  '{{ payload.row_url }}'
        last_synced_at: '{{ payload.edited_at }}'
        last_synced_by: '{{ payload.edited_by }}'
      stage: '{{ payload.status }}'
      # A stray edit on an unrelated row must never conjure a record here.
      on_no_match: ignore
      # The Status column is a data-validation dropdown, so this should never fire
      # — and if it does, that is a mapping bug worth seeing rather than coercing.
      on_unmapped_stage: reject
