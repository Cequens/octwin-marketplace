# orders — the shopper's order center: list my orders, view one (status +
# items), cancel it, or edit it (cancel + restore its items to the cart for a
# fresh checkout). Cancel/Edit are offered only while the order pipeline still
# allows canceling (pending/processing — ORDER_STATUS_TRANSITIONS is strict:
# shipped/completed orders are read-only and order_update_status fails loudly).
#
# Statuses reach the shopper through `$enum_label(<value>, "order_status" | "payment_status")`
# — the pack-level `locale.<lang>.yaml` labels — never as the raw `pending` / `captured` token.
flow_id:     orders
version:     1
description: 'List the shopper''s orders, show one order''s details and status, cancel it, or edit it (moves its items back to the cart).'

input:
  action:       { type: enum, enum: [list, view, cancel, edit], optional: true, describe: 'list | view | cancel | edit (default list).' }
  reference_id: { type: string, optional: true, describe: 'Order reference (ord_…) — required for view / cancel / edit.' }

entry:
  - else: true
    goto: route

steps:
  route:
    # No reference for a per-order action → fall back to the picker.
    - if: '$input.reference_id == null'
      goto: list_orders
    - dispatch:
        key: '$coalesce($input.action, "view")'
        cases:
          list:   [ { goto: list_orders } ]
          view:   [ { goto: load_order } ]
          cancel: [ { goto: cancel_order } ]
          edit:   [ { goto: load_for_edit } ]

  list_orders:
    - do: order_list
      args: { contact_id: '$contact.id' }
      bind: ol
      outputs:
        empty:  [ { render: { render_intent: text_card, body: '{$t("orders.none")}' } }, { end: applied } ]
        ok:     [ { goto: render_orders } ]
        failed: [ { render: { render_intent: text_card, body: '{$t("orders.err_list")}' } }, { end: failed } ]

  render_orders:
    - render:
        render_intent: list_picker
        header: '{$t("orders.header")}'
        body:   '{$t("orders.intro", { count: $ol.total })}'
        cta:    '{$t("orders.cta")}'
        items:  []
        sections:
          - title: '{$t("orders.section")}'
            items:
              for_each: '$ol.orders'
              as:       o
              template:
                title:       '{$t("orders.row_title", { number: $o.record_number, total: $format_money($o.total_minor / 100, $coalesce($o.currency, "USD")) })}'
                description: '$enum_label($o.status, "order_status", $o.status) + " · " + $summarize_items($o.items, "{quantity}× {name}", { max: 3, separator: ", " })'
                on_select:
                  invoke: 'orders'
                  with:
                    action:       view
                    reference_id: '$o.reference_id'
      memory_note: 'Listed the shopper''s {$ol.total} order(s).'
      data: { count: '$ol.total' }
    - end: applied

  load_order:
    - do: order_get
      args: { reference_id: '$input.reference_id' }
      bind: order
      outputs:
        ok:     [ { goto: render_order } ]
        empty:  [ { render: { render_intent: text_card, body: '{$t("orders.not_found")}' } }, { end: applied } ]
        failed: [ { render: { render_intent: text_card, body: '{$t("orders.err_load")}' } }, { end: failed } ]

  render_order:
    - assign:
        order_body: '$lines([
                       $t("orders.status_line", {
                         status:  $enum_label($order.status, "order_status", $order.status),
                         payment: $enum_label($order.payment_status, "payment_status", $order.payment_status)
                       }),
                       "",
                       $summarize_items($order.items, "{quantity}× {name}", { separator: "\n" })
                     ], "\n")'
        order_total: '$format_money($order.total_minor / 100, $coalesce($order.currency, "USD"))'
    # Editable = the pipeline still allows canceling (pending/processing).
    - if: '$order.status == "pending" || $order.status == "processing"'
      then:
        - render:
            render_intent: detail_card
            header: '{$t("orders.order_header", { number: $order.record_number })}'
            body:   '$order_body'
            footer: '{$t("orders.total", { total: $order_total })}'
            buttons:
              - { title: '{$t("orders.btn_cancel")}', on_select: { invoke: 'orders', with: { action: cancel, reference_id: '$order.reference_id' } } }
              - { title: '{$t("orders.btn_edit")}',   on_select: { invoke: 'orders', with: { action: edit,   reference_id: '$order.reference_id' } } }
              - { title: '{$t("orders.btn_list")}',   on_select: { invoke: 'orders', with: { action: list } } }
          memory_note: 'Showed order #{$order.record_number} ({$order.status}) with Cancel/Edit actions.'
          data: { status: '$order.status', payment_status: '$order.payment_status' }
        - end: applied
    # Shipped / completed / canceled → read-only details.
    - render:
        render_intent: detail_card
        header: '{$t("orders.order_header", { number: $order.record_number })}'
        body:   '$order_body'
        footer: '{$t("orders.total", { total: $order_total })}'
        buttons:
          - { title: '{$t("orders.btn_list")}', on_select: { invoke: 'orders', with: { action: list } } }
      memory_note: 'Showed order #{$order.record_number} ({$order.status}) — read-only, no longer editable.'
      data: { status: '$order.status', payment_status: '$order.payment_status' }
    - end: applied

  cancel_order:
    - do: order_update_status
      args: { reference_id: '$input.reference_id', status: 'canceled' }
      bind: co
      outputs:
        ok:
          - render:
              render_intent:  order_status
              reference_id:   '$co.reference_id'
              status:         '$co.status'
              payment_status: '$co.payment_status'
              body:           '{$t("orders.canceled", { number: $co.record_number })}'
            memory_note: 'Canceled order #{$co.record_number} at the shopper''s request.'
          - end: applied
        empty:  [ { render: { render_intent: text_card, body: '{$t("orders.not_found")}' } }, { end: applied } ]
        failed: [ { render: { render_intent: text_card, body: '{$t("orders.err_cancel")}' } }, { end: failed } ]

  load_for_edit:
    - do: order_get
      args: { reference_id: '$input.reference_id' }
      bind: order
      outputs:
        ok:     [ { goto: edit_order } ]
        empty:  [ { render: { render_intent: text_card, body: '{$t("orders.not_found")}' } }, { end: applied } ]
        failed: [ { render: { render_intent: text_card, body: '{$t("orders.err_load")}' } }, { end: failed } ]

  # Edit = cancel the order FIRST (the strict transition is the guard — it
  # fails on shipped/completed), then restore its line items into the cart so
  # the shopper adjusts and checks out again.
  edit_order:
    - do: order_update_status
      args: { reference_id: '$order.reference_id', status: 'canceled' }
      bind: co
      outputs:
        ok:     [ { goto: restore_items } ]
        empty:  [ { render: { render_intent: text_card, body: '{$t("orders.not_found")}' } }, { end: applied } ]
        failed: [ { render: { render_intent: text_card, body: '{$t("orders.err_edit")}' } }, { end: failed } ]

  restore_items:
    - foreach:
        in: '$order.items'
        as: it
        body:
          - do: cart_add
            args: { contact_id: '$contact.id', product_id: '$it.retailer_id', qty: '$it.quantity' }
            bind: readd
            outputs:
              ok:      [ { note: 'Restored {$it.quantity}× {$it.name} to the cart.' } ]
              # `invalid` is the UNKNOWN-SKU port, and re-ordering a past order is
              # exactly where a delisted product turns up — so this is the likely
              # per-item failure here, not an edge case. Unhandled it throws, and
              # because edit_order cancels the order BEFORE restoring, a throw
              # mid-loop leaves the shopper with no order AND a half-filled cart.
              invalid: [ { note: 'Could not restore {$it.name} — the product may no longer be available.' } ]
              failed:  [ { note: 'Could not restore {$it.name} right now.' } ]
    - do: cart_view
      args: { contact_id: '$contact.id' }
      bind: cart
      outputs:
        ok:     [ { goto: render_edit_done } ]
        # cart_view failed, but the cancel + item-restore ALREADY applied above —
        # so the flow outcome is genuinely `applied` (not a failure). We just
        # can't re-render the cart, so fall back to a text confirmation. Routed
        # via goto (not an inline render+end) so it reads as the applied outcome
        # it is — no success-stamped-failure lint trip.
        failed: [ { goto: render_edit_done_no_cart } ]

  render_edit_done_no_cart:
    - render: { render_intent: text_card, body: '{$t("orders.edit_done_plain")}' }
    - end: applied

  render_edit_done:
    - render:
        render_intent: detail_card
        header: '{$t("orders.edit_header")}'
        body: '$lines([
                 $t("orders.edit_body", { number: $order.record_number }),
                 "",
                 $summarize_items($cart.items, "{quantity}× {title} — {line_total}", { separator: "\n" })
               ], "\n")'
        footer: '{$t("orders.subtotal", { subtotal: $cart.subtotal })}'
        buttons:
          - { title: '{$t("orders.btn_checkout")}', on_select: { invoke: 'cart', with: { action: checkout } } }
          - { title: '{$t("orders.btn_shop")}',     on_select: { invoke: 'shop' } }
      memory_note: 'Edit flow: canceled order #{$order.record_number} and restored its items to the cart ({$cart.count} item(s), subtotal {$cart.subtotal}). The shopper adjusts the cart, then checks out again.'
    - end: applied
