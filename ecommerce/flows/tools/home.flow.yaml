# home — the shop hub. Pure-render list_picker with tap routing (no `do:`).
flow_id:     home
version:     1
description: Main menu of the shop. Call on a greeting or when the shopper wants to navigate.

input:
  message: { type: string, optional: true, describe: 'Optional free-text note from the shopper.' }

entry:
  - else: true
    goto: show

steps:
  show:
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body:   '{$t("home.body")}'
        cta:    '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_browse")}', description: '{$t("home.row_browse_d")}', on_select: { invoke: 'shop' } }
          - { title: '{$t("home.row_cart")}',   description: '{$t("home.row_cart_d")}',   on_select: { invoke: 'cart', with: { action: view } } }
          - { title: '{$t("home.row_orders")}', description: '{$t("home.row_orders_d")}', on_select: { invoke: 'orders', with: { action: list } } }
      memory_note: 'Showed the shop home menu.'
    - end: applied
