    agentDisabled:    'مساعد المتجر غير متاح مؤقتًا. حاول لاحقًا. 🙏'
    transientError:   'عذرًا، حدث خطأ مؤقت. حاول مرة أخرى بعد قليل. 🙏'
    workflowExpired:  'عذرًا، انتهت الجلسة. لنبدأ من جديد.'
    workflowError:    'عذرًا، حدث خطأ أثناء إتمام ذلك. حاول مرة أخرى.'
    workflowDisabled: 'هذه الميزة غير مفعّلة الآن.'
    toolDisabled:     'هذه الميزة غير مفعّلة الآن.'
    directTapError:   'عذرًا، حدث خطأ. حاول مرة أخرى.'
