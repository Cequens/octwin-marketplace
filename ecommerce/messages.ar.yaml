    failure: { body: 'عذرًا، حدث خطأ. حاول مرة أخرى.' }
  unhandled_tool_error:
    failure: { body: 'عذرًا، حدث خطأ غير متوقع. حاول مرة أخرى بعد قليل. 🙏' }

agents:
