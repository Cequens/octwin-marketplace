# What the ecommerce pack does by itself — abandoned-cart recovery, as rules (guide: craft-automation;
# every change, time and action: rules-guide). Zero XRM schema needed — the rule reads the platform
# `cart` system entity. A cart left `open` past that entity's own 48h idle timeout (its declared
# auto_transition) is abandoned by the platform itself, so the nudge below stops matching it and the
# funnel stays clean — no rule of the pack's own is needed for that.

rules:
  # Nudge shoppers whose cart has sat `open` and idle for 18 hours — inside WhatsApp's 24-hour
  # window, where a free-form message still reaches them (a day is exactly past it). One message
  # per shopper per 48h window (`limit: per_contact`).
  - key: cart_recovery_nudge
    for:
      entity: cart
      where:
        all:
          - { stage: open }
          - { not: { updated_within_days: 0.75 } }
    at: every 1h
    limit: { per_contact: 48h }
    do:
      - notify:
          message:
            en: 'You left items in your cart 🛒 — want to finish checking out?'
            ar: 'تركت منتجات في سلتك 🛒 — تحب تكمل الطلب؟'
