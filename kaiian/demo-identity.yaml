# Demo operator topology for kaiian — SEED-ONLY (created under the `seed` flag by
# the app-shell `applyIdentityDemoSeed` applier, THROUGH the identity layer). Lets
# the operator flow demo end-to-end: assign an extra_charge case to a demo agent,
# log in as them, see it under "My cases" (scoped to their team's queue), and get
# the header-bell notification when its SLA breaches.
#
# `password:` makes an agent login-capable so an evaluator can sign in as them —
# DEMO-ONLY (this file is only read when provisioning with seed data). Passwordless
# agents are safe placeholder assignment targets (they can't log in).
# Queues below are the casework queues declared in cases.yaml.

teams:
  - slug: customer-ops
    name: Customer Ops
    queues: [customer_ops]
    agents:
      - { email: sara.ops@demo.kaiian.test,   name: "Sara — Customer Ops", team_role: lead, password: "demo-kaiian-ops" }
      - { email: omar.ops@demo.kaiian.test,    name: "Omar — Customer Ops" }

  - slug: western-region
    name: Western Region
    queues: [ops_western]
    agents:
      - { email: layla.west@demo.kaiian.test,  name: "Layla — Western Region", team_role: lead, password: "demo-kaiian-west" }

  - slug: central-region
    name: Central Region
    queues: [ops_central]
    agents:
      - { email: hassan.central@demo.kaiian.test, name: "Hassan — Central Region" }
