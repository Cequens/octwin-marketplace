# Demo operator topology for kaiian — SEED-ONLY (created under the `seed` flag by
# the app-shell `applyIdentityDemoSeed` applier, THROUGH the identity layer). Lets
# the operator flow demo end-to-end: assign an extra_charge case to a demo agent,
# see it under "My cases" (scoped to their team's queue), and get the header-bell
# notification when its SLA breaches.
#
# Agents here are real users with a membership and a team seat, so they work as
# assignment and queue targets the moment the pack installs. They carry NO
# credential — a pack is public content and the platform's user lookup is global,
# so a committed password would be a shared account across every tenant that
# seeds this pack. `validatePackBundle` rejects `password:` for that reason. To
# sign in as an agent, invite them from Workspace → Team; they set their own
# password on accept.
# Queues below are the casework queues declared in cases.yaml.

teams:
  - slug: customer-ops
    name: Customer Ops
    queues: [customer_ops]
    agents:
      - { email: sara.ops@demo.kaiian.test,   name: "Sara — Customer Ops", team_role: lead }
      - { email: omar.ops@demo.kaiian.test,    name: "Omar — Customer Ops" }

  - slug: western-region
    name: Western Region
    queues: [ops_western]
    agents:
      - { email: layla.west@demo.kaiian.test,  name: "Layla — Western Region", team_role: lead }

  - slug: central-region
    name: Central Region
    queues: [ops_central]
    agents:
      - { email: hassan.central@demo.kaiian.test, name: "Hassan — Central Region" }
