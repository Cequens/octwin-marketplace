# book-tour — a campus visit, and the `tour_booked` milestone. A tour is the single
# strongest predictor of enrolment, which is why it is a milestone and not just a stage.
#
# If the guardian already has an application, the tour advances THAT record; if they do
# not, an enquiry record is created so the tour is still measurable. Either way the
# milestone fires once.

flow_id:     book-tour
version:     1
description: |-
  [interactive] Book a campus tour. Call when the guardian wants to visit, see the school,
  or attend an open day. Pass `application_id` when they already have an application.

input:
  application_id:
    type:     string
    optional: true
    describe: 'An existing application record id, when the guardian already applied.'

entry:
  - else: true
    goto: gather

steps:
  gather:
    - collect:
        # A REQUEST, not a guarantee. Asked as ONE native form where that is possible, and
        # field-by-field everywhere else — on web (no form client) and on any business Meta
        # has not verified, which is most of them. Both paths collect the same `$state`, so
        # nothing else in this node changes.
        form_flow: true
        before_each:
          - assign: { campus_label: null, campus_address: null }
          - if: '$state.campus_id != null'
            then:
              - do: record_get
                args: { entity: campus, record_id: '$state.campus_id' }
                bind: cmp
                outputs:
                  ok:        []
                  not_found: [{ assign: { state: '$merge($state, { campus_id: null })' } }]
                  failed:    []
              - if: '$cmp.fields != null'
                then:
                  # The address was declared AND seeded from the start, and no
                  # flow read it — a family was booked onto a campus visit and
                  # never told the street. Carried through to the confirmation
                  # and the T-24h reminder below.
                  - assign: { campus_label: '$cmp.fields.name', campus_address: '$cmp.fields.address' }
        progress: '$lines($compact([
                     $t("book-tour.progress.header"),
                     $campus_label != null ? $t("book-tour.progress.campus", { campus: $campus_label }) : null,
                     $state.slot_label != null ? $t("book-tour.progress.slot", { slot: $state.slot_label }) : null
                   ]), "\n")'
        gap_instructions: 'Ask the guardian for the next detail ({$collect_field}) in one short line, in Egyptian Arabic. Re-call book-tour once they answer.'
        fields:
          - field: campus_id
            when: '$state.campus_id == null'
            label: '$t("book-tour.label.campus")'
            options:
              header: book-tour.field_header.campus
              cta:    book-tour.field_cta.campus
              fetch:  { do: record_list, args: { entity: campus, all: true, limit: 10 }, bind: camps }
              rows:   '$camps.rows'
              map:
                value:       '$item.id'
                label:       '$item.fields.name'
                description: '$item.fields.area'
                selection:   { campus_label: '$item.fields.name', campus_address: '$item.fields.address' }
              auto_resolve: true
          - field: slot_start
            label: '$t("book-tour.label.slot")'
            options:
              header: book-tour.field_header.slot
              cta:    book-tour.field_cta.slot
              fetch:  { do: slot_list, args: { resource_record_id: '$state.campus_id' }, bind: slots }
              rows:   '$slots'
              map:
                value:       '$item.slot_start'
                label:       '$lines($compact([$item.local_date, $item.local_time]), " — ")'
                description: '$t("book-tour.places_left", { remaining: $item.remaining })'
                selection:
                  slot_minutes: '$item.slot_minutes'
                  slot_label:   '$lines($compact([$item.local_date, $item.local_time]), " — ")'
          - field: guardian_name
            label:    '$t("book-tour.label.guardian")'
            describe: "The guardian's name for the visitor list."
          - field: party_size
            label: '$t("book-tour.label.party")'
            options:
              header: book-tour.field_header.party
              cta:    book-tour.field_cta.party
              items:
                - { value: '1', label: book-tour.party.one }
                - { value: '2', label: book-tour.party.two }
                - { value: '3', label: book-tour.party.three }
        complete: [{ goto: confirm }]

  confirm:
    - use: approve_apply
      with:
        preview: '$lines($compact([
                    $t("book-tour.preview.header"),
                    $t("book-tour.preview.campus", { campus: $coalesce($campus_label, $state.campus_label, "-") }),
                    $t("book-tour.preview.slot", { slot: $coalesce($state.slot_label, "-") }),
                    $t("book-tour.preview.party", { party: $coalesce($state.party_size, "1") })
                  ]), "\n")'
        header:        '{$t("book-tour.approve_header")}'
        footer:        '{$t("book-tour.approve_footer")}'
        confirm_title: '{$t("book-tour.confirm_title")}'
        cancel_title:  '{$t("book-tour.cancel_title")}'
        apply:         reserve_place
        abort:         aborted
        on_other:      gather
        memory_note:   'Tour NOT booked yet — awaiting the guardian''s ✅.'

  reserve_place:
    - do: booking_reserve
      args:
        resource_record_id: '$state.campus_id'
        slot_start:         '$state.slot_start'
        slot_minutes:       '$state.slot_minutes'
        fields:
          campus_label:  '$coalesce($campus_label, $state.campus_label)'
          slot_label:    '$state.slot_label'
          guardian_name: '$state.guardian_name'
          party_size:    '$state.party_size'
      bind: tour
      outputs:
        ok:           [{ goto: advance_funnel }]
        full:         [{ goto: tour_full }]
        invalid_slot: [{ goto: tour_full }]
        failed:       [{ end: failed }]

  # Advance the guardian's EXISTING application if they have one, else create the enquiry
  # so the tour is still attributable. Either way exactly one record reaches `tour_booked`.
  advance_funnel:
    - if: '$state.application_id != null'
      then:
        - do: record_save
          args:
            entity:    application
            record_id: '$state.application_id'
            stage:     tour_booked
          bind: app
          outputs:
            ok:      []
            invalid: []
            failed:  []
      else:
        - do: record_save
          args:
            entity: application
            stage:  tour_booked
            fields:
              guardian_name: '$state.guardian_name'
              notes:         '$t("book-tour.enquiry_note", { campus: $coalesce($campus_label, "-"), slot: $coalesce($state.slot_label, "-") })'
          bind: app
          outputs:
            ok:      []
            invalid: []
            failed:  []
    - goto: fire_milestone

  fire_milestone:
    - if: '$app.record_id != null'
      then:
        # The tour is the strongest enrolment predictor — hence a milestone, fired once,
        # at the moment the place is actually held.
        - do: record_milestone
          args: { record_id: '$app.record_id', milestone: tour_booked }
          detach: true
    - goto: remind

  remind:
    - if: '$length($coalesce($tour.reminders, [])) > 0'
      then:
        - do: schedule_notify
          args:
            to:          { contact_id: '$contact.id' }
            send_at:     '$tour.reminders[0].send_at'
            dedupe_key:  'nile:tour:{$tour.record_id}:t24'
            memory_note: 'Campus tour reminder (t24)'
            intent:
              render_intent: detail_card
              body: '$lines($compact([
                       $t("book-tour.reminder.body", { campus: $coalesce($campus_label, ""), slot: $coalesce($state.slot_label, "") }),
                       $campus_address != null ? $t("book-tour.done_address", { address: $campus_address }) : null
                     ]), "\n")'
              buttons:
                - { title: '{$t("book-tour.reminder.progs")}', on_select: { invoke: programmes } }
          detach: true
    - render:
        render_intent: detail_card
        header: '{$t("book-tour.done_header")}'
        body: '$lines($compact([
                 $t("book-tour.done_body", { campus: $coalesce($campus_label, ""), slot: $coalesce($state.slot_label, "") }),
                 $campus_address != null ? $t("book-tour.done_address", { address: $campus_address }) : null,
                 $t("book-tour.done_ref", { ref: $tour.record_number }),
                 $t("book-tour.done_bring")
               ]), "\n")'
        buttons:
          - { title: '{$t("book-tour.btn_apply")}', on_select: { invoke: apply } }
          - { title: '{$t("book-tour.btn_progs")}', on_select: { invoke: programmes } }
      memory_note: 'Booked campus tour #{$tour.record_number} and fired the `tour_booked` milestone.'
    - end: applied

  tour_full:
    - render:
        render_intent: text_card
        body: '{$t("book-tour.full")}'
      memory_note: 'That tour slot filled before the guardian confirmed — offered another.'
    - end: aborted

  aborted:
    - end: { status: aborted, body: '{$t("book-tour.aborted")}' }
