flow_id: apply

strings:
  # The flow's OWN vision prompt — it knows which document it is looking at, where a pack-wide
  # image prompt has to serve every picture a customer might send. English, because it instructs
  # the model rather than speaking to the customer — so it is byte-identical to the Arabic file
  # rather than translated.
  vision_prompt: >-
    A photograph of a school document a guardian sent — a birth certificate, a report card or a transfer letter. Reply as JSON: {"student_name":"as printed, else null","previous_school":"school name as printed, else null",
    "school_year":"the grade or year as printed, else null"}.
    Copy characters exactly — never correct, complete or reformat a value, and never infer one
    that is not visible.
  progress.header:     '📝 Admission application'
  progress.programme:  '📚 Programme: {programme}'
  progress.student:    '🧒 Student: {student}'

  label.programme:  'Programme'
  label.student:    "Student's name"
  label.entry_year: 'Year applying for'
  label.guardian:   "Guardian's name"
  label.phone:      "Guardian's phone number"
  label.previous:   'Previous school'

  field_header.programme:  '📚 Which programme?'
  field_cta.programme:     'Programmes'
  field_header.entry_year: '📖 Which year?'
  field_cta.entry_year:    'Years'

  year.kg1:  'Kindergarten 1 (KG1)'
  year.kg2:  'Kindergarten 2 (KG2)'
  year.y1:   'Year 1'
  year.y3:   'Year 3'
  year.y5:   'Year 5'
  year.y7:   'Year 7'
  year.y9:   'Year 9'

  created_header:      '✅ Your application has been created'
  created_ref:         '🧾 Application number: #{ref}'
  created_programme:   '📚 Programme: {programme}'
  created_docs:        '📎 Send a photo of the birth certificate and the latest report card to complete the file.'
  created_no_promise:  'ℹ️ Admission is decided by the admissions team after the interview and assessment — the application is still being completed.'
  created_footer:      'Any update on the application will reach you here.'
  btn_tour:            '🏫 Book a visit'
  btn_progs:           '📚 Programmes'
