# nile-academy — pack-wide English strings.
# `stage.*` / `stage_hint.*` are the admissions funnel, resolved via `$enum_label`.
# `status.*` covers the `booking` system entity (campus tours).
# The key after the dot is a declared id, not prose — byte-identical to `locale.ar.yaml`;
# only the value is translated.
