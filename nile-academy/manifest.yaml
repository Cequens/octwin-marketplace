# nile-academy — a private academy in Cairo taking admissions on WhatsApp.
#
# Demonstrates MILESTONES as the thing an admissions office actually manages. A long
# funnel (enquiry → tour → application → assessment → offer → enrolled) is useless as a
# list of stages; what a registrar needs is "how many reached assessment this intake, and
# where do we lose them". Each money moment is a declared `milestone:` and the flows fire
# `record_milestone` when it really happens — so the console funnel and the completion
# rates are real, with no reporting code. Campus tours ride the scheduling engine.

id:          nile-academy
version: 1.8.0
description: 'Private academy admissions — programmes and fees, campus-tour booking, and an application funnel with real milestones from enquiry to enrolment.'

listing:
  title:    'Nile Academy'
  tagline:  'Admissions from enquiry to enrolment, with a funnel that is real'
  category: education
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'Nile Academy'
  avatar: widget/avatar.png
  accent: '#3730a3'   # matches the avatar's gradient
  about:  'Ask about programmes, apply, and follow your application.'

supported_channels: [whatsapp, web]
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

flows:
  - home
  - programmes
  - book-tour
  - apply

# NO `inbound_preprocessing.image`, deliberately.
#
# It read this pack's document fields and handed them to the AGENT to relay into tool arguments.
# When the relay did not happen the customer was asked to type what the picture already showed —
# and the values reached a record only as well as a language model retyped them.
#
# `apply`'s `read_doc` step reads the document itself, before the collect node runs. It also only
# ever fired on an inbound MESSAGE, so a document sent inside a native WhatsApp form was never read.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Egyptian Arabic private-school admissions voice note — the programme, the child grade or year, fees, campus tour booking.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                admissions
    display_name:      'Nile Academy Admissions'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - programmes
      - book-tour
      - apply
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
