# XRM declaration for smile-dental.
#
#  • `treatment` — the price list (reference, no pipeline ⇒ always listable).
#  • `dentist`   — the bookable resource (see scheduling.yaml). `rating` is a
#                  ROLLUP written back from the post-visit survey, and the picker
#                  ranks on it (`search.rank_by`), so patient feedback really
#                  changes what the next patient is offered.
#  • `booking`   — the visit, widened from the platform system entity.
#  • `survey_response` — widened with the rated `dentist`, the rollup dimension.

entities:
  treatment:
    label: { en: 'Treatment', ar: 'إجراء' }
    icon:        '🦷'
    description: { en: 'A dental treatment, its duration and starting price', ar: 'علاج أسنان ومدته وسعره المبدئي' }
    fields:
      code:        { type: text, required: true, unique: true, label: { en: 'Code', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      category:    { type: select, options: [preventive, restorative, cosmetic, orthodontic, surgical], label: { en: 'Category', ar: 'التصنيف' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      duration_min: { type: number, label: { en: 'Duration (min)', ar: 'المدة (دقيقة)' }, sortable: true }
      price_from:  { type: money, label: { en: 'From', ar: 'يبدأ من' }, sortable: true, currency: AED }
      insured:     { type: boolean, label: { en: 'Usually covered', ar: 'يغطيه التأمين عادةً' } }
    list: [category, duration_min, price_from]
    search: { text: [name, description], semantic: [name, description] }

  dentist:
    label: { en: 'Dentist', ar: 'طبيب أسنان' }
    icon:        '👨‍⚕️'
    description: { en: 'A dentist patients book with, ranked by rating', ar: 'طبيب أسنان يحجز معه المرضى ومرتب بتقييمه' }
    fields:
      name:         { type: text, required: true, unique: true, label: { en: 'Name', ar: 'الاسم' } }
      title:        { type: text, label: { en: 'Title', ar: 'اللقب' } }
      specialty:    { type: select, options: [general, orthodontics, periodontics, endodontics, pediatric, cosmetic], label: { en: 'Specialty', ar: 'التخصص' } }
      languages:    { type: text, label: { en: 'Languages', ar: 'اللغات' } }
      bio:          { type: textarea, label: { en: 'Bio', ar: 'نبذة' } }
      photo:        { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      timezone:     { type: text, label: { en: 'Timezone', ar: 'المنطقة الزمنية' }, default: 'Asia/Dubai' }
      # Written back by the survey rollup — never typed by hand.
      rating:       { type: number, label: { en: 'Rating', ar: 'التقييم' }, default: 0, sortable: true, description: { en: 'Computed from patient survey responses — it ranks the dentist picker.', ar: 'محسوب من تقييمات المرضى — وهو ما يرتب قائمة الأطباء.' } }
      rating_count: { type: number, label: { en: 'Ratings', ar: 'عدد التقييمات' }, default: 0, description: { en: 'How many responses the rating averages.', ar: 'عدد التقييمات التي بُني عليها المتوسط.' } }
    list: [title, specialty, rating]
    search: { text: [name, languages], rank_by: rating }

  booking:
    extends: system
    label: { en: 'Visit', ar: 'زيارة' }
    icon:        '🦷'
    description: { en: 'A patient visit with a dentist for a treatment', ar: 'زيارة مريض لطبيب أسنان لعلاج محدد' }
    fields:
      treatment:       { type: record, entity: treatment, label: { en: 'Treatment', ar: 'الإجراء' } }
      dentist:         { type: record, entity: dentist, label: { en: 'Dentist', ar: 'الطبيب' } }
      treatment_label: { type: text, label: { en: 'Treatment', ar: 'الإجراء' } }
      dentist_label:   { type: text, label: { en: 'Dentist', ar: 'الطبيب' } }
      slot_label:      { type: text, label: { en: 'Slot', ar: 'الموعد' } }
      complaint:       { type: textarea, label: { en: 'Complaint', ar: 'الشكوى' } }
      insurer:         { type: text, label: { en: 'Insurer', ar: 'شركة التأمين' } }
      member_id:       { type: text, label: { en: 'Member id', ar: 'رقم العضوية' } }
      # An expired card is the common billing failure, and it is printed on the card.
      valid_until:     { type: date, label: { en: 'Insurance valid until', ar: 'التأمين سارٍ حتى' } }

  # The rated dentist cannot be derived from a response alone (the subject is the
  # BOOKING), so my-visits stamps it right after submitting. That single field is
  # what makes the per-dentist average computable.
  survey_response:
    extends: system
    label:       { en: 'Visit feedback', ar: 'تقييم الزيارة' }
    icon:        '⭐'
    description: { en: 'A patient rating of the dentist after a visit — it feeds the rating that ranks the dentist picker', ar: 'تقييم المريض لطبيب الأسنان بعد الزيارة — ويغذّي التقييم الذي يرتب قائمة الأطباء' }
    fields:
      dentist: { type: record, entity: dentist, label: { en: 'Dentist', ar: 'الطبيب' } }
    list: [survey_key, score, dentist]

segments:
  upcoming_visits:
    entity: booking
    label: { en: 'Upcoming', ar: 'الزيارات القادمة' }
    where: { all: [{ active: true }] }

demo:
