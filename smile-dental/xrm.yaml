  - entity: treatment
    fields: { code: 'FILL', name: 'حشو تجميلي (كومبوزيت)', category: restorative, description: 'حشو أبيض بلون السن لعلاج التسوس. Tooth-coloured composite filling.', duration_min: 45, price_from: 450, insured: true }
