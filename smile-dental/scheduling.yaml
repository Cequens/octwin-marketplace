# Scheduling declaration — dentists become bookable resources. Availability rules,
# the race-free capacity ledger and slot expansion are the platform's; a visit is
# the `booking` XRM system entity. No pack DB.
#
# Chairs are single-capacity, so every rule sets `capacity: 1` — two patients can never be
# handed the same slot even if they tap at the same instant.

timezone: Asia/Dubai

resources:
  dentist:
    slot: { default_minutes: 30, window_days: 14 }
    # Reminders before slot_start (seconds). Each declares its card, so the PLATFORM
    # sends it, writes it again for the new time on every move, and cancels it when
    # the visit ends — whoever moves or cancels it (the chat, reception in the
    # console). The button opens the patient's own appointments.
    reminders:
      - key: t24
        seconds: 86400
        render:
          render_intent: detail_card
          body:
            en: '⏰ A reminder of your appointment with {{ resource }} — {{ time }}.'
            ar: '⏰ تذكير بموعدك مع {{ resource }} — {{ time }}.'
          buttons:
            - { title: { en: '📋 My appointments', ar: '📋 مواعيدي' }, on_select: { invoke: my-visits } }
      - key: t2
        seconds: 7200
        render:
          render_intent: detail_card
          body:
            en: '⏰ A reminder of your appointment with {{ resource }} — {{ time }}.'
            ar: '⏰ تذكير بموعدك مع {{ resource }} — {{ time }}.'
          buttons:
            - { title: { en: '📋 My appointments', ar: '📋 مواعيدي' }, on_select: { invoke: my-visits } }

booking:
  entity: booking

demo:
  availability:
    - resource_match: { entity: dentist, field: name, value: 'د. ليلى منصور' }
      rules:
        - { dow: 0, start: '10:00', end: '18:00', slot_minutes: 30, capacity: 1 }
        - { dow: 1, start: '10:00', end: '18:00', slot_minutes: 30, capacity: 1 }
        - { dow: 3, start: '14:00', end: '20:00', slot_minutes: 30, capacity: 1 }
    - resource_match: { entity: dentist, field: name, value: 'د. عمر الحداد' }
      rules:
        - { dow: 1, start: '09:00', end: '15:00', slot_minutes: 45, capacity: 1 }
        - { dow: 2, start: '09:00', end: '15:00', slot_minutes: 45, capacity: 1 }
        - { dow: 4, start: '09:00', end: '13:00', slot_minutes: 45, capacity: 1 }
    - resource_match: { entity: dentist, field: name, value: 'د. ريما القاسم' }
      rules:
        - { dow: 0, start: '09:00', end: '14:00', slot_minutes: 30, capacity: 1 }
        - { dow: 2, start: '09:00', end: '14:00', slot_minutes: 30, capacity: 1 }
        - { dow: 6, start: '10:00', end: '15:00', slot_minutes: 30, capacity: 1 }
    - resource_match: { entity: dentist, field: name, value: 'د. سامي درويش' }
      rules:
        - { dow: 3, start: '16:00', end: '21:00', slot_minutes: 60, capacity: 1 }
        - { dow: 5, start: '16:00', end: '21:00', slot_minutes: 60, capacity: 1 }
