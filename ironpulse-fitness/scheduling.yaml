# Scheduling declaration — the interesting part of this pack.
#
# A class is NOT a one-to-one appointment: it is many seats in one slot. So each
# availability rule below carries a `capacity:` — the class's real room size — instead
# of leaning on the one-booking-per-slot default. The platform's slot ledger then does
# the thing a spreadsheet cannot: twenty people can hold the same 07:00 spin slot, the
# twenty-first gets the `full` port, and two simultaneous taps for the last mat cannot
# both win.
#
# Each rule's `capacity:` must equal the `seats` on the matching class in xrm.yaml —
# that field is what the timetable card advertises, and nothing reconciles the two.

timezone: Asia/Dubai

resources:
  trainer:
    slot: { default_minutes: 45, window_days: 14 }
    # Reminders before slot_start (seconds). Each declares its card, so the PLATFORM
    # sends it, writes it again for the new time on every move, and cancels it when
    # the booking ends — whoever moves or cancels it (the chat, the front desk in the
    # console). The button opens the member's own classes.
    reminders:
      - key: t24
        seconds: 86400
        render:
          render_intent: detail_card
          body:
            en: '⏰ Reminder: {{ record.fields.class_label }} — {{ time }}. Do not forget your kit and water!'
            ar: '⏰ تذكير: حصة {{ record.fields.class_label }} — {{ time }}. لا تنسَ ملابس التمرين والماء!'
          buttons:
            - { title: { en: '🗓️ My classes', ar: '🗓️ حصصي' }, on_select: { invoke: my-schedule } }
      - key: t2
        seconds: 7200
        render:
          render_intent: detail_card
          body:
            en: '⏰ Reminder: {{ record.fields.class_label }} — {{ time }}. Do not forget your kit and water!'
            ar: '⏰ تذكير: حصة {{ record.fields.class_label }} — {{ time }}. لا تنسَ ملابس التمرين والماء!'
          buttons:
            - { title: { en: '🗓️ My classes', ar: '🗓️ حصصي' }, on_select: { invoke: my-schedule } }

booking:
  entity: booking

demo:
  availability:
    - resource_match: { entity: trainer, field: name, value: 'كوتش عمر' }
      rules:
        - { dow: 0, start: '06:00', end: '09:00', slot_minutes: 45, capacity: 20 }
        - { dow: 2, start: '06:00', end: '09:00', slot_minutes: 45, capacity: 20 }
        - { dow: 4, start: '18:00', end: '21:00', slot_minutes: 45, capacity: 20 }
    - resource_match: { entity: trainer, field: name, value: 'كوتش نور' }
      rules:
        - { dow: 1, start: '07:00', end: '10:00', slot_minutes: 60, capacity: 18 }
        - { dow: 3, start: '18:00', end: '20:00', slot_minutes: 60, capacity: 18 }
        - { dow: 6, start: '09:00', end: '12:00', slot_minutes: 60, capacity: 18 }
    - resource_match: { entity: trainer, field: name, value: 'كوتش ياسر' }
      rules:
        - { dow: 0, start: '18:00', end: '21:00', slot_minutes: 30, capacity: 16 }
        - { dow: 2, start: '18:00', end: '21:00', slot_minutes: 30, capacity: 16 }
        - { dow: 5, start: '08:00', end: '11:00', slot_minutes: 30, capacity: 16 }
    - resource_match: { entity: trainer, field: name, value: 'كوتش دانا' }
      rules:
        - { dow: 1, start: '17:00', end: '20:00', slot_minutes: 60, capacity: 10 }
        - { dow: 3, start: '07:00', end: '10:00', slot_minutes: 60, capacity: 10 }
    # BOX50 — 50 minutes, 12 seats (xrm.yaml `seats: 12`).
    - resource_match: { entity: trainer, field: name, value: 'كوتش خالد' }
      rules:
        - { dow: 2, start: '19:00', end: '21:30', slot_minutes: 50, capacity: 12 }
        - { dow: 4, start: '07:00', end: '09:30', slot_minutes: 50, capacity: 12 }
        - { dow: 6, start: '17:00', end: '19:30', slot_minutes: 50, capacity: 12 }
