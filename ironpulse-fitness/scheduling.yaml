# Scheduling declaration — the interesting part of this pack.
#
# A class is NOT a one-to-one appointment: it is many seats in one slot. So the
# each availability rule sets the class's
# real room capacity. The platform's slot ledger then does the thing a spreadsheet
# cannot: twenty people can hold the same 07:00 spin slot, the twenty-first gets the
# `full` port, and two simultaneous taps for the last mat cannot both win.

timezone: Asia/Dubai

resources:
  trainer:
    slot: { default_minutes: 45, window_days: 14 }
    reminders:
      - { key: t24, seconds: 86400 }
      - { key: t2,  seconds: 7200 }

booking:
  entity: booking

demo:
  availability:
    - resource_match: { entity: trainer, field: name, value: 'كوتش عمر' }
      rules:
        - { dow: 0, start: '06:00', end: '09:00', slot_minutes: 45, capacity: 20 }
        - { dow: 2, start: '06:00', end: '09:00', slot_minutes: 45, capacity: 20 }
        - { dow: 4, start: '18:00', end: '21:00', slot_minutes: 45, capacity: 20 }
    - resource_match: { entity: trainer, field: name, value: 'كوتش نور' }
      rules:
        - { dow: 1, start: '07:00', end: '10:00', slot_minutes: 60, capacity: 18 }
        - { dow: 3, start: '18:00', end: '20:00', slot_minutes: 60, capacity: 18 }
        - { dow: 6, start: '09:00', end: '12:00', slot_minutes: 60, capacity: 18 }
    - resource_match: { entity: trainer, field: name, value: 'كوتش ياسر' }
      rules:
        - { dow: 0, start: '18:00', end: '21:00', slot_minutes: 30, capacity: 16 }
        - { dow: 2, start: '18:00', end: '21:00', slot_minutes: 30, capacity: 16 }
        - { dow: 5, start: '08:00', end: '11:00', slot_minutes: 30, capacity: 16 }
    - resource_match: { entity: trainer, field: name, value: 'كوتش دانا' }
      rules:
        - { dow: 1, start: '17:00', end: '20:00', slot_minutes: 60, capacity: 10 }
        - { dow: 3, start: '07:00', end: '10:00', slot_minutes: 60, capacity: 10 }
