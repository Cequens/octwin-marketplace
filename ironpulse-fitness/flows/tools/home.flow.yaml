# home — the front door. Counts booked classes so a member lands on their timetable.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this member.'

entry:
  - else: true
    goto: count

steps:
  count:
    - do: record_aggregate
      args: { entity: booking, op: count, active_only: true }
      bind: booked
      outputs:
        ok:     [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign: { upcoming: '$coalesce($booked.value, 0)' }
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $upcoming > 0 ? $t("home.upcoming", { count: $upcoming }) : null
               ]), "\n")'
        cta: '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_classes")}',    description: '{$t("home.row_classes_d")}',    on_select: { invoke: classes } }
          - { title: '{$t("home.row_book")}',       description: '{$t("home.row_book_d")}',       on_select: { invoke: book-class } }
          - { title: '{$t("home.row_membership")}', description: '{$t("home.row_membership_d")}', on_select: { invoke: membership } }
          - { title: '{$t("home.row_schedule")}',   description: '{$t("home.row_schedule_d")}',   on_select: { invoke: my-schedule } }
      memory_note: 'Showed the IronPulse menu ({$upcoming} booked class(es)).'
    - end: applied
