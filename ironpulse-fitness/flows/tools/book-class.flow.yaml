# book-class — class → trainer → a slot with real remaining seats → confirm → reserve.
#
# The `full` port is the whole point of this pack. A class slot holds many seats, so
# the interesting failure is not "the diary is busy" but "the last mat went while you
# were reading" — and the platform's conditional upsert is what makes that safe rather
# than overselling. The slot label shows the remaining count so the member can see it
# closing.

flow_id:     book-class
version:     1
description: |-
  [interactive] Book a seat in a class. Call when the member wants to attend. Pass
  `class_id` when they tapped a class card and `is_trial: true` when this is a first
  free session. The tool asks for whatever is missing.

input:
  class_id:
    type:     string
    optional: true
    describe: 'Class (session_type) record id from a classes card — never a typed name.'
  is_trial:
    type:     boolean
    optional: true
    describe: 'True when this is a free trial session for a prospective member.'
  plan_id:
    type:     string
    optional: true
    describe: 'Plan record id from a membership plan row — the plan that prompted this trial. Never a typed name.'

entry:
  # A class tapped on the timetable arrives with its id, and the trainer picker below
  # filters `specialty eq <that class's discipline>`. If the club has no coach for that
  # discipline the picker has nothing to offer and the member is stuck at a field the
  # agent cannot fill in words (a typed coach name is not an id — platform KB,
  # craft-flows "Decide what an EMPTY picker means"). Check first, say so plainly.
  - if:   '$input.class_id != null'
    goto: check_coach
  - else: true
    goto: collect_fields

steps:
  check_coach:
    - do: record_get
      args: { entity: session_type, record_id: '$state.class_id' }
      bind: cls0
      outputs:
        ok:        []
        # A dead id — let the class picker re-ask rather than dead-ending here.
        not_found: [{ goto: collect_fields }]
        failed:    [{ goto: collect_fields }]
    - do: record_search
      args: { entity: trainer, query: '', limit: 1, where: { all: [{ field: specialty, op: eq, value: '$cls0.fields.discipline' }] } }
      bind: coaches
      outputs:
        ok:     [{ goto: collect_fields }]
        empty:  [{ goto: no_coach }]
        # Never block a booking on a failed lookup — the picker gets the same chance.
        failed: [{ goto: collect_fields }]

  no_coach:
    - render:
        render_intent: detail_card
        header: '{$t("book-class.no_coach_header")}'
        body:   '{$t("book-class.no_coach_body", { class: $coalesce($cls0.fields.name, "-") })}'
        buttons:
          - { title: '{$t("book-class.btn_classes")}', on_select: { invoke: classes } }
      memory_note: 'No coach teaches {$coalesce($cls0.fields.name, "-")} — offered the rest of the timetable.'
    - end: aborted

  collect_fields:
    - collect:
        before_each:
          - assign: { class_label: null, class_discipline: null, trainer_label: null, plan_label: null }
          - if: '$state.class_id != null'
            then:
              - do: record_get
                args: { entity: session_type, record_id: '$state.class_id' }
                bind: cls
                outputs:
                  ok:        []
                  not_found: [{ assign: { state: '$merge($state, { class_id: null })' } }]
                  failed:    []
              - if: '$cls.fields != null'
                then:
                  - assign:
                      class_label:      '$cls.fields.name'
                      class_discipline: '$cls.fields.discipline'
          - if: '$state.trainer_id != null'
            then:
              - do: record_get
                args: { entity: trainer, record_id: '$state.trainer_id' }
                bind: tr
                outputs:
                  ok:        []
                  # A dead trainer id would call slot_list on nothing — drop it.
                  not_found: [{ assign: { state: '$merge($state, { trainer_id: null })' } }]
                  failed:    []
              - if: '$tr.fields != null'
                then:
                  - assign: { trainer_label: '$tr.fields.name' }
          # The plan row ships its id only — a tap id carries identifiers, not display
          # strings (BACKLOG.md, the 200-code-point list-row cap). Re-read the name so
          # the preview can name the plan and `after_booking` can file it on the lead.
          - if: '$state.plan_id != null'
            then:
              - do: record_get
                args: { entity: plan, record_id: '$state.plan_id' }
                bind: pl
                outputs:
                  ok:        []
                  not_found: [{ assign: { state: '$merge($state, { plan_id: null })' } }]
                  failed:    []
              - if: '$pl.fields != null'
                then:
                  - assign: { plan_label: '$pl.fields.name' }
        progress: '$lines($compact([
                     $t("book-class.progress.header"),
                     $class_label != null ? $t("book-class.progress.class", { class: $class_label }) : null,
                     $trainer_label != null ? $t("book-class.progress.trainer", { trainer: $trainer_label }) : null,
                     $state.slot_label != null ? $t("book-class.progress.slot", { slot: $state.slot_label }) : null
                   ]), "\n")'
        gap_instructions: 'Ask the member for the next missing detail ({$collect_field}), one at a time, in their language. Re-call book-class once they answer. Never give training or medical advice.'
        fields:
          - field: class_id
            when: '$state.class_id == null'
            label: '$t("book-class.label.class")'
            options:
              header: book-class.field_header.class
              cta:    book-class.field_cta.class
              fetch:  { do: record_search, args: { entity: session_type, query: '', limit: 10 }, bind: cs }
              rows:   '$cs.rows'
              map:
                value:       '$item.id'
                label:       '$item.fields.name'
                description: '$t("book-class.duration", { mins: $item.fields.duration_min })'
                selection:   { class_label: '$item.fields.name', class_discipline: '$item.fields.discipline' }
              auto_resolve: true
          # Only trainers who teach this discipline are offered — a yoga instructor
          # never appears for a boxing class.
          - field: trainer_id
            when: '$state.trainer_id == null'
            label: '$t("book-class.label.trainer")'
            options:
              header: book-class.field_header.trainer
              cta:    book-class.field_cta.trainer
              fetch:  { do: record_search, args: { entity: trainer, query: '', limit: 10, where: { all: [{ field: specialty, op: eq, value: '$class_discipline' }] } }, bind: ts }
              rows:   '$ts.rows'
              map:
                value:       '$item.id'
                label:       '$item.fields.name'
                description: '$item.fields.bio'
                selection:   { trainer_label: '$item.fields.name' }
              auto_resolve: true
          # The label carries the REMAINING seat count straight off the engine's slot
          # row, so a member can see a class filling up.
          - field: slot_start
            label: '$t("book-class.label.slot")'
            options:
              header: book-class.field_header.slot
              cta:    book-class.field_cta.slot
              fetch:  { do: slot_list, args: { resource_record_id: '$state.trainer_id' }, bind: slots }
              rows:   '$slots'
              map:
                value: '$item.slot_start'
                label: '$lines($compact([$item.local_date, $item.local_time]), " — ")'
                description: '$t("book-class.seats_left", { remaining: $item.remaining })'
                selection:
                  slot_minutes: '$item.slot_minutes'
                  slot_label:   '$lines($compact([$item.local_date, $item.local_time]), " — ")'
                  remaining:    '$item.remaining'
        complete: [{ goto: confirm }]

  confirm:
    - use: approve_apply
      with:
        preview: '$lines($compact([
                    $t("book-class.preview.header"),
                    $t("book-class.preview.class", { class: $coalesce($class_label, "-") }),
                    $t("book-class.preview.trainer", { trainer: $coalesce($trainer_label, "-") }),
                    $t("book-class.preview.slot", { slot: $coalesce($state.slot_label, "-") }),
                    $state.remaining != null ? $t("book-class.preview.remaining", { remaining: $state.remaining }) : null,
                    $state.is_trial == true ? $t("book-class.preview.trial") : null,
                    $plan_label != null ? $t("book-class.preview.plan", { plan: $plan_label }) : null
                  ]), "\n")'
        header:        '{$t("book-class.approve_header")}'
        footer:        '{$t("book-class.approve_footer")}'
        confirm_title: '{$t("book-class.confirm_title")}'
        cancel_title:  '{$t("book-class.cancel_title")}'
        apply:         commit
        abort:         aborted
        # Neither approve nor decline (a typed reply, an agent resume, a stale tap)
        # → re-enter THIS step: re-render the card and pause on a FRESH token.
        # It used to point at `collect_fields`, which looks like it lets the member
        # amend a field mid-preview but cannot: every field is guarded
        # `when: $state.x == null` and by now the bag is full, so collect completes
        # asking nothing, `goto: confirm` re-renders, and the card the member is
        # looking at is orphaned. Tap again → "انتهت صلاحيته", forever. Same shape as
        # `heshamrabea/flows/tools/book.flow.yaml` and `clinic`'s confirm_cancel.
        on_other:      confirm
        memory_note:   'Seat NOT reserved yet — awaiting the member''s ✅.'

  commit:
    - do: booking_reserve
      args:
        resource_record_id: '$state.trainer_id'
        slot_start:         '$state.slot_start'
        slot_minutes:       '$state.slot_minutes'
        fields:
          session_type:  '$state.class_id'
          class_label:   '$class_label'
          trainer_label: '$trainer_label'
          slot_label:    '$state.slot_label'
          is_trial:      '$coalesce($state.is_trial, false)'
      bind: seat
      outputs:
        ok:           [{ goto: after_booking }]
        # The realistic failure for a class: the last seat went a second ago.
        full:         [{ goto: class_full }]
        invalid_slot: [{ goto: class_full }]
        failed:       [{ end: failed }]

  after_booking:
    # A trial booking is a sales event — advance the enquiry so the club can measure
    # trial-to-member conversion without anyone typing into a CRM.
    - if: '$state.is_trial == true'
      then:
        - do: record_save
          args:
            entity: member_lead
            stage:  trial_booked
            fields:
              plan:       '$state.plan_id'
              plan_label: '$plan_label'
              notes: '$t("book-class.trial_note", { class: $coalesce($class_label, "-"), slot: $coalesce($state.slot_label, "-") })'
          bind: lead
          outputs:
            ok:      []
            invalid: []
            failed:  []
    - goto: remind

  remind:
    # T-24h and T-2h. The offsets are declared in scheduling.yaml; the absolute
    # send_at comes back from the reservation, and dedupe_key makes a re-run safe.
    # Each block is guarded on ITS OWN index — the old single block tested
    # `> 0` and then read `[1]`, so a one-reminder resource passed the guard and
    # passed a null send_at, and t24 was never armed at all.
    #
    # `my-schedule`'s cancel_done revokes these two keys verbatim — the suffix comes
    # from the declaration (`t24`, `t2`), so both sides must move together.
    - if: '$length($coalesce($seat.reminders, [])) > 0'
      then:
        - do: schedule_notify
          args:
            to:          { contact_id: '$contact.id' }
            send_at:     '$seat.reminders[0].send_at'
            dedupe_key:  'ironpulse:class:{$seat.record_id}:{$seat.reminders[0].key}'
            memory_note: 'Class reminder ({$seat.reminders[0].key})'
            intent:
              render_intent: detail_card
              body: '{$t("book-class.reminder.body", { class: $coalesce($class_label, ""), slot: $coalesce($state.slot_label, "") })}'
              buttons:
                - { title: '{$t("book-class.reminder.mine")}', on_select: { invoke: my-schedule } }
          detach: true
    - if: '$length($coalesce($seat.reminders, [])) > 1'
      then:
        - do: schedule_notify
          args:
            to:          { contact_id: '$contact.id' }
            send_at:     '$seat.reminders[1].send_at'
            dedupe_key:  'ironpulse:class:{$seat.record_id}:{$seat.reminders[1].key}'
            memory_note: 'Class reminder ({$seat.reminders[1].key})'
            intent:
              render_intent: detail_card
              body: '{$t("book-class.reminder.body", { class: $coalesce($class_label, ""), slot: $coalesce($state.slot_label, "") })}'
              buttons:
                - { title: '{$t("book-class.reminder.mine")}', on_select: { invoke: my-schedule } }
          detach: true
    - render:
        render_intent: detail_card
        header: '{$t("book-class.done_header")}'
        body: '$lines($compact([
                 $t("book-class.done_body", { class: $coalesce($class_label, ""), trainer: $coalesce($trainer_label, ""), slot: $coalesce($state.slot_label, "") }),
                 $t("book-class.done_ref", { ref: $seat.record_number }),
                 $t("book-class.done_arrive")
               ]), "\n")'
        buttons:
          - { title: '{$t("book-class.btn_mine")}',    on_select: { invoke: my-schedule } }
          - { title: '{$t("book-class.btn_classes")}', on_select: { invoke: classes } }
      memory_note: 'Reserved a seat (#{$seat.record_number}) in {$class_label} with {$trainer_label} at {$state.slot_label}.'
      data: { booking_number: '$seat.record_number' }
    - end: applied

  class_full:
    - render:
        render_intent: detail_card
        header: '{$t("book-class.full_header")}'
        body:   '{$t("book-class.full_body")}'
        buttons:
          - { title: '{$t("book-class.btn_retry")}',   on_select: { invoke: book-class, with: { class_id: '$state.class_id' } } }
          - { title: '{$t("book-class.btn_classes")}', on_select: { invoke: classes } }
      memory_note: 'The class filled up before the member confirmed — offered another slot.'
    - end: aborted

  aborted:
    - end: { status: aborted, body: '{$t("book-class.aborted")}' }
