    fields: { code: 'HIIT30', name: 'هيت ٣٠ دقيقة', discipline: hiit, description: 'تمارين متقطعة عالية الشدة بوزن الجسم والأثقال الحرة. Bodyweight and free-weight high-intensity intervals.', intensity: advanced, duration_min: 30, seats: 16, popularity: 5, photo: 'generate:Photograph of a functional training studio during a HIIT class, athletes doing kettlebell swings on rubber flooring, industrial gym interior, bright daylight, photorealistic.' }
  - entity: session_type
