# XRM declaration for ironpulse-fitness.
#
#  • `session_type` — the class catalogue (spin, HIIT, yoga, …) with its seat count.
#  • `trainer`      — the BOOKABLE RESOURCE. A class slot's capacity is the number of
#                     mats in the room, so `scheduling.yaml` gives each trainer a
#                     multi-seat slot rather than the one-to-one default.
#  • `plan`         — membership tiers, a plain price list.
#  • `member_lead`  — the sales PIPELINE: enquiry → trial → member. This is what a
#                     club actually measures.

entities:
  session_type:
    label: { en: 'Class', ar: 'حصة' }
    icon:        '🏋️'
    description: { en: 'A class on the timetable and its capacity', ar: 'حصة ضمن الجدول وسعتها' }
    fields:
      code:        { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      discipline:  { type: select, options: [spin, hiit, yoga, boxing, strength, pilates], label: { en: 'Discipline', ar: 'النوع' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      intensity:   { type: select, options: [beginner, intermediate, advanced], label: { en: 'Intensity', ar: 'المستوى' } }
      duration_min: { type: number, label: { en: 'Duration (min)', ar: 'المدة (دقيقة)' } }
      seats:       { type: number, label: { en: 'Seats', ar: 'عدد المقاعد' }, default: 12, sortable: true, description: { en: 'Capacity per session. The scheduling engine stops booking once this many seats are taken.', ar: 'سعة الحصة. يتوقف محرك الحجز عند اكتمال هذا العدد.' } }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:  { type: number, label: { en: 'Popularity', ar: 'الأكثر حضوراً' }, default: 0, description: { en: 'Manual ordering weight for the class list — higher shows earlier.', ar: 'وزن ترتيب يدوي لقائمة الحصص — الأعلى يظهر أولاً.' } }
    list: [discipline, intensity, seats]
    search: { text: [name, description], semantic: [name, description], rank_by: popularity }
    dedupe_by: code

  trainer:
    label: { en: 'Trainer', ar: 'مدرب' }
    icon:        '💪'
    description: { en: 'A coach members book sessions with', ar: 'مدرب يحجز معه الأعضاء حصصهم' }
    fields:
      name:       { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      specialty:  { type: select, options: [spin, hiit, yoga, boxing, strength, pilates], label: { en: 'Specialty', ar: 'التخصص' } }
      bio:        { type: textarea, label: { en: 'Bio', ar: 'نبذة' } }
      languages:  { type: text, label: { en: 'Languages', ar: 'اللغات' } }
      photo:      { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      timezone:   { type: text, label: { en: 'Timezone', ar: 'المنطقة الزمنية' }, default: 'Asia/Dubai' }
      rating:     { type: number, label: { en: 'Rating', ar: 'التقييم' }, default: 0, sortable: true }
    list: [specialty, languages, rating]
    search: { text: [name, languages], rank_by: rating }
    dedupe_by: name

  plan:
    label: { en: 'Membership plan', ar: 'باقة عضوية' }
    icon:        '🎟️'
    description: { en: 'A membership term and what it includes', ar: 'مدة العضوية وما تشمله' }
    fields:
      code:      { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:      { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      months:    { type: number, label: { en: 'Months', ar: 'عدد الأشهر' }, sortable: true }
      price:     { type: money, label: { en: 'Price', ar: 'السعر' }, sortable: true, currency: AED }
      includes:  { type: textarea, label: { en: 'Includes', ar: 'يشمل' } }
      classes_included: { type: boolean, label: { en: 'Classes included', ar: 'يشمل الحصص' }, description: { en: 'Whether the membership price covers classes, or they are paid per session on top.', ar: 'هل يشمل سعر العضوية الحصص أم تُدفع لكل حصة على حدة.' } }
    list: [months, price, classes_included]
    dedupe_by: code

  member_lead:
    label: { en: 'Membership enquiry', ar: 'استفسار عضوية' }
    icon:        '🌟'
    description: { en: 'An enquiry, from first trial through to membership', ar: 'استفسار من الحصة التجريبية حتى العضوية' }
    fields:
      full_name:  { type: text, label: { en: 'Name', ar: 'الاسم' } }
      goal:       { type: select, options: [weight_loss, muscle_gain, endurance, general_fitness, rehab], label: { en: 'Goal', ar: 'الهدف' } }
      plan:       { type: record, entity: plan, label: { en: 'Plan', ar: 'الباقة' } }
      plan_label: { type: text, label: { en: 'Plan', ar: 'الباقة' } }
      experience: { type: select, options: [none, some, regular], label: { en: 'Experience', ar: 'الخبرة' }, description: { en: 'Training background — sets which sessions and intensities the member is offered.', ar: 'الخلفية التدريبية — وتحدد الحصص ومستويات الشدة التي تُعرض على العضو.' } }
      notes:      { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [full_name, goal, plan_label]
    pipeline:
      stages:   [enquiry, trial_booked, trial_attended, member, lapsed]
      initial:  enquiry
      terminal: [member, lapsed]
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      enquiry:        { en: 'Interested, no trial booked yet', ar: 'مهتم دون حجز حصة تجريبية' }
      trial_booked:   { en: 'A trial session is scheduled', ar: 'حُجزت حصة تجريبية' }
      trial_attended: { en: 'They came in; follow up on joining', ar: 'حضر التجريبية — تابع الاشتراك' }
      member:         { en: 'Joined on a paid plan', ar: 'اشترك في باقة مدفوعة' }
      lapsed:         { en: 'Membership ended and was not renewed', ar: 'انتهت العضوية ولم تُجدَّد' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      enquiry:        { en: 'Enquiry', ar: 'استفسار' }
      trial_booked:   { en: 'Trial booked', ar: 'حجز حصة تجريبية' }
      trial_attended: { en: 'Trial attended', ar: 'حضر التجريبية' }
      member:         { en: 'Member', ar: 'عضو 💪' }
      lapsed:         { en: 'Lapsed', ar: 'عضوية منتهية' }
    milestones:
      trial_booked: { label: { en: 'Trial booked', ar: 'حجز حصة تجريبية' }, stage: trial_booked }
      joined:       { label: { en: 'Joined', ar: 'انضم' },                   stage: member, terminal: true }

  booking:
    extends: system
    label: { en: 'Class booking', ar: 'حجز حصة' }
    fields:
      session_type:  { type: record, entity: session_type, label: { en: 'Class', ar: 'الحصة' } }
      class_label:   { type: text, label: { en: 'Class', ar: 'الحصة' } }
      trainer_label: { type: text, label: { en: 'Trainer', ar: 'المدرب' } }
      slot_label:    { type: text, label: { en: 'Slot', ar: 'الموعد' } }
      is_trial:      { type: boolean, label: { en: 'Trial session', ar: 'حصة تجريبية' } }

segments:
  live_leads:
    entity: member_lead
    label: { en: 'Open enquiries', ar: 'استفسارات مفتوحة' }
    where: { all: [{ active: true }] }

demo:
