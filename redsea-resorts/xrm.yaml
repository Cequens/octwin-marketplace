# XRM declaration for redsea-resorts.
#
#  • `resort`    — the properties (Hurghada, El Gouna, Marsa Alam …).
#  • `room_type`  — the BOOKABLE RESOURCE. Its slot capacity is the room COUNT, which is
#                  what makes overselling structurally impossible rather than a policy.
#  • `stay`      — the reservation pipeline the resort measures.

entities:
  resort:
    label: { en: 'Resort', ar: 'منتجع' }
    icon:        '🏖️'
    description: { en: 'A resort in the portfolio and its rating', ar: 'منتجع ضمن المجموعة وتصنيفه' }
    fields:
      name:        { type: text, required: true, unique: true, label: { en: 'Name', ar: 'الاسم' } }
      destination: { type: select, options: [hurghada, el_gouna, marsa_alam, sharm, dahab], label: { en: 'Destination', ar: 'الوجهة' } }
      stars:       { type: number, label: { en: 'Stars', ar: 'التصنيف' }, sortable: true }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      facilities:  { type: text, label: { en: 'Facilities', ar: 'المرافق' } }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      timezone:    { type: text, label: { en: 'Timezone', ar: 'المنطقة الزمنية' }, default: 'Africa/Cairo' }
    list: [destination, stars]
    search: { text: [name, facilities], semantic: [name, description] }

  room_type:
    label: { en: 'Room type', ar: 'نوع الغرفة' }
    icon:        '🛏️'
    description: { en: 'A room category and its nightly boards', ar: 'فئة غرفة وأسعار الليلة حسب نظام الإقامة' }
    fields:
      name:          { type: text, required: true, unique: true, label: { en: 'Name', ar: 'الاسم' } }
      resort:        { type: record, entity: resort, label: { en: 'Resort', ar: 'المنتجع' } }
      resort_label:  { type: text, label: { en: 'Resort', ar: 'المنتجع' } }
      view:          { type: select, options: [sea, pool, garden, lagoon], label: { en: 'View', ar: 'الإطلالة' } }
      max_adults:    { type: number, label: { en: 'Max adults', ar: 'أقصى عدد بالغين' } }
      # The inventory count — mirrored into scheduling.yaml as slot capacity.
      room_count:    { type: number, label: { en: 'Rooms of this type', ar: 'عدد الغرف' }, sortable: true }
      nightly_bb:    { type: money, label: { en: 'Per night (B&B)', ar: 'الليلة (إفطار)' }, sortable: true, currency: EGP }
      nightly_hb:    { type: money, label: { en: 'Per night (half board)', ar: 'الليلة (نصف إقامة)' }, currency: EGP }
      nightly_ai:    { type: money, label: { en: 'Per night (all inclusive)', ar: 'الليلة (شامل)' }, currency: EGP }
      photo:         { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:    { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [resort_label, view, room_count, nightly_bb]
    search: { text: [name, resort_label], semantic: [name], rank_by: popularity }

  stay:
    label: { en: 'Stay', ar: 'إقامة' }
    icon:        '🧳'
    description: { en: 'A guest stay, from deposit to check-out', ar: 'إقامة ضيف من العربون حتى المغادرة' }
    fields:
      guest_name:     { type: text, label: { en: 'Guest', ar: 'اسم الضيف' } }
      resort_label:   { type: text, label: { en: 'Resort', ar: 'المنتجع' } }
      room_label:     { type: text, label: { en: 'Room', ar: 'الغرفة' } }
      check_in_label: { type: text, label: { en: 'Check-in', ar: 'تاريخ الوصول' } }
      nights:         { type: number, label: { en: 'Nights', ar: 'عدد الليالي' }, sortable: true }
      adults:         { type: number, label: { en: 'Adults', ar: 'بالغون' } }
      children:       { type: number, label: { en: 'Children', ar: 'أطفال' } }
      board:          { type: select, options: [bb, hb, ai], label: { en: 'Board', ar: 'نظام الإقامة' } }
      total:          { type: money, label: { en: 'Total', ar: 'الإجمالي' }, sortable: true, currency: EGP }
      deposit:        { type: money, label: { en: 'Deposit', ar: 'العربون' }, currency: EGP }
      notes:          { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [resort_label, room_label, nights, total]
    pipeline:
      stages:   [held, confirmed, checked_in, completed, cancelled, no_show]
      initial:  held
      terminal: [completed, cancelled, no_show]
      outcomes: { completed: won, cancelled: lost, no_show: lost }
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      held:       { en: 'Provisional — the deposit is not in yet', ar: 'ℹ️ الغرفة محجوزة مبدئياً باسمك — التأكيد النهائي بعد وصول العربون.' }
      confirmed:  { en: 'Deposit received and the room is held', ar: 'ℹ️ حجزك مؤكَّد. في انتظارك 🌊' }
      checked_in: { en: 'The guest has arrived', ar: 'ℹ️ إقامتك جارية — تحت أمرك لأي طلب.' }
      completed:  { en: 'The stay finished', ar: 'ℹ️ شكراً لاختيارك منتجعاتنا 🌊' }
      cancelled:  { en: 'Cancelled before arrival', ar: 'ℹ️ هذا الحجز ملغى.' }
      no_show:    { en: 'The guest never arrived', ar: 'ℹ️ لم يتم الحضور في موعد الوصول.' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      held:       { en: 'Held (awaiting deposit)', ar: 'حجز مبدئي (بانتظار العربون)' }
      confirmed:  { en: 'Confirmed', ar: 'مؤكَّد ✅' }
      checked_in: { en: 'Checked in', ar: 'تم تسجيل الوصول' }
      completed:  { en: 'Completed', ar: 'انتهت الإقامة' }
      cancelled:  { en: 'Cancelled', ar: 'ملغى' }
      no_show:    { en: 'No show', ar: 'لم يتم الحضور' }
    milestones:
      stay_held:      { label: { en: 'Held', ar: 'حجز مبدئي' },   stage: held }
      stay_confirmed: { label: { en: 'Confirmed', ar: 'مؤكَّد' },   stage: confirmed }
      stay_completed: { label: { en: 'Completed', ar: 'تمت' },     stage: completed, terminal: true }

  booking:
    extends: system
    label: { en: 'Room night', ar: 'ليلة غرفة' }
    icon:        '🛏️'
    description: { en: 'A room night held by the scheduling engine against a stay', ar: 'ليلة غرفة يحجزها محرك المواعيد ضمن إقامة' }
    fields:
      room_label:   { type: text, label: { en: 'Room', ar: 'الغرفة' } }
      resort_label: { type: text, label: { en: 'Resort', ar: 'المنتجع' } }
      slot_label:   { type: text, label: { en: 'Arrival', ar: 'الوصول' } }
      guest_name:   { type: text, label: { en: 'Guest', ar: 'الضيف' } }

segments:
  live_stays:
    entity: stay
    label: { en: 'Live bookings', ar: 'حجوزات قائمة' }
    where: { all: [{ active: true }] }

demo:
