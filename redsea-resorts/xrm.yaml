  - entity: resort
    as: hurghada
    fields: { name: 'منتجع الغردقة ريف', destination: hurghada, stars: 4, description: 'منتجع عائلي على البحر مباشرة مع شعاب قريبة من الشاطئ. A family beachfront resort in Hurghada with reefs close to shore.', facilities: 'شاطئ رملي · مسبحان · أنشطة مائية · نادي أطفال', timezone: 'Africa/Cairo', photo: 'generate:Photograph of a family beach resort on the Red Sea in Hurghada, sandy beach with umbrellas, calm blue sea, low buildings behind, bright daylight, photorealistic.' }
  - entity: resort
    as: marsa
    fields: { name: 'مرسى علم إكو ريزورت', destination: marsa_alam, stars: 4, description: 'منتجع بيئي هادئ مناسب للغوص ومشاهدة السلاحف. A quiet eco-resort in Marsa Alam for diving and turtle spotting.', facilities: 'شاطئ شعاب · مركز غوص · مطعم بحري', timezone: 'Africa/Cairo', photo: 'generate:Photograph of a quiet eco resort on the Red Sea coast at Marsa Alam, timber walkways over coral shore, desert mountains behind, clear water, photorealistic.' }

