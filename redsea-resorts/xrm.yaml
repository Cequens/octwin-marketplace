  - entity: room_type
    fields: { name: 'سويت عائلي بإطلالة على البحيرة', resort: '@gouna', resort_label: 'منتجع الجونة لاجون', view: lagoon, max_adults: 4, room_count: 4, nightly_bb: 4200, nightly_hb: 4900, nightly_ai: 5800, popularity: 4, photo: 'generate:Photograph of a spacious family hotel suite with a separate living area and a balcony overlooking a calm lagoon, warm daylight, photorealistic.' }
  - entity: room_type
    fields: { name: 'غرفة مزدوجة بإطلالة على المسبح', resort: '@hurghada', resort_label: 'منتجع الغردقة ريف', view: pool, max_adults: 2, room_count: 14, nightly_bb: 1600, nightly_hb: 2000, nightly_ai: 2600, popularity: 5, photo: 'generate:Photograph of a comfortable double hotel room with a balcony overlooking a resort swimming pool, palm trees, bright daylight, photorealistic.' }
