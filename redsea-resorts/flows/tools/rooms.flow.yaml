# rooms — the room carousel. Board-basis rates are shown from the room record itself, so
# the guest compares real prices rather than a "from" figure the resort never honours.

flow_id:     rooms
version:     1
description: |-
  Show the rooms with their real nightly rates. Call when the guest asks what you have,
  asks a price, or names a destination or a view. Pass `destination` (hurghada, el_gouna,
  marsa_alam, sharm, dahab) or `view` (sea, pool, garden, lagoon) when they named one.

input:
  destination:
    type:     string
    optional: true
    describe: 'One of: hurghada, el_gouna, marsa_alam, sharm, dahab.'
  view:
    type:     string
    optional: true
    describe: 'One of: sea, pool, garden, lagoon.'

entry:
  - if:   '$input.destination != null'
    goto: resolve_dest
  - if:   '$input.view != null'
    goto: load_view
  - else: true
    goto: load_all

steps:
  # `destination` lives on the RESORT, not on the room — which is why this input
  # was declared, documented in the description, and then silently ignored by both
  # load paths. A guest asking for Dahab was shown every room in the country.
  # Resolve it to resort ids first, then filter rooms by the ref.
  resolve_dest:
    - do: record_list
      args:
        entity: resort
        all:    true
        limit:  25
        where:  { all: [{ field: destination, op: eq, value: '$input.destination' }] }
      bind: dest
      outputs:
        ok:    [{ goto: dest_ids }]
        empty: [{ goto: load_all }]      # unknown destination → show everything, never nothing

  dest_ids:
    - if: '$length($dest.rows) == 0'     # all:true returns ok+[] for 0 rows, not the empty port
      goto: load_all
    - assign:
        resort_ids: '$map($dest.rows, "id")'
    - if:   '$input.view != null'
      goto: load_dest_view
    - goto: load_dest

  load_dest:
    - do: record_search
      args:
        entity: room_type
        query:  ''
        limit:  10
        where:  { all: [{ field: resort, op: in, value: '$resort_ids' }] }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: load_all }]     # nothing in that destination → fall back rather than dead-end
        failed: [{ goto: unavailable }]

  load_dest_view:
    - do: record_search
      args:
        entity: room_type
        query:  ''
        limit:  10
        where:
          all:
            - { field: resort, op: in, value: '$resort_ids' }
            - { field: view,   op: eq, value: '$input.view' }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: load_dest }]    # that view isn't there → drop the view, keep the destination
        failed: [{ goto: unavailable }]

  load_all:
    - do: record_search
      args: { entity: room_type, query: '', limit: 10 }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: none }]
        failed: [{ goto: unavailable }]

  load_view:
    - do: record_search
      args:
        entity: room_type
        query:  ''
        limit:  10
        where:  { all: [{ field: view, op: eq, value: '$input.view' }] }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: load_all }]
        failed: [{ goto: unavailable }]

  show:
    - render:
        render_intent: carousel
        body:  '{$t("rooms.intro")}'
        items: '$page.rows'
        item_template:
          image_url: '$coalesce($item.fields.photo, "")'
          body: '$lines($compact([
                   $item.fields.name,
                   $item.fields.resort_label,
                   $t("rooms.from", { price: $format_money_field($item.fields.nightly_bb, "EGP") })
                 ]), "\n")'
          buttons:
            - { title: '{$t("rooms.btn_book")}', on_select: { invoke: book-stay, with: { room_id: '$item.id' } } }
      memory_note: 'Showed {$length($page.rows)} room type(s).'
    - end: applied

  none:
    - answer:
        instructions: 'No room matched. Say so in one line and offer the full list.'

  unavailable:
    - answer:
        instructions: 'The room list could not be read. Apologise in one line and offer to try again shortly. NEVER quote a rate from memory.'
