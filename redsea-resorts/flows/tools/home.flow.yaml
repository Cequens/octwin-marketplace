# home — the front door. Surfaces a live booking so a returning guest lands on their stay.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this guest.'

entry:
  - else: true
    goto: count

steps:
  count:
    - do: record_aggregate
      args: { entity: stay, op: count, active_only: true }
      bind: stays
      outputs:
        ok:     [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign: { live: '$coalesce($stays.value, 0)' }
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $live > 0 ? $t("home.live", { count: $live }) : null
               ]), "\n")'
        cta: '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_rooms")}', description: '{$t("home.row_rooms_d")}', on_select: { invoke: rooms } }
          - { title: '{$t("home.row_sea")}',   description: '{$t("home.row_sea_d")}',   on_select: { invoke: rooms, with: { view: sea } } }
          - { title: '{$t("home.row_book")}',  description: '{$t("home.row_book_d")}',  on_select: { invoke: book-stay } }
          - { title: '{$t("home.row_mine")}',  description: '{$t("home.row_mine_d")}',  on_select: { invoke: my-bookings } }
      memory_note: 'Showed the Red Sea Resorts menu ({$live} live booking(s)).'
    - end: applied
