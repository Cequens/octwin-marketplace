# redsea-resorts — pack-wide English strings.
# `stage_hint.held` is load-bearing: a held room is not a confirmed booking, and the guest
# must be told so plainly rather than discovering it at the desk. The English has to carry
# that as clearly as the Arabic does.
#
# The key after the dot is a declared id — byte-identical to `locale.ar.yaml`;
# only the value is translated.
pack_id: redsea-resorts
strings:
  field_picker_footer: 'Pick from the list 👆'

  status.requested:  'Awaiting confirmation'
  status.confirmed:  'Confirmed ✅'
  status.checked_in: 'Checked in'
  status.completed:  'Stay complete'
  status.cancelled:  'Cancelled'
  status.no_show:    'Did not arrive'

  stage.held:       'Provisional booking (awaiting deposit)'
  stage.confirmed:  'Confirmed ✅'
  stage.checked_in: 'Checked in'
  stage.completed:  'Stay complete'
  stage.cancelled:  'Cancelled'
  stage.no_show:    'Did not arrive'

  stage_hint.held:       'ℹ️ The room is held provisionally in your name — it is confirmed once the deposit arrives.'
  stage_hint.confirmed:  'ℹ️ Your booking is confirmed. We look forward to seeing you 🌊'
  stage_hint.checked_in: 'ℹ️ Your stay is under way — just ask if you need anything.'
  stage_hint.completed:  'ℹ️ Thank you for choosing our resorts 🌊'
  stage_hint.cancelled:  'ℹ️ This booking is cancelled.'
  stage_hint.no_show:    'ℹ️ You did not arrive on the booked date.'

  board.bb: 'Bed and breakfast'
  board.hb: 'Half board'
  board.ai: 'All inclusive'

  view.sea:    'Sea view'
  view.pool:   'Pool view'
  view.garden: 'Garden view'
  view.lagoon: 'Lagoon view'

  destination.hurghada:   'Hurghada'
  destination.el_gouna:   'El Gouna'
  destination.marsa_alam: 'Marsa Alam'
  destination.sharm:      'Sharm El Sheikh'
  destination.dahab:      'Dahab'
