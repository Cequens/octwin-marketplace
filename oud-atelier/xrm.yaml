# XRM declaration for oud-atelier — a complete boutique in three entities.
#
# WHY NOT the platform `product`/`cart`/`order` commerce entities? Two constraints
# meet here. (1) An external pack may ship only text (.yaml/.md/.sql), so
# `commerce_catalog_seed` — which uploads COMMITTED image files — cannot carry
# photography. (2) A `demo:` seed validates its rows against the PACK's declared
# fields, and an `extends: system` entity may only ADD fields, never restate the
# platform's — so a demo row cannot fill `product.name`/`price` either.
#
# So the catalog is the pack's own entity, whose `photo` is a first-class `image`
# field seeded with a `generate:` prompt. That is fully portable: the imagery is
# produced on the INSTALLING tenant's workspace at `--seed`, and the pack stays
# text-only. A boutique that later syncs a Meta catalog swaps `shop` over to the
# commerce primitives without touching the rest.

entities:
  # ── The catalog: reference records, no pipeline ⇒ always listable ──────────
  fragrance:
    label: { en: 'Fragrance', ar: 'عطر' }
    icon:        '🌸'
    description: { en: 'A perfume on the shelf, its price and stock', ar: 'عطر على الرف وسعره ومخزونه' }
    fields:
      sku:         { type: text, required: true, label: { en: 'SKU', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      price:       { type: money, label: { en: 'Price', ar: 'السعر' }, sortable: true, currency: SAR }
      category:    { type: select, options: [oud_oil, bakhoor, eau_de_parfum, gift_set, oud_chips], label: { en: 'Category', ar: 'الفئة' } }
      scent_notes: { type: text, label: { en: 'Notes', ar: 'المكوّنات العطرية' } }
      longevity:   { type: select, options: [light, moderate, long, very_long], label: { en: 'Longevity', ar: 'الثبات' }, description: { en: 'How long the scent lasts on skin — the attribute customers ask about most when choosing.', ar: 'مدة ثبات العطر على البشرة — وهي أكثر ما يسأل عنه العملاء عند الاختيار.' } }
      stock:       { type: number, label: { en: 'Stock', ar: 'المخزون' }, default: 0, sortable: true, description: { en: 'Units on hand. At 0 the cart refuses the add — this is the stock gate, not a display figure.', ar: 'الكمية المتاحة. عند 0 ترفض السلة الإضافة — هذا ضابط المخزون وليس رقماً للعرض.' } }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      rating:      { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [category, price, stock]
    # `semantic:` is what makes the fragrance quiz work — the quiz composes a
    # sentence and this entity is searched by MEANING, not keywords.
    search: { text: [name, scent_notes], semantic: [name, description], rank_by: rating }
    dedupe_by: sku

  # ── The shopping cart: one record per line, scoped to the shopper's contact ─
  cart_line:
    label: { en: 'Cart line', ar: 'سطر السلة' }
    icon:        '🛒'
    description: { en: 'One line in a shopper cart before checkout', ar: 'سطر في سلة المتسوق قبل إتمام الطلب' }
    fields:
      # A per-contact UNIQUENESS key: `<contact-id>:<item>`. `dedupe_by` resolves through
      # `findRecord`, which scopes to project + entity + field value and NOT to the
      # contact — so dedupe_by on a bare item code made one shopper's `record_save match:`
      # update ANOTHER shopper's line (their basket silently changed; this one looked
      # empty, because the row belonged to someone else). Folding the contact into the key
      # restores per-customer isolation.
      line_key:   { type: text, label: { en: 'Line key', ar: 'مفتاح السطر' } }
      fragrance:  { type: record, entity: fragrance, label: { en: 'Item', ar: 'المنتج' } }
      sku:        { type: text, label: { en: 'SKU', ar: 'الرمز' } }
      title:      { type: text, label: { en: 'Item', ar: 'المنتج' } }
      qty:        { type: number, label: { en: 'Qty', ar: 'الكمية' }, default: 1, sortable: true }
      unit_price: { type: money, label: { en: 'Unit price', ar: 'سعر الوحدة' }, currency: SAR }
      line_total: { type: money, label: { en: 'Line total', ar: 'إجمالي السطر' }, sortable: true, currency: SAR }
    list: [title, qty, line_total]
    # One line per SKU per SHOPPER — see the `line_key` note above.
    dedupe_by: line_key

  # ── The order: a pipeline, so the console charts the fulfilment funnel ─────
  purchase:
    label: { en: 'Order', ar: 'طلب' }
    icon:        '📦'
    description: { en: 'A placed order, from packing through to delivery', ar: 'طلب مؤكد من التغليف حتى التسليم' }
    fields:
      items_summary:  { type: textarea, label: { en: 'Items', ar: 'المنتجات' } }
      item_count:     { type: number, label: { en: 'Items', ar: 'عدد المنتجات' }, sortable: true }
      total:          { type: money, label: { en: 'Total', ar: 'الإجمالي' }, sortable: true, currency: SAR }
      recipient:      { type: text, label: { en: 'Recipient', ar: 'المستلم' } }
      contact_phone:  { type: text, label: { en: 'Contact phone', ar: 'هاتف التواصل' } }
      city:           { type: select, options: [riyadh, jeddah, dammam, makkah, madinah, abha], label: { en: 'City', ar: 'المدينة' } }
      address:        { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      # The delivery pin. One tap beats a district-street-landmark description,
      # and it cannot be misspelled.
      pin:            { type: geo, label: { en: 'Delivery pin', ar: 'موقع التوصيل على الخريطة' } }
      payment_method: { type: select, options: [cash_on_delivery, bank_transfer], label: { en: 'Payment', ar: 'الدفع' } }
      gift_wrap:      { type: boolean, label: { en: 'Gift wrap', ar: 'تغليف هدية' } }
    list: [item_count, total, city]
    pipeline:
      stages:   [placed, packed, shipped, delivered, cancelled]
      initial:  placed
      terminal: [delivered, cancelled]
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      placed:    { en: 'Order confirmed, not yet packed', ar: 'تأكد الطلب ولم يُغلّف بعد' }
      packed:    { en: 'Ready to leave the atelier', ar: 'جاهز لمغادرة الأتيليه' }
      shipped:   { en: 'With the courier', ar: 'مع شركة الشحن' }
      delivered: { en: 'Received by the customer', ar: 'استلمه العميل' }
      cancelled: { en: 'Cancelled before delivery', ar: 'أُلغي قبل التسليم' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      placed:    { en: 'Placed', ar: 'تم الطلب' }
      packed:    { en: 'Packed', ar: 'تم التغليف' }
      shipped:   { en: 'Shipped', ar: 'تم الشحن' }
      delivered: { en: 'Delivered', ar: 'تم التسليم' }
      cancelled: { en: 'Cancelled', ar: 'ملغي' }
    milestones:
      order_placed:    { label: { en: 'Order placed', ar: 'تم الطلب' },   stage: placed }
      order_delivered: { label: { en: 'Delivered', ar: 'تم التسليم' },     stage: delivered, terminal: true }

segments:
  open_orders:
    entity: purchase
    label: { en: 'Open orders', ar: 'طلبات قائمة' }
    where: { all: [{ active: true }] }
  low_stock:
    entity: fragrance
    label: { en: 'Low stock', ar: 'مخزون منخفض' }
    where: { all: [{ field: stock, op: lte, value: 5 }] }

