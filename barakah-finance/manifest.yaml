# barakah-finance — a Saudi Islamic home-finance provider on WhatsApp.
#
# The interesting problem here is a NEGATIVE one: a bot must not decide credit. So the
# pack draws a hard line down the middle — it will compute an INDICATIVE murabaha
# instalment from published product rates and collect a complete application, but the
# eligibility DECISION is a `case` in the credit queue that an underwriter owns, with an
# SLA the customer is told honestly. Every number the customer sees comes from a product
# record; nothing is inferred.

id:          barakah-finance
version: 1.11.0
description: 'Islamic home finance — indicative murabaha instalment from published rates, a complete application intake, and a credit review a real underwriter decides.'

listing:
  title:    'Barakah Finance'
  tagline:  'Indicative instalments and a credit review a human actually makes'
  category: finance
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'Barakah Finance'
  avatar: widget/avatar.png
  accent: '#047857'   # matches the avatar's gradient
  about:  'See what your instalments would look like, and apply for a review.'

supported_channels: [whatsapp, web]
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

flows:
  - home
  - products
  - estimate
  - apply

# NO `inbound_preprocessing.image`, deliberately.
#
# It read this pack's document fields and handed them to the AGENT to relay into tool arguments.
# When the relay did not happen the customer was asked to type what the picture already showed —
# and the values reached a record only as well as a language model retyped them.
#
# `apply`'s `read_doc` step reads the document itself, before the collect node runs. It also only
# ever fired on an inbound MESSAGE, so a document sent inside a native WhatsApp form was never read.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Saudi Arabic Islamic home-finance voice note — property price, down payment, monthly income, murabaha instalment.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                advisor
    display_name:      'Barakah Finance Advisor'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - products
      - estimate
      - apply
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
