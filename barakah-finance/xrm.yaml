# XRM declaration for barakah-finance.
#
#  • `finance_product` — the published finance products (NOT named `product`: that is a
#                 platform system entity and a pack may not reuse the key). Every rate and cap the customer is
#                 quoted comes from one of these rows, so a rate change is a record edit
#                 and the bot can never quote something the provider did not publish.
#  • `applicant`— the application, a pipeline the provider measures. The stages stop at
#                 `submitted`: the DECISION stages belong to the underwriter's case.

entities:
  finance_product:
    label: { en: 'Finance product', ar: 'منتج تمويلي' }
    icon:        '📋'
    description: { en: 'Published finance products and their rates', ar: 'منتجات التمويل المنشورة وأسعارها' }
    fields:
      code:            { type: text, required: true, unique: true, label: { en: 'Code', ar: 'الرمز' } }
      name:            { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      structure:       { type: select, options: [murabaha, ijara, musharaka], label: { en: 'Structure', ar: 'الصيغة' } }
      description:     { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      # Published, not computed — the estimate multiplies by this and says it is indicative.
      profit_rate_pct: { type: number, label: { en: 'Profit rate %', ar: 'نسبة الربح %' }, sortable: true, description: { en: 'Annual profit rate as a percentage, e.g. 4.9 for 4.9%. Published — the estimate quotes it verbatim and never invents one.', ar: 'نسبة الربح السنوية كنسبة مئوية، مثال 4.9 تعني ٤٫٩٪. منشورة — ويقتبسها التقدير كما هي دون اجتهاد.' } }
      min_down_pct:    { type: number, label: { en: 'Min down payment %', ar: 'أقل دفعة مقدمة %' }, description: { en: 'Smallest down payment the product accepts, as a percentage of the property price. An application below it cannot be estimated.', ar: 'أقل دفعة أولى يقبلها المنتج كنسبة من ثمن العقار. ولا يمكن تقدير طلب يقل عنها.' } }
      max_years:       { type: number, label: { en: 'Max term (years)', ar: 'أقصى مدة (سنة)' }, sortable: true, description: { en: 'Longest term the product allows. The estimate refuses a term above it.', ar: 'أطول مدة يسمح بها المنتج. ويرفض التقدير أي مدة تتجاوزها.' } }
      max_amount:      { type: money, label: { en: 'Max amount', ar: 'أقصى مبلغ' }, currency: SAR, description: { en: 'Largest amount the product finances.', ar: 'أعلى مبلغ يموّله المنتج.' } }
      supports_rege:   { type: boolean, label: { en: 'REDF supported', ar: 'مدعوم من صندوق التنمية العقارية' }, description: { en: 'Whether the Real Estate Development Fund (REDF) subsidy can be applied to this product.', ar: 'هل يمكن تطبيق دعم صندوق التنمية العقارية على هذا المنتج.' } }
    list: [structure, profit_rate_pct, max_years]
    search: { text: [name, description], semantic: [name, description] }

  applicant:
    label: { en: 'Application', ar: 'طلب تمويل' }
    icon:        '🏡'
    description: { en: 'A household applying for home finance, through to committee', ar: 'أسرة تتقدم بطلب تمويل عقاري حتى لجنة الائتمان' }
    fields:
      full_name:       { type: text, label: { en: 'Name', ar: 'الاسم' } }
      product:         { type: record, entity: finance_product, label: { en: 'Product', ar: 'المنتج' } }
      product_label:   { type: text, label: { en: 'Product', ar: 'المنتج' } }
      employment:      { type: select, options: [government, private, self_employed, retired], label: { en: 'Employment', ar: 'جهة العمل' } }
      monthly_income:  { type: number, label: { en: 'Monthly income', ar: 'الدخل الشهري' }, description: { en: 'Gross monthly income before deductions.', ar: 'الدخل الشهري الإجمالي قبل الخصومات.' } }
      existing_obligations: { type: number, label: { en: 'Existing obligations', ar: 'الالتزامات الحالية' }, description: { en: 'Total monthly repayments the applicant already carries. Subtracted from income when affordability is assessed.', ar: 'إجمالي الالتزامات الشهرية القائمة على المتقدم. تُخصم من الدخل عند تقدير القدرة على السداد.' } }
      property_price:  { type: money, label: { en: 'Property price', ar: 'سعر العقار' }, sortable: true, currency: SAR }
      down_payment:    { type: money, label: { en: 'Down payment', ar: 'الدفعة المقدمة' }, currency: SAR }
      term_years:      { type: number, label: { en: 'Term (years)', ar: 'المدة (سنة)' } }
      city:            { type: select, options: [riyadh, jeddah, dammam, makkah, madinah, khobar], label: { en: 'City', ar: 'المدينة' } }
      indicative_instalment: { type: money, label: { en: 'Indicative instalment', ar: 'القسط التقديري' }, currency: SAR, description: { en: 'Computed from the published rate, price, down payment and term. Indicative only — the committee decides the real figure.', ar: 'محسوب من السعر المنشور والثمن والدفعة والمدة. تقديري فقط — واللجنة تحدد الرقم الفعلي.' } }
      notes:           { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [full_name, product_label, property_price]
    pipeline:
      # Deliberately ends at `submitted` — an approval is the underwriter's case decision,
      # never a stage this bot can move a record into.
      stages:   [enquiry, estimated, documents_pending, submitted, withdrawn]
      initial:  enquiry
      terminal: [submitted, withdrawn]
      outcomes: { submitted: won, withdrawn: lost }
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      enquiry:           { en: 'Details taken; no figures given yet', ar: 'تم أخذ البيانات دون أي أرقام بعد' }
      estimated:         { en: 'An indicative instalment was shown from published rates', ar: 'عُرض قسط تقديري من الأسعار المنشورة' }
      documents_pending: { en: 'Waiting on the applicant to send salary and ID documents', ar: 'بانتظار إرسال المستندات وإثبات الدخل' }
      submitted:         { en: 'With the credit committee for a decision', ar: 'لدى لجنة الائتمان للبت فيه' }
      withdrawn:         { en: 'The applicant stopped pursuing this application', ar: 'توقف المتقدم عن متابعة الطلب' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      enquiry:           { en: 'Enquiry', ar: 'استفسار' }
      estimated:         { en: 'Estimate given', ar: 'تم التقدير' }
      documents_pending: { en: 'Documents pending', ar: 'بانتظار المستندات' }
      submitted:         { en: 'Submitted to bank', ar: 'تم التقديم' }
      withdrawn:         { en: 'Withdrawn', ar: 'مسحوب' }
    milestones:
      estimated: { label: { en: 'Estimate given', ar: 'تم التقدير' },   stage: estimated }
      submitted: { label: { en: 'Submitted', ar: 'تم التقديم' },        stage: submitted, terminal: true }

  # The worked entity — the credit queue. `case` is a RESERVED system entity
  # (extend-only): the pack declares none of its shape, and `worklist.yaml`
  # already says how it routes and what its SLA is. It appears here for one
  # reason: hooks survive `extends: system`, and a breached credit review needs
  # a named human holding it.
  case:
    extends: system
    # `automation.yaml`'s sla_sweep mints the `sla_breach` event and handles the
    # APPLICANT (one reassurance, deduped on `sla_notified_at`); this puts a
    # due-dated job on an underwriter's list so the breach is worked, not just
    # announced. The sweep is what makes this hook reachable at all — the event
    # has no other source.
    on:
      sla_breach:
        - open_task:
            title:        '⏰ تجاوز المهلة — حالة {{ record.record_number }}'
            body:         'النوع: {{ record.fields.case_type }} · الأولوية: {{ record.fields.priority }}. راجع الطلب وتواصل مع العميل.'
            # 48h SLAs move at a different tempo than a 4h dispatch board — a
            # one-hour due date on an underwriting task would just be noise.
            due_in_hours: 4

segments:
  live_applications:
    entity: applicant
    label: { en: 'Live applications', ar: 'طلبات قائمة' }
    where: { all: [{ active: true }] }

demo:
  - entity: finance_product
    fields:
      code: 'MUR-HOME'
      name: 'مرابحة تمويل عقاري'
      structure: murabaha
      description: 'تمويل شراء مسكن بصيغة المرابحة — البنك يشتري العقار ويبيعه لك بربح معلوم مقسّط. Home purchase via murabaha: the financier buys the property and resells it to you at a disclosed profit, paid in instalments.'
      profit_rate_pct: 4.9
      min_down_pct: 10
      max_years: 25
      max_amount: 5000000
      supports_rege: true
  - entity: finance_product
    fields:
      code: 'IJARA-HOME'
      name: 'إجارة منتهية بالتمليك'
      structure: ijara
      description: 'إجارة منتهية بالتمليك — تستأجر العقار وتنتقل الملكية إليك في نهاية المدة. Lease-to-own: you lease the property and ownership transfers at the end of the term.'
      profit_rate_pct: 5.2
      min_down_pct: 15
      max_years: 20
      max_amount: 4000000
      supports_rege: true
  - entity: finance_product
    fields:
      code: 'MUSH-HOME'
      name: 'مشاركة متناقصة'
      structure: musharaka
      description: 'مشاركة متناقصة — تشترك مع الجهة الممولة في ملكية العقار وتزيد حصتك تدريجياً. Diminishing musharaka: you co-own the property and buy out the financier''s share over time.'
      profit_rate_pct: 5.5
      min_down_pct: 20
      max_years: 15
      max_amount: 3000000
      supports_rege: false
  - entity: finance_product
    fields:
      code: 'MUR-SELF'
      name: 'مرابحة لأصحاب الأعمال'
      structure: murabaha
      description: 'مرابحة عقارية لأصحاب الأعمال والمهن الحرة مع متطلبات مستندات مختلفة. Murabaha for self-employed applicants, with a different document set.'
      profit_rate_pct: 5.9
      min_down_pct: 25
      max_years: 20
      max_amount: 3500000
      supports_rege: false
