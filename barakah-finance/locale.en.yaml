# barakah-finance — pack-wide English strings.
#
# `cases.*` / `status.*` / `decision.*` are the boot-enforced CASEWORK LOCALE CONTRACT: every
# language this pack ships must carry the complete set, or `validateCaseworkLocaleCoverage`
# REFUSES the pack at load. The key after the dot is a declared id from `worklist.yaml`, so it
# stays byte-identical to `locale.ar.yaml` — only the value is translated.
#
# Note the decision wording: `pre_approved` says "preliminary approval", because that is what an
# underwriter's pre-approval actually is, and `declined` is worded so it can be relayed to a
# customer without a reason the desk did not give.
pack_id: barakah-finance
