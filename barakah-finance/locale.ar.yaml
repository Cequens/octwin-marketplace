# barakah-finance — pack-wide Arabic strings.
#
# `cases.*` / `status.*` / `decision.*` are the boot-enforced CASEWORK LOCALE CONTRACT.
# Note the decision wording: `pre_approved` says "موافقة مبدئية" — a preliminary approval,
# because that is what an underwriter's pre-approval actually is, and `declined` is worded
# so it can be relayed to a customer without a reason the desk did not give.
