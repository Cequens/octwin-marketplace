# What Barakah Finance does by itself — rules (guide: craft-automation; every change, time and action: rules-guide).
#
# The alarm on the credit-review SLA `worklist.yaml` promises. An applicant
# waiting on a financing decision is the least likely customer in this repo to
# chase it, which is exactly why the deadline needs a machine watching it:
# `sla_due_at` was stamped at enrolment and, before this alarm, never read.
#
# The clock is the entity's, so one rule per clock covers all four case types
# (document_review 24h · finance_application 48h · sharia_question 48h ·
# general_query 48h). It skips terminal-stage cases, alerts the responsible
# operator through the ops inbox, and then puts an underwriter task on the case.
#
# The applicant's reassurance rides the FIRST-RESPONSE clock instead — a case nobody
# has touched in 4 hours (`first_response_within_hours`, worklist.yaml). A breach comes
# 24-48 hours in, past WhatsApp's 24-hour window, where a free-form message fails unless
# the applicant wrote since; 4 hours in, it reaches them.
#
# `escalate_to:` routes the breached item to a queue. It took three rounds to land:
# first omitted because the KB documented the target two incompatible ways, then kept
# out once it was typed as a principal-ref (`user:`/`team:`) — an id only the INSTALLING
# tenant knows, unwritable in a published pack. The platform then added `queue:<key>`,
# resolved against THIS pack's own `worklist.yaml` `queues:`, so it travels with the pack
# (KB 968db6a91806, `worklist-guide` §5). A key we never declared fails at pack load,
# naming the legal ones — it can no longer mis-route in silence.
#
# `credit_review` is the senior underwriting desk, already the `fallback:` for general
# queries.
#
# Know the limit: routing a queue notifies nobody new. The item appears in that queue's
# work inbox, and the ops-inbox alert still goes to the previous assignee — so a breach on
# an UNASSIGNED item escalates silently. The customer reassurance below is unaffected.

rules:
  # The resolution clock ran out. After the breach, a due-dated job on an underwriter's
  # list, so the breach is worked, not just announced.
  - key: case_sla
    for: case
    at: clock resolution
    do:
      - breach:
          escalate_to: queue:credit_review
      - open_task:
          title:        '⏰ تجاوز المهلة — حالة {{ record.record_number }}'
          body:         'النوع: {{ record.fields.case_type }} · الأولوية: {{ record.fields.priority }}. راجع الطلب وتواصل مع العميل.'
          # 48h SLAs move at a different tempo than a 4h dispatch board — a
          # one-hour due date on an underwriting task would just be noise.
          due_in_hours: 4

  # Nobody touched the case in 4 hours: route it to the desk and reassure the applicant.
  - key: case_first_response
    for: case
    at: clock first_response
    do:
      - breach:
          escalate_to: queue:credit_review
          message:
            ar: 'استلمنا طلبك 🙏 وهو الآن مع فريق الائتمان للمراجعة — بنتواصل معك قريباً.'
            en: 'We have your request 🙏 It is with our credit team for review — we will be in touch soon.'
