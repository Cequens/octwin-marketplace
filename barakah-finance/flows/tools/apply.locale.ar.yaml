flow_id: apply

strings:
  # The flow's OWN vision prompt — it knows which document it is looking at, where a pack-wide
  # image prompt has to serve every picture a customer might send. English, because it instructs
  # the model rather than speaking to the customer.
  vision_prompt: >-
    A photograph of a salary certificate or payslip. Reply as JSON: {"monthly_income":"net monthly figure as a NUMBER only, no currency or separators, else null","full_name":"employee name as printed, else null",
    "employer":"employing company as printed, else null"}.
    Copy characters exactly — never correct, complete or reformat a value, and never infer one
    that is not visible.
  progress.header:      '📝 طلب تمويل'
  progress.product:     '📋 المنتج: {product}'
  progress.employment:  '✅ جهة العمل'
  progress.city:        '✅ المدينة'

