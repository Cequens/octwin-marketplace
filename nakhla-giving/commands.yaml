# Pack-level slash commands. A top-level LIST, one literal `match` per entry.
#
# A donor who has changed their mind mid-flow needs a way out that does not
# involve explaining themselves to a bot about money.

- match:  '/clear'
  action: close_conversation
  reply:
    ar: 'تمام، بدينا من جديد. كيف نقدر نساعدك؟'
    en: 'Done — a fresh start. How can we help you?'
  source: '/clear'

- match:  '/جديد'
  action: close_conversation
  reply:
    ar: 'تمام، بدينا من جديد. كيف نقدر نساعدك؟'
    en: 'Done — a fresh start. How can we help you?'
  source: '/clear'
