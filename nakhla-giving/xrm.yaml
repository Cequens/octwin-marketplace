# Two entities: what the charity is raising for, and what a donor actually gave.
#
#  • campaign — operator data. The charity's team maintains these in the console;
#               the bot only reads them.
#  • donation — one per attempt, minted BEFORE the invoice exists so its
#               `record_number` can be the join key the gateway echoes back.

entities:

  appeal:
    label:   { en: 'Appeal', ar: 'حملة' }
    # `title_field` is what makes `--seed` IDEMPOTENT. The seeder looks for an
    # existing row by `dedupe_by`, else by the title field's value; declaring
    # NEITHER means it never finds one and inserts a fresh set on every seed —
    # deploy twice and the charity has ten campaigns instead of five.
    title_field: title_ar
    fields:
      title_ar:    { type: text,   required: true, label: { en: 'Title (AR)', ar: 'العنوان' } }
      title_en:    { type: text,   label: { en: 'Title (EN)', ar: 'العنوان بالإنجليزي' } }
      summary:     { type: text,   label: { en: 'Summary', ar: 'نبذة' } }
      goal:        { type: number, label: { en: 'Goal', ar: 'الهدف' }, sortable: true }
      raised:      { type: number, label: { en: 'Raised', ar: 'المُحصّل' }, sortable: true }
      category:    { type: select, options: [food, health, education, shelter, water], label: { en: 'Category', ar: 'التصنيف' } }
      # A donor gives to what they can see. Seeded via `generate:` so a pure-YAML
      # pack (which ships no binaries) still arrives with real imagery; an
      # unresolved marker OMITS the field rather than writing a broken ref.
      image:       { type: image,  label: { en: 'Photo', ar: 'صورة' } }
    list:   [title_ar, goal, raised]
    search: { text: [title_ar, title_en, summary] }
    pipeline:
      stages:      [draft, active, closed]
      initial:     draft
      progression: free
      terminal:    [closed]

    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      draft:  { en: 'Draft', ar: 'مسودة' }
      active: { en: 'Live', ar: 'حملة نشطة' }
      closed: { en: 'Closed', ar: 'مغلقة' }
  donation:
    label:   { en: 'Donation', ar: 'تبرّع' }
    fields:
      appeal_title: { type: text,   required: true, label: { en: 'Appeal', ar: 'الحملة' } }
      appeal_id:    { type: text,   label: { en: 'Appeal ref', ar: 'رقم الحملة' } }
      amount:         { type: number, required: true, label: { en: 'Amount', ar: 'المبلغ' }, sortable: true }
      currency:       { type: text,   label: { en: 'Currency', ar: 'العملة' } }
      donor_name:     { type: text,   label: { en: 'Donor', ar: 'المتبرّع' } }
      # Returned by the invoice create — the link the donor taps. Stored so
      # `my-donations` can offer it again for something still unpaid, which is
      # the single most common follow-up question.
      checkout_url:   { type: text,   label: { en: 'Checkout link', ar: 'رابط الدفع' } }
      invoice_id:     { type: text,   label: { en: 'Invoice', ar: 'رقم الفاتورة' } }
      # Written by the webhook, never by a flow.
      gateway_payment_id: { type: text, label: { en: 'Payment id', ar: 'رقم العملية' } }
      paid_at:            { type: text, label: { en: 'Paid at', ar: 'وقت الدفع' } }
      source:             { type: text, label: { en: 'Method', ar: 'الوسيلة' } }
    list:   [appeal_title, amount, donor_name]
    search: { text: [appeal_title, donor_name] }
    pipeline:
      # `pending` is where a donation sits between "we made an invoice" and "the
      # gateway told us what happened" — which may be never, if the donor closes
      # the page. That is a normal outcome, not an error.
      stages:      [pending, paid, failed, refunded]
      initial:     pending
      progression: free
      terminal:    [paid, refunded]
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      pending:  { en: 'Pending', ar: 'بانتظار السداد' }
      paid:     { en: 'Paid', ar: 'تم السداد' }
      failed:   { en: 'Failed', ar: 'فشل السداد' }
      refunded: { en: 'Refunded', ar: 'تم الاسترجاع' }
    milestones:
      first_gift: { label: { en: 'First gift', ar: 'أول تبرّع' } }

    on:
      # ── the receipt ─────────────────────────────────────────────────────────
      # The webhook moves the record to `paid`, and THIS fires. It is the ordinary
      # notify verb — the entire customer-facing half of a payment integration is
      # one declared line, and it does not care that a gateway caused the move.
      enter:
        paid:
          # The thank-you carries the RECEIPT as a tappable button (`link` +
          # `link_label` → a `cta_url` render), not a URL pasted into the body —
          # a bare link in Arabic body text is reordered and wrapped mid-token by
          # the bidi algorithm, which is how a receipt arrives looking corrupted.
          #
          # The URL is the invoice's own page: Moyasar exposes no receipt endpoint
          # (every documented path 404s), and after payment the checkout page
          # renders the paid invoice, which IS the receipt. It is already stored on
          # the record by `stamp_link`.
          #
          # If `checkout_url` is somehow empty, the platform degrades to the plain
          # text card rather than rendering a button to nowhere — so a missing link
          # costs the receipt, never the thank-you.
          - notify:
              message: >-
                🌱 وصلنا تبرّعك — جزاك الله خيراً.
                المبلغ {{ record.fields.amount }} {{ record.fields.currency }} لصالح {{ record.fields.appeal_title }}.
                رقم العملية {{ record.record_number }}.
              link:       '{{ record.fields.checkout_url }}'
              link_label: '🧾 الإيصال'
              cooldown_hours: 24
          - track: { event: donation_paid }

        # A failed card is not silence. A donor who thinks they gave and did not
        # is the worst outcome a charity can have.
        failed:
          - notify:
              message: >-
                ما تمّت عملية الدفع لتبرّعك رقم {{ record.record_number }}.
                ما انخصم أي مبلغ. تقدر تحاول مرة ثانية وقت ما يناسبك 🌿
              cooldown_hours: 6

        refunded:
          - notify:
              message: >-
                تم استرجاع مبلغ تبرّعك رقم {{ record.record_number }} بالكامل.
                إذا عندك أي استفسار تواصل معنا.
              cooldown_hours: 24

segments:
  unpaid:
    entity: donation
    label:  { en: 'Awaiting payment', ar: 'بانتظار الدفع' }
    where:  { stage: pending }
  received:
    entity: donation
    label:  { en: 'Received', ar: 'تبرّعات مستلمة' }
    where:  { stage: paid }
  live_appeals:
    entity: appeal
    label:  { en: 'Live appeals', ar: 'حملات نشطة' }
    where:  { stage: active }

# ── demo data ───────────────────────────────────────────────────────────────
#
# APPEALS ONLY, deliberately. Donations are NOT seeded:
#
#   • `my-donations` is contact-scoped, so a seeded gift (which has no linked
#     contact) is invisible to every donor — present in the console, absent
#     exactly where a demo needs it;
#   • inventing `paid` rows with fabricated `gateway_payment_id` / `paid_at`
#     puts money that never moved into the funnel and the journey's conversion
#     numbers, in the one pack whose whole subject is money;
#   • the agent's own instructions forbid inventing an amount, a campaign or a
#     receipt. Shipping fake gifts would contradict the product being demoed.
#
# Donations are earned by talking to the bot.
#
# Re-seeding is idempotent via `title_field: title_ar` (above) and REUSES any
# image already generated, so `deploy --seed` is cheap to repeat.
#
# The image prompts describe PLACES AND OBJECTS, never identifiable people in
# hardship. A charity that raises money on images of the people it serves trades
# their dignity for donations; the platform will generate whatever it is asked
# for, so the restraint has to live here.
demo:
  - entity: appeal
    stage:  active
    fields:
      title_ar: 'سلة الخير الغذائية'
      title_en: 'Food basket'
      summary:  'سلة غذائية شهرية لأسرة متعففة — مواد أساسية تكفي شهراً كاملاً.'
      category: food
      goal:     150000
      raised:   92400
      image:    'generate:A neatly packed cardboard box of staple pantry goods — rice, lentils, dates, cooking oil — on a plain wooden table in warm daylight. Documentary product photography, no people, no faces, no logos, no text.'

  - entity: appeal
    stage:  active
    fields:
      title_ar: 'علاج مرضى السرطان'
      title_en: 'Cancer treatment fund'
      summary:  'تغطية تكاليف العلاج والأدوية للمرضى غير القادرين.'
      category: health
      goal:     500000
      raised:   312750
      image:    'generate:A calm, clean hospital corridor with soft natural light through a window and an empty waiting bench. Architectural interior photography, no people, no faces, no signage, no text.'

  - entity: appeal
    stage:  active
    fields:
      title_ar: 'كفالة طالب علم'
      title_en: 'Sponsor a student'
      summary:  'رسوم دراسية وحقيبة مدرسية لطالب لعام كامل.'
      category: education
      goal:     200000
      raised:   74300
      image:    'generate:A tidy wooden school desk with stacked notebooks, a satchel and sharpened pencils beside a sunlit classroom window. Still-life photography, no people, no faces, no text.'

  - entity: appeal
    stage:  active
    fields:
      title_ar: 'ترميم بيوت الأسر المتعففة'
      title_en: 'Home repairs'
      summary:  'ترميم وصيانة مساكن الأسر المحتاجة لتأمين سكن آمن وكريم.'
      category: shelter
      goal:     300000
      raised:   118900
      image:    'generate:A simple modest house exterior mid-renovation under a clear sky, fresh plaster and a newly fitted window frame, ladder leaning against the wall. Architectural documentary photography, no people, no faces, no text.'

  - entity: appeal
    stage:  active
    fields:
      title_ar: 'حفر بئر ماء'
      title_en: 'Water well'
      summary:  'حفر بئر يخدم قرية كاملة بمياه شرب نظيفة على مدار العام.'
      category: water
      goal:     120000
      raised:   65200
      image:    'generate:Clear water pouring from a simple metal hand pump into a container, dry earth ground, bright daylight. Documentary photography, close on the pump and water, no people, no faces, no text.'
