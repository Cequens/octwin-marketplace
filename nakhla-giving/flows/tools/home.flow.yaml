# home — the front door. A list_picker hub, so a donor chooses instead of typing.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this donor.'

entry:
  - else: true
    goto: count_unpaid

steps:

  count_unpaid:
    # Lead with what is actually outstanding. A donor who tapped away from a
    # checkout page and came back has exactly one question.
    - do: record_aggregate
      args: { entity: donation, op: count, active_only: true }
      bind: oc
      outputs:
        ok:     [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign:
        live: '$coalesce($oc.value, 0)'
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $live > 0 ? $t("home.pending", { count: $live }) : null
               ]), "\n")'
        footer: '{$t("home.footer")}'
        cta:    '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_appeals")}',  description: '{$t("home.row_appeals_d")}',  on_select: { invoke: campaigns } }
          - { title: '{$t("home.row_donate")}',   description: '{$t("home.row_donate_d")}',   on_select: { invoke: donate } }
          - { title: '{$t("home.row_mine")}',     description: '{$t("home.row_mine_d")}',     on_select: { invoke: my-donations } }
      memory_note: 'Showed the giving menu.'
    - end: applied
