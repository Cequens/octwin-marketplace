# donate — collect an amount, mint the donation, create a checkout link.
#
# THE ORDER OF THE TWO WRITES IS THE WHOLE DESIGN.
#
# The xrm record is saved FIRST, and only then is the invoice created. That is
# deliberate and it is the opposite of what feels natural ("get the link, then
# record it"):
#
#   • `record_save` mints `record_number`, which is the join key we hand the
#     gateway as invoice metadata and which comes back on the webhook. Without a
#     record first, a payment could clear for a donation we have no row for.
#   • If the invoice call fails we are left with a `pending` donation and no
#     link — recoverable, visible in the console, re-offerable from
#     `my-donations`. The reverse failure (a live invoice with no record) is a
#     donor charged for something the charity cannot see.
#
# The invoice call is SYNCHRONOUS because the donor is holding their phone
# waiting for the link. The receipt is queued, because nobody is.

flow_id:     donate
version:     1
description: |-
  Take a donation. Call when the donor wants to give, names an amount, or taps a
  campaign. Pass `appeal_number` ONLY when it came off a card, never text they typed.

config:
  giving:
    currency:    SAR
    minor_units: 100

# `amount` is declared here even though the collect below also gathers it, because
# an explicit `input:` spec WINS over the field the collect engine would otherwise
# auto-expose as a bare string. That is the difference between the agent handing us
# the number 300 and handing us "٣٠٠" — and `$state.amount * minor_units` on a
# string is how a donation gets charged wrong.
input:
  # The record ID, NOT the record_number, and that is not a style preference.
  # `record_get` resolves `match: { field, value }` through xrm's `findRecords`,
  # which matches DECLARED FIELDS via `fields->>` — and `record_number` is a
  # COLUMN, so it can never be reached that way. The lookup returns `not_found`
  # for a campaign that plainly exists, silently, and the donation then fails a
  # required-field check three steps later. Ids go through `record_id:`.
  appeal_id:
    type:     string
    optional: true
    describe: 'A campaign reference — ONLY from a card or picker the donor tapped, never anything they typed.'
  amount:
    type:     number
    positive: true
    optional: true
    describe: 'The donation amount in whole riyals, as the donor named it.'
  donor_name:
    type:     string
    optional: true
    describe: 'The name to record the gift under, if the donor gave one.'

entry:
  - else: true
    goto: resolve_appeal

steps:

  # A tapped campaign card arrives carrying the appeal's id. Resolving it here
  # seeds `$state` so the collect below finds the field already filled and never
  # shows the picker — the tap IS the answer.
  resolve_appeal:
    - if: '$input.appeal_id == null'
      goto: check_live
    - do: record_get
      args: { entity: appeal, record_id: '$input.appeal_id' }
      bind: ap
      outputs:
        ok:        [{ goto: seed }]
        not_found: [{ goto: check_live }]
        failed:    [{ goto: check_live }]

  # A charity between campaigns has nothing to give to, which is a legitimate
  # state — and one the picker cannot express: a REQUIRED picker whose source
  # returns zero rows is a dead end the collect engine refuses LOUDLY rather than
  # re-asking for ever. Asking here means the picker below can never be empty.
  check_live:
    - do: record_list
      args: { entity: appeal, stage: active, all: true, limit: 1 }
      outputs:
        ok:     [{ goto: gather }]
        empty:  [{ goto: none_live }]
        failed: [{ goto: none_live }]

  seed:
    - assign:
        state: '$merge($state, {
                  appeal_id:    $ap.id,
                  appeal_title: $ap.fields.title_ar
                })'
    - goto: gather

  gather:
    - collect:
        # Fold any invoke-time args into the bag on every pass. `$coalesce` keeps
        # whatever the donor has already answered, so this is safe to re-run.
        derive:
          amount:     '$coalesce($state.amount, $input.amount)'
          donor_name: '$coalesce($state.donor_name, $input.donor_name)'
        fields:
          # `all: true` because appeals belong to the CHARITY, not to the donor.
          # Without it `record_list` scopes to the current contact and the picker
          # renders an empty list for every donor — silently, since zero rows is a
          # legitimate result. `auto_resolve` skips the tap when only one appeal is
          # live, and `fallback: text` keeps the ask answerable if none are.
          - field: appeal_id
            label: '$t("donate.f_appeal")'
            options:
              header: donate.pick_header
              body:   donate.pick_body
              cta:    donate.pick_cta
              fetch:
                do:   record_list
                args: { entity: appeal, stage: active, all: true, limit: 10 }
                bind: live
              rows: '$live.rows'
              map:
                # The id, so both entry paths agree on what identifies an appeal.
                value:       '$item.id'
                label:       '$item.fields.title_ar'
                description: '$coalesce($item.fields.summary, "")'
                # `appeal_id` is auto-echoed from `value`; the TITLE is the part
                # only the picker can supply, and `save_donation` requires it.
                selection:
                  appeal_title: '$item.fields.title_ar'
              auto_resolve: true

          # Free text, not a preset picker. A static option list cannot carry
          # `fallback: text` and forces every label through `$t()` with STRING
          # values — and an amount must stay a number. Presets are offered as taps
          # on the home card instead, which bind `amount` directly.
          - field: amount
            label: '$t("donate.f_amount")'
            validate:
              when:  '$state.amount != null && $state.amount <= 0'
              error: '$t("donate.err_amount")'

          - field: donor_name
            label: '$t("donate.f_donor")'

        gap_instructions: >-
          Ask for the one missing detail in a single short, warm line of Saudi
          Arabic. Never re-ask for something already answered, never pressure, and
          never guess an amount — if the donor is vague, ask.
        complete: [{ goto: check_resolved }]

  # THE GUARD THIS FLOW EARNED THE HARD WAY.
  #
  # `appeal_title` is a required field on the donation entity, and only two things
  # set it: `seed` (the tap path) and the picker's `selection:` (the typed path).
  # An `appeal_id` arriving on `$input` counts as ANSWERED by the collect engine,
  # so a bad id skips the picker — and then the title is empty and `record_save`
  # rejects the record, which the donor reads as "something broke on our side"
  # three steps after the thing that actually broke.
  #
  # A stale card is a real event (a withdrawn appeal, an old chat scrolled back to),
  # so recover instead of failing: say the campaign is gone and offer the live list.
  check_resolved:
    - if: '$state.appeal_title == null'
      then: [{ goto: stale_appeal }]
      else: [{ goto: confirm }]

  stale_appeal:
    - render:
        render_intent: text_card
        body: '{$t("donate.stale_appeal")}'
        buttons:
          - { title: '{$t("donate.btn_appeals")}', on_select: { invoke: campaigns } }
      memory_note: 'The campaign reference did not resolve — offered the live list instead.'
    - end: applied

  none_live:
    - answer:
        instructions: >-
          There are no campaigns open for donations right now. Say so in ONE short,
          warm line of Saudi Arabic and offer to let them know when the next one
          opens. Do NOT invent a campaign and do NOT take an amount.

  confirm:
    - use: approve_apply
      with:
        header:  '{$t("donate.confirm_header")}'
        preview: '$lines($compact([
                    $t("donate.preview_appeal", { appeal: $state.appeal_title }),
                    $t("donate.preview_amount", { amount: $format_money($state.amount, $config.giving.currency) }),
                    $t("donate.preview_donor",  { donor: $state.donor_name })
                  ]), "\n")'
        confirm_title: '{$t("donate.btn_confirm")}'
        cancel_title:  '{$t("donate.btn_cancel")}'
        apply:         save_donation
        abort:         cancelled
        # REQUIRED, and deliberately NOT `abort`: a donor who types instead of
        # tapping — correcting the amount, fixing a name — has not cancelled.
        # Routing back to the collect re-merges what they typed and re-asks.
        on_other:      gather

  # WRITE 1 — ours. Mints record_number, the join key the gateway echoes back.
  save_donation:
    - do: record_save
      args:
        entity: donation
        fields:
          appeal_title: '$state.appeal_title'
          appeal_id:    '$state.appeal_id'
          amount:       '$state.amount'
          currency:     '$config.giving.currency'
          donor_name:   '$state.donor_name'
      bind: gift
      outputs:
        ok:      [{ goto: make_invoice }]
        invalid: [{ goto: save_failed }]
        failed:  [{ goto: save_failed }]

  # WRITE 2 — the gateway. The amount is converted to the SMALLEST unit here,
  # once, so no other step has to remember that SAR is quoted in halalas.
  make_invoice:
    - assign:
        amount_minor: '$state.amount * $config.giving.minor_units'
    - do: integration_call
      args:
        operation: moyasar_create_invoice
        input:
          ref:          '$gift.record_number'
          appeal:       '$state.appeal_title'
          amount_minor: '$amount_minor'
          currency:     '$config.giving.currency'
          description:  '$state.appeal_title'
      bind: inv
      outputs:
        ok:      [{ goto: stamp_link }]
        empty:   [{ goto: no_link }]
        invalid: [{ goto: no_link }]
        denied:  [{ goto: not_configured }]
        failed:  [{ goto: no_link }]

  # `invoice_id` is the WEBHOOK'S JOIN KEY, not a nice-to-have — the receipt for
  # this donation can only be delivered if this write lands (see the inbound
  # declaration in integrations.yaml for why the join is not invoice metadata).
  #
  # The failure ports still continue to `send_link` anyway, deliberately: the donor
  # already has a working payment link, and refusing to hand it over because OUR
  # bookkeeping write failed punishes them for our problem. The cost is that such a
  # payment lands with nothing to match it and has to be reconciled by hand from
  # the Moyasar dashboard — which is what the invoice `metadata.ref` above is for.
  stamp_link:
    - do: record_save
      args:
        entity:    donation
        record_id: '$gift.record_id'
        fields:
          checkout_url: '$inv.url'
          invoice_id:   '$inv.id'
      outputs:
        ok:      [{ goto: send_link }]
        invalid: [{ goto: send_link }]
        failed:  [{ goto: send_link }]

  # THE LINK GOES OUT FIRST. That ordering is not cosmetic.
  #
  # An empty port body (`outputs: { ok: [] }`) selects the CANONICAL handler,
  # which is `[{ end: applied }]` — it terminates the FLOW, not just the step. A
  # `track_event` written above the render with empty ports therefore ended the
  # run right there, and the payment link below it was unreachable: the donation
  # was saved, the invoice was created, `checkout_url` was stored, and the donor
  # was shown nothing. Analytics silently outranked the one message the whole
  # flow exists to send.
  #
  # So: render, THEN track, with every port ending explicitly.
  send_link:
    - render:
        render_intent: detail_card
        header: '{$t("donate.ready_header")}'
        body: '$lines($compact([
                 $t("donate.ready_amount", { amount: $format_money($state.amount, $config.giving.currency), appeal: $state.appeal_title }),
                 $t("donate.ready_link",   { url: $inv.url }),
                 $t("donate.ready_note")
               ]), "\n")'
        buttons:
          - { title: '{$t("donate.btn_mine")}', on_select: { invoke: my-donations } }
      memory_note: 'Donation {$gift.record_number} created, checkout link sent. Awaiting the gateway.'
      data: { ref: '$gift.record_number', amount: '$state.amount' }
    # The funnel's `intending` stage. Emitted AFTER the link (see above) and at
    # `send_link` rather than `save_donation`, because a record with no link is
    # not an abandoned checkout — it is our failure, and counting it as donor
    # hesitation would flatter us. Both ports end explicitly: a missing analytics
    # write must never decide whether the flow completed.
    - do: track_event
      args:
        event: donation_link_issued
        value: '$state.amount'
      outputs:
        ok:     [{ end: applied }]
        failed: [{ end: applied }]

  # The record exists and is `pending`; only the link is missing. Say so honestly
  # rather than implying the donation failed — the charity can re-issue it.
  no_link:
    - render:
        render_intent: detail_card
        header: '{$t("donate.no_link_header")}'
        body:   '{$t("donate.no_link_body")}'
      memory_note: 'Donation {$gift.record_number} saved but the gateway returned no link; the team can re-issue it.'
    - end: applied

  # `denied` means the OPERATOR has not finished setup — a wrong key, or a
  # publishable one where a secret is required. Nothing the donor can do, so the
  # card is an apology plus a human route, not a diagnostic.
  not_configured:
    - render:
        render_intent: text_card
        body: '{$t("donate.not_configured")}'
      memory_note: 'Payment gateway rejected our key — the charity must finish setup on the console Integrations page.'
    - end: failed

  save_failed:
    - render:
        render_intent: text_card
        body: '{$t("donate.save_failed")}'
    - end: failed

  cancelled:
    - answer:
        instructions: >-
          The donor cancelled before paying. Acknowledge warmly in ONE short line
          of Saudi Arabic, with no pressure and no follow-up question.
