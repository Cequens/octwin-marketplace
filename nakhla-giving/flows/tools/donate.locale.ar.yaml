flow_id: donate

strings:
  # Gap-card labels — one per collect field, read by `$collect_missing_labels`.
  f_appeal:        'الحملة'
  f_amount:        'المبلغ'
  f_donor:         'الاسم'
  err_amount:      'المبلغ لازم يكون أكبر من صفر 🙏'

  # The appeal picker (a dynamic `options:` block, so these are bare keys).
  pick_header:     '🌱 وين تحب يوصل تبرّعك؟'
  pick_body:       'هذي الحملات المفتوحة حالياً.'
  pick_cta:        'اختر حملة'

  stale_appeal:    'يبدو أن هذي الحملة انتهت أو ما هي متاحة حالياً 🌿 تحب تشوف الحملات المفتوحة؟'
  btn_appeals:     '📋 الحملات المتاحة'

  confirm_header:  '📝 مراجعة التبرّع'
  preview_appeal:  '🌱 الحملة: {appeal}'
  preview_amount:  '💰 المبلغ: {amount}'
  preview_donor:   '👤 باسم: {donor}'
  btn_confirm:     '✅ أكّد وأصدر رابط الدفع'
  btn_cancel:      '❌ إلغاء'

  # `ready_link` (a raw {url} line) and `btn_mine` were REMOVED with the switch to
  # a `cta_url` render: the link now rides a native URL button, and that intent
  # carries only one button. Never print a checkout URL into Arabic body text —
  # bidi reordering breaks it across lines and strands the punctuation.
  ready_header:    '🔒 رابط الدفع جاهز'
  ready_amount:    '💰 {amount} لصالح {appeal}'
  ready_note:      'ℹ️ الدفع يتم على صفحة بوابة الدفع مباشرة — ما نطلب منك أي بيانات بطاقة هنا.'
  ready_footer:    'يوصلك إيصال هنا أول ما تتم العملية'
  btn_pay:         '🔒 ادفع الآن'

  no_link_header:  '⏳ سجّلنا تبرّعك'
  no_link_body:    'سجّلنا تبرّعك بس ما قدرنا نصدر رابط الدفع الحين. فريقنا يرسل لك الرابط قريب، وما انخصم أي مبلغ.'

  not_configured:  'عذراً، بوابة الدفع عندنا تحتاج ضبط من الفريق. سجّلنا اهتمامك ونتواصل معك قريب 🌿'
  save_failed:     'صار خلل بسيط عندنا وما قدرنا نسجّل التبرّع. جرّب مرة ثانية بعد شوي.'
