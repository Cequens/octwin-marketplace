# campaigns — the live appeals, read from the charity's own records.
#
# No integration here on purpose: this is the charity's OWN data, so it belongs
# in xrm rather than behind an API call. The pack's integration is the payment,
# not the catalogue.

flow_id:     campaigns
version:     1
description: |-
  The charity's active appeals. Call when the donor asks what they can give to,
  names a cause (طعام / صحة / تعليم / مأوى / ماء), or asks where the money goes.

config:
  lookup: { page_size: 10 }

input:
  category:
    type:     enum
    enum:     [food, health, education, shelter, water]
    optional: true
    describe: 'Only when the donor named a cause.'

entry:
  - else: true
    goto: fetch

steps:

  fetch:
    # `stage:` here is the first-class argument. (`where: { stage: active }` would
    # ALSO work — the filter AST has a `stage` node kind alongside `field` — but
    # the dedicated argument is the plainer way to say it.)
    #
    # `all: true` because appeals belong to the CHARITY. Without it `record_list`
    # scopes to the calling contact and every donor sees an empty list — with no
    # error, because zero rows is a legitimate answer.
    - do: record_list
      args:
        entity:  appeal
        stage:   active
        all:     true
        limit:   '$config.lookup.page_size'
      bind: found
      outputs:
        ok:     [{ goto: narrow }]
        empty:  [{ goto: none_live }]
        failed: [{ goto: none_live }]

  narrow:
    # `$filter`'s predicate takes a field name or an equality object and never
    # binds `$item`, so the category match is computed in `$map` and filtered on.
    - assign:
        rows: '$map($found.rows, $merge($item, { _hit:
                 $input.category == null || $item.fields.category == $input.category
               }))'
    - assign: { hits: '$filter($rows, "_hit")' }
    - if: '$length($hits) == 0'
      then: [{ goto: none_live }]
      else: [{ goto: show }]

  show:
    - assign:
        items: '$map($hits, {
                  id:      $item.id,
                  title:   $item.fields.title_ar,
                  summary: $item.fields.summary,
                  image:   $item.fields.image,
                  goal:    $item.fields.goal,
                  raised:  $item.fields.raised
                })'
    # A CAROUSEL, not a list_picker: appeals carry a photo, and someone decides
    # what to give to by looking. A carousel card has NO `title` / `description`
    # — the name goes in `body:` as markdown (a `title:` written here renders
    # nothing at all) — and `image_url` takes the raw `MEDIA-…` ref, which the
    # channel bridge rewrites to a storage URL.
    #
    # Meta rejects a ONE-card carousel (#131009); the provider degrades that to an
    # image-header message rather than failing, so a charity down to its last live
    # appeal still renders.
    - render:
        render_intent: carousel
        body:  '$t("campaigns.intro", { count: $length($items) })'
        items: '$items'
        item_template:
          image_url: '$item.image'
          body: '$lines($compact([
                   $t("campaigns.card_title", { title: $item.title }),
                   $t("campaigns.card_progress", {
                     raised: $format_money($item.raised, "SAR"),
                     goal:   $format_money($item.goal, "SAR") }),
                   $item.summary
                 ]), "\n")'
          buttons:
            # The ID, not the record_number: `record_get` cannot look a record up
            # by record_number (that is a column, and `match:` reaches declared
            # FIELDS only), so a number here resolves to nothing and the donation
            # fails a required-field check further downstream.
            - { title: '{$t("campaigns.btn_give")}', on_select: { invoke: donate, with: { appeal_id: '$item.id' } } }
      memory_note: 'Listed {$length($items)} live appeal(s).'
      data: { total: '$length($items)' }
    - end: applied

  none_live:
    - answer:
        data: { asked_for: '$input.category' }
        instructions: >-
          There are no live appeals matching that right now. Say so in ONE short
          line of Saudi Arabic, warmly, and offer to take a general donation
          instead. Never invent a campaign.
