# nakhla-giving — pack-wide Arabic strings.
#
# This file exists because `my-donations` renders a donation's stage through
# `$enum_label($item.stage, "stage")` with NO fallback argument. Without these keys the
# donor's status line resolved to nothing on every gift — the pack was the only one in the
# marketplace with no pack-level locale at all.
#
# The `stage.*` values are copied from `xrm.yaml`'s `stage_labels:`, which is the CANONICAL
# source (the console reads it directly). Keep the two in step: the declaration names the
# stage for the operator, this file is the flow-side lookup for the donor.
pack_id: nakhla-giving
strings:
  # `donation` pipeline — what `my-donations` reads.
  stage.pending:  'بانتظار السداد'
  stage.paid:     'تم السداد'
  stage.failed:   'فشل السداد'
  stage.refunded: 'تم الاسترجاع'

  # `appeal` pipeline. No flow renders these today, but the two pipelines share this flat
  # `stage.` namespace and their keys do not collide, so declaring them keeps a future
  # `$enum_label(appeal.stage, "stage")` from hitting the same empty-string bug.
  stage.draft:  'مسودة'
  stage.active: 'حملة نشطة'
  stage.closed: 'مغلقة'

  # Per-stage explainers — what the donor should expect next. `stage_hints:` in xrm.yaml is
  # the canonical home for these now; kept here in step so a flow can render one via
  # `$enum_label(stage, "stage_hint")` the way the other packs do.
  stage_hint.pending:  'تعهدك مسجَّل ولم يُسدَّد بعد — أكمل الدفع لتصلك الإيصال.'
  stage_hint.paid:     'وصل تبرعك وتم إصدار الإيصال. جزاك الله خيراً.'
  stage_hint.failed:   'لم تكتمل عملية الدفع — يمكنك المحاولة مرة أخرى.'
  stage_hint.refunded: 'تم إرجاع المبلغ إليك.'
