# gulf-realty — Gulf property brokerage on WhatsApp.
#
# Demonstrates: XRM reference catalog (developments + unit types) with
# AI-generated imagery rendered as a carousel, a qualified-lead pipeline
# (funnel analytics for free), the scheduling engine for site viewings with
# T-24h / T-2h reminders, a `collect:` intake with fetched pickers, and
# `approve_apply` confirm-before-commit. No pack DB, no code — pure YAML.

id:          gulf-realty
version: 1.8.0
description: 'Off-plan & ready property brokerage for the Gulf — project carousels, mortgage estimates, and site-viewing bookings on WhatsApp.'

listing:
  title:    'Gulf Realty'
  tagline:  'Off-plan tours, payment plans and site viewings — booked in chat'
  category: real-estate
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'Gulf Realty'
  avatar: widget/avatar.png
  accent: '#334155'   # matches the avatar's gradient
  about:  'Browse properties, see payment plans, and book a viewing.'

supported_channels: [whatsapp, web]
# No data-store: developments/units/leads are XRM records, viewings are the
# `booking` system entity, availability is the platform scheduling engine.
# `vision` powers inbound ID / salary-certificate intake.
required_adapters:  [messaging, vision]

default_settings:
  locale: ar

# Pack-level config merged into every flow's `config:` — the indicative profit
# rate mortgage-estimate quotes on. An operator can change the number without
# touching a flow.
config:
  finance:
    profit_rate: 0.049

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

flows:
  - home
  - browse-projects
  - project-detail
  - mortgage-estimate
  - book-viewing
  - my-requests

# Inbound photo intake — a buyer sends an Emirates ID / salary certificate and the
# agent pre-fills the finance qualification instead of re-asking. Logistics only.
# NO `inbound_preprocessing.image`, deliberately.
#
# It read this pack's document fields and handed them to the AGENT to relay into tool arguments.
# When the relay did not happen the customer was asked to type what the picture already showed —
# and the values reached a record only as well as a language model retyped them.
#
# `mortgage-estimate`'s `read_doc` step reads the document itself, before the collect node runs. It also only
# ever fired on an inbound MESSAGE, so a document sent inside a native WhatsApp form was never read.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Gulf Arabic property enquiry voice note — budget, area, bedrooms.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                broker
    display_name:      'Gulf Realty Advisor'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - browse-projects
      - project-detail
      - mortgage-estimate
      - book-viewing
      - my-requests
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
