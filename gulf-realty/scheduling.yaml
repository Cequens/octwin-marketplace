# Scheduling declaration — makes the `advisor` XRM entity a bookable resource for
# site viewings. Availability rules + the capacity ledger live on the platform;
# a viewing is the `booking` XRM system entity. No pack DB.

timezone: Asia/Dubai

resources:
  advisor:
    slot: { default_minutes: 60, window_days: 10 }
    # Reminders before slot_start (seconds) — a buyer gets a day-before and a 2-hour
    # one. Each declares its card, so the PLATFORM sends it, writes it again for the
    # new time on every move, and cancels it when the viewing ends — whoever moves or
    # cancels it (the chat, an advisor in the console). The button opens my-requests.
    reminders:
      - key: t24
        seconds: 86400
        render:
          render_intent: detail_card
          body:
            en: '⏰ Reminder: your viewing with {{ resource }} — {{ time }}.'
            ar: '⏰ تذكير: معاينتك مع {{ resource }} — {{ time }}.'
            ur: '⏰ یاد دہانی: {{ resource }} کے ساتھ آپ کی ملاقات — {{ time }}۔'
          buttons:
            - { title: { en: '📁 My requests', ar: '📁 طلباتي', ur: '📁 میری درخواستیں' }, on_select: { invoke: my-requests } }
      - key: t2
        seconds: 7200
        render:
          render_intent: detail_card
          body:
            en: '⏰ Reminder: your viewing with {{ resource }} — {{ time }}.'
            ar: '⏰ تذكير: معاينتك مع {{ resource }} — {{ time }}.'
            ur: '⏰ یاد دہانی: {{ resource }} کے ساتھ آپ کی ملاقات — {{ time }}۔'
          buttons:
            - { title: { en: '📁 My requests', ar: '📁 طلباتي', ur: '📁 میری درخواستیں' }, on_select: { invoke: my-requests } }

booking:
  entity: booking

# Demo availability for the seeded advisors (matched by name). Idempotent —
# an advisor that already has rules is skipped on re-seed.
demo:
  availability:
    - resource_match: { entity: advisor, field: name, value: 'ريم الحسن' }
      rules:
        - { dow: 0, start: '10:00', end: '18:00', slot_minutes: 60, capacity: 2 }
        - { dow: 1, start: '10:00', end: '18:00', slot_minutes: 60, capacity: 2 }
        - { dow: 2, start: '10:00', end: '18:00', slot_minutes: 60, capacity: 2 }
        - { dow: 6, start: '11:00', end: '16:00', slot_minutes: 60, capacity: 2 }
    - resource_match: { entity: advisor, field: name, value: 'خالد المطيري' }
      rules:
        - { dow: 0, start: '16:00', end: '21:00', slot_minutes: 60, capacity: 1 }
        - { dow: 3, start: '16:00', end: '21:00', slot_minutes: 60, capacity: 1 }
        - { dow: 6, start: '10:00', end: '14:00', slot_minutes: 60, capacity: 2 }
    - resource_match: { entity: advisor, field: name, value: 'مروان صادق' }
      rules:
        - { dow: 1, start: '09:00', end: '17:00', slot_minutes: 60, capacity: 2 }
        - { dow: 4, start: '09:00', end: '17:00', slot_minutes: 60, capacity: 2 }
