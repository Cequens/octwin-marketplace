# project-detail — the drill-down reached from a carousel card. Loads the
# development, then its unit types (a related list via the `development` record
# ref) and renders one detail_card whose buttons carry the next journeys.

flow_id:     project-detail
version:     1
description: |-
  Show one development in full — payment plan, highlights and available unit types.
  Call with `development_id` from a browse-projects card. If the buyer only NAMED a
  project, call browse-projects first and let them tap.

input:
  development_id:
    type:     string
    describe: 'The development record id from a browse-projects card — never a typed name.'

entry:
  - else: true
    goto: load

steps:
  load:
    - do: record_get
      args: { entity: development, record_id: '$input.development_id' }
      bind: dev
      outputs:
        ok:        [{ goto: load_units }]
        not_found: [{ goto: missing }]
        failed:    [{ end: failed }]

  load_units:
    - do: record_list
      args:
        entity: unit_type
        all:    true
        limit:  20
        where:  { all: [{ field: development, op: eq, value: '$input.development_id' }] }
        sort_by: { field: price, dir: asc }
      bind: units
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: show }]
        failed: [{ goto: show }]

  show:
    # `$map(arr, <expr>)` is the SCALAR per-row mapper — the second argument is a
    # real expression evaluated with `$item` bound, so it yields strings. (A bare
    # string second argument would be a field-name PROJECTION, not a template.)
    - assign:
        unit_lines: '$map($coalesce($units.rows, []), $lines($compact([("🛏️ " + $item.fields.bedrooms + $t("project-detail.bedrooms_suffix")), ($format_number($item.fields.area_sqft) + $t("project-detail.sqft_suffix")), $format_money_field($item.fields.price, $coalesce($item.fields.currency, "AED"))]), " · "))'
    - render:
        # detail_card carries no image — the buyer already saw the hero on the
        # browse carousel; this card is the long copy + the three next actions
        # (`$caps.buttons.max`).
        render_intent: detail_card
        header: '{$dev.fields.name}'
        body: '$lines($compact([
                 $dev.fields.developer != null ? $t("project-detail.developer", { developer: $dev.fields.developer }) : null,
                 $dev.fields.area != null ? $t("project-detail.area", { area: $dev.fields.area }) : null,
                 $dev.fields.handover != null ? $t("project-detail.handover", { handover: $dev.fields.handover }) : null,
                 $dev.fields.from_price != null ? $t("project-detail.from", { price: $format_money_field($dev.fields.from_price, $coalesce($dev.fields.currency, "AED")) }) : null,
                 $dev.fields.payment_plan != null ? $t("project-detail.plan", { plan: $dev.fields.payment_plan }) : null,
                 $dev.fields.highlights != null ? $t("project-detail.highlights", { highlights: $dev.fields.highlights }) : null,
                 $length($unit_lines) > 0 ? $t("project-detail.units_header") : null,
                 $length($unit_lines) > 0 ? $lines($unit_lines, "\n") : null
               ]), "\n")'
        buttons:
          - { title: '{$t("project-detail.btn_viewing")}',  on_select: { invoke: book-viewing,      with: { development_id: '$input.development_id' } } }
          - { title: '{$t("project-detail.btn_mortgage")}', on_select: { invoke: mortgage-estimate, with: { development_id: '$input.development_id' } } }
          - { title: '{$t("project-detail.btn_back")}',     on_select: { invoke: browse-projects } }
      memory_note: 'Showed development {$dev.fields.name} with {$length($coalesce($units.rows, []))} unit type(s).'
    - end: applied

  missing:
    - answer:
        instructions: 'That project id does not resolve. Apologise in one line and call browse-projects so the buyer can pick from the live list.'
