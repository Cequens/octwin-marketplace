# XRM declaration for gulf-realty. Three shapes, each earning something:
#
#  • `development` / `unit_type`  — shared reference catalog (no pipeline ⇒ always
#    listable), searchable by name/area, carrying an AI-generated hero image.
#  • `advisor`                    — the bookable resource the scheduling engine
#    expands availability for (see scheduling.yaml).
#  • `buyer_lead`                 — a per-contact PIPELINE record. A pipeline is
#    what earns funnel analytics (`octwin analytics buyer_lead`) and milestones.

entities:
  development:
    label: { en: 'Development', ar: 'مشروع' }
    fields:
      name:          { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      developer:     { type: text, label: { en: 'Developer', ar: 'المطوّر' } }
      city:          { type: select, options: [dubai, abu_dhabi, riyadh, jeddah, sharjah, cairo], label: { en: 'City', ar: 'المدينة' } }
      area:          { type: text, label: { en: 'Area', ar: 'المنطقة' } }
      handover:      { type: text, label: { en: 'Handover', ar: 'التسليم' } }
      payment_plan:  { type: text, label: { en: 'Payment plan', ar: 'خطة السداد' } }
      from_price:    { type: money, label: { en: 'Starting price', ar: 'يبدأ من' }, sortable: true }
      currency:      { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'AED' }
      highlights:    { type: textarea, label: { en: 'Highlights', ar: 'أبرز الميزات' } }
      hero:          { type: image, label: { en: 'Hero image', ar: 'الصورة' } }
      rating:        { type: number, label: { en: 'Demand score', ar: 'مؤشر الطلب' }, default: 0 }
    list: [developer, city, from_price]
    search: { text: [name, area, developer], rank_by: rating }
    dedupe_by: name

  unit_type:
    label: { en: 'Unit type', ar: 'نوع الوحدة' }
    fields:
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      development: { type: record, entity: development, label: { en: 'Development', ar: 'المشروع' } }
      bedrooms:    { type: number, label: { en: 'Bedrooms', ar: 'غرف النوم' }, sortable: true }
      area_sqft:   { type: number, label: { en: 'Area (sqft)', ar: 'المساحة (قدم²)' } }
      price:       { type: money, label: { en: 'Price', ar: 'السعر' }, sortable: true }
      currency:    { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'AED' }
      view:        { type: text, label: { en: 'View', ar: 'الإطلالة' } }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
    list: [development, bedrooms, price]
    search: { text: [name, view] }
    dedupe_by: name

  advisor:
    label: { en: 'Advisor', ar: 'مستشار عقاري' }
    fields:
      name:      { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      title:     { type: text, label: { en: 'Title', ar: 'المسمى' } }
      languages: { type: text, label: { en: 'Languages', ar: 'اللغات' } }
      city:      { type: select, options: [dubai, abu_dhabi, riyadh, jeddah, sharjah, cairo], label: { en: 'City', ar: 'المدينة' } }
      timezone:  { type: text, label: { en: 'Timezone', ar: 'المنطقة الزمنية' }, default: 'Asia/Dubai' }
      photo:     { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      rating:    { type: number, label: { en: 'Rating', ar: 'التقييم' }, default: 0 }
    list: [title, city, languages]
    search: { text: [name, languages], rank_by: rating }
    dedupe_by: name

  # The commercial funnel. `record_milestone` marks the money moments; the
  # console + `octwin analytics buyer_lead` chart conversion between stages.
  buyer_lead:
    label: { en: 'Buyer lead', ar: 'عميل محتمل' }
    fields:
      full_name:      { type: text, label: { en: 'Name', ar: 'الاسم' } }
      budget:         { type: money, label: { en: 'Budget', ar: 'الميزانية' }, sortable: true }
      bedrooms:       { type: number, label: { en: 'Bedrooms', ar: 'غرف النوم' } }
      city:           { type: select, options: [dubai, abu_dhabi, riyadh, jeddah, sharjah, cairo], label: { en: 'City', ar: 'المدينة' } }
      purpose:        { type: select, options: [end_use, investment], label: { en: 'Purpose', ar: 'الغرض' } }
      finance:        { type: select, options: [cash, mortgage], label: { en: 'Finance', ar: 'التمويل' } }
      development:    { type: record, entity: development, label: { en: 'Interested in', ar: 'المشروع' } }
      monthly_income: { type: number, label: { en: 'Monthly income', ar: 'الدخل الشهري' } }
      notes:          { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }
    list: [full_name, city, budget, finance]
    pipeline:
      stages:   [new, qualified, viewing_booked, offer_made, reserved, lost]
      initial:  new
      terminal: [reserved, lost]
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      new:            { en: 'New', ar: 'جديد' }
      qualified:      { en: 'Qualified', ar: 'مؤهل' }
      viewing_booked: { en: 'Viewing booked', ar: 'تم حجز معاينة' }
      offer_made:     { en: 'Offer made', ar: 'تم تقديم عرض' }
      reserved:       { en: 'Reserved', ar: 'تم الحجز' }
      lost:           { en: 'Lost', ar: 'مغلق دون بيع' }
    milestones:
      qualified_lead:  { label: { en: 'Qualified', ar: 'مؤهَّل' },      stage: qualified }
      viewing_secured: { label: { en: 'Viewing booked', ar: 'حجز معاينة' }, stage: viewing_booked }
      unit_reserved:   { label: { en: 'Unit reserved', ar: 'حجز وحدة' },  stage: reserved, terminal: true }

  # The site viewing IS the platform booking entity, widened with the two
  # display snapshots the confirmation card reads back.
  booking:
    extends: system
    label: { en: 'Site viewing', ar: 'معاينة' }
    fields:
      development:   { type: record, entity: development, label: { en: 'Development', ar: 'المشروع' } }
      advisor_label: { type: text, label: { en: 'Advisor', ar: 'المستشار' } }
      slot_label:    { type: text, label: { en: 'Slot', ar: 'الموعد' } }
      party_size:    { type: number, label: { en: 'Party size', ar: 'عدد الحضور' } }

segments:
  hot_leads:
    entity: buyer_lead
    label: { en: 'Hot leads', ar: 'عملاء ساخنون' }
    where: { all: [{ active: true }] }

