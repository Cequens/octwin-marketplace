# shield-motor — a UAE motor insurer on WhatsApp.
#
# Two journeys that must behave very differently. A QUOTE is arithmetic the bot may do —
# from published rating factors on a `plan` record, labelled indicative and never binding.
# A CLAIM is not: it is a case with an FNOL (first notification of loss) record, an
# assessor, and a settlement only a human decides. The pack draws that line in data, not
# just in the prompt: there is no stage or action reachable from a flow that admits
# liability or states a settlement.

id:          shield-motor
version:     '1.6.0'
description: 'Motor insurance — indicative premium from published rating factors, policy enquiry intake, and first-notification-of-loss claims a real assessor handles.'

listing:
  title:    'Shield Motor'
  tagline:  'Indicative quotes, and claims a human assessor actually decides'
  category: finance
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'Shield Motor'
  avatar: widget/avatar.png
  accent: '#047857'   # matches the avatar's gradient
  about:  'Get a quote, add cover, and open a claim.'

supported_channels: [whatsapp, web]
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

flows:
  - home
  - plans
  - quote
  - claim

inbound_preprocessing:
  image:
    enabled: true
    ack: '📸 وصلت الصورة، جاري فحصها...'
    prompt: |-
      You are an intake assistant for a motor insurer. Classify each image and extract structured fields. Describe only what is VISIBLE. You must NOT assign fault, estimate a repair cost, or say whether anything is covered.

      Respond with JSON only (no markdown) — an object with an `images` array holding EXACTLY ONE entry per input image, IN ORDER:
      {
        "images": [
          {
            "media_ref": "<copy the MEDIA- ref for this image, in order>",
            "doc_type": "vehicle_damage" | "mulkiya" | "driving_licence" | "police_report" | "emirates_id" | "other",
            "plate": "<licence plate if legible, else null>",
            "make_model": "<make and model if identifiable, else null>",
            "visible_damage": "<short factual description of visible damage, or null>",
            "summary_ar": "<one short Arabic line describing the image>"
          }
        ]
      }
      Return entries in the SAME ORDER as provided; copy each entry's media_ref from the list.
    note_template: |-
      $lines($compact([
        "📸 صورة ({$media_ref}) — النوع: {$doc_type ?? 'غير محدد'}",
        $plate != null          ? "اللوحة: {$plate}" : null,
        $make_model != null     ? "المركبة: {$make_model}" : null,
        $visible_damage != null ? "الأضرار الظاهرة: {$visible_damage}" : null,
        $summary_ar != null     ? "ملخص: {$summary_ar}" : null
      ]))
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Arabic motor insurance voice note — the incident, the vehicle, the location. Do not assign fault.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                advisor
    display_name:      'Shield Motor Advisor'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - plans
      - quote
      - claim
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
