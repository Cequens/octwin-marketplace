# shield-motor — pack-wide English strings.
#
# `cases.*` / `status.*` / `decision.*` are the boot-enforced casework locale contract: every
# language this pack ships must carry the complete set, or the pack is REFUSED at load. The
# decision wording is written so it can be relayed verbatim: `claim_declined` says the claim is
# not covered without the bot adding a reason the assessor did not give.
#
# The key after the dot is a declared id from `worklist.yaml`, not prose — byte-identical to
# `locale.ar.yaml`; only the value is translated.
pack_id: shield-motor
strings:
