# home — the front door. A customer with a live claim lands on it; the emergency route is
# a top-level row because that is what someone standing beside a damaged car needs.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this customer.'

entry:
  - else: true
    goto: count

steps:
  count:
    - do: case_list
      args: { contact_id: '$contact.id' }
      bind: cases
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign: { claims: '$length($coalesce($cases, []))' }
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $claims > 0 ? $t("home.open_claims", { count: $claims }) : null
               ]), "\n")'
        cta: '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_claim")}',  description: '{$t("home.row_claim_d")}',  on_select: { invoke: claim } }
          - { title: '{$t("home.row_status")}', description: '{$t("home.row_status_d")}', on_select: { invoke: claim, with: { mode: status } } }
          - { title: '{$t("home.row_quote")}',  description: '{$t("home.row_quote_d")}',  on_select: { invoke: quote } }
          - { title: '{$t("home.row_plans")}',  description: '{$t("home.row_plans_d")}',  on_select: { invoke: plans } }
      memory_note: 'Showed the Shield Motor menu ({$claims} open claim(s)).'
    - end: applied
