# Standing automation jobs for PharmaPlus.
#
# This pack says the SLA OUT LOUD — `otc.locale.ar.yaml` tells the patient
# «بتتواصل معاك خلال {hours} ساعة كحد أقصى». Until this job existed nothing
# measured the number the patient was given: `sla_due_at` was stamped at
# enrolment and never read.
#
# The sweep is entity-level, so this one job covers all five case types
# (prescription_review 2h · otc_order 6h · repeat_request 6h · insurance_query 24h
# · general_query 24h). It skips terminal-stage cases, alerts the responsible
# operator through the ops inbox, relays `message` to the patient ONCE per breach
# (deduped on `sla_notified_at`), and mints the `sla_breach` record event that
# `xrm.yaml`'s `on.sla_breach` hook turns into a pharmacist task.
#
# `escalate_to:` routes the breached item to a queue. It took three rounds to land:
# first omitted because the KB documented the target two incompatible ways, then kept
# out once it was typed as a principal-ref (`user:`/`team:`) — an id only the INSTALLING
# tenant knows, unwritable in a published pack. The platform then added `queue:<key>`,
# resolved against THIS pack's own `worklist.yaml` `queues:`, so it travels with the pack
# (KB 968db6a91806, `worklist-guide` §5). A key we never declared fails at pack load,
# naming the legal ones — it can no longer mis-route in silence.
#
# `pharmacist_review` is the senior clinical desk; a breach anywhere in the pack ends up
# in front of a pharmacist.
#
# Know the limit: routing a queue notifies nobody new. The item appears in that queue's
# work inbox, and the ops-inbox alert still goes to the previous assignee — so a breach on
# an UNASSIGNED item escalates silently. The customer reassurance below is unaffected.

jobs:
  - key:              case_sla
    kind:             sla_sweep
    entity:           case
    # Five minutes. The prescription-review SLA is 2h — the shortest in the repo,
    # and the one the patient was quoted — so the detection lag has to be small
    # against it. Floor is 60.
    interval_seconds: 300
    config:
      escalate_to: queue:pharmacist_review
      message: 'نعتذر عن التأخير 🙏 الصيدلي بيراجع طلبك دلوقتي وهنتواصل معاك حالاً.'
