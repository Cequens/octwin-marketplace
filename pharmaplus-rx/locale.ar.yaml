# pharmaplus-rx — pack-wide Arabic strings.
#
# The wording here is part of the safety design. `stage_hint.pharmacist_review` says a
# pharmacist is READING the prescription — never that it is approved — and
# `decision.needs_clarification` is phrased so it can be relayed verbatim without the bot
# adding a clinical gloss.
