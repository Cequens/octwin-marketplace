# pharmaplus-rx — a community pharmacy chain on WhatsApp.
#
# This is the pack where the BOUNDARY is the product. A pharmacy bot that answers "is this
# safe with my other medicine?" is dangerous, so this one structurally cannot: it reads a
# prescription photo into structured intake, opens a PHARMACIST REVIEW case, and reports
# only what the pharmacist decided. It sells over-the-counter items and books refills; it
# never advises, substitutes, doses, or dispenses a prescription-only medicine on its own.

id:          pharmaplus-rx
version:     '2.1.0'
description: 'Community pharmacy — send a prescription photo for pharmacist review, reorder a repeat, and shop over-the-counter items, with every clinical question routed to a human.'

listing:
  title:    'PharmaPlus Rx'
  tagline:  'Prescription intake and refills — every clinical call left to a pharmacist'
  category: healthcare
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'PharmaPlus Rx'
  avatar: widget/avatar.png
  accent: '#0369a1'   # matches the avatar's gradient
  about:  'Send your prescription, order a refill, and ask a pharmacist.'

supported_channels: [whatsapp, web]
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

default_conversation_context:
  lang: { type: enum, enum: [ar, en, bilingual], default: ar, describe: 'Reply language.' }

config:
  policy:
    delivery_fee: 20
    currency:     EGP

flows:
  - home
  - otc
  - prescription
  - my-orders

# NO `inbound_preprocessing.image`, deliberately.
#
# The defensive vision prompt that used to live here — TRANSCRIBE the prescription, refuse to
# interpret it — moved to `prescription.vision_prompt` in the flow's locale file. It is still
# written that way, and for the same reason: this is the one place a hallucinated dose could do
# real harm, so the constraint belongs in the prompt rather than only in the agent's instructions.
#
# It read the prescription and handed the result to the AGENT, which then copied it into tool
# arguments — a language model in the middle of a drug list. `prescription`'s `read_rx` step reads
# the page itself now, so the transcription never passes through the model at all.
#
# It also only ever fired on an inbound MESSAGE, so a photo sent inside a native WhatsApp form was
# never read. One reading, in the flow, is safer AND works everywhere.
#
# The voicenote half stays: a patient may dictate, and the agent genuinely cannot hear.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Egyptian Arabic pharmacy request voice note — the item wanted, the address. Do not interpret medical content.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                counter
    display_name:      'PharmaPlus Counter'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - otc
      - prescription
      - my-orders
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
