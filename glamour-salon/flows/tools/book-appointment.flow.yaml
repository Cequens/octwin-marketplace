# book-appointment — treatment → stylist (filtered to that specialty) → slot → ✅.
#
# `slot_minutes` is the TREATMENT's own `duration_min`, and it is load-bearing on BOTH
# sides of the booking — keep them in sync or the client is rejected AFTER she confirms:
#
#   • `booking_reserve` claims every grid slot the duration covers, and refuses a start
#     whose span would run past the stylist's closing time.
#   • `slot_list` is therefore given the SAME number as `fits_minutes`, so the picker
#     only offers a start with enough consecutive free slots behind it.
#
# Passing the duration to one and not the other is exactly how a 18:00 start was offered
# for a three-hour colour on a day that closes at 20:00, and then refused on the ✅.

flow_id:     book-appointment
version:     1
description: |-
  [interactive] Book a salon appointment. Call when the client wants a booking. Pass
  `treatment_id` and/or `stylist_id` when she came from a card; the tool asks for
  whatever is missing.

input:
  treatment_id:
    type:     string
    optional: true
    describe: 'Treatment record id from a services card — never a typed name.'
  stylist_id:
    type:     string
    optional: true
    describe: 'Stylist record id from a stylists card — never a typed name.'

entry:
  - else: true
    goto: collect_fields

steps:
  collect_fields:
    - collect:
        before_each:
          - assign: { tr_label: null, tr_minutes: null, tr_category: null, st_label: null }
          - if: '$state.treatment_id != null'
            then:
              - do: record_get
                args: { entity: treatment, record_id: '$state.treatment_id' }
                bind: tr
                outputs:
                  ok:        []
                  not_found: [{ assign: { state: '$merge($state, { treatment_id: null })' } }]
                  failed:    []
              - if: '$tr.fields != null'
                then:
                  - assign:
                      tr_label:    '$tr.fields.name'
                      tr_minutes:  '$tr.fields.duration_min'
                      tr_category: '$tr.fields.category'
          - if: '$state.stylist_id != null'
            then:
              - do: record_get
                args: { entity: stylist, record_id: '$state.stylist_id' }
                bind: st
                outputs:
                  ok:        []
                  # A dead resource id would call slot_list on nothing — drop it.
                  not_found: [{ assign: { state: '$merge($state, { stylist_id: null })' } }]
                  failed:    []
              - if: '$st.fields != null'
                then:
                  - assign: { st_label: '$st.fields.name' }
        # `retry_note` is set by the recovery steps below and carried here rather than
        # rendered on its own: the accumulator keeps only the LAST render of a turn, so a
        # separate warning card followed by this picker would show the picker alone.
        # Prepending it to the progress card puts the warning and the new times in one
        # message, which is also the right shape on WhatsApp.
        progress: '$lines($compact([
                     $state.retry_note,
                     $t("book-appointment.progress.header"),
                     $tr_label != null ? $t("book-appointment.progress.treatment", { treatment: $tr_label }) : null,
                     $st_label != null ? $t("book-appointment.progress.stylist", { stylist: $st_label }) : null,
                     $state.slot_label != null ? $t("book-appointment.progress.slot", { slot: $state.slot_label }) : null
                   ]), "\n")'
        gap_instructions: 'Ask the client for the next missing detail ({$collect_field}), one at a time, in her language. Re-call book-appointment once she answers. Never give beauty or medical advice.'
        fields:
          - field: treatment_id
            when: '$state.treatment_id == null'
            label: '$t("book-appointment.label.treatment")'
            options:
              header: book-appointment.field_header.treatment
              cta:    book-appointment.field_cta.treatment
              fetch:  { do: record_search, args: { entity: treatment, query: '', limit: 10 }, bind: trs }
              rows:   '$trs.rows'
              map:
                value:       '$item.id'
                label:       '$item.fields.name'
                description: '$format_money_field($item.fields.price, "SAR")'
                selection:   { tr_label: '$item.fields.name', tr_minutes: '$item.fields.duration_min', tr_category: '$item.fields.category' }
              auto_resolve: true
          # Only specialists who do this category are offered (`has` on the
          # multi_select), so a nail artist never appears for a colour job.
          - field: stylist_id
            when: '$state.stylist_id == null'
            label: '$t("book-appointment.label.stylist")'
            options:
              header: book-appointment.field_header.stylist
              cta:    book-appointment.field_cta.stylist
              fetch:  { do: record_search, args: { entity: stylist, query: '', limit: 10, where: { all: [{ field: specialties, op: has, value: '$tr_category' }] } }, bind: sts }
              rows:   '$sts.rows'
              map:
                value:       '$item.id'
                label:       '$item.fields.name'
                description: '$item.fields.title'
                selection:   { st_label: '$item.fields.name' }
              auto_resolve: true
          - field: slot_start
            label: '$t("book-appointment.label.slot")'
            options:
              header: book-appointment.field_header.slot
              cta:    book-appointment.field_cta.slot
              # `fits_minutes` is the SAME expression `booking_reserve` gets below, so the
              # picker and the reservation agree by construction: only starts with enough
              # consecutive free slots to hold the whole treatment are offered.
              fetch:  { do: slot_list, args: { resource_record_id: '$state.stylist_id', fits_minutes: '$coalesce($tr_minutes, $state.tr_minutes, 90)' }, bind: slots }
              rows:   '$slots'
              map:
                value: '$item.slot_start'
                label: '$lines($compact([$item.local_date, $item.local_time]), " — ")'
                selection:
                  slot_label: '$lines($compact([$item.local_date, $item.local_time]), " — ")'
          - field: notes
            required: false
            label:    '$t("book-appointment.label.notes")'
            describe: 'Anything the specialist should know (allergies, a reference photo, a preference).'
        # Drop a spent retry warning on the way out, or it reappears on the progress card
        # if she backs out of the preview (`on_other: collect_fields`).
        complete:
          - assign: { state: '$merge($state, { retry_note: null })' }
          - goto: confirm

  confirm:
    - use: approve_apply
      with:
        preview: '$lines($compact([
                    $t("book-appointment.preview.header"),
                    $t("book-appointment.preview.treatment", { treatment: $coalesce($tr_label, $state.tr_label, "-") }),
                    $t("book-appointment.preview.stylist", { stylist: $coalesce($st_label, $state.st_label, "-") }),
                    $t("book-appointment.preview.slot", { slot: $coalesce($state.slot_label, "-") }),
                    $t("book-appointment.preview.duration", { min: $coalesce($tr_minutes, $state.tr_minutes, 30) }),
                    $state.notes != null ? $t("book-appointment.preview.notes", { notes: $state.notes }) : null
                  ]), "\n")'
        header:        '{$t("book-appointment.approve_header")}'
        footer:        '{$t("book-appointment.approve_footer")}'
        confirm_title: '{$t("book-appointment.confirm_title")}'
        cancel_title:  '{$t("book-appointment.cancel_title")}'
        apply:         reserve_chair
        abort:         aborted
        on_other:      collect_fields
        memory_note:   'Appointment NOT booked yet — awaiting the client''s ✅.'

  reserve_chair:
    - do: booking_reserve
      args:
        resource_record_id: '$state.stylist_id'
        slot_start:         '$state.slot_start'
        # Recorded on the booking so the salon sees the true length. The diary is
        # protected by the per-stylist grid step, not by this number.
        slot_minutes:       '$coalesce($tr_minutes, $state.tr_minutes, 90)'
        fields:
          treatment:       '$state.treatment_id'
          stylist:         '$state.stylist_id'
          treatment_label: '$coalesce($tr_label, $state.tr_label)'
          stylist_label:   '$coalesce($st_label, $state.st_label)'
          slot_label:      '$state.slot_label'
          notes:           '$state.notes'
      bind: appt
      # Two DIFFERENT failures, so two messages. `full` is a genuine race — another client
      # took the chair between the picker and the ✅. `invalid_slot` means the start itself
      # stopped being valid: with `fits_minutes` on the picker the duration case no longer
      # reaches here, so what lands is a confirm that arrived after the slot had passed.
      # They shared one string until 2026-08-08, which told a client her time was "taken"
      # when in truth it had never been bookable for that treatment.
      outputs:
        ok:           [{ goto: remind }]
        full:         [{ goto: slot_taken }]
        invalid_slot: [{ goto: slot_expired }]
        failed:       [{ end: failed }]

  remind:
    - if: '$length($coalesce($appt.reminders, [])) > 0'
      then:
        - do: schedule_notify
          args:
            to:          { contact_id: '$contact.id' }
            send_at:     '$appt.reminders[0].send_at'
            dedupe_key:  'glamour:appt:{$appt.record_id}:t24'
            memory_note: 'Appointment reminder (t24)'
            intent:
              render_intent: detail_card
              body: '{$t("book-appointment.reminder.body", { treatment: $coalesce($tr_label, ""), slot: $coalesce($state.slot_label, "") })}'
              buttons:
                - { title: '{$t("book-appointment.reminder.mine")}', on_select: { invoke: my-visits } }
          detach: true
    - render:
        render_intent: detail_card
        header: '{$t("book-appointment.done_header")}'
        body: '$lines($compact([
                 $t("book-appointment.done_body", { stylist: $coalesce($st_label, ""), slot: $coalesce($state.slot_label, "") }),
                 $t("book-appointment.done_ref", { ref: $appt.record_number }),
                 $t("book-appointment.done_note")
               ]), "\n")'
        buttons:
          - { title: '{$t("book-appointment.btn_mine")}',     on_select: { invoke: my-visits } }
          - { title: '{$t("book-appointment.btn_services")}', on_select: { invoke: services } }
      memory_note: 'Booked appointment #{$appt.record_number} for {$tr_minutes} minutes with {$st_label}.'
    - end: applied

  # Both recoveries re-open the picker instead of ending. Telling a client to choose
  # another time and then closing the flow left her with nothing to choose from.
  slot_taken:
    - assign: { state: '$merge($state, { retry_note: $t("book-appointment.slot_taken") })' }
    - goto: reoffer_slot

  slot_expired:
    - assign: { state: '$merge($state, { retry_note: $t("book-appointment.slot_expired") })' }
    - goto: reoffer_slot

  # Clear the chosen time only — treatment and stylist survive, so she re-picks one thing.
  reoffer_slot:
    - assign: { state: '$merge($state, { slot_start: null, slot_label: null })' }
    - note: 'That time did not hold — showing her the available times again. The appointment is NOT booked.'
    - goto: collect_fields

  aborted:
    - end: { status: aborted, body: '{$t("book-appointment.aborted")}' }
