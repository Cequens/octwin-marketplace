# home — the front door. Counts upcoming appointments so a returning client lands on
# her booking rather than the menu.

flow_id:     home
version:     1
description: Main menu / welcome. Call on a greeting, an unclear or off-topic message, or "what can you do?".

input:
  message:
    type:     string
    optional: true
    describe: 'Optional ONE short greeting line YOU compose for this client.'

entry:
  - else: true
    goto: count

steps:
  count:
    - do: record_aggregate
      args: { entity: booking, op: count, active_only: true, contact_id: '$contact.id' }
      bind: upcoming
      outputs:
        ok:     [{ goto: show }]
        failed: [{ goto: show }]

  show:
    - assign: { n: '$coalesce($upcoming.value, 0)' }
    - render:
        render_intent: list_picker
        header: '{$t("home.header")}'
        body: '$lines($compact([
                 $coalesce($input.message, $t("home.greeting")),
                 $n > 0 ? $t("home.upcoming", { count: $n }) : null
               ]), "\n")'
        cta: '{$t("home.cta")}'
        items:
          - { title: '{$t("home.row_services")}', description: '{$t("home.row_services_d")}', on_select: { invoke: services } }
          - { title: '{$t("home.row_stylists")}', description: '{$t("home.row_stylists_d")}', on_select: { invoke: stylists } }
          - { title: '{$t("home.row_book")}',     description: '{$t("home.row_book_d")}',     on_select: { invoke: book-appointment } }
          - { title: '{$t("home.row_bridal")}',   description: '{$t("home.row_bridal_d")}',   on_select: { invoke: services, with: { category: bridal } } }
          - { title: '{$t("home.row_mine")}',     description: '{$t("home.row_mine_d")}',     on_select: { invoke: my-visits } }
      memory_note: 'Showed the Glamour Salon menu ({$n} upcoming appointment(s)).'
    - end: applied
