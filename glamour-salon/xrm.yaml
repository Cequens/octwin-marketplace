    fields: { code: 'CUT-BLOW', name: 'قص وتصفيف', category: hair, description: 'قص وغسيل وتصفيف بالسيشوار. Cut, wash and blow-dry.', duration_min: 60, price: 180, currency: SAR, popularity: 5, photo: 'generate:Photograph of a modern upscale hair salon interior with a stylist blow-drying a client hair at a mirrored station, warm lighting, elegant decor, photorealistic.' }
