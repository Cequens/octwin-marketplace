# XRM declaration for glamour-salon.
#
#  • `treatment` — the menu. `duration_min` is load-bearing: the booking flow passes it
#                  to `booking_reserve` as `slot_minutes`, so a long colour job holds
#                  the chair for its real length instead of one nominal slot.
#  • `stylist`   — the bookable resource, ranked by a rating rolled up from surveys.
#  • `booking`   — the appointment (system entity, widened with display snapshots).
#  • `survey_response` — widened with the rated `stylist`, the rollup dimension.

entities:
  treatment:
    label: { en: 'Treatment', ar: 'خدمة' }
    fields:
      code:         { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:         { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      category:     { type: select, options: [hair, colour, nails, skincare, spa, makeup, bridal], label: { en: 'Category', ar: 'القسم' } }
      description:  { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      # The real chair time — this is what the booking passes as `slot_minutes`.
      duration_min: { type: number, label: { en: 'Duration (min)', ar: 'المدة (دقيقة)' }, sortable: true }
      price:        { type: money, label: { en: 'Price', ar: 'السعر' }, sortable: true }
      currency:     { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'SAR' }
      photo:        { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:   { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [category, duration_min, price]
    search: { text: [name, description], semantic: [name, description], rank_by: popularity }
    dedupe_by: code

  stylist:
    label: { en: 'Stylist', ar: 'أخصائية' }
    fields:
      name:         { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      title:        { type: text, label: { en: 'Title', ar: 'المسمى' } }
      specialties:  { type: multi_select, options: [hair, colour, nails, skincare, spa, makeup, bridal], label: { en: 'Specialties', ar: 'التخصصات' } }
      languages:    { type: text, label: { en: 'Languages', ar: 'اللغات' } }
      bio:          { type: textarea, label: { en: 'Bio', ar: 'نبذة' } }
      photo:        { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      timezone:     { type: text, label: { en: 'Timezone', ar: 'المنطقة الزمنية' }, default: 'Asia/Riyadh' }
      # Rolled up from the post-visit survey — never typed by hand.
      rating:       { type: number, label: { en: 'Rating', ar: 'التقييم' }, default: 0, sortable: true }
      rating_count: { type: number, label: { en: 'Ratings', ar: 'عدد التقييمات' }, default: 0 }
    list: [title, languages, rating]
    search: { text: [name, languages], rank_by: rating }
    dedupe_by: name

  booking:
    extends: system
    label: { en: 'Appointment', ar: 'موعد' }
    fields:
      treatment:       { type: record, entity: treatment, label: { en: 'Treatment', ar: 'الخدمة' } }
      stylist:         { type: record, entity: stylist, label: { en: 'Stylist', ar: 'الأخصائية' } }
      treatment_label: { type: text, label: { en: 'Treatment', ar: 'الخدمة' } }
      stylist_label:   { type: text, label: { en: 'Stylist', ar: 'الأخصائية' } }
      slot_label:      { type: text, label: { en: 'Slot', ar: 'الموعد' } }
      notes:           { type: textarea, label: { en: 'Notes', ar: 'ملاحظات' } }

  survey_response:
    extends: system
    fields:
      stylist: { type: record, entity: stylist, label: { en: 'Stylist', ar: 'الأخصائية' } }
    list: [survey_key, score, stylist]

segments:
  upcoming:
    entity: booking
    label: { en: 'Upcoming', ar: 'المواعيد القادمة' }
    where: { all: [{ active: true }] }

demo:
