# What the salon does by itself — rules (guide: craft-automation; every change, time and action: rules-guide).
rules:
  # The appointment's reminders, a day and two hours before. They follow the appointment: moved, they move;
  # cancelled or finished, they stop — whoever does it (the chat, reception in the console). The button opens
  # the client's own appointments.
  - key: appointment_day_before
    for: booking
    at: slot_start - 24h
    do:
      - remind:
          resource_type: stylist
          render:
            render_intent: detail_card
            body:
              en: '⏰ A reminder of your {{ record.fields.treatment_label }} appointment — {{ record.fields.slot_start }}. We look forward to seeing you 💐'
              ar: '⏰ تذكير بموعد {{ record.fields.treatment_label }} — {{ record.fields.slot_start }}. نتشرف بحضورك 💐'
            buttons:
              - { title: { en: '🗓️ My appointments', ar: '🗓️ مواعيدي' }, on_select: { invoke: my-visits } }

  - key: appointment_two_hours_before
    for: booking
    at: slot_start - 2h
    do:
      - remind:
          resource_type: stylist
          render:
            render_intent: detail_card
            body:
              en: '⏰ A reminder of your {{ record.fields.treatment_label }} appointment — {{ record.fields.slot_start }}. We look forward to seeing you 💐'
              ar: '⏰ تذكير بموعد {{ record.fields.treatment_label }} — {{ record.fields.slot_start }}. نتشرف بحضورك 💐'
            buttons:
              - { title: { en: '🗓️ My appointments', ar: '🗓️ مواعيدي' }, on_select: { invoke: my-visits } }
