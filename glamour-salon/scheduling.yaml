# Scheduling declaration — stylists as bookable resources, one client at a time.
#
# ── A REAL LIMIT, STATED HONESTLY ────────────────────────────────────────────
# `booking_reserve` claims a seat on the slot it is given. Passing a longer
# `slot_minutes` records the true treatment length on the booking, but it does NOT
# consume the following grid slots — a four-hour treatment booked on a 30-minute grid
# leaves 15:30, 16:00 … bookable underneath it. (Verified: `octwin scheduling --slots`
# shows only the start slot at 0/1 after a 240-minute reservation.)
#
# So the grid here is NOT 30 minutes. Each stylist's rules use a `slot_minutes` close to
# the length of the work she actually does, which makes one claimed slot equal one real
# appointment:
#
#   • ريهام (colour + keratin, 3-4h)  → 120-minute slots
#   • سُمية (facials, 60-75m)         → 90-minute slots
#   • لمى   (nails, 90m)              → 90-minute slots
#   • دانية (bridal + makeup, 5h)     → 240-minute slots
#
# A salon whose treatments vary more widely should split the long work onto its own
# resource rather than relying on duration to reserve consecutive slots.

timezone: Asia/Riyadh

resources:
  stylist:
    slot: { default_minutes: 90, window_days: 21 }
    reminders:
      - { key: t24, seconds: 86400 }
      - { key: t2,  seconds: 7200 }

booking:
  entity: booking

demo:
  availability:
    # Colour and keratin — long sessions, so long slots.
    - resource_match: { entity: stylist, field: name, value: 'ريهام' }
      rules:
        - { dow: 6, start: '10:00', end: '20:00', slot_minutes: 120, capacity: 1 }
        - { dow: 0, start: '10:00', end: '20:00', slot_minutes: 120, capacity: 1 }
        - { dow: 1, start: '10:00', end: '20:00', slot_minutes: 120, capacity: 1 }
        - { dow: 2, start: '14:00', end: '20:00', slot_minutes: 120, capacity: 1 }
    # Facials — 60-75 minutes plus turnaround.
    - resource_match: { entity: stylist, field: name, value: 'سُمية' }
      rules:
        - { dow: 0, start: '11:00', end: '19:00', slot_minutes: 90, capacity: 1 }
        - { dow: 2, start: '11:00', end: '19:00', slot_minutes: 90, capacity: 1 }
        - { dow: 4, start: '11:00', end: '17:00', slot_minutes: 90, capacity: 1 }
    # Nails — 90 minutes.
    - resource_match: { entity: stylist, field: name, value: 'لمى' }
      rules:
        - { dow: 6, start: '12:00', end: '21:00', slot_minutes: 90, capacity: 1 }
        - { dow: 1, start: '12:00', end: '21:00', slot_minutes: 90, capacity: 1 }
        - { dow: 3, start: '12:00', end: '21:00', slot_minutes: 90, capacity: 1 }
    # Bridal — a whole half-day per client.
    - resource_match: { entity: stylist, field: name, value: 'دانية' }
      rules:
        - { dow: 4, start: '09:00', end: '19:00', slot_minutes: 240, capacity: 1 }
        - { dow: 5, start: '09:00', end: '19:00', slot_minutes: 240, capacity: 1 }
