# services — the service list as a carousel (each has a trade photo). Tapping a card
# starts a work order for that service.

flow_id:     services
version:     1
description: |-
  Show the services with their call-out fee. Call when the customer asks what you do,
  asks a price, or names a trade. Pass `trade` when they named one (plumbing,
  electrical, ac, carpentry, painting, appliance).

input:
  trade:
    type:     string
    optional: true
    describe: 'One of: plumbing, electrical, ac, carpentry, painting, appliance, other.'

entry:
  - if:   '$input.trade != null'
    goto: load_trade
  - else: true
    goto: load_all

steps:
  load_all:
    - do: record_search
      args: { entity: trade_service, query: '', limit: 10 }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: none }]
        failed: [{ goto: unavailable }]

  load_trade:
    - do: record_search
      args:
        entity: trade_service
        query:  ''
        limit:  10
        where:  { all: [{ field: trade, op: eq, value: '$input.trade' }] }
      bind: page
      outputs:
        ok:     [{ goto: show }]
        empty:  [{ goto: load_all }]
        failed: [{ goto: unavailable }]

  show:
    - render:
        render_intent: carousel
        body:  '{$t("services.intro")}'
        items: '$page.rows'
        item_template:
          image_url: '$coalesce($item.fields.photo, "")'
          body: '$lines($compact([
                   $item.fields.name,
                   $t("services.from", { price: $format_money_field($item.fields.price_from, $coalesce($item.fields.currency, "AED")) })
                 ]), "\n")'
          buttons:
            - { title: '{$t("services.btn_request")}', on_select: { invoke: request-visit, with: { service_id: '$item.id' } } }
      memory_note: 'Showed {$length($page.rows)} service(s).'
    - end: applied

  none:
    - answer:
        instructions: 'No service matched. Say so in one line and offer the full list.'

  unavailable:
    - answer:
        instructions: 'The service list could not be read. Apologise in one line and offer to try again shortly. NEVER quote a price from memory.'
