# request-visit — the dispatch journey. Trade → urgency → emirate → address → photo →
# confirm → a routed work order with a real response window.
#
# Two things carry the weight here. First, the URGENCY the customer picks is the work
# type, which is what selects the SLA in worklist.yaml — so the response window quoted
# back is the queue's own number, never prose. Second, the EMIRATE is the routing key,
# so the order lands with the regional crew rather than a central inbox.

flow_id:     request-visit
version:     1
description: |-
  [interactive] Raise a maintenance work order and dispatch it. Call when the customer
  reports a fault or asks for a technician. Pass `service_id` when they tapped a
  service card, and pre-fill `trade` / `urgency` / `fault` from a photo or voice note
  the platform already read.

input:
  service_id:
    type:     string
    optional: true
    describe: 'Service record id from a services card — never a typed name.'
  trade:
    type:     enum
    enum:     [plumbing, electrical, ac, carpentry, painting, appliance, other]
    optional: true
    describe: 'The trade, from the briefing the platform gave you after reading a photo. Omit if unsure.'
  urgency:
    type:     enum
    enum:     [routine, soon, emergency]
    optional: true
    describe: 'Only pass `emergency` when the customer describes water flooding, no power, a gas smell, or a security risk — it puts a 4-hour promise on the company.'
  fault:
    type:     string
    optional: true
    describe: "The fault in the customer's own words (may come from a voice note)."
  fault_photo:
    type:     string
    optional: true
    describe: 'The MEDIA- ref of a photo the customer already sent of the fault, if there is one. NEVER invent a ref.'

entry:
  - else: true
    goto: collect_fields

steps:
  collect_fields:
    - collect:
        before_each:
          - assign: { svc_label: null, svc_trade: null }
          - if: '$state.service_id != null'
            then:
              - do: record_get
                args: { entity: trade_service, record_id: '$state.service_id' }
                bind: svc
                outputs:
                  ok:        []
                  not_found: [{ assign: { state: '$merge($state, { service_id: null })' } }]
                  failed:    []
              - if: '$svc.fields != null'
                then:
                  - assign:
                      svc_label: '$svc.fields.name'
                      svc_trade: '$svc.fields.trade'
          - assign: { eff_trade: '$coalesce($svc_trade, $state.trade)' }
        before_prompt:
          - assign:
              progress_card: '$lines($compact([
                                $t("request-visit.progress.header"),
                                $svc_label != null ? $t("request-visit.progress.service", { service: $svc_label }) : null,
                                $state.urgency != null ? $t("request-visit.progress.urgency") : null,
                                $state.emirate != null ? $t("request-visit.progress.emirate") : null
                              ]), "\n")'
        progress: '$progress_card'
        gap_instructions: 'Ask the customer for the next missing detail ({$collect_field}), one at a time, in their language. Re-call request-visit once they answer. NEVER quote a repair price.'
        fields:
          - field: service_id
            when: '$state.service_id == null'
            label: '$t("request-visit.label.service")'
            options:
              header: request-visit.field_header.service
              cta:    request-visit.field_cta.service
              fetch:  { do: record_search, args: { entity: trade_service, query: '', limit: 10 }, bind: svcs }
              rows:   '$svcs.rows'
              map:
                value:       '$item.id'
                label:       '$item.fields.name'
                description: '$format_money_field($item.fields.price_from, "AED")'
                selection:   { svc_label: '$item.fields.name', svc_trade: '$item.fields.trade' }
              auto_resolve: true
          # The urgency IS the work type — it sets the SLA, so the customer chooses
          # their own response window knowingly.
          - field: urgency
            label: '$t("request-visit.label.urgency")'
            options:
              header: request-visit.field_header.urgency
              cta:    request-visit.field_cta.urgency
              items:
                - { value: emergency, label: request-visit.urg.emergency }
                - { value: soon,      label: request-visit.urg.soon }
                - { value: routine,   label: request-visit.urg.routine }
          # WHICH property — asked BEFORE the address, because a returning
          # customer should tap the home we already hold rather than describe it
          # again. `record_list` here is contact-scoped by default (record_save
          # auto-links the conversation's contact), so these are only ever THEIR
          # properties.
          #
          # The list carries a synthetic "a different address" row, so choosing to
          # add one is a tap rather than a dead end. A FIRST-TIME customer has no
          # properties, leaving that single row — and `auto_resolve: true` then
          # picks it silently, so they never see a one-option picker.
          - field: property_id
            label: '$t("request-visit.label.property")'
            options:
              header: request-visit.field_header.property
              cta:    request-visit.field_cta.property
              fetch:  { do: record_list, args: { entity: property, limit: 9 }, bind: props }
              rows:   '$concat($props.rows, [{ id: "__new", fields: { label: $t("request-visit.new_address"), address: "" } }])'
              map:
                value:       '$item.id'
                label:       '$item.fields.label'
                description: '$coalesce($item.fields.address, "")'
              auto_resolve: true
          - field: emirate
            when: '$state.property_id == "__new"'
            label: '$t("request-visit.label.emirate")'
            options:
              header: request-visit.field_header.emirate
              cta:    request-visit.field_cta.emirate
              items:
                - { value: dubai,     label: request-visit.em.dubai }
                - { value: sharjah,   label: request-visit.em.sharjah }
                - { value: abu_dhabi, label: request-visit.em.abu_dhabi }
                - { value: ajman,     label: request-visit.em.ajman }
                - { value: rak,       label: request-visit.em.rak }
          - field: address
            when: '$state.property_id == "__new"'
            label:    '$t("request-visit.label.address")'
            describe: 'Building, flat/villa number and floor — the part of an address a map pin cannot show.'
          # The map pin. OPTIONAL on purpose, and not because it matters less:
          # a `type: geo` field can only be answered by SHARING a location, so a
          # required one is a dead end for a web visitor who blocks the browser
          # permission — they cannot type their way out of it. Offered with a
          # Skip, the address above still gets the job dispatched.
          - field: pin
            type: geo
            required: false
            label:      '$t("request-visit.label.pin")'
            skip_title: '$t("request-visit.skip_pin")'
          # CONFIRMS the WhatsApp profile name rather than asking — one tap.
          - field: contact_name
            type: name
            label:    '$t("request-visit.label.contact")'
            describe: 'Who the technician should ask for on arrival.'
          # A dispatch had a name, an address and a map pin — and no way to CALL
          # anyone. A technician who cannot find the flat, or is running late, had
          # nothing to do about it. One tap on WhatsApp's native share, verified.
          - field: contact_phone
            type: phone
            dial_code: '971'
            label:    '$t("request-visit.label.phone")'
            describe: 'The number the technician rings on arrival or if they are delayed.'
          - field: preferred_window
            label: '$t("request-visit.label.window")'
            options:
              header: request-visit.field_header.window
              cta:    request-visit.field_cta.window
              items:
                - { value: morning,   label: request-visit.win.morning }
                - { value: afternoon, label: request-visit.win.afternoon }
                - { value: evening,   label: request-visit.win.evening }
          - field: fault
            label:    '$t("request-visit.label.fault")'
            describe: "What is wrong, in the customer's own words."
        complete: [{ goto: save_property }]

  # Two ways to arrive here, and only ONE of them creates a property.
  #
  # This used to dedupe on `match: { field: label, value: $state.address }` — the
  # free-text address the customer had just typed. "Villa 12, Street 4, Al Barsha"
  # and "villa 12 street 4 albarsha" are different keys, so every retype forked the
  # home into a second record and split its history, notes and pin. A `geo` pin
  # cannot fix that (a float pair is not an equality key); the fix is to stop
  # asking the customer to retype at all — the picker above hands back a record ID.
  save_property:
    - if: '$state.property_id != "__new"'
      goto: use_existing
    - goto: create_property

  # An existing property carries its OWN address, emirate and pin. Read them back:
  # the work order below stamps them, and `$state.address` is null on this path
  # because the collect skipped those fields.
  use_existing:
    - do: record_get
      args: { entity: property, record_id: '$state.property_id' }
      bind: prop_row
      outputs:
        ok:        [{ goto: adopt_existing }]
        not_found: [{ goto: create_property }]   # deleted between turns → fall back to creating one

  adopt_existing:
    - assign:
        prop_id:     '$prop_row.id'
        eff_address: '$prop_row.fields.address'
        eff_emirate: '$prop_row.fields.emirate'
        eff_pin:     '$prop_row.fields.pin'
    - goto: confirm

  create_property:
    - do: record_save
      args:
        entity: property
        # No `match:` — this branch only runs when the customer chose "a different
        # address", so a new record is the correct outcome. The entity's own
        # `dedupe_by: label` still merges a byte-identical retype as a backstop.
        fields:
          label:   '$state.address'
          emirate: '$state.emirate'
          address: '$state.address'
          # The pin the customer shared, straight into the `geo` field this pack
          # has always declared for it. Omitted when they skipped.
          pin:     '$state.pin'
      bind: prop
      outputs:
        ok:      [{ goto: adopt_new }]
        invalid: [{ goto: adopt_new }]
        failed:  [{ goto: adopt_new }]

  adopt_new:
    - assign:
        prop_id:     '$prop.record_id'
        eff_address: '$state.address'
        eff_emirate: '$state.emirate'
        eff_pin:     '$state.pin'
    - goto: confirm

  confirm:
    - assign:
        callout: '$coalesce($config.pricing.callout_fee, 150)'
        surcharge: '$state.urgency == "emergency" ? $coalesce($config.pricing.emergency_surcharge, 250) : 0'
    - use: approve_apply
      with:
        preview: '$lines($compact([
                    $t("request-visit.preview.header"),
                    $t("request-visit.preview.service", { service: $coalesce($svc_label, $state.svc_label, "-") }),
                    $t("request-visit.preview.urgency", { urgency: $enum_label($state.urgency, "urgency", $state.urgency) }),
                    $t("request-visit.preview.emirate", { emirate: $enum_label($eff_emirate, "emirate", $eff_emirate) }),
                    $t("request-visit.preview.address", { address: $eff_address }),
                    $eff_pin != null ? $t("request-visit.preview.pin") : null,
                    $t("request-visit.preview.window", { window: $enum_label($state.preferred_window, "window", $state.preferred_window) }),
                    $t("request-visit.preview.callout", { fee: $format_money($callout, "AED") }),
                    $surcharge > 0 ? $t("request-visit.preview.surcharge", { fee: $format_money($surcharge, "AED") }) : null,
                    $t("request-visit.preview.note")
                  ]), "\n")'
        header:        '{$t("request-visit.approve_header")}'
        footer:        '{$t("request-visit.approve_footer")}'
        confirm_title: '{$t("request-visit.confirm_title")}'
        cancel_title:  '{$t("request-visit.cancel_title")}'
        apply:         raise_order
        abort:         aborted
        on_other:      collect_fields
        memory_note:   'Work order NOT raised yet — awaiting the customer''s ✅.'

  raise_order:
    # `work_open` writes the record AND enrols it: the queue comes from `route_by:
    # emirate`, the SLA from the `urgency` type. It publishes only record_id /
    # record_number / queue_key — the due time stays on the platform side, so the
    # window quoted below is the urgency's declared hours, not a returned timestamp.
    - do: work_open
      args:
        entity: work_order
        stage:  received
        fields:
          urgency:          '$state.urgency'
          # `$eff_*` — resolved by save_property, because a returning customer who
          # picked an existing property never retyped any of these.
          emirate:          '$eff_emirate'
          trade:            '$coalesce($eff_trade, $state.svc_trade, "other")'
          service:          '$state.service_id'
          service_label:    '$coalesce($svc_label, $state.svc_label)'
          property:         '$prop_id'
          address:          '$eff_address'
          # The technician gets coordinates, not prose — the reason `work_order.pin`
          # was declared. Absent when the customer skipped the share.
          pin:              '$eff_pin'
          fault:            '$state.fault'
          fault_photo:      '$state.fault_photo'   # an agent-supplied MEDIA- ref, or absent
          preferred_window: '$state.preferred_window'
          contact_name:     '$state.contact_name'
          contact_phone:    '$state.contact_phone'
      bind: order
      outputs:
        ok:     [{ goto: dispatched }]
        failed: [{ goto: raise_failed }]

  dispatched:
    - assign:
        window_hours: '$enum_lookup($state.urgency, { emergency: 4, soon: 12, routine: 48 }, 48)'
    - render:
        render_intent: detail_card
        header: '{$t("request-visit.done_header")}'
        body: '$lines($compact([
                 $t("request-visit.done_ref", { ref: $order.record_number }),
                 $t("request-visit.done_crew", { emirate: $enum_label($eff_emirate, "emirate", $eff_emirate) }),
                 $t("request-visit.done_window", { hours: $window_hours }),
                 $t("request-visit.done_next")
               ]), "\n")'
        footer: '{$t("request-visit.done_footer")}'
        buttons:
          - { title: '{$t("request-visit.btn_mine")}',     on_select: { invoke: my-requests } }
          - { title: '{$t("request-visit.btn_services")}', on_select: { invoke: services } }
      memory_note: 'Raised work_order #{$order.record_number} — urgency {$state.urgency}, queue {$order.queue_key}, response window {$window_hours}h. NO repair price was quoted.'
      data: { order_number: '$order.record_number' }
    - end: applied

  aborted:
    - end: { status: aborted, body: '{$t("request-visit.aborted")}' }

  raise_failed:
    - answer:
        instructions: 'The work order could not be raised. Say so plainly in one line and give the customer the dispatch line to call. Do NOT claim a technician is coming.'
