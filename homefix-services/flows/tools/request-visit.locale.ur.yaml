flow_id: request-visit

strings:
  # The flow's OWN prompt. English — it instructs the model rather than speaking to the customer,
  # so it is byte-identical to the Arabic and English files. `visible_issue` stays in Egyptian
  # Arabic ON PURPOSE even for an Urdu conversation: it is written into the work order that a
  # dispatcher reads, so the stored value must not change language with the customer.
  vision_prompt: >-
    A photograph of a household fault a technician has been asked to fix. Reply as JSON:
    {"trade":"plumbing|electrical|ac|carpentry|painting|appliance|other",
    "urgency":"routine|soon|emergency",
    "visible_issue":"one or two short lines in Egyptian Arabic describing ONLY what is visible"}.
    Judge urgency from visible harm — water actively escaping or exposed live wiring is emergency.
    Never quote a price and never say whether something is safe to use.
