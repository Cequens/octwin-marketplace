# Standing automation jobs for HomeFix.
#
# The alarm on the dispatch SLA `worklist.yaml` promises. The four-hour emergency
# is the one that matters: a burst pipe whose work order sits unworked past the
# deadline produced no signal at all before this job existed — `sla_due_at` was
# stamped at enrolment and never read again.
#
# The sweep is entity-level, so this one job covers all three urgency types
# (emergency 4h · soon 12h · routine 48h). It skips work orders already completed
# or cancelled, alerts the responsible operator through the ops inbox, relays
# `message` to the customer ONCE per breach (deduped on `sla_notified_at`), and
# mints the `sla_breach` record event that `xrm.yaml`'s `on.sla_breach` hook turns
# into a dispatch-desk task.
#
# `escalate_to:` routes the breached item to a queue. It took three rounds to land:
# first omitted because the KB documented the target two incompatible ways, then kept
# out once it was typed as a principal-ref (`user:`/`team:`) — an id only the INSTALLING
# tenant knows, unwritable in a published pack. The platform then added `queue:<key>`,
# resolved against THIS pack's own `worklist.yaml` `queues:`, so it travels with the pack
# (KB 968db6a91806, `worklist-guide` §5). A key we never declared fails at pack load,
# naming the legal ones — it can no longer mis-route in silence.
#
# `dispatch_desk` is already the routing `fallback:` — a breached job leaves the
# regional crew and lands with dispatch.
#
# Know the limit: routing a queue notifies nobody new. The item appears in that queue's
# work inbox, and the ops-inbox alert still goes to the previous assignee — so a breach on
# an UNASSIGNED item escalates silently. The customer reassurance below is unaffected.

jobs:
  - key:              work_order_sla
    kind:             sla_sweep
    entity:           work_order
    # A quarter of an hour, bounding the detection lag at ~6% of the four-hour
    # emergency promise.
    interval_seconds: 900
    config:
      escalate_to: queue:dispatch_desk
      message: 'نعتذر عن التأخير 🙏 طلبك تجاوز الوقت المتوقع وتم تنبيه فريق الإرسال — بنرجع لك في أقرب وقت.'
