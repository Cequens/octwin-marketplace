# homefix-services — a home-maintenance company on WhatsApp.
#
# Demonstrates DISPATCH: a request becomes a queue-routed work order whose queue is
# derived from the customer's EMIRATE (`route_by: emirate` + an explicit map), with a
# per-trade SLA and a technician assigned in the console. Plus a `geo` location field
# (a WhatsApp location pin lands straight on the record), a photo of the fault, and a
# recurring-maintenance contract pipeline. No pack DB, no code — pure YAML.

id:          homefix-services
version: 2.5.0
description: 'Home maintenance & handyman dispatch — describe the fault, send a photo and a location pin, and get a routed work order with a real response window.'

listing:
  title:    'HomeFix Services'
  tagline:  'Fault to dispatched technician, routed by emirate with an SLA'
  category: services
  icon:     listing/icon.png
  author:   { name: 'Octwin', url: 'https://octwin.ai' }
  public:   true

# The pack's CHAT FACE — what a customer sees in the web widget, which is a different
# audience from `listing:` above (that one is read by a business deciding to install us).
# `about` is deliberately not the tagline: a tagline argues with a buyer.
widget:
  name:   'HomeFix Services'
  avatar: widget/avatar.png
  accent: '#b45309'   # matches the avatar's gradient
  about:  'Report a fault and we will send a technician to you.'

supported_channels: [whatsapp, web]
supported_languages: [ar, en, ur]
required_adapters:  [messaging, vision, storage]

default_settings:
  locale: ar

# No `default_conversation_context.lang:` here. That knob was copy-pasted boilerplate:
# nothing in this pack ever read `$context.lang`, so its `en` / `bilingual` options offered
# an operator a switch that changed nothing. Removed across the marketplace 2026-09-05.
#
# The language is not a manifest setting. Automatic detection reads the customer's own words
# (`language-detect.ts`), `/lang` overrides it per contact, and what the pack can actually
# render is derived from the `locale.<lang>.yaml` files it ships.

# Call-out fee and the emergency surcharge live here so an operations manager can
# change a number without touching a flow.
config:
  pricing:
    callout_fee:        150
    emergency_surcharge: 250
    currency:           AED

flows:
  - home
  - services
  - request-visit
  - my-requests

# NO `inbound_preprocessing.image`, deliberately.
#
# It read the trade and urgency off a fault photo and handed them to the AGENT to relay. When the
# relay did not happen, the customer picked a trade from a list while looking at a picture of the
# problem they had just sent. `request-visit`'s `read_fault` step reads it before the collect node
# runs, so those fields are pre-filled rather than asked.
#
# It also only ever fired on an inbound MESSAGE, so a photo sent inside a native WhatsApp form was
# never read. An image in a home-repair pack means a fault; that needs no vision call to work out.
inbound_preprocessing:
  voicenote:
    mode: transcribe
    ack: '🎤 وصلت الرسالة الصوتية، جاري تفريغها...'
    prompt: 'Arabic home-maintenance voice note — the fault, the room, how urgent.'
    note_template: |-
      $transcript != null ? "🎤 رسالة صوتية ({$media_ref}): {$transcript}" : "🎤 رسالة صوتية ({$media_ref}) — تعذّر التفريغ"

agents:
  - id:                dispatcher
    display_name:      'HomeFix Dispatch'
    default_model:     'openrouter/google/gemini-3.1-flash-lite-preview'
    tools:
      - home
      - services
      - request-visit
      - my-requests
    include_platform_protocol: true
    instructions:
      - file: prompts/identity.md
