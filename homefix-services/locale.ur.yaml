# homefix-services — pack-wide Urdu strings.
#
# `urgency.*` / `emirate.*` / `window.*` label the select values the flows echo back,
# and `stage.*` / `stage_hint.*` the `work_order` pipeline — all resolved through
# `$enum_label`, so no flow hardcodes a value's wording. `decision.*` labels the
# dispatch dispositions declared in worklist.yaml.
#
# The key after the dot is a declared id, not prose — byte-identical to `locale.ar.yaml`;
# only the value is translated.
#
# NOTE: this root file is what registers `ur` for the pack. With `ar` and `ur` both being
# Arabic-SCRIPT languages, the detector's free script pass can no longer choose between them
# and hands the message to the model — by design, and measured at zero ur→ar errors.
pack_id: homefix-services
