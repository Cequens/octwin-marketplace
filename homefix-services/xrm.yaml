# XRM declaration for homefix-services.
#
#  • `trade_service` — the service list (reference, no pipeline ⇒ always listable).
#  • `property`      — the customer's home, contact-scoped, carrying a `geo` field. A
#                      WhatsApp location pin lands straight on it, so a technician gets
#                      coordinates instead of "the building next to the bakery".
#  • `work_order`    — the DISPATCH item, worked through worklist.yaml. `emirate` is the
#                      routing key and `urgency` the type discriminator (which is what
#                      sets the SLA).
#  • `contract`      — recurring maintenance, a pipeline the company sells against.

entities:
  trade_service:
    label: { en: 'Service', ar: 'خدمة' }
    icon:        '🛠️'
    description: { en: 'A trade the company sends technicians for', ar: 'تخصص فني ترسل له الشركة فنيين' }
    fields:
      code:        { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      trade:       { type: select, options: [plumbing, electrical, ac, carpentry, painting, appliance, other], label: { en: 'Trade', ar: 'التخصص' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      price_from:  { type: money, label: { en: 'From', ar: 'يبدأ من' }, sortable: true, currency: AED }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:  { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0, description: { en: 'Manual ordering weight for the services list — higher shows earlier.', ar: 'وزن ترتيب يدوي لقائمة الخدمات — الأعلى يظهر أولاً.' } }
    list: [trade, price_from]
    search: { text: [name, description], semantic: [name, description], rank_by: popularity }
    dedupe_by: code

  property:
    label: { en: 'Property', ar: 'العقار' }
    icon:        '🏢'
    description: { en: 'A customer address work is carried out at', ar: 'عنوان العميل الذي تُنفَّذ فيه الأعمال' }
    fields:
      label:        { type: text, required: true, label: { en: 'Label', ar: 'الاسم' } }
      emirate:      { type: select, options: [dubai, sharjah, abu_dhabi, ajman, rak], label: { en: 'Emirate', ar: 'الإمارة' } }
      area:         { type: text, label: { en: 'Area', ar: 'المنطقة' } }
      address:      { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      # A WhatsApp location pin lands here — the technician gets coordinates, not prose.
      pin:          { type: geo, label: { en: 'Location pin', ar: 'الموقع على الخريطة' } }
      property_type: { type: select, options: [apartment, villa, office, shop], label: { en: 'Type', ar: 'النوع' } }
    list: [emirate, area, property_type]
    dedupe_by: label

  work_order:
    label: { en: 'Work order', ar: 'أمر عمل' }
    icon:        '🔧'
    description: { en: 'A dispatched job, from request to completion', ar: 'أمر عمل من الطلب حتى الإنجاز' }
    fields:
      # The TYPE discriminator — it is what selects the SLA in worklist.yaml.
      urgency:      { type: select, options: [routine, soon, emergency], label: { en: 'Urgency', ar: 'الاستعجال' }, description: { en: 'Drives dispatch order — an emergency is offered the earliest window, not the next free one.', ar: 'يحدد أولوية الإرسال — الحالة الطارئة تُمنح أقرب موعد وليس أول موعد متاح.' } }
      # The ROUTING key — worklist.yaml maps it to a regional crew.
      emirate:      { type: select, options: [dubai, sharjah, abu_dhabi, ajman, rak], label: { en: 'Emirate', ar: 'الإمارة' } }
      trade:        { type: select, options: [plumbing, electrical, ac, carpentry, painting, appliance, other], label: { en: 'Trade', ar: 'التخصص' } }
      service:      { type: record, entity: trade_service, label: { en: 'Service', ar: 'الخدمة' } }
      service_label: { type: text, label: { en: 'Service', ar: 'الخدمة' } }
      property:     { type: record, entity: property, label: { en: 'Property', ar: 'العقار' } }
      address:      { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      pin:          { type: geo, label: { en: 'Location pin', ar: 'الموقع' } }
      fault:        { type: textarea, label: { en: 'Fault', ar: 'وصف المشكلة' } }
      fault_photo:  { type: image, label: { en: 'Photo', ar: 'صورة المشكلة' } }
      preferred_window: { type: select, options: [morning, afternoon, evening], label: { en: 'Preferred window', ar: 'الوقت المفضل' }, description: { en: 'The time band the customer asked for. A preference, not a guarantee — dispatch may not match it.', ar: 'الفترة التي طلبها العميل. تفضيل لا ضمان — وقد لا يطابقه جدول الإرسال.' } }
      contact_name: { type: text, label: { en: 'Contact', ar: 'اسم المتواصل' } }
      contact_phone: { type: text, label: { en: 'Contact phone', ar: 'هاتف المتواصل' } }
      quoted_amount: { type: money, label: { en: 'Quote', ar: 'عرض السعر' }, currency: AED }
    list: [urgency, trade, emirate]
    pipeline:
      stages:   [received, dispatched, on_site, awaiting_parts, completed, cancelled]
      initial:  received
      terminal: [completed, cancelled]
      outcomes: { completed: won, cancelled: lost }
    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      received:       { en: 'Logged, no technician assigned yet', ar: 'ℹ️ الطلب عند فريق منطقتك ويتم تعيين فني له.' }
      dispatched:     { en: 'A technician is on the way', ar: 'ℹ️ تم تعيين فني — بيتواصل معك قبل الوصول.' }
      on_site:        { en: 'Work is underway at the property', ar: 'ℹ️ الفني في الموقع الآن.' }
      awaiting_parts: { en: 'Paused until a part arrives', ar: 'ℹ️ مطلوب قطع غيار — بنبلّغك بموعد الوصول أول ما تتوفر.' }
      completed:      { en: 'Job finished and signed off', ar: 'ℹ️ تم إنجاز العمل. لو ظهرت المشكلة تاني تواصل معنا فوراً.' }
      cancelled:      { en: 'Called off before completion', ar: 'ℹ️ هذا الطلب ملغى.' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      received:       { en: 'Received', ar: 'وصل الطلب' }
      dispatched:     { en: 'Technician dispatched', ar: 'تم إرسال فني 👷' }
      on_site:        { en: 'Technician on site', ar: 'الفني في الموقع' }
      awaiting_parts: { en: 'Awaiting parts', ar: 'بانتظار قطع غيار' }
      completed:      { en: 'Completed', ar: 'تم الإنجاز ✅' }
      cancelled:      { en: 'Cancelled', ar: 'ملغى' }
    milestones:
      dispatched: { label: { en: 'Dispatched', ar: 'تم الإرسال' }, stage: dispatched }
      completed:  { label: { en: 'Completed', ar: 'تم الإنجاز' },   stage: completed, terminal: true }
    # The operator half of the SLA. `automation.yaml`'s sla_sweep mints the
    # `sla_breach` event and handles the CUSTOMER (one reassurance, deduped);
    # this puts a due-dated job on a human's list so the breach is worked, not
    # just announced. The sweep is what makes this hook reachable at all — the
    # event has no other source.
    on:
      sla_breach:
        - open_task:
            title:        '⏰ تجاوز المهلة — أمر عمل {{ record.record_number }}'
            body:         'الاستعجال: {{ record.fields.urgency }} · الإمارة: {{ record.fields.emirate }}. راجع الإسناد وبلّغ العميل.'
            due_in_hours: 1

  contract:
    label: { en: 'Maintenance contract', ar: 'عقد صيانة' }
    icon:        '📑'
    description: { en: 'An annual maintenance plan and its cover', ar: 'عقد صيانة سنوي وتغطيته' }
    fields:
      plan:       { type: select, options: [ac_annual, full_home_annual, pool_monthly], label: { en: 'Plan', ar: 'الباقة' } }
      property:   { type: record, entity: property, label: { en: 'Property', ar: 'العقار' } }
      price:      { type: money, label: { en: 'Price', ar: 'السعر' }, sortable: true, currency: AED }
      visits_per_year: { type: number, label: { en: 'Visits / year', ar: 'عدد الزيارات سنوياً' }, description: { en: 'Scheduled maintenance visits the contract price covers. Extra visits are billed separately.', ar: 'عدد زيارات الصيانة التي يغطيها سعر العقد. وتُحتسب الزيارات الإضافية بشكل منفصل.' } }
    list: [plan, price]
    pipeline:
      stages:   [proposed, active, expired, cancelled]
      initial:  proposed
      terminal: [expired, cancelled]
      outcomes: { expired: won, cancelled: lost }

    # What each stage MEANS — rendered above the console pipeline control and on
    # each move button. Kept in step with the `stage_hint.*` locale keys the flows
    # resolve through `$enum_label(stage, "stage_hint")`.
    stage_hints:
      proposed:  { en: 'Quoted to the customer, not yet signed', ar: 'قُدّم العرض ولم يُوقّع بعد' }
      active:    { en: 'In force — visits can be booked against it', ar: 'ساري — يمكن حجز زيارات عليه' }
      expired:   { en: 'Past its end date; renew to reactivate', ar: 'انتهت مدته؛ جدّده لتفعيله' }
      cancelled: { en: 'Ended early at the customer request', ar: 'ℹ️ هذا الطلب ملغى.' }
    # Display names for the stages above — entity level, NOT inside `pipeline:`,
    # so an `extends: system` entity can label stages it never declared. The console
    # badge/filter/pipeline/funnel read these; an unlabelled stage falls back to Title
    # Case of its key. Kept in step with the `stage.*` locale keys the flows resolve
    # through `$enum_label(stage, "stage")`.
    stage_labels:
      proposed:  { en: 'Proposed', ar: 'مقترح' }
      active:    { en: 'Active', ar: 'ساري' }
      expired:   { en: 'Expired', ar: 'منتهي' }
      cancelled: { en: 'Cancelled', ar: 'ملغى' }
segments:
  open_orders:
    entity: work_order
    label: { en: 'Open work orders', ar: 'أوامر عمل قائمة' }
    where: { all: [{ active: true }] }
  emergencies:
    entity: work_order
    label: { en: 'Emergencies', ar: 'حالات طارئة' }
    where: { all: [{ field: urgency, op: eq, value: emergency }, { active: true }] }

