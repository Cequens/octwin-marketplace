# XRM declaration for homefix-services.
#
#  • `trade_service` — the service list (reference, no pipeline ⇒ always listable).
#  • `property`      — the customer's home, contact-scoped, carrying a `geo` field. A
#                      WhatsApp location pin lands straight on it, so a technician gets
#                      coordinates instead of "the building next to the bakery".
#  • `work_order`    — the DISPATCH item, worked through worklist.yaml. `emirate` is the
#                      routing key and `urgency` the type discriminator (which is what
#                      sets the SLA).
#  • `contract`      — recurring maintenance, a pipeline the company sells against.

entities:
  trade_service:
    label: { en: 'Service', ar: 'خدمة' }
    fields:
      code:        { type: text, required: true, label: { en: 'Code', ar: 'الرمز' } }
      name:        { type: text, required: true, label: { en: 'Name', ar: 'الاسم' } }
      trade:       { type: select, options: [plumbing, electrical, ac, carpentry, painting, appliance, other], label: { en: 'Trade', ar: 'التخصص' } }
      description: { type: textarea, label: { en: 'Description', ar: 'الوصف' } }
      price_from:  { type: money, label: { en: 'From', ar: 'يبدأ من' } }
      currency:    { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'AED' }
      photo:       { type: image, label: { en: 'Photo', ar: 'الصورة' } }
      popularity:  { type: number, label: { en: 'Popularity', ar: 'الأكثر طلباً' }, default: 0 }
    list: [trade, price_from]
    search: { text: [name, description], semantic: [name, description], rank_by: popularity }
    dedupe_by: code

  property:
    label: { en: 'Property', ar: 'العقار' }
    fields:
      label:        { type: text, required: true, label: { en: 'Label', ar: 'الاسم' } }
      emirate:      { type: select, options: [dubai, sharjah, abu_dhabi, ajman, rak], label: { en: 'Emirate', ar: 'الإمارة' } }
      area:         { type: text, label: { en: 'Area', ar: 'المنطقة' } }
      address:      { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      # A WhatsApp location pin lands here — the technician gets coordinates, not prose.
      pin:          { type: geo, label: { en: 'Location pin', ar: 'الموقع على الخريطة' } }
      property_type: { type: select, options: [apartment, villa, office, shop], label: { en: 'Type', ar: 'النوع' } }
    list: [emirate, area, property_type]
    dedupe_by: label

  work_order:
    label: { en: 'Work order', ar: 'أمر عمل' }
    fields:
      # The TYPE discriminator — it is what selects the SLA in worklist.yaml.
      urgency:      { type: select, options: [routine, soon, emergency], label: { en: 'Urgency', ar: 'الاستعجال' } }
      # The ROUTING key — worklist.yaml maps it to a regional crew.
      emirate:      { type: select, options: [dubai, sharjah, abu_dhabi, ajman, rak], label: { en: 'Emirate', ar: 'الإمارة' } }
      trade:        { type: select, options: [plumbing, electrical, ac, carpentry, painting, appliance, other], label: { en: 'Trade', ar: 'التخصص' } }
      service:      { type: record, entity: trade_service, label: { en: 'Service', ar: 'الخدمة' } }
      service_label: { type: text, label: { en: 'Service', ar: 'الخدمة' } }
      property:     { type: record, entity: property, label: { en: 'Property', ar: 'العقار' } }
      address:      { type: textarea, label: { en: 'Address', ar: 'العنوان' } }
      pin:          { type: geo, label: { en: 'Location pin', ar: 'الموقع' } }
      fault:        { type: textarea, label: { en: 'Fault', ar: 'وصف المشكلة' } }
      fault_photo:  { type: image, label: { en: 'Photo', ar: 'صورة المشكلة' } }
      preferred_window: { type: select, options: [morning, afternoon, evening], label: { en: 'Preferred window', ar: 'الوقت المفضل' } }
      contact_name: { type: text, label: { en: 'Contact', ar: 'اسم المتواصل' } }
      quoted_amount: { type: money, label: { en: 'Quote', ar: 'عرض السعر' } }
    list: [urgency, trade, emirate]
    pipeline:
      stages:   [received, dispatched, on_site, awaiting_parts, completed, cancelled]
      initial:  received
      terminal: [completed, cancelled]
    milestones:
      dispatched: { label: { en: 'Dispatched', ar: 'تم الإرسال' }, stage: dispatched }
      completed:  { label: { en: 'Completed', ar: 'تم الإنجاز' },   stage: completed, terminal: true }

  contract:
    label: { en: 'Maintenance contract', ar: 'عقد صيانة' }
    fields:
      plan:       { type: select, options: [ac_annual, full_home_annual, pool_monthly], label: { en: 'Plan', ar: 'الباقة' } }
      property:   { type: record, entity: property, label: { en: 'Property', ar: 'العقار' } }
      price:      { type: money, label: { en: 'Price', ar: 'السعر' } }
      currency:   { type: text, label: { en: 'Currency', ar: 'العملة' }, default: 'AED' }
      visits_per_year: { type: number, label: { en: 'Visits / year', ar: 'عدد الزيارات سنوياً' } }
    list: [plan, price]
    pipeline:
      stages:   [proposed, active, expired, cancelled]
      initial:  proposed
      terminal: [expired, cancelled]

segments:
  open_orders:
    entity: work_order
    label: { en: 'Open work orders', ar: 'أوامر عمل قائمة' }
    where: { all: [{ active: true }] }
  emergencies:
    entity: work_order
    label: { en: 'Emergencies', ar: 'حالات طارئة' }
    where: { all: [{ field: urgency, op: eq, value: emergency }, { active: true }] }

